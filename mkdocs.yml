site_name: Learning Design Wiki
site_description: A persistent, LLM-maintained knowledge base for learning design — principles, elements, patterns, designs, products and programmes, strategies, design processes and methods, research methods, theories, learner variables, and empirical claims.
site_url: https://learning-design-alliance.github.io/learning-wiki/
repo_url: https://github.com/Learning-Design-Alliance/learning-wiki
repo_name: Learning-Design-Alliance/learning-wiki
edit_uri: ""
copyright: >-
  <span class="lda-footer-links"><a href="https://www.learningdesignalliance.org">Learning Design Alliance</a> ·
  <a href="https://reports.learningdesignalliance.org">Research reports</a> ·
  <a href="https://wiki.learningdesignalliance.org">Wiki</a> ·
  <a href="https://lazuli.design">Lazuli</a></span>
  Copyright &copy; Learning Design Alliance — content licensed CC BY-SA 4.0

docs_dir: docs

# Links from the curated tier to the long tail are directory URLs the two_tier hook
# writes (claims/<slug>/), which mkdocs cannot resolve and would report one by one.
validation:
  links:
    unrecognized_links: ignore
site_dir: site

theme:
  name: material
  logo: branding/lda-monogram-lapis.svg
  favicon: branding/lda-favicon.png
  # The LDA faces (DM Sans, DM Mono, Baskervville) load from branding/lda-theme.css, which
  # both tiers carry; false stops Material loading Roboto as well.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.path
    - navigation.prune
    - toc.follow
    - content.code.copy
    - content.tooltips

extra:
  generator: false

extra_css:
  - branding/lda-theme.css

hooks:
  - docs_hooks/page_metadata.py
  - docs_hooks/situations.py
  - docs_hooks/two_tier.py

# Search is Pagefind's, built over both tiers by scripts/build_site.sh, and reached from the
# search box in every page's header (docs_hooks/two_tier.py), not from the nav; the
# built-in lunr index had reached 20 MB at 18,800 pages.
plugins: []

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Design for a Situation: situations/index.md
  - Application:
      - Principles: principles/index.md
      - Patterns: patterns/index.md
      - Elements: elements/index.md
      - Strategies: strategies/index.md
      - Designs: designs/index.md
      - Products & Programmes: products/index.md
  - Research:
      - Claims: claims/index.md
      - Theories: theories/index.md
      - Learner Variables: learner-variables/index.md
  - Methods:
      - Design Processes: processes/index.md
      - Design Methods: methods/index.md
      - Research Methods: research-methods/index.md
  - About:
      - State of the Evidence: evidence.md
      - Schema & Guide: CLAUDE.md
