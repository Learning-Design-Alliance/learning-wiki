site_name: Learning Design Wiki
site_description: A persistent, LLM-maintained knowledge base for learning design — principles, elements, patterns, strategies, theories, and empirical claims.
site_url: https://learning-design-alliance.github.io/learning-wiki/
repo_url: https://github.com/Learning-Design-Alliance/learning-wiki
repo_name: Learning-Design-Alliance/learning-wiki
edit_uri: ""
copyright: Copyright &copy; Learning Design Alliance — content licensed CC BY-SA 4.0

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: branding/lazuli-monogram-lapis.svg
  favicon: branding/lazuli-monogram-lapis.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - navigation.path
    - navigation.prune
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

extra:
  generator: false

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Principles: principles/index.md
  - Elements: elements/index.md
  - Patterns: patterns/index.md
  - Strategies: strategies/index.md
  - Theories: theories/index.md
  - Claims: claims/index.md
  - Log: log.md
  - Schema & Guide: CLAUDE.md
