# ============================================================================
# SYNTHETIC EXAMPLE — version 1.1.0.
#
# THIS FILE DOES NOT REPLACE 1.0.0. That file is untouched and still says what
# it said; so is the evidence record it produced. A version is a file, so
# "never silently rewrite what an earlier release claimed" is a property of the
# layout rather than a rule somebody has to remember, and the cost is visible
# too: almost everything below is repeated from 1.0.0, because a version has to
# stand alone to be citable on its own.
#
# What changed: the time-on-task confound raised in
# research/issues/time-on-task-not-held-constant.yaml was confirmed. 1.1.0 adds
# the analysis that settles it and reports the adjusted estimate ALONGSIDE the
# original — as a new evidence record, so that the 1.0.0 estimate remains
# attached to the release that produced it rather than being overwritten.
# ============================================================================

schema_version: 1

release:
  id: example-spaced-review-scheduling
  version: 1.1.0
  supersedes: 1.0.0
  change_note: >-
    Adds a time-on-task analysis and reports an adjusted retention estimate
    beside the original. The 1.0.0 estimate is not withdrawn and not restated:
    it remains the record of what was published on 2026-09-11.
  addresses:
    - kind: issue
      ref: time-on-task-not-held-constant
  title: >-
    SYNTHETIC EXAMPLE — Spaced review scheduling versus end-of-unit review in a
    self-paced online course
  released_at: 2026-09-18
  # The QUESTION, not the finding. A release that cannot say what it was asking
  # is a paper with a conclusion attached.
  question: >-
    In a self-paced online course, does distributing review items across
    sessions produce better four-week retention than presenting the same items
    massed at the end of each unit?

protocol:
  ref: example-platform-learning-telemetry
  version: 1.0.0

research_design:
  family: randomized-controlled-trial
  detail: >-
    Learners randomised 1:1 at enrolment to a spaced or massed review schedule.
    Item pool, item count and total review time budget held constant across
    arms; only the scheduling differed.
  preregistration:
    registered: false
    note: >-
      Not preregistered. Recorded here because the absence is a fact about the
      evidence, and a reader who has to infer it will infer wrongly.

# Identifiers, metadata and hashes. Never the data: a Parquet table of attempt
# events does not belong in a git repository of markdown, and a summary of it
# here would be a second version of the numbers.
datasets:
  - id: attempt-events
    title: Attempt-grain interaction events for the collection window
    grain: one learner attempt on one assessment item
    format: parquet
    rows: 1841260
    size_bytes: 214958080
    location:
      kind: s3
      ref: "s3://SYNTHETIC-EXAMPLE/learning-observations/attempt-events/v1/"
    sha256: 9c90b7a58b61fd49075f73e06ae302f93428293f674632616997b57ec2beb184
    identifiability: pseudonymised
    access: derived
    note: >-
      The grain is the attempt, matching the canonical learning-observation
      pipeline: design configuration, learner exposure, learner action, outcome.

  - id: retention-scores
    title: Four-week retention check scores, aggregated by arm and item family
    grain: one arm x item-family cell
    format: csv
    rows: 96
    size_bytes: 8140
    location:
      kind: url
      ref: "https://SYNTHETIC-EXAMPLE.invalid/releases/spaced-review/retention-scores-v1.csv"
    sha256: e60248bfd9d332e1ab30a35c7c91cf35210aec897f78575727ed3c020160b63c
    identifiability: aggregate
    access: published
    derived_from:
      - attempt-events

  - id: retention-scores-adjusted
