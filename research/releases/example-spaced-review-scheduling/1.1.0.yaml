      Four-week retention scores with realised time on task, aggregated by arm
      — added in 1.1.0
    grain: one arm x item-family cell
    format: csv
    rows: 96
    size_bytes: 9320
    location:
      kind: url
      ref: "https://SYNTHETIC-EXAMPLE.invalid/releases/spaced-review/retention-scores-adjusted-v1.csv"
    sha256: 7f9f91796c38545564743734723d521da4b5d94f2356046dc92fbe37aa16d779
    identifiability: aggregate
    access: published
    derived_from:
      - attempt-events

  - id: reflection-codes
    title: Codes applied to open-text reflection responses
    grain: one response x code
    format: ndjson
    rows: 3112
    size_bytes: 412000
    location:
      kind: s3
      ref: "s3://SYNTHETIC-EXAMPLE/learning-observations/reflection-codes/v1/"
    sha256: 0c31c4059b289cf3ecc7c4721fa1331ec379858f4ec7ac9431a1518b87aac632
    identifiability: pseudonymised
    access: derived
    derived_from:
      - attempt-events

analyses:
  - id: retention-model
    title: Between-arm comparison of four-week retention
    code:
      repo: "https://SYNTHETIC-EXAMPLE.invalid/lda/spaced-review-analysis"
      # A commit, never a branch or a tag: a branch moves, and then the
      # reference names an analysis nobody ran.
      commit: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef   # SYNTHETIC
      path: analysis/retention_model.py
    environment:
      kind: container
      detail: python:3.12-slim, numpy 2.1.0, statsmodels 0.14.4
      lockfile: analysis/requirements.lock
    inputs:
      - attempt-events
    outputs:
      - retention-scores
    ai_processing: false

  - id: reflection-coding
    title: LLM-assisted coding of open-text reflections, with human-reviewed sample
    code:
      repo: "https://SYNTHETIC-EXAMPLE.invalid/lda/spaced-review-analysis"
      commit: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef   # SYNTHETIC
      path: analysis/code_reflections.py
    environment:
      kind: container
      detail: python:3.12-slim, coding model called through a hosted API
      lockfile: analysis/requirements.lock
    inputs:
      - attempt-events
    outputs:
      - reflection-codes
    # Read against the protocol's consent block: an analysis that declares AI
    # processing under a protocol whose consent did not disclose it fails
    # validation. Here the protocol discloses it, so this passes.
    ai_processing: true

  - id: time-on-task-model
    title: >-
      Retention contrast adjusted for realised time on task — added in 1.1.0 in
      response to an issue raised against 1.0.0
    code:
      repo: "https://SYNTHETIC-EXAMPLE.invalid/lda/spaced-review-analysis"
      commit: feedfacefeedfacefeedfacefeedfacefeedface   # SYNTHETIC
      path: analysis/time_on_task_model.py
    environment:
      kind: container
      detail: python:3.12-slim, numpy 2.1.0, statsmodels 0.14.4
      lockfile: analysis/requirements.lock
    inputs:
      - attempt-events
    outputs:
      - retention-scores-adjusted
    ai_processing: false

# The findings are NOT restated here. They are records in observations/, which
# is already the evidence layer, and each names this release back.
evidence:
  # Produced by 1.0.0 and still listed: this version does not disown the
  # earlier estimate, it adds one beside it. The record itself still names
  # release 1.0.0, because that is the version that produced it.
  - ref: example-spaced-review-2026/retention-four-week
    note: The unadjusted estimate, as published in 1.0.0.
  - ref: example-spaced-review-2026/completion
    note: >-
      The null the headline needs beside it — scheduling did not change whether
      people finished.
  - ref: example-spaced-review-2026-adjusted/retention-four-week-adjusted
    note: >-
      Added in 1.1.0: the same contrast with realised time on task in the model.

