  - id: practitioner-brief
    kind: practitioner-brief
    title: SYNTHETIC EXAMPLE — What spacing did and did not change
    location:
      kind: url
      ref: "https://SYNTHETIC-EXAMPLE.invalid/releases/spaced-review/brief"
  - id: analysis-notebook
    kind: notebook
    title: SYNTHETIC EXAMPLE — retention model, as run
    location:
      kind: git
      ref: "https://SYNTHETIC-EXAMPLE.invalid/lda/spaced-review-analysis/blob/deadbee/notebooks/retention.ipynb"

interpretation: >-
  Distributing the same review items across sessions produced a small advantage
  on a four-week retention check, with no detectable difference in whether
  learners finished the course. Version 1.0.0 read that as an effect of
  scheduling; it is not, or not only. Learners in the spaced arm also spent
  about 18 per cent more time on task, because more occasions carry more
  re-entry, and with that in the model the advantage falls to d = 0.12 with an
  interval spanning zero. Both estimates are reported: the unadjusted one
  answers "what happens if you offer this schedule", which is the question a
  course designer asks, and the adjusted one answers "what does distribution
  itself do", which is the question the spacing literature asks. They are
  different questions and 1.0.0 conflated them.

limitations:
  - >-
    Self-paced learners chose their own session boundaries, so the realised
    spacing interval is not the assigned one and is measured, not controlled.
  - >-
    Time on task is adjusted for post hoc, in a model chosen after seeing the
    problem. That is weaker than a design that held it constant, and this
    release does not claim otherwise.
  - >-
    A four-week horizon says nothing about retention at six months, which is
    the horizon most course decisions actually care about.
  - >-
    Learners who consented to research use are not a random sample of learners.
  - >-
    A single course in a single subject; nothing here establishes that the
    scheduling effect transfers to a different item type.

funding: >-
  SYNTHETIC EXAMPLE — no funding, because no research was conducted.

conflicts: >-
  SYNTHETIC EXAMPLE — a real release would record here that the platform
  hosting the course and the group publishing the finding are the same
  organisation, which is a conflict and is declared rather than mitigated away.

provenance:
