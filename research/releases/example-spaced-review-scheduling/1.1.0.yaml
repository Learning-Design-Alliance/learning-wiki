    - id: claude/unspecified
      role: constructed the example
  # The field a consumer reads to know this is not evidence. A real release of
  # this shape would be `platform-experiment`.
  source_type: synthetic-simulation
  created_at: 2026-09-18
  software_versions:
    pipeline: SYNTHETIC-EXAMPLE
  verification: unverified
