interpretation: >-
  Distributing the same review items across sessions produced a small
  advantage on a four-week retention check, with no detectable difference in
  whether learners finished the course. The effect is smaller than the
  laboratory spacing literature would suggest, which is what a self-paced
  setting with learner-chosen session boundaries should be expected to produce:
  the manipulation sets the schedule of what is OFFERED, and the learner sets
  the schedule of what is DONE.

limitations:
  - >-
    Self-paced learners chose their own session boundaries, so the realised
    spacing interval is not the assigned one and is measured, not controlled.
  - >-
    A four-week horizon says nothing about retention at six months, which is
    the horizon most course decisions actually care about.
  - >-
    Learners who consented to research use are not a random sample of learners.
  - >-
    A single course in a single subject; nothing here establishes that the
    scheduling effect transfers to a different item type.

