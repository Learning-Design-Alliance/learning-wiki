# Rau, Aleven & Rummel (2010): blocked versus interleaved practice with
# multiple graphical representations in a fractions intelligent tutor.
#
# Read from a text copy of the LNCS chapter (pp. 413-422); no page images were
# available.
#
# Points a reader needs:
#
#   * TABLE 1 IS NOT RECORDED. Its text layer comes out as a column of labels
#     followed by eight runs of six values, with the condition headers
#     (Blocked, Moderate, Interleaved, Increased) printed once, apart from the
#     numbers. Which run belongs to which condition cannot be read from the
#     text with certainty, so no cell mean is recorded; see not_yet_extracted.
#   * The sample is reported three ways: 296 students in the abstract, 269 in
#     the Methods (and in the chi-square, N = 269), and N = 215 analysed. The
#     record uses the Methods' 269 as the number who took part and 215 as the
#     analysed sample, and keeps the abstract's 296 as a note.
#   * Students were randomly assigned to conditions (individual assignment,
#     stated); analysis was a four-level HLM (tests, students, classes,
#     schools) with Bonferroni-adjusted post-hoc comparisons. No effect sizes
#     are printed, only F statistics and p values.
#   * What is interleaved is three graphical representations of ONE concept
#     (pie chart, number line, set), not problem types needing different
#     strategies. The authors draw that distinction themselves.
#   * No age figure is printed, only "5th- and 6th-grade", and no reliability
#     coefficient for the tests (a confirmatory factor analysis is mentioned,
#     with no figures).

schema_version: 2

study:
  key: rau-2010
  citation: "Rau, M. A., Aleven, V., & Rummel, N. (2010). Blocked versus interleaved practice with multiple representations in an intelligent tutoring system for fractions. In V. Aleven, J. Kay, & J. Mostow (Eds.), Intelligent Tutoring Systems (ITS 2010), Part I, Lecture Notes in Computer Science, vol. 6094 (pp. 413–422). Springer."
  doi: "10.1007/978-3-642-13388-6_45"
  design:
    family: randomized-controlled-trial
    design_detail: >-
      In vivo classroom experiment: students randomly assigned to one of four
      sequences of practice with three graphical representations of fractions
      in example-tracing tutors (blocked, moderate, interleaved, increased),
      crossed with four randomly assigned orders of representations. Pretest,
      immediate post-test (day after the tutor sessions) and delayed post-test
      (seven days later). Four-level hierarchical linear model (tests within
      students within classes within schools); Bonferroni-adjusted post-hoc
      comparisons; a median split on pretest for low and high prior knowledge.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: blocked-interleaved-representations-fractions-its
    bearing: supports
    anchor: rau-2010
  - claim: prior-knowledge-moderates-sequencing-benefit
    bearing: supports
    anchor: rau-2010

evidence_base:
  unit: participants
  size:
    value: 215
    unit: participants
  additional_sizes:
    - value: 269
      unit: participants
      note: "students who took part (Methods; chi-square on exclusions uses N = 269). The abstract says 296."
    - value: 3
      unit: schools
      note: "US schools; students worked with the tutor during regular mathematics instruction"
  population:
    description: >-
      5th- and 6th-grade students from three schools in the United States,
      during their regular mathematics instruction. Analysed students stayed
      in their assigned condition, were present for all test days and did not
      use the tutor at the weekend.
    age_or_stage: "5th and 6th grade"
    age: unreported
  context:
    setting: "Classroom mathematics lessons; example-tracing fractions tutors for a total of 5 hours over five to six consecutive days"
  arms:
    - id: blocked
      description: "All topics with the first graphical representation (36 problems), then with the second, then with the third."
      elements:
        - term: "blocked practice of representations"
      dose:
        amount: 5
        unit: hours
        detail: "tutor time, spread across five to six consecutive days; same problems in every condition"
    - id: moderate
      description: "Representations switched after every third problem."
      elements:
        - term: "moderately interleaved practice of representations"
      dose:
        amount: 5
        unit: hours
    - id: interleaved
      description: "Representations switched after every single problem."
      elements:
        - term: "interleaved practice of representations"
      dose:
        amount: 5
        unit: hours
    - id: increased
      description: "Block length reduced gradually from twelve problems at the beginning to a single problem at the end."
      elements:
        - term: "blocked-to-interleaved practice of representations"
      dose:
        amount: 5
        unit: hours

comparisons:
  - id: four-sequences
    kind: other
    index_arm:
      - blocked
      - moderate
      - interleaved
      - increased
    reference_arm:
      - blocked
      - moderate
      - interleaved
      - increased
    description: "Omnibus HLM test across the four practice sequences (the condition terms of the model); no single pair."
  - id: blocked-vs-interleaved
    kind: between-groups
    index_arm: blocked
    reference_arm: interleaved
    description: "Blocked against interleaved, Bonferroni-adjusted post-hoc comparison."
  - id: blocked-increased-vs-interleaved-moderate
    kind: between-groups
    index_arm:
      - blocked
      - increased
    reference_arm:
      - interleaved
      - moderate
    description: "Blocked and increased each against interleaved and moderate, Bonferroni-adjusted post-hoc comparisons reported together."

