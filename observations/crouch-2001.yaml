      estimate: 32
      unit: "percent of all ConcepTest answer pairs"
      interpretation: "Text: the vast majority of students who revise their answers during discussion change from an incorrect answer to the correct answer, and nearly half of the correct answers given were arrived at after discussion."
    moderators:
      reported:
        - variable: "Initial percentage of correct answers to a ConcepTest"
          relationship: "Correct answers increase substantially after discussion when 35% to 70% answer correctly beforehand; the improvement is largest around 50%."
          source_quote: "after discussion, the number of students who give the correct answer to a ConcepTest increases substantially, as long as the initial percentage of correct answers to a ConcepTest is between 35% and 70%."
