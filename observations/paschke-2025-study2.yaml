# Paschke, Steinmayr, Mertens, Neubauer & Spinath (2025), Dataset 2 (MEGA):
# competence beliefs and intrinsic motivation in maths, Grades 2-4.
#
# Second of two samples in the article; see paschke-2025-study1. Seven waves
# about 4 months apart, and a three-wave model on waves 1, 4 and 7 for one-year
# intervals. Read from the PMC full text (PMC12598449).
#
# Table 1's last row is labelled "July 2001 (t W7)"; the Participants section
# dates the seventh wave July 2011, which is used here.

schema_version: 2
study:
  key: paschke-2025-study2
  citation: Paschke, P., Steinmayr, R., Mertens, A., Neubauer, A. B., & Spinath, B. (2025). Re-examination of the
    reciprocal relation between intrinsic motivation and competence beliefs in math using the random-intercept cross-lagged
    panel framework. Child Development, 96(6), 2201–2220.
  doi: 10.1111/cdev.70028
  design:
    family: longitudinal
    design_detail: 'Dataset 2 (MEGA project, Weidinger et al. 2018), reanalysed: seven waves about 4 months apart,
      July 2009 (Grade 2) to July 2011, plus a three-wave model on waves 1, 4 and 7 (one-year intervals). Multi-indicator
      RI-CLPMs and CLPMs, autoregressive and cross-lagged, in Mplus 8.501 with MLR and FIML; gender as a time-varying
      covariate. No correction for clustering (it caused nonconvergence). Scalar invariance for competence beliefs,
      metric for intrinsic value. No assignment of conditions.'
provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-publisher-fulltext
  verification: unverified
appears_in:
- claim: random-intercepts-competence-beliefs-intrinsic-motivation-strongly-correlated
  bearing: supports
  anchor: paschke-2025
- claim: concurrent-correlations-competence-beliefs-intrinsic-motivation-substantial
  bearing: supports
  anchor: paschke-2025
- claim: ri-clpm-little-no-reciprocal-competence-beliefs-intrinsic-motivation
  bearing: qualifies
  anchor: paschke-2025
evidence_base:
  unit: participants
  size:
    value: 542
    unit: participants
  additional_sizes:
  - value: 27
    unit: classes
    note: classes, nested in 11 schools; not modelled as clusters
  - value: 11
    unit: schools
    note: elementary schools
  population:
    description: German elementary students, 50.2% female; 54.1% reported German as first language, 16.4% another
      language, 29.5% did not report. About 75% of parents consented.
    age_or_stage: Grade 2 at the first wave, Grade 4 at the last
    age:
      unit: years
      mean: 7.96
      sd: 0.58
      note: at the first measurement occasion
  context:
    setting: Germany, 2009-2011; about 45-minute sessions in class, run by trained research assistants, items read
      aloud
  arms: []
comparisons:
- id: within-person
  kind: none
  description: Within-person paths in the RI-CLPMs and lagged paths in the CLPMs; no contrast between groups.
- id: between-person
  kind: none
  description: Between-person and concurrent correlations in the whole Dataset 2 sample; no contrast between groups.
- id: whole-sample-scales
  kind: none
  description: Internal consistency of the scales in the whole sample.
observations:
- id: iv-carryover-ri-w1-w2
  sample:
    value: 542
    unit: participants
  comparison_ref: within-person
  outcome:
    construct: Intrinsic motivation (intrinsic value) for mathematics, within-person deviation
    source_language: t W1–t W2 IV → IV
    measure: Three items, how much the child likes mental arithmetic, math problems and doing calculations; 5-point
      scale, recoded so higher is more intrinsic motivation
    scale: standardised path coefficient
    direction: contextual
    role: learner-characteristic
    role_basis: inferred
    valued_by: []
  time:
    label: July 2009 to November 2009 (adjacent waves, about 4 months apart)
  result:
    measure_type: regression_coefficient
    estimate: 0.38
    standard_error: 0.12
    p_value: 0.001
    model: Autoregressive RI-CLPM, seven waves, tentatively favoured for simplicity (best BIC; the cross-lagged
      RI-CLPM had the better AIC). The cross-lagged RI-CLPM gives 0.22 (SE 0.22) for this interval.
  moderators:
