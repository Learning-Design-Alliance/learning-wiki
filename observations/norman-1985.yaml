    kind: other
    index_arm: experts
    reference_arm: [residents, clerks]
    description: >-
      Divergent construct validity: analysis of variance with level of
      experience as the grouping factor across the three groups (Table 1).
      Not encoded here; see not_yet_extracted.
  - id: replication-agreement
    kind: none
    description: "Correct diagnosis on the first against the second presentation of the same problem, residents and clerks together (Table 5); no contrast between groups."

