      reliability:
        statistic: other
        over: occasions
        form: "generalizability coefficient for generalizing to the second presentation of the same problem (Table 4, column Same/Same/Same/Same); the second presentation was by a different simulated patient"
      note: "Rest of the Table 4 row: same complaint different diagnosis 0·30; different complaint same diagnosis 0·27; different complaint and diagnosis, same specialty 0·20; different specialty 0·08."
    moderators:
