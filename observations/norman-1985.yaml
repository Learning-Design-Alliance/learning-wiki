# Norman, Tugwell, Feightner, Muzzin & Jacoby (1985): knowledge and clinical
# problem-solving. A generalizability study of four scores from simulated-patient
# encounters, with problem content varied systematically.
#
# ALL QUOTES AND NUMBERS COME FROM THE PAGE IMAGES of the scanned PDF (13 pp.),
# read with the Read tool. The OCR text layer beside it is unreliable (broken
# words, misread digits), so no quote was taken from it. Quotes keep the
# article's printed characters, including its raised decimal point ("0·60").
#
# WHAT THIS FILE RECORDS:
#
#   * The generalizability coefficients of Table 4 for the "same problem"
#     column: how far a score on one presentation of a problem generalises to a
#     second presentation of the identical problem, by a different simulated
#     patient about two weeks later. `measure_type: reliability`, statistic
#     `other` (a G coefficient; Appendix 2 says that in its simplest form it is
#     identical to the classical reliability coefficient), over `occasions`.
#     Each observation's note carries the rest of its Table 4 row.
#   * The residual share of total variance from Table 3, per score: the part
#     no content factor (complaint, diagnosis, specialty) and no subject effect
#     explained. Recorded as printed percentages under `measure_type: other`.
#   * Agreement on whether the correct diagnosis was reached on the first and
#     second presentation of the same problem. The text prints "a Kappa
#     coefficient of 0·12"; Table 5, which the text cites, prints
#     "Kappa (weighted) = 0·06". Both are recorded, as two observations, and
#     the discrepancy is not resolved: the source does not say whether the
#     text's figure is unweighted.
#   * The analysis of covariance finding that MCQ knowledge scores were
#     unrelated to performance, which the article states without printing a
#     statistic (qualitative).
#
# Arms are the three training levels. The G and variance analyses used the
# residents and clerks only (Appendix 1: "The criterion clinicians were not
# included in this analysis"), so those observations name both arms.
#
# The DOI is not printed in the article's front matter (1985); it appears in
# the publisher's download stamp in the page margin and matches the given DOI.
# The article prints "Received 21 December 1985; accepted for publication
# 4 March 1985", a received date after the accepted date, as printed.

schema_version: 2

study:
  key: norman-1985
  citation: "Norman, G. R., Tugwell, P., Feightner, J. W., Muzzin, L. J., & Jacoby, L. L. (1985). Knowledge and clinical problem-solving. Medical Education, 19(5), 344–356."
  doi: "10.1111/j.1365-2923.1985.tb01336.x"
  design:
    family: other
    design_detail: >-
      Generalizability study. Each subject saw eight simulated-patient problems
      (four rheumatology, four cardiorespiratory) chosen so that each shared a
      presenting complaint or a diagnosis with another problem in the same
      specialty (Fig. 1); two problems per specialty were presented twice, by
      different simulated patients. Residents and clerks saw five patients on
      each of two half-days about two weeks apart; order randomised. A sixty-item
      MCQ per specialty linked to the diagnoses. Mixed-model ANOVA (BMDP8V) with
      educational level fixed and subjects nested within level; variance
      components turned into generalizability coefficients by the methods of
      Cronbach et al. (1963). Training levels were compared cross-sectionally;
      no assignment of subjects to conditions.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

