    - value: 240
      unit: other
      note: "clinical encounters scored in the study"
    - value: 8
      unit: items
      note: "simulated patient problems, four in rheumatology and four in cardiorespiratory medicine"
  population:
    description: >-
      Five specialists in rheumatology and five in cardiology or respirology,
      ten second-year residents in internal medicine and ten second-year
      medical students (clinical clerks). All but one specialist were academic
      physicians at McMaster University.
    age_or_stage: "Second-year medical students, second-year internal medicine residents and practising specialists; no ages printed"
    age: unreported
  context:
    setting: "McMaster University, Hamilton, Ontario; videotaped encounters with live simulated patients, plus a structured medical record and an MCQ subtest at each session"
  arms:
    - id: clerks
      description: "Ten second-year medical students (clinical clerks)."
      size:
        value: 10
        unit: participants
    - id: residents
      description: "Ten second-year residents in internal medicine."
      size:
        value: 10
        unit: participants
    - id: experts
      description: "Ten subspecialists (five rheumatology, five cardiology or respirology), the criterion group; each saw the four problems in his own specialty in one afternoon."
      size:
        value: 10
        unit: participants

comparisons:
