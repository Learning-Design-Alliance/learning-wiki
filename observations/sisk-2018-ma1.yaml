  - claim: growth-mindset-achievement-correlation-weak
    bearing: supports
    anchor: victoria-f-sisk-2018
  - claim: developmental-stage-moderates-mindset-correlation
    bearing: supports
    anchor: victoria-f-sisk-2018
  - claim: mindset-achievement-heterogeneity-high
    bearing: supports
    anchor: victoria-f-sisk-2018

evidence_base:
  unit: effect-sizes
  size:
    value: 273
    unit: effect-sizes
  additional_sizes:
    - value: 123
      unit: reports
      note: "records included (Fig. 1)"
    - value: 129
      unit: studies
      note: "studies meeting all inclusion criteria"
    - value: 162
      unit: other
      note: "independent samples within the 129 studies"
    - value: 365915
      unit: participants
      note: "total sample size of students across the 273 effect sizes"
  population:
    description: >-
      Students in primary, secondary and postsecondary education, in studies
      from over 20 countries. Academic risk status by effect size: low 208,
      moderate 55, high 6. Of 95 effect sizes with student-level SES reported,
      33 were low-SES samples and 62 not low.
    age_or_stage: >-
      Coded as developmental stage: children (primary school students),
      adolescents (middle school, junior high school and high school students)
      and adults (e.g., postsecondary students). Eight effect sizes from samples
      spanning more than one stage were left out of the stage analysis. The
      article prints no age range or mean.
    age: unreported
  context:
    setting: "Educational settings; achievement measured by course exams, course grades, GPA, standardised tests, and in 24 effect sizes by laboratory-based measures"
  variation:
    - dimension: "Developmental stage (Table 1)"
      distribution: "children 50 effect sizes (N = 8,118), adolescents 126 (N = 332,240), adults 89 (N = 21,673)"
    - dimension: "Academic achievement measure (Table 1)"
      distribution: "course exam 15, course grade 51, GPA 82, standardised test 125; 24 of the 273 were laboratory-based measures (coded as course exams or standardised tests)"
    - dimension: "Mind-set type (Table 1)"
      distribution: "intelligence 167, other attribute (e.g., math ability) 106"
    - dimension: "Publication status (Table 1)"
      distribution: "published 116, unpublished 157"
  arms:
    - id: children
      description: "Effect sizes from samples of children (primary school students)."
      size:
        value: 50
        unit: effect-sizes
    - id: adolescents
      description: "Effect sizes from samples of adolescents (middle school, junior high school and high school students)."
      size:
        value: 126
        unit: effect-sizes
    - id: adults
      description: "Effect sizes from samples of adults (e.g., postsecondary students)."
      size:
        value: 89
        unit: effect-sizes

comparisons:
  - id: whole-corpus
    kind: none
    description: "Mind-set and academic achievement across all 273 effect sizes; no contrast between strata."

observations:

  - id: mindset-achievement-overall
    sample:
      value: 273
      unit: effect-sizes
    comparison_ref: whole-corpus
    outcome:
      construct: "Academic achievement"
      source_language: "academic achievement"
      measure: "Course exams, course grades, GPA and standardised tests, as reported by the primary studies"
      scale: "correlation with growth mind-set scores"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "as measured in the primary studies; mind-set and achievement collected before or without any intervention"
    result:
      measure_type: correlation
      estimate: 0.10
      ci_lower: 0.08
      ci_upper: 0.13
      interval_type: confidence
      p_value: "< .001"
      k:
        value: 273
        unit: effect-sizes
      heterogeneity:
        statistic: I2
        value: 96.29
        unit: percent
        interpretation: "tau2 = .025; described as a very large proportion of heterogeneity"
      publication_bias:
        method: "Published vs unpublished moderator analysis, p-curve, Egger's regression"
        finding: "Published (r = .11) and unpublished (r = .09) did not differ, Q(1) = 0.65, p = .420; p-curve right-skewed (evidential value); Egger's regression significant, B0 = -2.98, 95% CI [-3.58, -2.39], t(271) = 9.92, p < .001, which the authors read with caution given the heterogeneity"
      model: "random-effects"
      interpretation: "Described by the authors as very weak"
      note: >-
        157 of 273 effect sizes (58%) did not differ from zero, 16 (6%) were
        significantly negative and 100 (37%) significantly positive. Assuming
        a mind-set reliability of .80 (a figure the authors take from Dweck et
        al., 1995, not one measured here), the authors report r = .12, 95% CI
        [.09, .14]. Excluding the 24 laboratory-based effect sizes gave r = .11,
        95% CI [.08, .13].
    moderators:
      reported:
        - variable: "Developmental stage"
          relationship: "Children r = .19, adolescents r = .15, adults r = .02 (not significant); adults differed from both other groups"
          source_quote: "The developmental stage of the students was a statistically significant moderator, Q(2) = 72.84, p < .001."
        - variable: "Academic risk status"
          relationship: "Not a significant moderator: low risk r = .11, moderate r = .11, high r = .08"
          source_quote: "Academic risk status was not a significant moderator, Q(2) = 0.22, p = .895."
        - variable: "Socioeconomic status"
          relationship: "Not a significant moderator: low SES r = .17, middle class and higher r = .12"
          source_quote: "Socioeconomic status was not a significant moderator, Q(1) = 1.48, p = .223."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: unreported
      outcome_timing: unreported
      effect_size: observed
      pooled_k: observed
    observability_notes: >-
      Whether each correlation was concurrent or prospective is not reported;
      the inclusion rule says only that both measures were collected before or
      without an intervention.
    source_quote: "The meta-analytic average correlation (i.e., the average of various population effects) between growth mind-set and academic achievement is r = .10, 95% confidence interval (CI) = [.08, .13], p < .001."
    source_location: "Meta-Analysis 1, Results (p. 554)"

