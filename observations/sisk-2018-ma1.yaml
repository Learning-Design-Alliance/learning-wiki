# Sisk, Burgoyne, Sun, Butler & Macnamara (2018), Meta-Analysis 1: the
# correlation between students' mind-sets and academic achievement.
#
# The article reports two meta-analyses with different corpora (Meta-Analysis 1:
# 129 studies, 273 effect sizes, N = 365,915; Meta-Analysis 2: 29 studies, 43
# effect sizes, N = 57,155), so each has its own record. This one is Meta-Analysis
# 1; `sisk-2018-ma2` is the intervention meta-analysis.
#
# WHAT THIS FILE RECORDS:
#
#   * The pooled correlation over all 273 effect sizes, and the three
#     developmental-stage strata (children, adolescents, adults) as arms named by
#     `arm_ref`: a stratum's correlation is a result about one stratum, not a
#     contrast between two.
#   * `k` counts EFFECT SIZES. The corpus is 123 records, 129 studies, 162
#     independent samples and 273 effect sizes.
#   * `population.age: unreported`. The article codes developmental stage
#     (children = primary school, adolescents = middle/junior high/high school,
#     adults = e.g. postsecondary) and prints no age figure.
#   * No reliability observation. The article says very few primary studies
#     reported a reliability for mind-set, and its corrected estimate (r = .12)
#     assumes a reliability of .80 taken from another study (Dweck et al., 1995).
#     That .80 is not this study's figure; the corrected r is kept in a note on
#     the overall observation, labelled as resting on the assumption.
#
# Read from the publisher PDF's text layer (pdftotext). The I² values print as
# "I2" in the text layer; the quotes keep the text layer's characters.

schema_version: 2

study:
  key: sisk-2018-ma1
  citation: "Sisk, V. F., Burgoyne, A. P., Sun, J., Butler, J. L., & Macnamara, B. N. (2018). To what extent and under which circumstances are growth mind-sets important to academic achievement? Two meta-analyses. Psychological Science, 29(4), 549–571."
  doi: "10.1177/0956797617739704"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-Analysis 1 of two in one article: random-effects meta-analysis of
      bivariate correlations between a measure of students' mind-set (belief
      that a human attribute such as intelligence is fixed or malleable),
      collected before or without any mind-set intervention, and academic
      achievement (course exam, course grade, GPA or standardised test).
      Mixed-effects moderator analyses (developmental stage, academic risk
      status, SES, achievement measure) and publication-bias analyses.
  synthesis:
    model: "Random-effects meta-analysis, effect sizes weighted by inverse variance; mixed-effects models for moderators (Comprehensive Meta Analysis Version 2)"
    heterogeneity_statistic: "I2"
    reporting_guideline: "PRISMA"
    search:
      databases:
        - ERIC
        - PsycINFO
        - PubMed
        - ProQuest Dissertations & Theses
        - Google Scholar
      date_range: "through October 28, 2016; new data accepted through January 11, 2017"
      records_screened: 15858
      records_included: 123
    inclusion:
      - "A measure of a belief about one or more human attributes as fixed or malleable, collected prior to or without a mind-set intervention"
      - "A measure of academic achievement (course exam, course grade, GPA or standardised test) collected prior to or without a mind-set intervention"
      - "A bivariate correlation between mind-set and achievement reported, or enough information to compute it"
      - "Methods and results in English"
    exclusion:
      - "Measures of beliefs about the importance of effort without beliefs about the malleability of an attribute"
      - "Mind-set of willpower"
    data_handling:
      - "Dependent effect sizes (several mind-set or achievement measures per sample) adjusted by lowering the associated sample size, after Cheung and Chan (2004, 2008)"
      - "Standardised mean differences from group comparisons converted to biserial correlations"
      - "Signs coded so that a positive correlation means growth mind-set goes with higher achievement"
      - "Outliers defined as residual z of 3 or more; none found"
      - "Individual effect sizes not corrected for measurement unreliability, because very few studies reported a reliability for mind-set"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

