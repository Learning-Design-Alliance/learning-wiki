# Tarmizi & Sweller (1988), Experiment 4: conventional geometry problems,
# conventional (split-source) worked examples and modified (integrated) worked
# examples for the top 30 students of a Year 9 mathematics class in Sydney.
#
# Read from the publisher PDF, a scan with an OCR text layer. The OCR layer
# mangles the statistics ("F(l, 27)", "MS, = 12.71", "F{\, 27)", and the
# volume as "SO"), so EVERY F ratio and MSe recorded below was read from the
# page images (pp. 432-433), not from the text. The source quotes are the
# clean prose in front of each statistic and the Table 4 rows, which the text
# layer reproduces correctly; each was checked against the page images.
#
# Allocation: Experiment 4 says only "There were three groups of 10 subjects
# each" and that its general procedure was similar to Experiment 3's, in which
# subjects were allocated at random. The Experiment 4 method does not itself
# state random allocation, so the design family is `other`, not a randomised
# trial.
#
# Experiments 1-3 and 5 used other samples and are not recorded here.

schema_version: 2

study:
  key: tarmizi-1988-exp4
  citation: "Tarmizi, R. A., & Sweller, J. (1988). Guidance during mathematical problem solving. Journal of Educational Psychology, 80(4), 424–436."
  doi: "10.1037/0022-0663.80.4.424"
  design:
    family: other
    design_detail: >-
      Three-group between-subjects experiment, 10 subjects a group:
      conventional problems, conventional (split-source) worked examples and
      modified worked examples with the solution steps placed within the
      geometric diagram. 16-minute acquisition period of paired two-step
      circle-geometry problems, then four test problems; verbal protocols
      recorded throughout. Group differences tested as planned single-df
      contrasts, F(1, 27). The method of allocation to groups is not stated
      for this experiment (see header).

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: split-attention-effect-in-worked-examples
    bearing: supports

evidence_base:
  unit: participants
  size:
    value: 30
    unit: participants
  population:
    description: >-
      The top 30 students from the Year 9 mathematics class of a Sydney high
      school, not previously exposed to circle geometry; their mathematical
      background was sufficient to follow the explanations and solve problems
      in the area.
    age_or_stage: "Year 9"
    age: unreported
  context:
    setting: "A Sydney high school; circle-geometry problems, students working individually and thinking aloud"
  arms:
    - id: conventional
      description: "Conventional problems: every acquisition problem solved, presented in conventional fashion."
      size:
        value: 10
        unit: participants
      dose:
        amount: 16
        unit: minutes
        detail: "acquisition period"
    - id: conventional-worked-example
      description: "Conventional worked examples: the first of each similar problem pair presented as a worked example in the conventional split-source format (solution text separate from the diagram), the second solved as a conventional problem."
      size:
        value: 10
        unit: participants
      dose:
        amount: 16
        unit: minutes
        detail: "acquisition period"
    - id: modified-worked-example
      description: "Modified worked examples: the same procedure with the worked solution placed within the geometric diagram as numerically ordered steps, calculated angle values in red and givens in black."
      size:
        value: 10
        unit: participants
      elements:
        - term: "worked solution steps integrated into the diagram"
      dose:
        amount: 16
        unit: minutes
        detail: "acquisition period"

comparisons:
  - id: modified-vs-other-two
    kind: between-groups
    index_arm: modified-worked-example
    reference_arm: [conventional, conventional-worked-example]
    description: "Modified worked-example group against the conventional and conventional worked-example groups combined, a single-df contrast."
  - id: modified-vs-conventional-worked-example
    kind: between-groups
    index_arm: modified-worked-example
    reference_arm: conventional-worked-example
    description: "Integrated against split-source worked examples, a single comparison between the two worked-example groups."

