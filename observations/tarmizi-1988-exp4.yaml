      value: 30
      unit: participants
    comparison_ref: modified-vs-other-two
    outcome:
      construct: "Acquisition throughput"
      source_language: "No. problems processed"
      measure: "Number of acquisition problems processed in the 16-minute acquisition period"
      scale: "F for a single-df contrast"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "acquisition phase"
    result:
      measure_type: other
      statistic: "F(1, 27) = 12.60, MSe = 12.71"
      descriptives: "Mean problems processed: conventional 7.7, conventional worked example 7.1, modified worked example 12.30 (Table 4)"
      interpretation: "Modified worked-example group processed significantly more problems; the other two groups did not differ, F(1, 27) = 0.14, MSe = 12.71."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: "No standardised effect size or SD is printed; only the MSe. The F and MSe were read from the page image (p. 432)."
    source_quote: "The modified worked-example group processed significantly more problems than the other two groups,"
    source_location: "Experiment 4, Results and Discussion, p. 432"

