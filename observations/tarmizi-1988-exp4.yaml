  - id: test-problem1-time-worked-example-contrast
    sample:
      value: 30
      unit: participants
    comparison_ref: modified-vs-conventional-worked-example
    outcome:
      construct: "Geometry problem-solving speed"
      source_language: "Mean s to solution"
      measure: "Seconds to solve test Problem 1, very similar to the acquisition problems; maximum 180 s"
      scale: "F for a single-df contrast"
      direction: lower-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "test phase, immediately after acquisition"
    result:
      measure_type: other
      statistic: "F(1, 27) = 4.95, MSe = 2173.19"
      descriptives: "Mean s to solution: conventional 87.8, conventional worked example 129.0, modified worked example 82.6 (Table 4)"
      interpretation: >-
        Significant in the single comparison of the two worked-example groups.
        The modified group against the other two combined was not significant,
        F(1, 27) = 2.04, MSe = 2173.19.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      F and MSe read from the page image (p. 433). The MSe is from the
      three-group analysis (27 error df), so the sample is all 30 students.
      Subjects who failed a problem were given the maximum time; the authors
      say this violated ANOVA assumptions and that nonparametric tests gave
      identical conclusions.
    source_quote: "It might be noted also that a single comparison between the two worked-example groups yielded a significant effect,"
    source_location: "Experiment 4, Results and Discussion, p. 433"

