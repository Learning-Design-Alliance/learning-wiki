      implementation_detail: partial
      outcome_timing: observed
      effect_size: unreported
    observability_notes: &den >-
      The paper does not say whether indeterminate pairs are in the
      denominator; effect_size is unreported because a rate is not an effect.
    source_quote: &q3 "Under this criterion, the frequency of wheel spinning in CL1, CL2 and Geometry dataset is 6.6%, 0.56%, and 10.2% of (student, KC) pairs, respectively."
