# Zhang, Huang, Wang, Lu, Fang, Stamper, Fancsali, Holstein & Aleven (2019):
# early detection of wheel spinning across tutors, models, features and
# operationalizations (EDM 2019 short paper).
#
# What is recorded: how often wheel spinning occurs in three tutor data sets
# under two operationalizations (Sections 2.1.1 and 2.1.2), and how far the two
# operationalizations agree on which (student, KC) pairs are wheel spinning
# (Section 3.1.1). The detector results (precision and recall of six models)
# are listed in not_yet_extracted.
#
# THE ARMS ARE DATA SETS, NOT CONDITIONS. No learner was assigned anything:
# CL1 and CL2 are two Algebra sections of MATHia (2017-18), Geometry is a high
# school geometry tutor. Each figure is about one data set, so each
# observation names it with arm_ref. The two operationalizations are two
# outcome definitions applied to the same pairs, recorded as separate
# observations rather than as arms.
#
# DENOMINATOR. The paper gives the rates as a percentage "of (student, KC)
# pairs" and says indeterminate pairs were discarded "before training our
# models". It does not say whether the rates are taken before or after that
# discard. The pair counts in the arms are the data sets' totals as printed in
# Section 2; they are not stated to be the rates' denominators.
#
# The agreement figures are recorded as `reliability` (percent agreement
# between two classification rules). The statistic is the paper's own: of the
# pairs labelled wheel spinning by EITHER rule, the share labelled so by both.
# It is not overall percent agreement across all pairs, and `form` says so.
#
# DOI: none recorded. Crossref (title and author search, 2019-2020) and
# DataCite (title search) were searched on 2026-11-27 and returned no record
# for this paper. The field is omitted rather than null: a null asserts that
# none is registered, which a search that finds nothing does not establish.
#
# Read from the ERIC repository copy (text layer, which is clean; no table
# figures are quoted). Age: the article prints no age figure, so
# age: unreported.

schema_version: 2

study:
  key: zhang-2019-wheel-spinning
  citation: "Zhang, C., Huang, Y., Wang, J., Lu, D., Fang, W., Stamper, J., Fancsali, S., Holstein, K., & Aleven, V. (2019). Early detection of wheel spinning: Comparison across tutors, models, features, and operationalizations. In Proceedings of the 12th International Conference on Educational Data Mining (EDM 2019), Montreal, QC, Canada. ERIC ED594575."
  design:
    family: observational
    design_detail: >-
      Secondary analysis of tutor log data exported from DataShop, three data
      sets. Each (student, KC) pair labelled mastered, wheel spinning or
      indeterminate under two operationalizations: three correct in a row
      within the first 10 practice opportunities (Beck & Gong), and the
      Predictive Stability++ policy with Bayesian Knowledge Tracing (shipped
      parameters for the two MATHia data sets, fitted parameters for
      Geometry). Six wheel-spinning detectors then trained and tested on a
      6:4 split. No conditions were assigned.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-repository-copy
  verification: unverified

evidence_base:
  unit: other
  size:
    value: 3
    unit: other
  additional_sizes:
    - value: 132551
      unit: pairs
      note: "(student, KC) pairs in the CL1 data set"
    - value: 419832
      unit: pairs
      note: "(student, KC) pairs in the CL2 data set"
    - value: 8175
      unit: pairs
      note: "(student, KC) pairs in the Geometry data set"
  population:
    description: >-
      Students working in two Algebra sections of the MATHia intelligent
      tutoring system (Carnegie Learning) in the 2017-18 school year, and
      students using a high school geometry tutor. The paper gives no number
      of students, school, grade or demographic detail.
    age_or_stage: "Algebra (MATHia) and high school geometry; no grade or age stated."
    age: unreported
  context:
    setting: "Intelligent tutoring systems with multi-step problems, each problem practising several knowledge components; logs exported from DataShop"
  arms:
    - id: cl1
      description: "CL1: one Algebra section of MATHia, 2017-18 school year."
      size:
        value: 132551
        unit: pairs
    - id: cl2
      description: "CL2: a second Algebra section of MATHia, 2017-18 school year."
      size:
        value: 419832
        unit: pairs
    - id: geometry
      description: "Geometry: a high school geometry tutor (the paper cites Liu & Koedinger 2017 for it)."
      size:
        value: 8175
        unit: pairs

comparisons: []

