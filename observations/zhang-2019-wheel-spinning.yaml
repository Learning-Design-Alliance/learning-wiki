      source_language: "the frequency of wheel spinning ... of (student, KC) pairs"
      measure: "Three correct in a row criterion: a (student, KC) pair with 10 or more steps and no three contiguous correct attempts within the first 10 steps is wheel spinning"
      scale: "percent of (student, KC) pairs"
      direction: lower-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time: &t10
      label: "first 10 practice opportunities on the KC"
    result:
      measure_type: probability
      estimate: 6.6
      unit: "percent of (student, KC) pairs"
    moderators:
      reported: []
      candidate: []
    observability: &obs
