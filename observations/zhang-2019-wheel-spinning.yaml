not_yet_extracted:
  - "Detector precision and recall at the fourth step (Section 3.3.1): Random Forest (77.2%, 63.5%) under three correct in a row and (90.8%, 81.4%) under PS++; MLP (71.9%, 58.9%) and (82.4%, 77.2%); baseline logistic regression (74.9%, 58.2%) and (75.3%, 59.9%). The paper does not say on which data set these were measured."
  - "Single-feature logistic regression on 'Correct Response Percentage': 93.5% precision and 77.1% recall after 4 steps for the PS++ label; on 'Assistance Score', 68.4% precision and 60% recall at the fourth step (Section 3.2.2). Data set not stated."
  - "Figure 7 (precision and recall by step, per detector, data set and criterion) and Figures 1-3 (confusion matrices) are images; no figures read from them."
  - "CL2: 'over 97% (student, KC) pairs are under mastery class after discarding the indeterminate class' (Section 3.3.2), a bound on the mastered share, not recorded as an observation."
