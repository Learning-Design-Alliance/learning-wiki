    sample:
      value: 30
      unit: effect-sizes
    comparison_ref: whole-corpus
    outcome:
      construct: "Academic achievement"
      source_language: "academic achievement"
      measure: "Achievement indices as reported by the primary studies, correlated with overall student engagement"
      scale: "Pearson r (pooled via Fisher's z)"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "cross-sectional, as measured in the primary studies"
    result:
      measure_type: correlation
      estimate: 0.269
      ci_lower: 0.258
      ci_upper: 0.279
      interval_type: confidence
      p_value: "p < .001"
      statistic: "z = 46.095"
      k:
        value: 30
        unit: effect-sizes
      heterogeneity:
        statistic: I2
        value: 88.442
        interpretation: "QT(29) = 250.906, p < .001"
    moderators:
      reported:
        - variable: "Cultural value"
          relationship: "Higher in Eastern samples (r = .320) than Western samples (r = .257)"
          source_quote: "the correlations between overall, emotional, and cognitive engagement and academic achievement were higher for Eastern students (r = .320, p < .001; r = .276, p < .001; r = .343, p < .001, respectively) compared to Western students (r = .257, p < .001; r = .205, p < .001; r = .241, p < .001, respectively)."
        - variable: "Gender composition of the sample"
          relationship: "Meta-regression significant (QM(1, k = 26) = 87.383); the article reports the effect size increasing with the number of female participants, rOE = .881"
          source_quote: "gender significantly moderated the relationships of overall, behavioral, and cognitive engagement with academic achievement, QM,OE (1,k = 26) = 87.383, p < .001"
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: unreported
      outcome_timing: unreported
      effect_size: observed
      pooled_k: observed
    observability_notes: >-
      Where a primary study did not report overall engagement, the authors
      used the average of its three domain correlations.
    source_quote: "overall engagement, rOE = .269 (z = 46.095, p < .001, k = 30, 95% CI = .258, .279)"
    source_location: "Results, Overall Relationship (p. 523); heterogeneity in Moderator Analysis (p. 523)"

