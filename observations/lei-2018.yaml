# Lei, Cui & Zhou (2018): student engagement and academic achievement, a
# meta-analysis of correlations (Grades 1-12, literature 2003-2015).
#
# Read from the publisher's PDF text layer; every quote matches it. The article
# has no tables: every figure below is in the Results text (pp. 522-524).
#
# WHAT THIS RECORD HOLDS:
#
#   * The four pooled correlations, overall engagement and its behavioural,
#     emotional and cognitive domains, each with its own k. Summed, the four
#     k (30 + 55 + 47 + 31) equal the 163 effect sizes, so k counts effect
#     sizes (one per independent sample per domain), not studies.
#   * The reporting-method strata for behavioural and emotional engagement
#     (other-reported against self-reported) as arms with `arm_ref`, because
#     the article prints a pooled r per stratum and no k for either.
#   * `age: unreported`: the article names Grades 1 to 12 and prints no age
#     figure.
#
# No reliability is recorded: the article prints no reliability for any
# engagement or achievement measure and does not correct correlations for
# attenuation. No moderator k is printed for the reporting-method or
# cultural-value strata.
#
# The cultural-value text contradicts itself for behavioural engagement: it
# says the correlation "was higher for Western students (r = .354 ...) than for
# Eastern students (r = .377 ...)". Both numbers are recorded as printed in a
# moderator entry; which label or number is wrong cannot be settled from the
# article.

schema_version: 2

study:
  key: lei-2018
  citation: "Lei, H., Cui, Y., & Zhou, W. (2018). Relationships between student engagement and academic achievement: A meta-analysis. Social Behavior and Personality, 46(3), 517-528."
  doi: "10.2224/sbp.7054"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-analysis of Pearson correlations between student engagement
      (overall, and the behavioural, emotional and cognitive domains of
      Fredricks et al.'s three-factor model) and academic achievement, in
      Chinese- and English-language studies published 2003-2015. Moderators:
      method of reporting engagement and cultural value (subgroup homogeneity
      tests) and gender (meta-regression on the share of male or female
      participants). The authors state that the included studies were
      cross-sectional and that no causal inference can be made.
  synthesis:
    model: "Comprehensive Meta-Analysis 2.0; r converted to Fisher's z, weighted, and back-transformed; the article states it used a fixed effect model to calculate homogeneity statistics and names no other pooling model"
    heterogeneity_statistic: "Q and I2"
    search:
      databases:
        - CNKI
        - VIP
        - Wanfang
        - Web of Science
        - Elsevier SDOL
        - EBSCO
        - Springer
        - PsycINFO
        - ProQuest Digital Dissertations
        - Google Scholar
      date_range: "2003-2015"
      records_screened: 273
      records_included: 69
    inclusion:
      - "Engagement conceptualised as behavioural, emotional and cognitive (studies using the vigor/dedication/absorption model excluded)"
      - "Empirical study mainly of the engagement-achievement correlation, reporting a Pearson r"
      - "Sample size clear; participants from the general population"
      - "Engagement measured at the individual level, not the class level"
      - "Published in Chinese or English"
    data_handling:
      - "Effect sizes per independent sample; correlations at several time points for the same domain and index averaged into one"
      - "Where a study reported all three domains but not overall engagement, overall was the average of the three domains"
      - "Where a study reported several aspects of one domain, their average correlation was used"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

