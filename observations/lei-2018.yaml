evidence_base:
  unit: effect-sizes
  size:
    value: 163
    unit: effect-sizes
  additional_sizes:
    - value: 69
      unit: other
      note: "independent samples (the abstract calls them independent studies); 1 to 8 samples per study"
    - value: 196473
      unit: participants
      note: "total participants across the 69 samples"
  population:
    description: >-
      Students in Grades 1 to 12 from the general population, in samples coded
      by cultural value as Eastern (Asian countries such as China, Korea, the
      Philippines, Singapore), Western (European and North American) or other.
    age_or_stage: "Grades 1 to 12"
    age: unreported
  context:
    setting: "School students; achievement indices as reported by the primary studies"
  variation:
    - dimension: "Engagement domain of the participants"
      distribution: "overall engagement 14.31% of participants, behavioural 45.20%, emotional 24.76%, cognitive 15.73%"
    - dimension: "Cultural value"
      distribution: "Eastern, Western or other; counts per category not printed"
  arms:
    - id: be-other-reported
      description: "Samples in which behavioural engagement was reported by someone other than the student (the authors say mainly teachers)."
    - id: be-self-reported
      description: "Samples in which behavioural engagement was self-reported by the student."
    - id: ee-other-reported
      description: "Samples in which emotional engagement was reported by someone other than the student."
    - id: ee-self-reported
      description: "Samples in which emotional engagement was self-reported by the student."

comparisons:
  - id: whole-corpus
    kind: none
    description: "Pooled correlation across all samples reporting the domain; no contrast between groups."

