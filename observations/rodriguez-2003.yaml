      scale: "reliability coefficient, mean across correlations"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "as reported by the primary studies"
    result:
      measure_type: reliability
      estimate: 0.76
      reliability:
        statistic: other
        over: other
        form: "Mixed: coefficient alpha (13 correlations), K-R 20 (23), split half (7), ANOVA estimates (3), type not reported (2), imputed (8)"
      descriptives: "Unweighted over n = 56: median 0.77, M 0.76, SD 0.11, skew -0.69 (significant), 5th percentile 0.55, 95th percentile 0.91"
      note: "No significant differences in score reliability by type of reliability for CR items (F = 0.78, p = .57)."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: partial
      effect_size: unreported
    observability_notes: >-
      As for the MC reliabilities: an unweighted mean of mixed coefficients,
      not one instrument's reliability.
    source_quote: "CR reliability 0.77 0.76 0.11 -0.69* 0.55 0.91"
    source_location: "Table 4 (p. 173)"

