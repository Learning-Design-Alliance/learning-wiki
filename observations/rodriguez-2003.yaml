    source_quote: "Age 0.191 0.116 0.248 1.649 0.105"
    source_location: "Table 7 (p. 179); text p. 177-178"

  # The reliabilities that the correction for attenuation divides by: the
  # article's own coded values over its 56 correlations, as Table 4 prints
  # them. Not the reliability of any single instrument.
  - id: mc-reliability-summary
    sample:
      value: 56
      unit: effect-sizes
    comparison_ref: whole-corpus
    outcome:
      construct: "Score reliability of the MC forms"
      source_language: "MC reliability"
      measure: "Reported reliabilities of the MC forms behind the 56 correlations (imputed where not reported)"
      scale: "reliability coefficient, mean across correlations"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "as reported by the primary studies"
    result:
      measure_type: reliability
      estimate: 0.79
      reliability:
        statistic: other
        over: other
        form: "Mixed: coefficient alpha (13 correlations), K-R 20 (23), split half (7), ANOVA estimates (3), type not reported (2), imputed (8)"
      descriptives: "Unweighted over n = 56: median 0.82, M 0.79, SD 0.14, skew -0.89 (significant), 5th percentile 0.51, 95th percentile 0.97"
      note: "No significant differences in score reliability by type of reliability for MC forms (F = 1.64, p = .17)."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: partial
      effect_size: unreported
    observability_notes: >-
      The estimate is the unweighted mean of a mixed set of coefficients,
      as Table 4 prints it; it is not one instrument's reliability. Most are
      internal-consistency estimates, which the author notes do not include
      error due to occasions when the two forms are given separately.
    source_quote: "MC reliability 0.82 0.79 0.14 -0.89* 0.51 0.97"
    source_location: "Table 4 (p. 173)"

  - id: cr-reliability-summary
