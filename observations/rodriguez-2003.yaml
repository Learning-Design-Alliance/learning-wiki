    source_location: "Table 6 (p. 178)"

  - id: age-moderator-wls
    sample:
      value: 56
      unit: effect-sizes
    comparison_ref: whole-corpus
    outcome:
      construct: "Construct equivalence of MC and CR formats"
      source_language: "Weighted least squares regression random effects moderator analysis"
      measure: "Fisher Z transformed corrected correlations regressed on item-design dummy variables and age level of subjects"
      scale: "unstandardised regression coefficient for age, Fisher Z metric"
      direction: contextual
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "as tested in the primary studies"
    result:
      measure_type: regression_coefficient
      estimate: 0.191
      standard_error: 0.116
      p_value: "0.105"
      statistic: "t = 1.649; standardised coefficient 0.248"
      model: "Weighted least squares regression with a random variance component, item design (stem equivalent, content equivalent, essay-type) entered alongside age"
      interpretation: "The author reads it as no effect of age: the correlation is similar for primary, secondary and post-secondary/adult examinees."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: partial
      effect_size: observed
      pooled_k: unreported
    observability_notes: >-
      The number of correlations entered in the regression is not printed
      (pooled_k unreported). The coding of age for the regression (presumably the education-level
