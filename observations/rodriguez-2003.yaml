      estimate: 0.860
      ci_lower: 0.815
      ci_upper: 0.894
      interval_type: confidence
      k:
        value: 35
        unit: effect-sizes
      model: "random-effects"
      note: "Within this group (Table 6): content equivalent 0.915 (0.837, 0.956), n 12; not content equivalent 0.839 (0.661, 0.927), n 8; essay-type items 0.810 (0.674, 0.893), n 15. The fixed-effects mean for non-stem-equivalent items is 0.85."
    moderators:
      reported: []
