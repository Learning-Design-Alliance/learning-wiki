# Muldner, Burleson, Van de Sande & VanLehn (2011), Study 1: is student or
# problem the better predictor of gaming, in Andes physics tutor logs.
#
# The article analyses two log corpora with different samples, so each is its
# own record: this file is the primary Andes analysis (286 college students,
# 318 problems); `muldner-2011-study2` is the Algebra Cognitive Tutor
# replication (53 high-school students, 775 problems).
#
# WHAT THIS FILE RECORDS:
#
#   * The linear regression of a student's percentage of gamed actions on a
#     problem on the student's average gaming and the problem's average gaming:
#     R2 .608, standardised coefficients .658 (student) and .325 (problem), and
#     each predictor entered alone (49.6% and 18.6% of the variance).
#   * The two "self-correlations": a student's average gaming on two random
#     halves of their problems (r = .963), and a problem's average gaming on two
#     random halves of its students (r = .89), with the authors' Z test of the
#     difference. The source calls these self-correlations, not reliability, and
#     prints no Spearman-Brown correction; they are recorded as correlations,
#     as printed.
#
# All of it is associational: nothing was assigned. Gaming is labelled by the
# authors' latency-based rule detector, which they say was hand-checked on a
# new data fragment; no agreement or accuracy figure for the detector is
# printed, so no reliability observation is recorded.
#
# `population.age: unreported`: the article says "college physics classes" and
# "college students working at home" and prints no age figure.
#
# Read from the publisher's online-first PDF text layer (Springer, "123" page
# footers). Page numbers are not cited because the online-first pagination
# differs from the journal's 99-135; sections are.

schema_version: 2

study:
  key: muldner-2011-study1
  citation: "Muldner, K., Burleson, W., Van de Sande, B., & VanLehn, K. (2011). An analysis of students' gaming behaviors in an intelligent tutoring system: Predictors and impacts. User Modeling and User-Adapted Interaction, 21(1-2), 99-135."
  doi: "10.1007/s11257-010-9086-0"
  design:
    family: observational
    design_detail: >-
      Secondary analysis of DataShop logs of the Andes physics tutor, used for
      assigned homework and test preparation in six college physics classes
      over about three years. A rule-based detector labels each tutor-student
      turn pair as gamed or not from response latency (skipping hints, copying
      bottom-out hints, guessing after an incorrect entry, asking for a hint
      straight after a correct entry). Per student-problem percentage of gamed
      actions is analysed by linear regression, split-half self-correlations,
      frequency distributions and Bayesian network parameter learning. No
      condition was assigned.

