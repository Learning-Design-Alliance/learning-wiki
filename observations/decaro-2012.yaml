    source_quote: &qconceptual "Conceptual knowledge Posttest Retention test 59 (28) 62 (26) 60 (23) 63 (21) 64 (22) 65 (22) 64 (24) 69 (21)"
    source_location: "Table 2 (p. 560)"

  - id: mean-conceptual-retention-is-se
