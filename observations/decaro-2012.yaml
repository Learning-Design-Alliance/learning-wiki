not_yet_extracted:
  - "Conceptual knowledge posttest cell means (Table 2): 59 (28), 60 (23), 64 (22), 64 (24) for instruct-solve extra practice, instruct-solve self-explain, solve-instruct extra practice, solve-instruct self-explain."
  - "Scoring agreement on the conceptual items requiring an explanation, 'kappas = 89–96%', two raters blind to condition on 20% of those items; not recorded because the number of items the range spans is not printed. Strategy-report coding kappa = 80%; self-explanation coding kappa = 89%."
  - "Time effects: procedural knowledge 72% to 76% (F(1, 152) = 3.07, p = .082, partial eta squared .02); conceptual knowledge 62% to 65% (F(1, 152) = 8.75, p = .004, partial eta squared .05)."
  - "Pretest: procedural M = 47% (SD = 27), conceptual M = 36% (SD = 19)."
  - "Intervention process measures: midtest relational definition 58% vs 20% (chi-square 23.18); midtest encoding 54% vs 44% (F = 4.16, partial eta squared .03); intervention accuracy 52% vs 65% (F = 6.36, partial eta squared .04); strategy use (Table 3), number of incorrect strategies 0.74 vs 0.47; subjective ratings (Table 4) and their correlations with conceptual knowledge."
  - "Far transfer at retention (seven items): accuracy 'quite low', no differences across conditions; no figures printed."
