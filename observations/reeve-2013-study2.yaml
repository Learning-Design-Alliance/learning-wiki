# Reeve (2013), Study 2: validating the Agentic Engagement Scale (AES).
#
# One article, three studies with three different samples, so three records:
# reeve-2013-study1, reeve-2013-study2, reeve-2013-study3.
#
# WHAT THIS FILE RECORDS: the AES's correlations with autonomous motivation
# (.44) and controlled motivation (−.14); autonomous motivation's correlations
# with the other three aspects of engagement (Table 5 row 1), which the author
# uses to say that engagement in general, not agentic engagement in particular,
# goes with autonomous motivation; agentic engagement's path to course grade in
# the structural model; and the alphas the article prints for this sample.
#
#   * `population.age: unreported`: college students; no age figure printed.
#   * `measure_type: reliability`: six alphas. The Method text prints the AES
#     alpha as "(α = 84)"; the recorded .84 is Table 3's, and the slip is noted.
#   * All motivation and engagement measures are self-reports collected in one
#     session; only course grade comes from the school record.
#
# QUOTES. The text layer of this PDF renders "=" as "⫽", alpha as "␣", "<" as
# "⬍", minus as "⫺" and significance stars as "ⴱⴱ", and scrambles two-column
# pages. Every source_quote containing one of those characters, and every table
# row, was taken from the page image of the publisher's PDF and is written in
# the article's own characters ("=", "α", "<", "−", "**"); the words around them
# are as in the text layer, including its line-break hyphens ("in- cluded").
# Read back into the text layer's glyphs, the Table 1 rows and the single-column
# sentences match it exactly. Table 3, the Table 5 row, the Study 2 engagement
# alphas and every Study 3 quote come out of the text layer interleaved or
# garbled, and were read from the page images (pp. 585, 588, 589) only.

schema_version: 2
study:
  key: reeve-2013-study2
  citation: >-
    Reeve, J. (2013). How students create motivationally supportive learning environments for themselves:
    The concept of agentic engagement. Journal of Educational Psychology, 105(3), 579–595.
  doi: 10.1037/a0032690
  design:
    family: observational
    design_detail: >-
      Cross-sectional questionnaire study with a later outcome: self-reported motivation and four aspects
      of engagement midway through the semester, final course grade from the school record at the end.
      Correlations of observed scores; multilevel confirmatory factor analysis and a multilevel structural
      model (LISREL 8.8) predicting course grade from the four latent engagement factors with gender as
      a control.
