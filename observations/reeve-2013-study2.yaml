- id: aes-predicts-course-grade
  sample:
    value: 248
    unit: participants
  comparison_ref: whole-sample
  outcome:
    construct: Course achievement
    source_language: course-specific achievement
    measure: Final semester grade from the school record, 0–100
    scale: standardised path coefficient
    direction: higher-is-better
    role: capability-evidence
    role_basis: inferred
    valued_by: []
  time: *id001
  result:
    measure_type: regression_coefficient
    estimate: 0.25
    statistic: t = 3.20
    p_value: < .01
    model: >-
      Multilevel structural equation model (LISREL 8.8): latent agentic, behavioral, emotional and cognitive
      engagement and gender predicting course grade; behavioral engagement beta .28 (t = 2.80), emotional
      .07 and cognitive −.06 (both ns); the predictors together explained 25% of the variance.
  moderators:
    reported: []
    candidate: []
  observability:
    population_detail: partial
    implementation_detail: observed
    outcome_timing: partial
    effect_size: observed
  observability_notes: >-
    Four classes (k = 4) were too few for a teacher-level analysis; the author reports the results as
    student-level after multilevel modelling.
  source_quote: Only two of the hypothesized paths were individually significant, however, as behavioral
    en- gagement (beta = .28, t = 2.80, p < .01) and agentic engagement (beta = .25, t = 3.20, p < .01)
    individually predicted achievement while this was not true for either emotional engagement (beta =
    .07, t = 0.87, ns) or cognitive engagement (beta = –.06, t = 0.75, ns).
  source_location: Study 2, Results, Unique predictive validity, p. 586; Figure 2
