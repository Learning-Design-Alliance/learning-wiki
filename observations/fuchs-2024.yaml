evidence_base:
  unit: participants
  size:
    value: 207
    unit: participants
  additional_sizes:
    - value: 221
      unit: participants
      note: "randomised (RC.INT 74, WP.INT 74, control 73); 14 left the study (11 moved, 2 excluded by teachers for behaviour, 1 scheduling conflict)"
    - value: 1526
      unit: participants
      note: "second graders screened; 294 met the RC and WPS low-performance criteria"
    - value: 106
      unit: participants
      note: "not-at-risk classmates in the final descriptive comparison sample (110 sampled)"
  population:
    description: >-
      Second graders below the 25th percentile on both an RC screener
      (Gates-MacGinitie) and a WPS screener (Pennies Story Problems), and at or
      above the 10th percentile on at least one WASI subtest, in a large,
      diverse urban and suburban county-wide district in the southeastern
      United States. About 45% of the at-risk sample received English learner
      services.
    age_or_stage: "Second grade; no age figure printed"
    age: unreported
  context:
    setting: "Supplemental 1:1 tutoring during the school day, delivered by research staff (mostly university master's students without teaching certification); late October to March"
  arms:
    - id: rc-int
      description: "RC text-structure intervention (Pirate Reading): schema instruction on cause-effect and compare-contrast text structures on passages without numerals, with note-taking, summarisation and retelling."
      size:
        value: 70
        unit: participants
      dose:
        amount: 45
        unit: lessons
        detail: "Three 30-minute lessons a week for 15 weeks, delivered 1:1"
      delivery:
        grouping: individual
        role: supplement
        basis: stated
    - id: wp-int
      description: "WPS text-structure intervention (study version of Vanderbilt Pirate Math): schema instruction on cause-effect and compare-contrast word-problem types, with a WP-type diagram or equation, built in parallel with RC.INT."
      size:
        value: 67
        unit: participants
      dose:
        amount: 45
        unit: lessons
        detail: "Three 30-minute lessons a week for 15 weeks, delivered 1:1"
      delivery:
        grouping: individual
        role: supplement
        basis: stated
    - id: control
      description: "Standard school program. Schools provided reading intervention to 93% and math intervention to 73% of control children."
      size:
        value: 70
        unit: participants

comparisons:
  - id: rc-int-vs-control
    kind: between-groups
    index_arm: rc-int
    reference_arm: control
    description: "RC.INT against control: acquisition on RC outcomes, cross-domain transfer on WPS outcomes."
  - id: wp-int-vs-control
    kind: between-groups
    index_arm: wp-int
    reference_arm: control
    description: "WP.INT against control: acquisition on WPS outcomes, cross-domain transfer on RC outcomes."
  - id: rc-task-scoring
    kind: none
    description: "Scoring consistency of the RC outcome task (RC Notes and RC Retell) across the sample."
  - id: wp-task-scoring
    kind: none
    description: "Scoring consistency of the WPS outcome task (WP Solutions and WP Retell) across the sample."

