  - claim: rc-text-structure-intervention-acquisition-rc-comorbid
    bearing: supports
    anchor: fuchs-2024
  - claim: wps-text-structure-intervention-acquisition-wps-comorbid
    bearing: supports
    anchor: fuchs-2024
  - claim: rc-intervention-transfers-to-wps
