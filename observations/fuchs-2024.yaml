not_yet_extracted:
  - "RQ6 contrasts RC.INT against WP.INT within each outcome (Table 2; g 0.39, 0.30, 0.94, 0.33 in Figure 3): acquisition exceeded transfer except on RC Retell."
  - "Mediation models (Table 3): text-structure knowledge in passages and word problems mediated all 16 tested effects; partial for WP.INT, complete for seven of eight RC.INT tests."
  - "Post-intervention gaps against not-at-risk classmates (Table 4), descriptive only."
  - "Table 1 posttest means and SDs by condition; the text layer of the table is garbled and was not read from the image."
  - "Sample-based alphas for screening, covariate and mediator measures (.78 to .86); the Gates alternate-form reliability .74-.92 is the test publisher's, not this sample's."
  - "Test-session double-scoring agreement 'exceeded 99%' and fidelity-coding agreement 'exceeded 95%' (bounds)."
