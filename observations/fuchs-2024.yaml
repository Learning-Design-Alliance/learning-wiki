# Fuchs, Seethaler, Sterba, Fuchs, Cutting, Mancilla-Martinez, Martin & Espinas
# (2024): a three-arm randomised controlled trial of reading-comprehension (RC)
# and word-problem-solving (WPS) text-structure intervention for second graders
# with difficulty in both domains.
#
# Read from the author manuscript ("Manuscript version of", 64 pp., text layer),
# not the copy of record. Page numbers below are the manuscript's own.
#
# WHAT THIS FILE RECORDS:
#
#   * The eight bias-corrected Hedges' g values against control: two
#     acquisition and two cross-domain (far) transfer effects per intervention
#     arm, one per outcome subtest. Each is quoted from the running text. The
#     multilevel model's pretest-adjusted mean difference, SE and p for the
#     same contrast sit in `descriptives`; those figures were read from the
#     PAGE IMAGE of Table 2 (manuscript p. 57), because the table's text layer
#     comes out with its columns separated from its rows.
#   * `measure_type: reliability` for the two outcome tasks: interscorer
#     agreement (percent) and sample-based alpha. The text layer drops the
#     alpha glyph ("Sample-based  was .82"), so the two alpha quotes were taken
#     from the page images (manuscript pp. 20-21) and print the article's own
#     alpha character.
#   * `population.age: unreported`. The sample is defined by grade (second
#     grade); neither the text nor Table 1 prints an age figure.
#
# One discrepancy in the source: the abstract gives RC.INT's g on RC Retell as
# 0.83, the Discussion and Figure 3 as 0.84. The record takes the Discussion's
# figure, which agrees with the figure, and keeps the abstract's in the notes.

schema_version: 2

study:
  key: fuchs-2024
  citation: "Fuchs, L. S., Seethaler, P. M., Sterba, S. K., Fuchs, D., Cutting, L. E., Mancilla-Martinez, J., Martin, B. N., & Espinas, D. (2024). Transfer between reading comprehension and word-problem solving among children with learning difficulty in both domains. Journal of Educational Psychology."
  doi: "10.1037/edu0000911"
  design:
    family: randomized-controlled-trial
    design_detail: >-
      Three-arm randomised controlled trial, random assignment at the individual
      level to RC text-structure intervention (RC.INT, Pirate Reading), WPS
      text-structure intervention (WP.INT, a version of Vanderbilt Pirate Math)
      or the standard school program (control). Outcomes analysed in multilevel
      main-effects models with a pretest covariate and a random classroom
      intercept; intra-class correlations .01 to .03 at the classroom level and
      .001 to .10 at the school level. Transfer in each intervention arm was
      tested against control, as the protocol specified. A not-at-risk
      classmate sample (n = 106) was tested for descriptive gaps only.
    preregistration:
      status: not-preregistered
      source_quote: "This study’s design and analysis were not preregistered."

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-author-manuscript
  verification: unverified

