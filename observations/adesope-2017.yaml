    source_language: learning benefits on a final test
    measure: 'Final-test scores in the primary studies: free recall, cued recall, multiple choice, short
      answer and other formats'
    scale: Hedges's g, testing minus comparison condition
    direction: higher-is-better
    role: capability-evidence
    role_basis: inferred
    valued_by: []
