  result:
    measure_type: hedges_g
    estimate: 0.61
    standard_error: 0.02
    ci_lower: 0.58
    ci_upper: 0.65
    interval_type: confidence
    k:
      value: 272
      unit: effect-sizes
    heterogeneity:
      statistic: Q
      value: 1405.0
      interpretation: Q(271); I2 = 80.71%
    model: fixed-effects
    note: N = 15,427 participants across the k effect sizes (as printed)
    p_value: < .001
    publication_bias:
      method: Classic fail-safe N and Orwin's fail-safe N (criterion .05)
      finding: 3,608 additional null studies needed to invalidate the overall effect (classic); 2,604
        to bring it to .05 (Orwin); both above 5k + 10, read by the authors as no significant threat
  moderators:
    reported: []
    candidate: []
