    outcome_timing: partial
    effect_size: observed
    pooled_k: observed
  source_quote: Under a fixed-effects model, Table 1 shows that the overall weighted mean effect size
    was moderately large and statistically significant, indicating the effectiveness of learning with
    practice tests (g = 0.61, p < .001). However, the overall sample was heterogeneous, Q(271) = 1405.00,
    p < .001, I2 = .81.
  source_location: Results, p. 670; Table 1, p. 672 (SE and interval from the table)
