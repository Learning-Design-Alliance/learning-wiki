# Adesope, Trevisan & Sundararajan (2017): a meta-analysis of practice
# testing against nontesting learning conditions.
#
# Read from the publisher PDF (Review of Educational Research 87(3),
# pp. 659-701). Its reading-order text splits Tables 1-4 into separate
# columns, so a table row cannot be quoted from it. Where the Results prose
# states a figure, the source_quote is that prose. Where a figure is printed
# only in a table (confidence bounds, SEs, N, Q, I2, and the rows the prose
# never mentions), it was read from the PDF's own table layout (pdftotext
# -layout, checked against the page image), and an observation whose
# source_quote is a table row says so in source_location: those quotes come
# from the page, not from the reading-order text.
#
# WHAT THIS FILE HOLDS:
#
#   * Every pooled estimate here is FIXED-EFFECTS except the one labelled
#     random-effects. The authors chose a fixed-effects model "for all
#     analyses" after reporting the random-effects overall g of 0.70.
#   * The moderator rows (Tables 2-4) compare testing with EVERY comparison
#     condition (restudy, filler or no activity, a mixture, not reported),
#     not with restudy alone. Only Table 1 splits by comparison condition.
#     So the moderator strata are arms contrasted with a heterogeneous
#     reference.
#   * `k` counts independent EFFECT SIZES (272 from 118 articles, 217
#     experiments by Figure 1), not studies, although the prose sometimes
#     says "studies" for k.
#   * `population.age: unreported`: the article codes educational level
#     (primary grades 1-6, secondary 7-12, postsecondary) but prints no age
#     figure.
#   * One reliability observation: the authors' own coding check, printed as
#     "Interrater agreement was high (k = .96)". The statistic is printed as k
#     and not named, so it is recorded as `other` rather than as a kappa.
#   * Discrepancies left as printed: the prose says the search returned
#     1,717 studies, Figure 1 says 1,716; the prose gives the practice-test
#     format QB as QB(7) = 27.02, Table 2 gives 6 degrees of freedom (not
#     recorded here).

schema_version: 2
study:
  key: adesope-2017
  citation: 'Adesope, O. O., Trevisan, D. A., & Sundararajan, N. (2017). Rethinking the use of tests:
    A meta-analysis of practice testing. Review of Educational Research, 87(3), 659–701.'
  doi: 10.3102/0034654316689306
  design:
    family: meta-analysis
    design_detail: Meta-analysis of studies contrasting a practice test with restudying or another nontesting
      learning condition on a later final test. Cohen's d per outcome, corrected to Hedges's g; 272 independent
      effect sizes from 118 articles. Categorical moderator analyses (QB between levels) for practice-test
      features, feedback, setting, design, educational level, outcome construct, retention interval, initial
      learning task, time matching and methodological features.
  synthesis:
    model: Fixed-effects model for all analyses; a random-effects estimate reported for the overall effect
      only
    heterogeneity_statistic: Q and I2
    search:
      databases:
      - ERIC
      - PsycARTICLES
      - PsycINFO
      - Web of Science
      date_range: 'Searched in 2014; query: testing effect* OR test effect* OR retrieval practice*; reference
        lists of key articles also searched'
      records_screened: 1717
      records_included: 118
    inclusion:
    - Contrast the effects of taking a practice test with restudying or other learning strategies
    - Report measurable cognitive outcomes such as recall or transfer
    - Report sufficient data for effect size extraction
    - Publicly available through databases, journals or library archives
    - Random assignment, within-subjects designs, or other control for preexisting group differences (pretests,
      matching)
    data_handling:
    - Hedges's g from Cohen's d; F or t used to derive or verify d
    - Five outlying effect sizes (|Z| >= 3.3) adjusted toward the nearest other effect size and kept
    - One author recoded about 30% of the included studies as a reliability check
    - Comprehensive Meta-Analysis 2.2.048 and SPSS 23
