    result:
      measure_type: other
      statistic: "Fisher's Exact Test, N = 34"
      p_value: "< .05"
      descriptives: "High consistent-low inconsistent: in five of six dyads the less competent child improved while the more competent kept the pretest rule, and in the sixth both improved. Other unequal dyads: half featured decline and half improvement."
    moderators:
      reported:
        - variable: "Consistency of the partners' pretest rules"
          relationship: "Only dyads pairing a more competent consistent-rule child with a less competent inconsistent-rule child improved without the higher partner regressing."
          source_quote: "Thus only the collaboration between high consistent–low inconsistent partners was an unqualified success, in that the lower (less competent) partners all improved, whereas no higher (more competent) partners regressed."
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "As can be seen in Table 2, these dyads were significantly more likely to feature improvement (in five of the six cases the less competent child improved while the more competent child retained the pretest rule, and in the sixth case both partners improved) than all other dyads, half of which featured decline and half improvement, with the one dyad in which the partners retained their pretest rules dropped from this analysis (Fisher's Exact Test, N = 34, p < .05)."
    source_location: "Results, p. 1373; Table 2, p. 1374"

