      unit: pairs
    comparison_ref: equal-vs-unequal
    outcome:
      construct: "Retaining the pretest rule rather than changing"
      source_language: "retain the same rule than change"
      measure: "Dyads in which partners kept their pretest rules at the second posttest"
      scale: "dyads"
      direction: contextual
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
