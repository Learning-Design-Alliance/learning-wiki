      source_language: "improvement"
      measure: "Dyads in which members used a higher rule at the second posttest than at pretest"
      scale: "number of dyads"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "second posttest, a minimum of 4 weeks after the first posttest"
    result:
      measure_type: count
      estimate: 3
      unit: "equal-rule dyads"
      descriptives: "In all three, both members improved (Table 2 'Both Up': 2 consistent-rule and 1 inconsistent-rule dyad)."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "The same was true of improvement—when this occurred in equal rule dyads it was true of both members (in all three cases), whereas in unequal rule dyads the more competent member typically (17 of 20 cases) retained his or her pretest rule, while the less competent child improved (Fisher's Exact Test, N = 23, p < .02)."
    source_location: "Results, p. 1373"

