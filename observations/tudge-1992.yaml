      effect_size: unreported
    source_quote: "These analyses (all of which were two-tailed) revealed that equal rule dyads were significantly more likely than unequal rule dyads to retain the same rule than change (nine of 19 and one of 35, respectively, Fisher's Exact Test, N = 54, p < .0001)."
    source_location: "Results, p. 1373"

