    comparison_ref: hcli-vs-other-unequal
    outcome:
      construct: "Improvement versus decline in unequal-rule dyads"
      source_language: "significantly more likely to feature improvement"
      measure: "Dyadic outcome at the second posttest: improvement or decline"
      scale: "dyads"
      direction: contextual
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
