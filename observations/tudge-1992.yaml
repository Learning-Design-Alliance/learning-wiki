# Tudge (1992): processes and consequences of peer collaboration on the
# balance-beam task, children aged 5 to 9.
#
# Read from the JSTOR copy (text layer and page images). The text layer of
# this two-column article interleaves the columns, so most source_quote
# values below were taken from the PAGE IMAGES (pp. 1364, 1368-1371,
# 1373-1374) in the article's own words, not from the text layer. Short
# fragments of each were checked against the text layer where it ran clean.
#
# Units of analysis: for the condition analyses ONE member of each pair was
# retained at random, so means are over independent children; the dyadic
# outcome analyses (Table 2, Fisher's exact tests) count DYADS. The two are
# different units and are kept apart below.
#
# Assignment: the article says same-rule children were randomly assigned to
# condition within constraints (same gender and class, no more than two rules
# apart). Which partner was "more" or "less" competent follows from the
# pretest rules, not from assignment, so no stronger design is recorded.

schema_version: 2

study:
  key: tudge-1992
  citation: "Tudge, J. R. H. (1992). Processes and consequences of peer collaboration: A Vygotskian analysis. Child Development, 63(6), 1364-1379."
  doi: "10.2307/1131562"
  design:
    family: other
    design_detail: >-
      Pretest, one paired (or individual) treatment session, and two
      individual posttests on a mathematical balance-beam prediction task
      scored by Siegler-type rules. Three treatment conditions: no partner,
      a partner who used the same rule at pretest, or a partner who used a
      different rule (analysed as less and more competent members). Pairs
      disagreeing on a prediction were asked to discuss and reach agreement;
      no feedback was given. Same-rule children were randomly assigned to
      condition within constraints; partner competence follows from the
      pretest rules.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: peer-collaboration-less-improve-more-decline
    bearing: supports
    anchor: tudge-1992
  - claim: peer-collaboration-less-improve-more-decline
    bearing: supports
    anchor: tudge-1992-2
  - claim: high-consistent-low-inconsistent-dyads-success
    bearing: supports
    anchor: tudge-1992

evidence_base:
  unit: participants
  size:
    value: 153
    unit: participants
  additional_sizes:
    - value: 162
      unit: participants
      note: "children pretested; nine who used Rule 0 were dropped"
    - value: 93
      unit: participants
      note: "children in the condition analyses (one member per pair retained), with the second posttest"
  population:
    description: >-
      Children from an open-enrollment public elementary school in Ithaca,
      New York, a mix of social classes and race: 51 in kindergarten, 55 in
      mixed first- and second-grade classes and 47 in mixed third- and
      fourth-grade classes.
    age_or_stage: "Kindergarten to Grade 4; analysed in three age groups (5-year-olds, 6-7-year-olds, 8-9-year-olds)"
    age:
      unit: years
      min: 5
      max: 9
      note: >-
        The abstract's "aged from 5 to 9". The Method also prints grade-group
        ages in months: kindergarten M = 66.6, SD = 3.9, range 60-72;
        first/second grade M = 82.9, SD = 8.7, range 72-100; third/fourth
        grade M = 112.0, SD = 8.8, range 99-134. The upper bound of 134 months
        is above 9 years; both are recorded as printed.
  context:
    setting: "Individual and paired sessions with an experimenter in school; balance beam with eight sticks (treatment: beakers and plastic figures), 14 problem configurations per session"
  arms:
    - id: no-partner
      description: "Control: children worked alone and were always tested individually."
      size:
        value: 41
        unit: participants
    - id: equal-rule
      description: "Each child paired with a child who had used the same rule at pretest; for the condition analyses one member of each pair was dropped at random."
      size:
        value: 38
        unit: participants
    - id: unequal-rule
      description: "Each child paired with a child who had used a different rule at pretest (no more than two rules apart)."
      size:
        value: 74
        unit: participants
    - id: less-competent-partner
      description: "Less competent members of unequal-rule pairs, one member per pair retained at random."
      size:
        value: 19
        unit: participants
    - id: more-competent-partner
      description: "More competent members of unequal-rule pairs, one member per pair retained at random."
      size:
        value: 18
        unit: participants
    - id: high-consistent-low-inconsistent
      description: "Unequal-rule dyads whose more competent member used a consistent rule and less competent member an inconsistent one (two Rule 4-Rule 3 and four Rule 2-Rule 1 dyads)."
      size:
        value: 6
        unit: pairs
    - id: other-unequal-dyads
      description: "The remaining unequal-rule dyad types: high inconsistent-low consistent, different rules both inconsistent, different rules both consistent; the one dyad in which both partners kept their pretest rules was dropped."
  variation:
    - dimension: "Pretest rule"
      distribution: "Rule 1: 11 children; Rule 2: 52; Rule 3: 24; Rule 4: 35 (read from the page image); Rule 5: 31; Rule 6: none"

comparisons:
  - id: equal-vs-unequal
    kind: between-groups
    index_arm: equal-rule
    reference_arm: unequal-rule
    description: "Equal-rule dyads against unequal-rule dyads on dyadic outcomes (Fisher's exact tests, dyads as the unit)."
  - id: hcli-vs-other-unequal
    kind: between-groups
    index_arm: high-consistent-low-inconsistent
    reference_arm: other-unequal-dyads
    description: "High consistent-low inconsistent dyads against the remaining unequal-rule dyads on improvement versus decline."
  - id: reliability-of-rule-coding
    kind: none
    description: "Agreement between the experimenter and a second, blind coder on which rule each child used."

observations:

  - id: equal-dyads-with-regression
    sample:
      value: 19
      unit: pairs
    arm_ref: equal-rule
    outcome:
      construct: "Regression in rule use"
      source_language: "When regression occurred"
      measure: "Dyads in which one or both members used a lower rule at the second posttest than at pretest"
      scale: "number of dyads"
      direction: lower-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "second posttest, a minimum of 4 weeks after the first posttest"
    result:
      measure_type: count
      estimate: 7
      unit: "equal-rule dyads"
      descriptives: "In four of the seven, both members declined (Table 2: one both-down dyad among consistent-rule pairs, four among inconsistent-rule pairs; one dyad of each with one member down)."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "When regression occurred, it was more likely for both members of equal rule dyads to decline (four of seven dyads) than was the case for members of unequal rule dyads (one of 14 dyads), where the less competent child tended to retain the same rule and the more competent partner tended to move down (Fisher's Exact Test, N = 21, p < .001)."
    source_location: "Results, p. 1373; Table 2, p. 1374"

  - id: equal-dyads-with-improvement
