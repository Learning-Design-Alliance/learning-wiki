      source_language: "it was more likely for both members of equal rule dyads to decline"
      measure: "Dyads with regression in which both members declined"
      scale: "dyads"
      direction: contextual
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "second posttest"
    result:
      measure_type: other
      statistic: "Fisher's Exact Test, N = 21"
      p_value: "< .001"
      descriptives: "Equal-rule: four of seven dyads; unequal-rule: one of 14 dyads."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "When regression occurred, it was more likely for both members of equal rule dyads to decline (four of seven dyads) than was the case for members of unequal rule dyads (one of 14 dyads), where the less competent child tended to retain the same rule and the more competent partner tended to move down (Fisher's Exact Test, N = 21, p < .001)."
    source_location: "Results, p. 1373"

