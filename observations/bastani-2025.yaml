    source_quote: "Control arm mean 0.284 0.321 Control arm SD 0.287 0.277"
    source_location: "Table 1, column (2)"

  # A property of the tool, not of the students: how often GPT Base, asked the
  # students' most common question, gave a correct answer.
  - id: gpt-base-answer-accuracy
    sample:
      value: 57
      unit: items
    arm_ref: gpt-base
    outcome:
      construct: "AI tool answer accuracy"
      source_language: "GPT Base gives a correct answer"
      measure: "Each of the 57 practice problems put to GPT Base ten times with \"What is the answer?\", resetting between queries; errors coded by hand as logical or arithmetic"
      scale: "percent of queries answered correctly, averaged over problems"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "after the experiment, by the authors"
    result:
      measure_type: probability
      estimate: 51
      unit: "percent of queries"
      note: "Logical errors 42% of the time and arithmetic errors 8% of the time; error rates vary considerably by problem (Fig. 2)"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      Measured by re-querying the tool, not from the students' own
      conversations. GPT Tutor was not queried this way, because by design it
      does not return an answer and its prompt carries the correct solution.
    source_quote: "We find that GPT Base gives a correct answer only 51% of the time on average; it makes logical errors 42% of the time and arithmetic errors 8% of the time."
    source_location: "Potential Mechanism, GPT Errors vs. Student Performance"

