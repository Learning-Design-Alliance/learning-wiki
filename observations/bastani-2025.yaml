      estimate: 0.284
      sd: 0.287
      unit: "normalised grade (0-1)"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      The sample is the regression's 2,848 student-session observations; the
