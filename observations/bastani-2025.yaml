    source_quote: "Control arm mean 0.284 0.321 Control arm SD 0.287 0.277"
    source_location: "Table 1, column (1)"

  - id: control-exam-mean
    sample:
      value: 2848
      unit: other
    arm_ref: control
    outcome:
      construct: "Unassisted exam performance"
      source_language: "Control arm mean"
      measure: "Normalised rubric grade on the unassisted exam, control arm"
      scale: "0-1 (normalised grade)"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "same session, after the practice period"
    result:
      measure_type: mean
      estimate: 0.321
      sd: 0.277
      unit: "normalised grade (0-1)"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      The sample is the regression's 2,848 student-session observations; the
