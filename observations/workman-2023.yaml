# Workman, von Hippel & Merry (2023): average summer learning in three modern
# data sources (ECLS-K:2011, NWEA, Renaissance), fitted with the same linear
# growth model.
#
# Read from the publisher's open-access full text (text layer). Table 2's math
# columns read cleanly; the article's own header prints "NWEA (2005)" for the
# third math column where the reading header and Table 3 print "NWEA (2–5)",
# so the column is taken as the grades 2–5 NWEA sample (a typo in the source).
#
# The data sources are recorded as ARMS: each is a different sample, test and
# test schedule, and each observation is one source's own estimate (arm_ref).
# The article reports no contrast between sources as a statistic, so no
# comparison of arms is recorded; the disagreement is read from the four rows.
#
# "Total SDs lost during summer" is the paper's own fitted quantity: 2.65 times
# the average monthly summer rate from the growth model, extrapolated to the
# first and last day of school. It is in SDs of the FIRST test given in each
# data set, not SDs of the spring score. No conversion to any other scale is
# made here.

schema_version: 2

study:
  key: workman-2023
  citation: "Workman, J., von Hippel, P. T., & Merry, J. (2023). Findings on summer learning loss often fail to replicate, even in recent data. Sociological Science, 10, 251–285."
  doi: "10.15195/v10.a8"
  design:
    family: longitudinal
    design_detail: >-
      Secondary analysis of three data sources that tested US elementary
      students in fall and spring in the 2010s with adaptive, IRT-scored tests:
      the ECLS-K:2011 (nationally representative cohort, kindergarten to grade
      2), and restricted vendor data from NWEA (fall 2011 onward) and
      Renaissance Learning (fall 2013 onward), the vendor data in an
      accelerated longitudinal design (cohorts followed for one year each).
      Linear growth models of standardized scores on months in each grade and
      each summer, with a random child intercept, school-clustered standard
      errors and, for the vendor data, cohort dummies; no covariates in the
      average model. No intervention.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: summer-loss-nonreplication-average-losses
    bearing: supports
    anchor: workman-2023
  - claim: hardly-any-findings-replicate-modern-data
    bearing: supports
    anchor: workman-2023

evidence_base:
  unit: participants
  size:
    value: 3900
    unit: participants
  additional_sizes:
    - value: 3
      unit: other
      note: "data sources analysed (ECLS-K:2011, NWEA, Renaissance); each is an arm below with its own sample. The headline size is the ECLS-K:2011 analytic sample only, because the vendor samples are not summed here."
    - value: 280
      unit: schools
      note: "schools attended in kindergarten by the ECLS-K:2011 analytic sample (text; Table 1 prints 277 schools)"
  population:
    description: >-
      US elementary students. ECLS-K:2011: a nationally representative
      kindergarten cohort of fall 2010, restricted to the one-third random
      subsample of schools tested in fall of grades 1 and 2, excluding the
      three percent in year-round schools. NWEA and Renaissance: large, diverse
      but not nationally representative samples of schools that tested about
      the same number of students in every grade. Race/ethnicity and the
      school-level share of students on free or reduced-price lunch differ by
      source (Table 1).
    age_or_stage: "Kindergarten through grade 5 (ECLS-K:2011 kindergarten to grade 2; NWEA kindergarten to grade 5, or grades 2 to 5; Renaissance grades 1 to 5). The article prints grades, not ages."
    age: unreported
  context:
    setting: >-
      Fall and spring reading and math tests in US schools, 2010s. Vendor tests
      were low-stakes formative assessments bought by schools; ECLS-K:2011
      tests were given for research. Average first day of school Aug. 22 and
      last day June 4 (recorded in the ECLS-K:2011 only and assumed for the
      vendor data). Fall tests 2 to 8 weeks after school started and spring
      tests 3 to 7 weeks before it ended, depending on the source.
  variation:
    - dimension: "Test and its IRT model"
      distribution: "ECLS-K:2011 two-stage adaptive test scored with a three-parameter IRT model; NWEA and Renaissance continuously adaptive tests scored with a one-parameter (Rasch) model"
    - dimension: "Weeks of school before the fall test / after the spring test (math columns, Table 1)"
      distribution: "Renaissance 3 / 3; NWEA K–5 3 / 5; NWEA 2–5 4 / 5; ECLS-K:2011 8 / 7"
  arms:
    - id: renaissance
      description: "Renaissance Learning math data, grades 1 to 5, schools tested fall 2013 onward in an accelerated longitudinal design."
      size:
        value: 45303
        unit: participants
      implementation_notes:
        - "Table 1 math column: 90,606 test scores, 45,303 students, 164 schools"
    - id: nwea-k-5
      description: "NWEA sample limited to schools testing equal numbers of students in every grade from kindergarten to grade 5; accelerated longitudinal design from fall 2011."
      size:
        value: 11402
        unit: participants
      implementation_notes:
        - "Table 1: 32,262 test scores, 11,402 students, 43 schools"
    - id: nwea-2-5
      description: "Less-limited NWEA sample requiring equal testing only in grades 2 to 5; used because the K–5 restriction ruled out many schools with substantial African American enrollments."
      size:
        value: 44516
        unit: participants
      implementation_notes:
        - "Table 1: 122,295 test scores, 44,516 students, 194 schools"
    - id: ecls-k-2011
      description: "ECLS-K:2011 analytic sample, kindergarten to grade 2 (grades 3 to 5 excluded because they were tested in spring only)."
      size:
        value: 3900
        unit: participants
      implementation_notes:
        - "Table 1: 22,310 test scores, 3,900 students, 277 schools; ECLS-K:2011 sizes rounded to the nearest 10 under NCES rules"

