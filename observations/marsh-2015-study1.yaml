# Marsh et al. (2015), Study 1: dimensional comparison theory in five domains.
#
# WHAT THIS FILE TESTS, by needing it:
#
#   * `population.age` with every figure the source prints: "ages varied from
#     12 to 18 years (M = 14.24, SD = 1.6)". The prose (Grades 7 and 10, high
#     ability track) stays beside it; the numbers do not replace it.
#   * `measure_type: reliability` reported as a RANGE across scales, with no
#     single coefficient: the source gives ".79 < α < .85" for the five
#     self-concept scales. An estimate would be invented; estimate_range holds it.
#
# Study 2 of the same article is a different sample (511 students, Grades 8-9,
# all three school tracks) and would be its own record; it prints only a mean
# age (14.7), which `population.age` holds as `{unit: years, mean: 14.7}`.
#
# Read from the author manuscript (33 pp., text layer). Tables 2 and 4 are not
# in the manuscript, so every path figure below comes from the text.

schema_version: 2

study:
  key: marsh-2015-study1
  citation: "Marsh, H. W., Lüdtke, O., Nagengast, B., Trautwein, U., Abduljabbar, A. S., Abdelfattah, F., & Jansen, M. (2015). Dimensional comparison theory: Paradoxical relations between self-beliefs and achievements in multiple domains. Learning and Instruction, 35, 16–32."
  doi: "10.1016/j.learninstruc.2014.08.005"
  design:
    family: observational
    design_detail: >-
      Cross-sectional survey with structural equation models (Mplus 7.11, MLR,
      design-based correction for students nested in classrooms): midterm
      report-card grades in five domains predicting five latent academic
      self-concept factors, with and without four control variables.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-author-manuscript
  verification: unverified

appears_in:
  - claim: dct-near-far-contrast-difference
    bearing: supports
    anchor: marsh-2015
  - claim: no-significant-assimilation-effects-study1
    bearing: supports
    anchor: marsh-2015

evidence_base:
  unit: participants
  size:
    value: 1140
    unit: participants
  additional_sizes:
    - value: 51
      unit: classes
      note: "classrooms, in 6 public high-ability-track schools (Gymnasiums); not a unit of assignment, but standard errors were corrected for it"
  population:
    description: >-
      German secondary students (54.1% female) in 51 classrooms of six public
      high-ability-track high schools (Gymnasiums), Grade 7 (59%) and Grade 10
      (41%). Participation above 90% in every class.
    age_or_stage: "Grades 7 and 10"
    age:
      unit: years
      min: 12
      max: 18
      mean: 14.24
      sd: 1.6
  context:
    setting: "Classroom questionnaire near the end of the school year, 45 minutes"
  arms: []

comparisons:
  - id: whole-sample
    kind: none
    description: "Structural paths and scale properties in the whole Study 1 sample; no contrast between groups."

observations:

  - id: self-concept-alpha
    comparison_ref: whole-sample
    outcome:
      construct: "Academic self-concept, five domains"
      source_language: "Coefficient alpha estimates of internal consistency"
      measure: "Three parallel-worded self-concept items per domain (English, mathematics, German, second foreign language, biology), 4-point Likert scale"
      scale: "Cronbach's alpha"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "end of school year"
    result:
      measure_type: reliability
      estimate_range:
        lower: 0.79
        upper: 0.85
        over:
          value: 5
          unit: scales
      reliability:
        statistic: cronbach_alpha
        over: items
      interpretation: "Described as satisfactory for all five domains"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: partial
      effect_size: unreported
    observability_notes: >-
      The source writes the bounds as strict inequalities (.79 < α < .85) and
      does not say which domain is which; the range is recorded as printed and
      no per-domain alpha is inferred.
    source_quote: "Coefficient alpha estimates of internal consistency were satisfactory for all five academic domains (.79 < α < .85)."
    source_location: "Section 4.1.2, Measures"

  - id: far-paths-mean-extended-model
    comparison_ref: whole-sample
    outcome:
      construct: "Academic self-concept in a far domain"
      source_language: "far comparisons"
      measure: "Latent self-concept factors regressed on report-card grades; the 12 paths from achievement in one domain group (verbal or math/science) to self-concept in the other"
      scale: "mean of 12 standardised path coefficients"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "end of school year, cross-sectional"
    result:
      measure_type: regression_coefficient
      estimate: -0.080
      standard_error: 0.010
      model: >-
        Extended five-domain SEM, no controls. Mean of the 12 far paths. With
        the four control variables the mean was -.073. The mean of the 8 near
        paths was -.014 (SE .017), not different from zero; far minus near
        .066 (SE .017).
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: partial
      effect_size: observed
    observability_notes: >-
      A mean over path coefficients as the source reports it, not a single
      path. The individual coefficients are in Table 2, which the manuscript
      copy read here does not contain.
    source_quote: "the mean of the 8 near coefficients is not significantly different from zero (Mn = −.014, SE = .017), whilst the mean of the 12 “far” coefficients is significantly negative (Mn = −.080, SE = .010); the difference between the two is highly significant (Mn = .066, SE = .017)."
    source_location: "Section 6.2, DCT extension to include five domains"

  - id: near-paths-mean-extended-model
    comparison_ref: whole-sample
    outcome:
      construct: "Academic self-concept in a near domain"
      source_language: "near comparisons"
      measure: "Latent self-concept factors regressed on report-card grades; the 8 paths between domains in the same group (verbal, or math/science)"
      scale: "mean of 8 standardised path coefficients"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "end of school year, cross-sectional"
    result:
      measure_type: regression_coefficient
      estimate: -0.014
      standard_error: 0.017
      model: "Extended five-domain SEM, no controls; -.002 with the four control variables."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: partial
      effect_size: observed
    source_quote: "the mean of the 8 near coefficients is not significantly different from zero (Mn = −.014, SE = .017)"
    source_location: "Section 6.2, DCT extension to include five domains"
