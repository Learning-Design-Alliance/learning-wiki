# Goetz, Frenzel, Pekrun, Hall & Lüdtke (2007): between- and within-domain
# relations of students' academic emotions (enjoyment, pride, anxiety, anger,
# boredom) in mathematics, physics, German and English, Grades 8 and 11.
#
# What is recorded, per grade sample unless said otherwise:
#   * Between-domains (Table 2, Table 3):
#     - The general between-domains coefficients, printed in the text ONLY as
#       limits ("below .35" in Grade 8, "below .20" in Grade 11), recorded as
#       `result.bound`, never as estimates. Both limits exclude the
#       mathematics-physics relations and pride between English and German.
#     - The mathematics-physics relations as the ranges the text prints
#       (estimate_range over the five emotions), with the Table 2 cells in
#       notes.
#     - The one other exception, pride between English and German (Table 2:
#       .51 in Grade 8, .29 in Grade 11), as point estimates.
#     - The homogeneity index h(d) per grade, as the range over the five
#       emotions.
#   * Within-domain (Table 5, Table 6):
#     - The boredom-anger and enjoyment-boredom latent correlations, as the
#       ranges the text prints across the four domains and both grades.
#     - The homogeneity index h(e), one observation per domain and grade.
#   * Reliability: alphas of the 20 emotion scales, the range per grade.
# The two grades are separate samples analysed in separate models, so they
# are arms; each per-grade result names its grade with `arm_ref`, and a range
# the text prints across both grades names the `both-grades` comparison.
# Nothing here contrasts the grades as an effect: the article tests the h(d)
# and h(e) differences but prints no estimate of them.
#
# Source and page images. The text layer of this repository copy (University
# of Konstanz, "First publ. in: Journal of Educational Psychology 99 (2007), 4,
# pp. 715-733") prints "=", minus and "<" as glyphs (⫽, ⫺, ⬍), and Tables 2, 5
# and 6 come out of it as scattered columns. So the following source_quotes
# were copied from the PDF page images, with the article's own characters
# (real "=" and minus signs, superscript asterisks written as plain *):
#   - the alpha sentence (p. 719) on both alpha observations;
#   - the h(d) sentence (p. 721) on both h(d) observations;
#   - the Table 2 pride rows (p. 720), the Table 5 sentence (p. 724) and the
#     Table 6 rows (p. 726).
# Every other quote is a substring of the text layer as it stands.
#
# Alpha discrepancy, checked against the page image of Appendix A (p. 731):
# the appendix prints .93 for Grade 8 pride in mathematics, while the text says
# the standardized alphas ranged from .72 to .92 in Grade 8. The appendix
# column is headed only "α", and nothing on the pages says whether it is raw or
# standardized, so the pages do not settle it; the text's range is recorded as
# printed and the discrepancy is noted on the Grade 8 alpha observation.

schema_version: 2

study:
  key: goetz-2007
  citation: "Goetz, T., Frenzel, A. C., Pekrun, R., Hall, N. C., & Lüdtke, O. (2007). Between- and within-domain relations of students' academic emotions. Journal of Educational Psychology, 99(4), 715–733."
  doi: "10.1037/0022-0663.99.4.715"
  design:
    family: observational
    design_detail: >-
      Cross-sectional questionnaire survey of two grade samples. Between-domains
      relations: one structural equation model per emotion and grade (LISREL
      8.72; four latent domain-specific emotion factors with correlated
      uniquenesses between parallel items, plus midterm grades as manifest
      variables), giving disattenuated correlations; and three-level
      unconditional models (Mplus 4.0) giving a homogeneity index h(d) per
      emotion and grade. Within-domain relations analysed in the same two
      ways per domain.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

