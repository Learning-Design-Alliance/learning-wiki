# Goetz, Frenzel, Pekrun, Hall & Lüdtke (2007): between- and within-domain
# relations of students' academic emotions (enjoyment, pride, anxiety, anger,
# boredom) in mathematics, physics, German and English, Grades 8 and 11.
#
# What is recorded: the between-domains results, per grade sample.
#   * The text prints the general between-domains coefficients ONLY as limits
#     ("below .35" in Grade 8, "below .20" in Grade 11), so they are recorded
#     as `result.bound`, never as estimates. Both limits exclude the
#     mathematics-physics relations and pride between English and German.
#   * The mathematics-physics relations are recorded as the ranges the text
#     prints (estimate_range over the five emotions); Table 2's individual
#     coefficients agree with those ranges where they can be read.
#   * The homogeneity index h(d), the authors' test of the grade difference,
#     as the range over the five emotions per grade.
#   * Reliability: standardized alphas of the 20 emotion scales, as the range
#     the text prints per grade.
# The two grades are separate samples analysed in separate models, so they
# are arms, and each result names its grade with `arm_ref`. Nothing here
# contrasts them as an effect: the article tests the h(d) difference but
# prints no estimate of it.
#
# The text layer is from the typeset article with PDF glyph codes left in
# (/H11005 for "=", /H11002 for minus, /H11021 for "<"). No page image was
# available beside the text file, so every quote below was chosen to contain
# no glyph code, and Table 2 coefficients with a coded minus sign were not
# read. The medians printed beside the ranges ("Mdn" followed by a coded
# equals sign) are given in notes only.

schema_version: 2

study:
  key: goetz-2007
  citation: "Goetz, T., Frenzel, A. C., Pekrun, R., Hall, N. C., & Lüdtke, O. (2007). Between- and within-domain relations of students' academic emotions. Journal of Educational Psychology, 99(4), 715–733."
  doi: "10.1037/0022-0663.99.4.715"
  design:
    family: observational
    design_detail: >-
      Cross-sectional questionnaire survey of two grade samples. Between-domains
      relations: one structural equation model per emotion and grade (LISREL
      8.72; four latent domain-specific emotion factors with correlated
      uniquenesses between parallel items, plus midterm grades as manifest
      variables), giving disattenuated correlations; and three-level
      unconditional models (Mplus 4.0) giving a homogeneity index h(d) per
      emotion and grade. Within-domain relations analysed in the same two
      ways per domain.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: academic-emotions-weak-between-domain-relations
    bearing: supports
    anchor: goetz-et-al-2007
  - claim: academic-emotions-domain-specific-organization
    bearing: supports
    anchor: goetz-et-al-2007-2
  - claim: between-domain-emotions-weaker-with-grade-level
    bearing: supports
    anchor: goetz-et-al-2007

evidence_base:
  unit: participants
  size:
    value: 542
    unit: participants
  population:
    description: >-
      German high school students (56% female): 307 in Grade 8 (53% female)
      and 235 in Grade 11 (60% female). Voluntary participation; 0.2% of item
      responses missing.
    age_or_stage: "Grades 8 and 11"
    age:
      unit: years
      mean: 15.77
      sd: 1.66
      note: "whole sample; per-grade figures are on the arms"
  context:
    setting: >-
      Standardized student questionnaires given in class by trained testing
      personnel, April and May 2005; items for different domains placed in
      different parts of the booklet.
  arms:
    - id: grade-8
      description: "The Grade 8 sample: mean age 14.42 years (SD 0.61), range 13.25-16.50."
      size:
        value: 307
        unit: participants
    - id: grade-11
      description: "The Grade 11 sample: mean age 17.53 years (SD 0.60), range 16.33-19.67."
      size:
        value: 235
        unit: participants

comparisons: []

observations:

  - id: between-domain-emotion-r-bound-grade8
    sample:
      value: 307
      unit: participants
    arm_ref: grade-8
    outcome:
      construct: "Between-domains relation of an academic emotion"
      source_language: "interrelations among the domain- and emotion-specific factors"
      measure: "Disattenuated correlations between latent factors for the same emotion (enjoyment, pride, anxiety, anger, boredom) in different domains, from adapted Achievement Emotions Questionnaire class-related scales, 4 items each, 5-point Likert"
      scale: "latent correlation"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "second half of the school year, cross-sectional"
    result:
      measure_type: correlation
      bound:
        operator: "<"
        value: 0.35
      model: "One SEM per emotion; correlations corrected for unreliability"
      note: >-
        Excludes the mathematics-physics relations (recorded separately) and
        pride between English and German, which the text calls relatively
        strong. The bound covers coefficients of either sign.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: partial
    observability_notes: >-
      effect_size is partial: the text gives only an upper limit; the
      individual coefficients are in Table 2, whose negative values are
      glyph-coded in the text read here and were not transcribed.
    source_quote: "With the exception of substantial relations between emotions in mathematics and physics and the relatively strong relations between pride in English and German, all coefficients were below .35 in the Grade 8 sample and below .20 in the Grade 11 sample."
    source_location: "Results, Between-Domains Analyses, Strength of between-domains relations (Hypothesis 1a); Table 2"

