      model: "Fully unconditional three-level model, Mplus 4.0"
      note: >-
        Table 3, Grade 8: enjoyment .22, pride .38, anxiety .24, anger .37,
        boredom .30 (median .30 per the text). Each emotion's h(d) differed
        significantly from Grade 11's (p < .01 for four emotions, p < .05 for
        boredom, as stated in the text). Achievement grades, from a two-level
        model not comparable with the emotion indices: .37.
    moderators:
