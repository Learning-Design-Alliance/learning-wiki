  - id: share-low-loss-recall
    arm_ref: recall-tasks
    outcome:
      construct: "Share of studies with little loss of taught knowledge"
      source_language: "recall studies report loss scores below 20%"
      measure: "Percentage of recall loss scores in Table 1 below 20% relative loss (Figure 1)"
      scale: "percent of studies"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "retention interval of at least 1 week, varying across entries"
