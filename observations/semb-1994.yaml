  - id: ability-no-differential-forgetting
    comparison_ref: higher-vs-lower-ability
    outcome:
      construct: "Rate of forgetting of taught knowledge by ability level"
      source_language: "rate of forgetting or relative loss scores"
      measure: "Learning, retention and relative loss in studies directly comparing ability levels"
      direction: contextual
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "end of course and delayed retention test, intervals varying across the five studies"
    result:
      measure_type: qualitative
      finding: >-
        Across five studies that directly compared ability levels, higher-ability
        students learned and retained more than lower-ability students, but the
        reviewers report no differences in the rate of forgetting or in relative
        loss scores. No statistic is printed for this summary.
      perspective: researcher
      collection_method: "narrative summary of primary studies"
    moderators:
      reported: []
      candidate:
        - "Original learning was not equated across ability groups in the summary; the reviewers compare it to instructional-strategy studies with learning differences but no differential forgetting"
    observability:
      population_detail: unreported
      implementation_detail: unreported
      outcome_timing: unreported
      effect_size: unreported
    observability_notes: >-
      A summary of primary studies, not a pooled estimate. "No differences" is
      the absence of a reported difference, not a measured zero, and the
      section opens by calling ability findings "mixed".
    source_quote: "The general findings for these studies were that higher ability students learned and retained more than lower ability students, but there were no differences in the rate of forgetting or relative loss scores."
    source_location: "p. 278, Individual Differences"

not_yet_extracted:
  - "Inclusion agreement between the two authors (agreements / (agreements + disagreements)): .956 for the 46 file articles, 0.950 for the 403 database abstracts, 1.0 for the 69 full texts (p. 258); and .875 for the reviewers' judgments of low content coherence / prior knowledge (p. 268). Selection agreement, not reliability of the loss scores."
  - "Pretest-adjusted results over the seven Table 2 courses with recognition tests: mean pretest 43.3% (range 32% to 59.4%), average adjusted relative loss 25.6% (p. 264). Not used by the simulator; the per-study Table 2 rows belong to those studies."
  - "Low-coherence / low-prior-knowledge subset (Figure 2) and the degree-of-original-learning section (Bahrick 1984; Bahrick & Hall 1991; Semb et al.): narrative summaries of named primary studies; their figures belong to those studies."
  - "Table 1 and Table 2 per-study relative loss scores: per-study figures, and the Table 1 text layer is scrambled."
