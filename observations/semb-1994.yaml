      source_language: "overall mean loss scores"
      measure: "Relative loss score per Table 1 entry, calculated by the reviewers"
      scale: "percent relative loss (negative = loss)"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "retention interval of at least 1 week, varying across entries"
    result:
      measure_type: mean
      estimate: -28.25
      unit: "percent relative loss"
      k:
        value: 22
        unit: other
      note: "Mean over the 22 recall loss scores in Table 1. No SD printed."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: partial
      effect_size: unreported
    source_quote: "-16.17 (n = 52) for recognition, - 28.25 (n = 22) for recall, and -13.32 (n = 26) for cognitive skills. These means support our observation that much of what is taught in school is remembered."
    source_location: "p. 259, Article Selection, Review, and Summarization"

  - id: mean-relative-loss-cognitive-skills
    arm_ref: cognitive-skill-tasks
    sample:
      value: 26
      unit: other
    outcome:
      construct: "Loss of taught knowledge between end of course and retention test"
      source_language: "overall mean loss scores"
      measure: "Relative loss score per Table 1 entry, calculated by the reviewers"
      scale: "percent relative loss (negative = loss)"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "retention interval of at least 1 week, varying across entries"
    result:
      measure_type: mean
      estimate: -13.32
      unit: "percent relative loss"
      k:
        value: 26
        unit: other
      note: "Mean over the 26 cognitive-skill loss scores in Table 1. No SD printed."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: partial
      effect_size: unreported
    source_quote: "-16.17 (n = 52) for recognition, - 28.25 (n = 22) for recall, and -13.32 (n = 26) for cognitive skills. These means support our observation that much of what is taught in school is remembered."
    source_location: "p. 259, Article Selection, Review, and Summarization"

  - id: share-low-loss-recognition
    arm_ref: recognition-tasks
    outcome:
      construct: "Share of studies with little loss of taught knowledge"
      source_language: "recognition studies report loss scores of less than 20%"
      measure: "Percentage of recognition loss scores in Table 1 below 20% relative loss (Figure 1, 10-point intervals)"
      scale: "percent of studies"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "retention interval of at least 1 week, varying across entries"
    result:
      measure_type: other
      bound:
        operator: ">"
        value: 70
      unit: "percent of recognition studies with relative loss below 20%"
      note: "The text gives only 'over 70%'; the exact share is in Figure 1, which is not read here."
    moderators:
      reported: []
      candidate: []
    observability:
