      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      One class's data (both conditions) were excluded for an implementation
      error, so this analysis covers three of the four classes. The
      parenthesised values 4.6 and 3.3 are not consistent with an SD of a
      0-100% score at these means and this d; they are recorded as printed
      and not interpreted.
    source_quote: "The means in Table 1 indicate that the T&P students used ratio to describe surface pressure significantly less often than the ICC students, who had not yet been told about the formulas or the importance of ratio; F(1,94) = 6.8, p = .011, d = .27."
    source_location: "Experiment 1, Results, Transfer Effects, manuscript p. 17; Table 1"

