  - id: surface-pressure-transfer-icc-vs-tp
    comparison_ref: icc-vs-tell-and-practice
    outcome:
      construct: "Spontaneous far transfer of ratio structure"
      source_language: "Ratios at Transfer: Surface Pressure"
      measure: "Aerosol-can problem: 'describe' the plate pressure in four cans with internal springs; 1 point for each case described with a ratio"
      scale: "percent of the four cases described with a ratio"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "immediate transfer, start of Day 8, before the ICC group's ratio lecture"
    result:
      measure_type: cohens_d
      estimate: 0.27
      statistic: "F(1,94) = 6.8"
      p_value: ".011"
      descriptives:
        icc: "M = 35.2%; Table 1 prints (4.6) in the SD column"
        tell-and-practice: "M = 13.8%; Table 1 prints (3.3) in the SD column"
      interpretation: "ICC higher, before ICC students had been told the formulas or the importance of ratio"
    moderators:
      reported: []
      candidate: []
    observability:
