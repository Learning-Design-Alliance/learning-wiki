not_yet_extracted:
  - "Coder agreement: the source reports only that it \"was greater than 98% for each measure for both studies\". A lower bound, not a measured value, so it is not recorded as a reliability estimate; the schema has no field for a bound."
  - "Redrawing test on Day 2: deep-structure recall ICC 75.5% (35.3) vs T&P 52.3% (41.9), F(1,120) = 11.0, d = .30; surface features 27.1% (18.9) vs 31.3% (19.0), d = .11 (Table 1; manuscript p. 16)"
  - "Three-step regression of delayed transfer on structural recall (r = .22), condition (rmodel = .34) and their interaction (rmodel = .35, n.s.) (manuscript p. 18)"
  - "Post-hoc ranking of trampoline stiffness: 96% correct among students using ratios for over half the cases, 1% among others, chi2(1, N=126) = 113.7 (manuscript p. 19)"
