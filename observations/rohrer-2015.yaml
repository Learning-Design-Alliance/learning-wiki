not_yet_extracted:
  - "Per problem kind and delay (Welch t tests): 1 day graph 89% vs 73%, d = 0.54, p = .029; slope 73% vs 54%, d = 0.43, p = .10; 30 days graph 84% vs 54%, d = 0.81; slope 65% vs 29%, d = 0.87."
  - "Practice-assignment scores as a compliance measure (self-corrected, so not a learning measure): blocked 81%, interleaved 84%, last eight interleaved problems 82%; review 94% vs 89%."
  - "Baseline equivalence of the two counterbalancing groups on six NAEP Grade-8 items: 76% (SD 22%) vs 79% (SD 22%), t(108) = 0.62, d = 0.12."
  - "Teacher survey (three teachers, Appendix B)."
