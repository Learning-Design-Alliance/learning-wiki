      standard_error: 0.070
      model: >-
        Parallel-process model as above. Unstandardised b = 0.285 (SE 0.070);
        standardised beta = 0.51. Constraining the path gave chi2(1) = 12.64,
        p < .001. Freeing the within-domain paths worsened fit (delta AIC 3.6,
        delta BIC 10.4).
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    source_quote: "The path from reasoning intercepts on vocabulary slope was similarly strong and positive (b = 0.285, SE = 0.070, β = 0.51), and constraining it led to a comparable drop in model fit, χ2(1) = 12.64, p < .001."
    source_location: "Results, Alternative model specification"

