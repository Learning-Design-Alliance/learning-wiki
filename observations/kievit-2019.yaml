# Kievit, Hofman & Nation (2019): mutualistic coupling between vocabulary and
# reasoning in children aged 6-8, a replication of Kievit et al. (2017).
#
# Read from the PubMed Central full text (PMC6691592, CC BY 4.0), text only; the
# figure (Fig. 2, all standardised and raw parameters) and the supplement (Tables
# S1-S2, Figs. S1-S3) were not available, so every figure below comes from the
# running text.
#
# A correction was published (Erratum, Psychological Science 30(8), 1253,
# doi:10.1177/0956797619860523, registered in Crossref as a correction to this
# article). Its content was not read, so whether it changes any figure recorded
# here is not established.
#
# One cohort, no assigned conditions: arms are empty and every result rests on a
# whole-sample comparison of kind `none`, as in marsh-2015-study1. The coupling
# parameters are the paper's own fitted estimates (standardised), recorded as
# printed. The article labels the reasoning-to-vocabulary coupling "(r)" and the
# vocabulary-to-reasoning coupling "β"; both are standardised path parameters of
# the same latent change score model and are recorded as regression coefficients.

schema_version: 2

study:
  key: kievit-2019
  citation: "Kievit, R. A., Hofman, A. D., & Nation, K. (2019). Mutualistic coupling between vocabulary and reasoning in young children: A replication and extension of the study by Kievit et al. (2017). Psychological Science, 30(8), 1245–1252."
  doi: "10.1177/0956797619841265"
  design:
    family: longitudinal
    design_detail: >-
      Cohort of 227 children tested in four waves; Waves 2 to 4 analysed (WASI
      vocabulary and matrix reasoning). Bivariate latent change score models
      comparing g-factor, investment and mutualism accounts (lavaan, robust ML
      with Yuan-Bentler correction, FIML for missing data), with a
      parallel-process latent growth model and a random-intercept cross-lagged
      panel model as robustness checks. No intervention; associational.
    preregistration:
      status: not-preregistered
      source_quote: "The design and analysis plans were not preregistered."

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: coupling-stronger-self-feedback-weaker-younger-children
    bearing: supports
    anchor: kievit-r-a-2019
  - claim: vocabulary-drives-reasoning-gains
    bearing: supports
    anchor: kievit-r-a-2019
  - claim: parallel-process-validates-cross-domain-coupling
    bearing: supports
    anchor: kievit-r-a-2019

evidence_base:
  unit: participants
  size:
    value: 227
    unit: participants
  population:
    description: >-
      Convenience cohort of 227 children (129 girls) studied at the University
      of Oxford; the analysed waves were tested at ages 6.22, 7.22 and 8.22
      years.
    age_or_stage: >-
      Four waves at ages 4.8, 6.22, 7.22 and 8.22 years; Wave 1 (WPPSI rather
      than WASI) was not analysed. The abstract describes the sample as "6–8
      years old". No SD or per-child range is printed.
    age:
      unit: years
      min: 6
      max: 8
      note: "The abstract's '(N = 227, 6–8 years old)'; the analysed waves were at ages 6.22, 7.22 and 8.22 (Method)."
  context:
    setting: "Longitudinal cohort testing with the Wechsler Abbreviated Scale of Intelligence, United Kingdom (Oxford)"
  arms: []

comparisons:
  - id: whole-cohort
    kind: none
    description: "Structural parameters of models fitted to the whole cohort across Waves 2 to 4; no contrast between groups."

