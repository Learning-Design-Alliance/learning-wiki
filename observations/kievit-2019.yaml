      value: 227
      unit: participants
    comparison_ref: whole-cohort
    outcome:
      construct: "Vocabulary growth"
      source_language: "the coupling parameter (r) from reasoning to changes in vocabulary"
      measure: "Latent change in WASI vocabulary between waves, regressed on matrix reasoning at the earlier wave"
      scale: "standardised coupling parameter, latent change score model"
      direction: contextual
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "Wave 2 to Wave 3 (ages about 6.22 to 7.22)"
      offset:
        value: 1
        unit: years
        from: "Wave 2"
    result:
      measure_type: regression_coefficient
      estimate: 0.218
      model: >-
        Final mutualism latent change score model (chi2(8) = 9.849, p = .276,
        RMSEA = 0.032, CFI = .996, SRMR = .032). Standardised estimate. The
        adolescent NSPN sample of Kievit et al. (2017) gave .155; z = 0.92 for
        the difference.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      Standard errors are given only for the unstandardised estimates, in
      Fig. 2, which the text read here does not contain.
    source_quote: "Indeed, in the NSPN sample, the coupling parameter (r) from reasoning to changes in vocabulary was .155 (standardized estimate), whereas in the younger Oxford sample, it was .218 and .276 for Waves 2 and 3, respectively (red arrows pointing downward in Fig. 2; zs = 0.92 and 1.72, respectively)."
    source_location: "Results, third paragraph after Fig. 2"

