  - id: parallel-process-vocabulary-intercept-to-reasoning-slope
    sample:
      value: 227
      unit: participants
    comparison_ref: whole-cohort
    outcome:
      construct: "Reasoning growth rate"
      source_language: "The path of vocabulary intercepts on reasoning slopes"
      measure: "Linear slope of WASI matrix reasoning over Waves 2 to 4 (loadings 0, 1, 2), regressed on the vocabulary intercept"
      scale: "unstandardised b with SE, and standardised β"
      direction: contextual
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "Waves 2 to 4 (ages about 6.22 to 8.22)"
    result:
      measure_type: regression_coefficient
      estimate: 0.196
      standard_error: 0.051
      model: >-
        Parallel-process (bivariate latent growth) model, chi2(9) = 18.72,
        p = .028, RMSEA = 0.069, CFI = .978, SRMR = .048. Unstandardised
        b = 0.196 (SE 0.051); standardised beta = 0.43. Constraining the path
        gave chi2(1) = 18.72, p < .0001, as printed.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      The constraint test is printed as chi2(1) = 18.72, the same value as the
      model's overall chi2(9); recorded as printed, not corrected.
    source_quote: "The path of vocabulary intercepts on reasoning slopes was strong and positive (b = 0.196, SE = 0.051, β = 0.43), and constraining this path led to a considerable drop in model fit, χ2(1) = 18.72, p < .0001."
    source_location: "Results, Alternative model specification"

