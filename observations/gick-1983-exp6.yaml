# Gick & Holyoak (1983), Experiment 6: two story analogs, similar or
# dissimilar, with or without convergence diagrams.
#
# Read from a text layer of the published article (Cognitive Psychology 15,
# 1-38); no PDF was available beside it. Table 9A is flattened by the text
# layer into one column per condition, in the header's order (similar with
# diagrams, dissimilar with diagrams, similar without, dissimilar without):
# before hint, after hint, total, N. Every cell's frequency agrees with its
# percentage and N, and before plus after equals total in frequencies, so the
# per-condition figures below are recorded from it, quoted as the flattened
# column. The pooled contrasts are quoted from the running text, where the text
# layer has dropped the superscript 2 ("G(1)", "G (1)"); `statistic` writes
# G2.
#
#   * Per-condition shares as `probability`, in percent as printed.
#   * `population.age: unreported`: 189 subjects "run in small groups", not
#     otherwise described.
#   * No reliability figure for the schema scoring.
#   * Design `quasi-experimental`: the stories' assignment to conditions was
#     counterbalanced, but how subjects were divided among the four conditions
#     is not stated.

schema_version: 2

study:
  key: gick-1983-exp6
  citation: "Gick, M. L., & Holyoak, K. J. (1983). Schema induction and analogical transfer. Cognitive Psychology, 15(1), 1–38. Experiment 6."
  doi: "10.1016/0010-0285(83)90002-6"
  design:
    family: quasi-experimental
    design_detail: >-
      2 x 2 between-subjects: two similar analogs (both military or both
      fire-fighting) or two dissimilar analogs (one of each), with or without
      a separate sheet of two arrow diagrams representing convergence (stories
      modified to refer to them; subjects asked to draw them). Story
      assignment and order fully counterbalanced. Procedure as in Experiment
      5: study for 5 minutes, summarise and describe similarities from memory,
      then the radiation problem without and then with a hint.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: schema-aids-beneficial-with-two-analogs
    bearing: supports
    anchor: gick-1983

evidence_base:
  unit: participants
  size:
    value: 189
    unit: participants
  population:
    description: "189 subjects run in small groups, approximately equal numbers per condition; the article does not otherwise describe them for this experiment."
    age_or_stage: "Not described for this experiment"
    age: unreported
  context:
    setting: "Small-group testing; written story task from memory, then the radiation problem in the two-pass procedure"
  arms:
    - id: similar-with-diagrams
      description: "Two similar-domain analogs plus the convergence diagrams."
      size:
        value: 48
        unit: participants
      elements:
        - term: "comparing two analogous cases"
        - term: "diagrammatic representation of the principle"
    - id: dissimilar-with-diagrams
      description: "Two dissimilar-domain analogs plus the convergence diagrams."
      size:
        value: 51
        unit: participants
      elements:
        - term: "comparing two analogous cases"
        - term: "diagrammatic representation of the principle"
    - id: similar-without-diagrams
      description: "Two similar-domain analogs, no diagrams."
      size:
        value: 43
        unit: participants
      elements:
        - term: "comparing two analogous cases"
    - id: dissimilar-without-diagrams
      description: "Two dissimilar-domain analogs, no diagrams."
      size:
        value: 47
        unit: participants
      elements:
        - term: "comparing two analogous cases"

comparisons:
  - id: diagrams-vs-none
    kind: between-groups
    index_arm:
      - similar-with-diagrams
      - dissimilar-with-diagrams
    reference_arm:
      - similar-without-diagrams
      - dissimilar-without-diagrams
    description: "Diagrams against no diagrams, pooled over analog similarity, as the article pools them."

observations:

  - id: before-hint-diagrams-vs-none
    sample:
      value: 189
      unit: participants
    comparison_ref: diagrams-vs-none
    outcome:
      construct: "Spontaneous analogical transfer"
      source_language: "initial solutions"
      measure: "Convergence solution to the radiation problem proposed on the first pass, before the hint"
      scale: "percent of subjects"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "same session, first pass at the transfer problem"
    result:
      measure_type: other
      statistic: "G2(1) = 7.55"
      p_value: "< .01"
      descriptives:
        with-diagrams: "57% before the hint"
        without-diagrams: "37% before the hint"
      interpretation: "The diagrams' effects were essentially the same for similar and dissimilar analogs; analog similarity had no significant influence on solution frequencies (no statistic printed)."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: unreported
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: "Printed in the text layer as \"G(1) = 7.55\"; the superscript 2 is lost."
    source_quote: "Provision of a diagram resulted in a higher frequency of initial solutions (57 vs 37%), G(1) = 7.55, p < .01, as well as of total solutions (92 vs 79%), G (1) = 6.66, p < .01."
    source_location: "Experiment 6, Results and Discussion, p. 28; Table 9A"

