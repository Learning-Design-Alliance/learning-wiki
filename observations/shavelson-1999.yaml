    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: partial
      effect_size: unreported
    source_quote: "The variance component for pt (0.65) is smaller than the variance component for pto (0.79)."
    source_location: "p. 64, Task Sampling Variability in Performance Assessment (Table 2, p. 66)"

  - id: person-x-occasion-variance
