      implementation_detail: observed
      outcome_timing: partial
      effect_size: unreported
    source_quote: "pt,pto in the un-stratified design accounts for 57.18 percent (Table 2)."
    source_location: "p. 67, Task Sampling Variability in Performance Assessment"

not_yet_extracted:
  - "Table 2 (p. 66) residual ptom,e component (0.47, 18.70% in the text layer) and the person (0.33, 13.11%), occasion, task x method and other rows: the text layer of the table is garbled (the n column reads '7322'; the pom and tom rows read '02'), and no PDF was available, so no table-only figure is recorded."
  - "Table 1 (p. 65), the person x rater x task x occasion G study (n = 26) reproduced from Shavelson, Baxter & Gao (1993): pt 0.63 (32%), pto 1.16 (59%), prto,e 0.08 (4%). These belong to that publication's record; note the prose here prints pt as '.063'. The G coefficients row is garbled in the text layer."
  - "Table 3 (p. 67), stratified p x (t:s) x o x m G study: p x (t:s) x o 39.60% (text: 40 percent); ps 8.54%; pso 7.97%; psom 1.87% in the text against 1.89 in the table text layer. The table's text layer is partly scrambled."
  - "Decision-study result: tasks needed for a reliability of .80 with one occasion and one method, 27 un-stratified against 38 stratified (p. 68)."
  - "Table 4 (p. 69) method correlations, reproduced from Shavelson, Baxter & Gao (1993, Table 6), garbled in the text layer; and the retest DO-NB correlations on 29 students (p. 69), whose subscripts are garbled in the text layer ('/D01,NB2 = .48', '7D02,NBI .56')."
