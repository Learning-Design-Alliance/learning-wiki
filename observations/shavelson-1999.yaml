# Shavelson, Ruiz-Primo & Wiley (1999): a re-analysis note on task and occasion
# sampling in science performance assessments.
#
# WHAT IS RECORDED HERE, and what is not:
#
#   * The note's OWN new analysis: the person x occasion x task x method G study
#     (27 students, 3 tasks, 2 occasions, 2 methods; Table 2). The person x
#     task and person x task x occasion components (0.65 and 0.79), the zero
#     person x occasion component and the 57.18% share of pt plus pto are each
#     printed in the prose, which is what the quotes below come from.
#   * NOT recorded: Table 1, which the note reproduces from Shavelson, Baxter
#     & Gao (1993). Those figures belong to that publication's record. The
#     note's prose prints the Table 1 pt component as ".063" while the table
#     itself prints 0.63, a discrepancy in the source.
#   * The text layer of Table 2 is garbled (the n column is unreadable and the
#     pom and tom rows read "02"). The residual (ptom,e) component, 0.47 and
#     18.70%, appears only in that table and is therefore NOT recorded; it is
#     listed in not_yet_extracted. No PDF was available to check it.
#   * `population.age: unreported`: the note says only "fifth and sixth grade
#     students". No reliability coefficient for the scores is printed for this
#     note's own analysis (the ".80 reliability" figures are a target used in
#     a decision study), so no reliability observation is recorded.
#
# No claim page cites this DOI, so appears_in is omitted.

schema_version: 2

study:
  key: shavelson-1999
  citation: "Shavelson, R. J., Ruiz-Primo, M. A., & Wiley, E. W. (1999). Note on sources of sampling variability in science performance assessments. Journal of Educational Measurement, 36(1), 61–71."
  doi: "10.1111/j.1745-3984.1999.tb00546.x"
  design:
    family: other
    design_detail: >-
      Generalizability (G) study re-analysis of existing data (Ruiz-Primo,
      Baxter & Shavelson, 1993): a fully crossed person x occasion x task x
      method design in which each student performed the same three hands-on
      science tasks on two occasions (late spring and early fall of 1990), in
      the same order, scored by direct observation and by notebook. A
      measurement study estimating variance components; no intervention and
      no group contrast.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

evidence_base:
  unit: participants
  size:
    value: 27
    unit: participants
  additional_sizes:
    - value: 3
      unit: items
      note: "performance tasks in the Table 2 G study: Paper Towels, Electric Mysteries, Bugs"
    - value: 2
      unit: sessions
      note: "testing occasions, late spring and early fall of 1990"
    - value: 2
      unit: other
      note: "measurement methods in the Table 2 G study: direct observation and notebook"
    - value: 186
      unit: participants
      note: "fifth and sixth grade students in the larger Ruiz-Primo et al. (1993) sample from which the retest students were drawn"
    - value: 29
      unit: participants
      note: "random retest sample from the 186 used for the cross-occasion DO-NB correlations"
  population:
    description: "Fifth and sixth grade students in the Ruiz-Primo, Baxter & Shavelson (1993) study of hands-on science performance assessments."
    age_or_stage: "fifth and sixth grade"
    age: unreported
  context:
    setting: "Hands-on science investigations drawn from fifth-sixth grade curricula, administered on two occasions a summer apart"
  arms: []

comparisons:
  - id: whole-sample
    kind: none
    description: "Variance components estimated over the whole G-study sample; no contrast between groups."

observations:

  - id: person-x-task-variance
    comparison_ref: whole-sample
    sample:
      value: 27
      unit: participants
    outcome:
      construct: "Person x task variance in performance-assessment scores"
      source_language: "The variance component for pt"
      measure: "Estimated variance component for person x task (pt) in the person x occasion x task x method G study"
      scale: "estimated variance component"
      direction: contextual
      role: other
      role_basis: ambiguous
      valued_by: []
    time:
      label: "two occasions, late spring and early fall of 1990"
    result:
      measure_type: other
      estimate: 0.65
      unit: "estimated variance component"
      model: "Random-effects G study, person x occasion x task x method, all facets crossed"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: partial
      effect_size: unreported
    observability_notes: >-
      The score scale of the tasks is not described in the note, so the
      component's units are not stated. No standard error is printed.
    source_quote: "The variance component for pt (0.65) is smaller than the variance component for pto (0.79)."
    source_location: "p. 64, Task Sampling Variability in Performance Assessment (Table 2, p. 66)"

  - id: person-x-task-x-occasion-variance
    comparison_ref: whole-sample
    sample:
      value: 27
      unit: participants
    outcome:
      construct: "Person x task x occasion variance in performance-assessment scores"
      source_language: "the variance component for pto"
