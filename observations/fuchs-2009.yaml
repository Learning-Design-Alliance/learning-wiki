# Fuchs, Powell, Seethaler, Cirino, Fletcher, Fuchs, Hamlett & Zumeta (2009):
# number-combination (Math Flash) and word-problem (Pirate Math) tutoring for
# third graders with mathematics difficulty, a three-arm randomised trial.
#
# What is recorded: the Table 5 effect sizes for number-combination tutoring
# against control on its own outcome (number combinations), on procedural
# calculations (the near-transfer contrast), and on each of the five
# word-problem measures (the far-transfer contrasts), plus word-problem
# tutoring against control on procedural calculations. Each Table 5 cell is
# one observation, because that is the grain the source reports; nothing is
# averaged across the five word-problem measures.
#
# Effect sizes are what the authors call Cohen's d: unadjusted posttest means
# over the pooled SD of the two groups compared (Table 5 note), with the
# printed confidence intervals. They are NOT the pretest-adjusted ANCOVA
# contrasts whose p values the text reports beside them.
#
# Reliability: the article prints scorer agreement and alpha computed on this
# sample for the four number-combination subtests and the two procedural
# calculation measures, which make up the two factor scores. Figures it takes
# from test manuals or other samples (WRAT, WASI, KeyMath split-half, Iowa
# KR-20, the word-problem screener's .83) are not recorded as this study's.
#
# Read from the PMC author manuscript (PMC2768320), text layer; the tables
# came out cleanly as tab-separated rows.

schema_version: 2

study:
  key: fuchs-2009
  citation: "Fuchs, L. S., Powell, S. R., Seethaler, P. M., Cirino, P. T., Fletcher, J. M., Fuchs, D., Hamlett, C. L., & Zumeta, R. O. (2009). Remediating number combination and word problem deficits among students with mathematics difficulties: A randomized control trial. Journal of Educational Psychology, 101(3), 561–576."
  doi: "10.1037/a0014701"
  design:
    family: randomized-controlled-trial
    design_detail: >-
      Individually randomised field trial at two sites (Houston, Nashville).
      Students were blocked on site, type of screening difficulty (word
      problems, calculations or both) and difficulty status (mathematics
      difficulty alone, MD, or with reading difficulty, MDRD) and randomly
      assigned to number-combination tutoring, word-problem tutoring or a
      no-tutoring control. Primary analysis three-way ANCOVA (treatment x
      difficulty status x site, pretest covariate) with interactions trimmed
      top-down. Effect sizes from unadjusted posttest means and pooled SDs.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-author-manuscript
  verification: unverified

appears_in:
  - claim: nc-and-wp-tutoring-improve-nc-fluency
    bearing: supports
    anchor: fuchs-2009
  - claim: tutoring-improves-procedural-calculation
    bearing: supports
    anchor: fuchs-2009
  - claim: tutoring-improves-procedural-calculation
    bearing: supports
    anchor: fuchs-2009-2
  - claim: pirate-math-improves-word-problems-and-foundational-skills
    bearing: supports
    anchor: fuchs-2009

evidence_base:
  unit: participants
  size:
    value: 133
    unit: participants
  additional_sizes:
    - value: 924
      unit: participants
      note: "third graders screened, in 63 classrooms of 18 schools"
    - value: 162
      unit: participants
      note: "randomly assigned; 29 moved or were withdrawn before or during tutoring, leaving 133 evaluated at posttest"
    - value: 18
      unit: schools
      note: "schools in which students were screened (7 Houston, 11 Nashville); not a unit of assignment"
  population:
    description: >-
      Third graders with mathematics difficulty (below the 26th percentile on
      WRAT-3 Arithmetic, or 0-1 on a five-item word-problem screener) in two
      large urban districts. 73 (55%) MD and 60 (45%) MDRD; 67 in Houston, 66
      in Nashville. 55% boys, 78% eligible for subsidised lunch, 16% English
      learners, 17% special education, 27% retained; 63% African American,
      23% Hispanic, 9% Caucasian, 2% Asian.
    age_or_stage: "Grade 3"
    age:
      unit: years
      mean: 8.94
      sd: 0.54
      note: "the evaluated sample of 133"
  context:
    setting: >-
      Tutoring during the school day outside the classroom, often in the
      library, never during reading or mathematics instruction, so it was
      layered on the classroom programme (Houghton Mifflin Math in Nashville;
      school-chosen programmes under a district planning guide in Houston).
      Tutors were employees of the research grant.
  arms:
    - id: nc-tutoring
      description: >-
        Math Flash number-combination tutoring: counting strategies (min
        strategy, missing-addend subtraction), conceptual lessons and
        computerised and flash-card practice on the 200 number combinations
        with addends and subtrahends 0-9, with mastery criteria and a
        reinforcement programme.
      size:
        value: 44
        unit: participants
      dose:
        amount: 48
        unit: sessions
        detail: "16 weeks, 3 sessions a week, 20-30 min a session; total minutes averaged 1,032 (Nashville) and 1,155 (Houston)"
      delivery:
        role: add-on
        basis: stated
      implementation_notes:
        - "Fidelity: 98.1% (Nashville) and 99.5% (Houston) of essential lesson points addressed, from 16.8% of audiotaped sessions"
    - id: wp-tutoring
      description: >-
        Pirate Math word-problem tutoring: an introductory unit on foundational
        skills (the counting-up strategy for number combinations, double-digit
        addition and subtraction, solving for X, checking work), then
        schema-broadening instruction on Total, Difference and Change problems
        with explicit instruction on transfer features; each session opens
        with the same flash-card warm-up as Math Flash and ends with 2 min of
        paper-and-pencil review including calculation items.
      size:
        value: 42
        unit: participants
      dose:
        amount: 48
        unit: sessions
        detail: "16 weeks, 3 sessions a week, 20-30 min a session; total minutes averaged 997 (Nashville) and 1,158 (Houston)"
      delivery:
        role: add-on
        basis: stated
      implementation_notes:
        - "Fidelity: 98.4% (Nashville) and 99.2% (Houston) of essential lesson points addressed"
        - "Number-combination counting strategy taught in a single lesson, then practised in the 2-min warm-up, the 2-min review and within word problems"
    - id: control
      description: "No tutoring; the classroom mathematics programme only."
      size:
        value: 47
        unit: participants

comparisons:
  - id: nc-vs-control
    kind: between-groups
    index_arm: nc-tutoring
    reference_arm: control
    description: "Number-combination tutoring against no tutoring, at posttest."
  - id: wp-vs-control
    kind: between-groups
    index_arm: wp-tutoring
    reference_arm: control
    description: "Word-problem tutoring against no tutoring, at posttest."
  - id: whole-sample
    kind: none
    description: "Scale properties in the study sample; no contrast between arms."

observations:

  - id: nc-vs-control-number-combinations
    sample:
      value: 91
      unit: participants
    comparison_ref: nc-vs-control
    outcome:
      construct: "Number-combination fluency"
      source_language: "Number combinations"
      measure: "Factor score (M = 0, SD = 1) from four Grade 3 Math Battery subtests: Addition and Subtraction Fact Fluency 0-12 and 0-18, 25 items each, 1 min"
      scale: "factor score"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "posttest, immediately after 16 weeks of tutoring"
      offset:
        value: 16
        unit: weeks
        from: "start of tutoring"
    result:
      measure_type: cohens_d
      estimate: 0.55
      ci_lower: 0.14
      ci_upper: 0.97
      interval_type: confidence
      p_value: "< .0002 (ANCOVA follow-up comparison on adjusted means)"
      descriptives: "Posttest M (SD): NC tutoring 0.19 (1.10), control -0.36 (0.86) (Table 4)"
      model: "d from unadjusted posttest means and the pooled SD of the two groups; significance from the three-way ANCOVA with pretest covariate"
    moderators:
      reported:
        - variable: "Difficulty status (MD vs MDRD)"
          relationship: "No treatment x difficulty status interaction"
          source_quote: "For NCs, there were no interactions among the three factors or with pretest, including the interaction between difficulty status and treatment."
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      Sample is the sum of the two arms' sizes in Tables 4 and 5's headers;
      the article does not print an analysed n per contrast.
    source_quote: "Number combinations +0.62 (0.19 to 1.04) +0.01 (−0.41 to 0.43) +0.55 (0.14 to 0.97) +0.43 (0.08 to 0.77)"
    source_location: "Table 5, Number combinations row, NCs vs. Control column"

