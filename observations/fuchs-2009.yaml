      p_value: "< .007 (ANCOVA follow-up comparison on adjusted means)"
      descriptives: "Posttest M (SD): NC tutoring 0.01 (0.89), control -0.26 (1.11) (Table 4)"
      model: "d from unadjusted posttest means and the pooled SD; significance from the three-way ANCOVA with pretest covariate"
      interpretation: >-
