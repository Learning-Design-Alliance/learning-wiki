evidence_base:
  unit: effect-sizes
  size:
    value: 44
    unit: effect-sizes
  additional_sizes:
    - value: 33
      unit: studies
      note: "studies that met the inclusion criteria and contributed the 44 independent comparisons"
    - value: 3869
      unit: participants
      note: "participants across the 44 comparisons (the overall n)"
  population:
    description: >-
      Learners reading refutation or non-refutation texts in experiments drawn
      from the medical science, social science, psychological science and
      science education literature; most comparisons used post-secondary
      samples. Studies took place in Europe (21 comparisons) or North America
      (18); location not reported for 5.
    age_or_stage: >-
      Coded by grade band: primary (K-5) 2 comparisons, middle (6-8) 4,
      secondary (9-12) 4, post-secondary 30, mixed adult 2, mixed ages 2. The
      article prints no age in years.
    age: unreported
  context:
    setting: "Mostly one-time interventions with relatively short text passages, read in print, electronically or both"
  variation:
    - dimension: "Learner age"
      distribution: "primary 2, middle 4, secondary 4, post-secondary 30, mixed adult 2, mixed ages 2 comparisons"
    - dimension: "Participant assignment"
      distribution: "random 39, convenience (classroom random assignment) 1, not reported 4 comparisons"
    - dimension: "Format of outcome test"
      distribution: "Likert 5, mixed item types 13, multiple choice 9, open-ended 10, true-false 4, not reported 3 comparisons"
    - dimension: "Timing of outcome test"
      distribution: "same day 17, 2 days to 1 week 11, 8 days to 1 month 13, more than 1 month 2, not reported 1 comparison"
    - dimension: "Comparison condition"
      distribution: "expository/scientific text 30, mixed control condition 1, non-specified text 10, problem solving 3 comparisons"
