    - id: non-refutation-middle
      description: "Non-refutation text in comparisons with middle-grade learners (grades 6-8)."
    - id: refutation-secondary
      description: "Refutation text in comparisons with secondary-grade learners (grades 9-12)."
    - id: non-refutation-secondary
      description: "Non-refutation text in comparisons with secondary-grade learners (grades 9-12)."
    - id: refutation-post-secondary
      description: "Refutation text in comparisons with post-secondary learners (university or similar settings)."
    - id: non-refutation-post-secondary
      description: "Non-refutation text in comparisons with post-secondary learners (university or similar settings)."
    - id: refutation-multiple-choice
      description: "Refutation text in comparisons whose coded outcome test was a multiple-choice test."
    - id: non-refutation-multiple-choice
      description: "Non-refutation text in comparisons whose coded outcome test was a multiple-choice test."
    - id: refutation-open-ended
      description: "Refutation text in comparisons whose coded outcome test was open-ended questions."
    - id: non-refutation-open-ended
