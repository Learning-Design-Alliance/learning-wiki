# Schroeder & Kucera (2022): meta-analysis of refutation text against
# non-refutation text conditions, between-subjects experiments.
#
# Read from the publisher PDF (Educational Psychology Review 34:957-987) and its
# text layer. The front matter prints the DOI 10.1007/s10648-021-09656-z, which
# agrees with the key given for this record.
#
# WHAT THIS FILE RECORDS:
#
#   * The pooled effect over all 44 comparisons, the trim-and-fill adjusted
#     estimate, the random-assignment stratum, the four school and university
#     age strata, and the multiple-choice and open-ended test-format strata
#     (Table 3). The Table 3 rows quoted are those whose text-layer row reads
#     cleanly; the "Mixed adult", "Mixed ages", "Likert" and "Mixed item types"
#     rows interleave their columns in the text layer and are not recorded.
#   * `measure_type: reliability`, twice: the coders' Cohen's kappa (0.89) and
#     their percent agreement (90.4%), on eight of the 33 studies double-coded.
#     It is the reliability of the CODING, not of any outcome test; the article
#     prints no reliability for the primary studies' tests.
#   * `population.age: unreported`. Learner age was coded by grade band
#     (primary K-5, middle 6-8, secondary 9-12, post-secondary) and the article
#     prints no age in years.
#   * The corpus is counted in effect sizes: one per independent comparison,
#     44 in all, from 33 studies. Stratum k values count the same unit.
#   * Effects are Hedges' g as the article names it. Table 3 gives n for each
#     side of a stratum; those counts go in descriptives and are not summed.

schema_version: 2

study:
  key: schroeder-2022
  citation: "Schroeder, N. L., & Kucera, A. C. (2022). Refutation text facilitates learning: A meta-analysis of between-subjects experiments. Educational Psychology Review, 34(2), 957–987."
  doi: "10.1007/s10648-021-09656-z"
  design:
    family: meta-analysis
    design_detail: >-
      Random-effects meta-analysis of between-subjects comparisons of a
      refutation text condition with a non-refutation text condition carrying
      the same general instructional information, on quantitatively measured
      learning of factual information. One outcome test per independent
      comparison, chosen by stated preference rules (conceptual change, then
      transfer, then comprehension or retention, then unspecified; the most
      delayed test where several were given). Categorical moderator analyses
      (Q between) on text features and on methodological features.
  synthesis:
    model: "Random-effects model, run in Comprehensive Meta-Analysis version 2.2.064"
    heterogeneity_statistic: "Q"
    search:
      databases:
        - Academic Search Complete
        - APA PsycINFO
        - CINAHL Plus with Full Text
        - Education Research Complete
        - ERIC
        - MEDLINE
        - Web of Science Core Collection
      date_range: "no start limit; searched March 28, 2020"
      records_screened: "855 research items, 473 after removal of duplicates; 129 retrieved in full text"
      records_included: "33 research items, 44 independent comparisons"
    inclusion:
      - "A between-subjects comparison of a refutation text condition with a separate non-refutation text condition containing the same general instructional information"
      - "Quantitative measure of learning of factual information rather than beliefs or opinions"
      - "Enough data to calculate an effect size, and the number of participants in each group"
      - "A design with few or minimal confounding variables"
      - "Published in English and publicly available"
    exclusion:
      - "Comparison conditions with no instructional materials or with filler texts"
    data_handling:
      - "One outcome test per independent comparison, by stated preference order; the most delayed test where several were given"
      - "Where a conference proceeding and a journal article reported the same data, the journal article was coded unless it lacked the information needed"
      - "One author coded all studies; the second coded eight randomly selected studies; disagreements reconciled through discussion"
      - "Moderator variables not reported in a primary study were coded 'not reported'"

