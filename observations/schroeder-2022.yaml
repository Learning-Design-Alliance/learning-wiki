observations:

  - id: refutation-overall
    sample:
      value: 3869
      unit: participants
    comparison_ref: refutation-vs-non-refutation
    outcome:
      construct: "Learning of the refuted content"
      source_language: "learning outcomes"
      measure: "One outcome test per comparison: a conceptual change test, else a transfer test, else a comprehension or retention test, else an unspecified learning test"
      scale: "Hedges' g, refutation minus non-refutation"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "the most delayed test reported per comparison; same day (17 comparisons) to more than 1 month (2)"
    result:
      measure_type: hedges_g
      estimate: 0.41
      ci_lower: 0.30
      ci_upper: 0.51
      interval_type: confidence
      p_value: "< 0.001"
      k:
        value: 44
        unit: effect-sizes
      heterogeneity:
        statistic: "I2"
        value: 60.76
        interpretation: "Q(43) = 109.59, p < 0.001; described as significant heterogeneity"
      publication_bias:
        method: "Funnel plot, Egger's regression intercept, Duval and Tweedie's trim and fill, classic fail-safe N"
        p_value: "one-tailed p = 0.29 (Egger, t(42) = 0.55)"
        finding: "Funnel plot relatively symmetrical; Egger showed no significant asymmetry; trim and fill adjusted 10 studies to the left of the mean (adjusted g = 0.28, recorded as its own observation); fail-safe N 1,625. Judged by the authors not a substantial concern."
      model: "random-effects"
      note: "Leave-one-out sensitivity analysis: overall effect ranged from g = 0.39 to g = 0.43."
    moderators:
      reported:
        - variable: "Publication type"
          relationship: "Significant moderation: proceedings g = 0.73, journal articles g = 0.45, dissertations or theses g = 0.11 (Qb(2) = 9.01, p = 0.01)"
          source_quote: "We did find that the effectiveness of refutation text significantly varied by the type of publication the comparison appeared in (Qb(2) = 9.01, p = 0.01)."
        - variable: "Learner age"
          relationship: "No significant moderation (Qb(5) = 6.60, p = 0.25)"
          source_quote: "We found that the effects of refutation text were robust and consistent regardless of the age of the learners (Qb(5) = 6.60, p = 0.25)."
        - variable: "Type of outcome test"
          relationship: "No significant moderation (Qb(5) = 3.76, p = 0.58)"
          source_quote: "We found that the type of outcome test did not significantly influence the effectiveness of refutation text (Qb(5) = 3.76, p = 0.58)."
        - variable: "Timing of outcome test"
          relationship: "No significant moderation (Qb(4) = 0.48, p = 0.98)"
          source_quote: "We found that the effectiveness of refutation text did not significantly differ depending on when the outcome test occurred (Qb(4) = 0.48, p = 0.98)."
        - variable: "Participant assignment"
          relationship: "No significant moderation (Qb(2) = 4.33, p = 0.11); non-random comparisons had larger effects"
          source_quote: "The results showed that the type of participant assignment did not significantly influence the effectiveness of refutation text (Qb(2) = 4.33, p = 0.11)."
        - variable: "Comparison condition"
          relationship: "No significant moderation (Qb(3) = 2.56, p = 0.47)"
          source_quote: "Importantly, this moderator analysis showed that refutation text was significantly more effective than all comparison conditions, and these positive effects did not vary significantly depending on the comparison condition (Qb(3) = 2.56, p = 0.47)."
        - variable: "Prior knowledge"
          relationship: "No significant moderation (Q(2) = 2.18, p = 0.34); 37 comparisons did not report it"
          source_quote: "However, we found that most studies did not categorize the prior knowledge of participants (k = 37), and the moderator analysis revealed that prior knowledge did not have a significant moderating effect (Q(2) = 2.18, p = 0.34)."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: partial
      effect_size: observed
      pooled_k: observed
    source_quote: "A random-effects meta-analysis of the 44 independent comparisons found a moderate overall effect size (g = 0.41, p < 0.001, 95% CI [0.30, 0.51], n = 3,869) with significant heterogeneity (Q(43) = 109.59, p < 0.001, I2 = 60.76)."
    source_location: "Results, RQ1; Fig. 2"

  - id: refutation-overall-trim-and-fill
    sample:
      value: 3869
