    unit: studies
  additional_sizes:
    - value: 208796
      unit: participants
      note: "students across the 82 included studies"
    - value: 698
      unit: reports
      note: "full papers assessed against the inclusion criteria"
  population:
    description: >-
      Students in regular secondary education classrooms. Studies by region:
      USA/Canada 57, Europe 9, Asia 8, Australia 4, South America 2, multiple
      countries 2. Of the 51 studies (62%) reporting SES, 16 were low-SES
      samples (>40% free or reduced lunch) and 33 middle/high SES.
    age_or_stage: >-
      Grades 6/7 to 12, middle school and high school. 24 studies in middle
      school, 38 in high school, 20 with both (8 of which reported the two
      separately). Age was coded but no age figure is printed.
    age: unreported
  context:
    setting: "Regular secondary schools; correlational studies published 2000-2018"
  variation:
    - dimension: "Grade level"
      distribution: "middle school 24 studies, high school 38, both 20"
    - dimension: "Region"
      distribution: "USA/Canada 57, Europe 9, Asia 8, Australia 4, South America 2, multiple countries 2"
    - dimension: "Belonging instrument"
      distribution: "many different scales (Table 1); the Psychological Sense of School Membership (PSSM) questionnaire most frequently used"
  arms:
    - id: middle-school
      description: "The middle-school stratum: studies or subsamples of middle-school students."
    - id: high-school
      description: "The high-school stratum: studies or subsamples of high-school students."

comparisons:
