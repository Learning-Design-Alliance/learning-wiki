# Korpershoek, Canrinus, Fokkens-Bruinsma & de Boer (2020): meta-analysis of
# school belonging and secondary students' outcomes.
#
# Read from the publisher's open-access version of record (CC BY-NC-ND 4.0).
# Its front matter gives DOI 10.1080/02671522.2019.1615116, Research Papers in
# Education 35(6), 641-680 (2020), "Published online: 27 May 2019". The
# citation uses the issue year; the online year is 2019.
#
# WHAT THIS FILE RECORDS:
#
#   * The academic-achievement summary correlation, its trim-and-fill adjusted
#     value, the two achievement measures within it (school grades,
#     standardised tests), mastery-approach goals, and the middle-school and
#     high-school academic-achievement correlations.
#   * `measure_type: reliability` for the authors' own inclusion screening:
#     two researchers judged 121 of 698 full papers, agreement 0.94 (114 of
#     121) and Cohen's kappa 0.84. It is the reliability of the study-selection
#     decisions, not of any outcome instrument. The proportion is printed as
#     0.94, not as a percent, so it is recorded as `other` with its form rather
#     than converted to 94 for `percent_agreement`.
#   * No reliability for the belonging or outcome measures: the article prints
#     none, saying only that "results from highly unreliable instruments were
#     excluded", with no threshold.
#   * `population.age: unreported`. Age was coded, but the article prints only
#     grade levels (6/7 to 12).
#   * Model: the summary effects are inverse-variance weighted means of Fisher's
#     Z, back-transformed to r. The article does not say whether a fixed- or
#     random-effects model was used for them; random effects are named only for
#     the trim-and-fill analysis. Recorded as printed, not inferred.
#
# QUOTES FROM PAGE IMAGES: Tables 2 and 3 (p. 659) come out of the text layer
# with their columns separated, so the table-row quotes for academic
# achievement, school grades, standardised tests and mastery-approach goals were
# read from the page image of p. 659. The other quotes are copied from the text
# layer, with its ligature characters written as plain letters ("ff").

schema_version: 2

study:
  key: korpershoek-2020
  citation: "Korpershoek, H., Canrinus, E. T., Fokkens-Bruinsma, M., & de Boer, H. (2020). The relationships between school belonging and students' motivational, social-emotional, behavioural, and academic outcomes in secondary education: A meta-analytic review. Research Papers in Education, 35(6), 641–680. (Published online 27 May 2019.)"
  doi: "10.1080/02671522.2019.1615116"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-analysis of correlational studies relating students' sense of school
      belonging to motivational, social-emotional, behavioural and academic
      outcomes in regular secondary education. The authors focus on all
      correlational studies irrespective of the direction of effects, because
      causal evidence is scarce. Moderators (measurement instrument, region,
      grade level, SES) tested by meta-ANOVA.
  synthesis:
    model: "Inverse-variance weighted mean of Fisher's Z per outcome, back-transformed to r (Comprehensive Meta-Analysis); fixed versus random effects not stated for the summary effects"
    heterogeneity_statistic: "Q"
    search:
      databases:
        - ERIC
        - PsycINFO
      date_range: "peer-reviewed journal articles in English, January 2000 to December 2018"
      records_screened: 7090
      records_included: 82
    inclusion:
      - "Relates students' sense of school belonging to academic, motivational, social-emotional and/or behavioural outcomes"
      - "Regular secondary education classrooms, grades 6/7 to 12 (grade 6 excluded where still in primary school); regular students"
      - "Quantitative methods, at least 30 students"
      - "Dependent and independent variables not part of the same measurement instrument"
    exclusion:
      - "Special needs education, more than 25% single-sex schools, physical education, out-of-school activities"
      - "Students with emotional and/or behavioural disorders, learning disabilities, and gifted students"
    data_handling:
      - "Several correlations with similar outcomes in one study averaged into one study effect, with variance adjusted assuming a correlation of 0.7 between outcome measures (Borenstein et al., 2009, formula 24.6)"
      - "Study is the unit for summary effects; individual measures are the unit for analyses by instrument and by specific outcome, with variances multiplied by the number of same-type measures in a study"
      - "Studies reporting separate subsamples (grade level, SES, region) split for the group-difference analyses"
      - "Two researchers screened about 17% of 698 full papers; the first author screened the remaining 577"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

