# Kornell, Hays & Bjork (2009), Experiment 2: fictional trivia questions,
# total trial time held equal (13 s) in both conditions, so the read-only
# condition saw the answer for 13 s against the test condition's 5 s.
#
# Records the final cued-recall means with SDs (fictional and nonfictional
# items), the printed t for the fictional contrast (t(19) = 0.00: no
# difference; no d is printed), and the printed final-test accuracy of
# nonfictional items answered correctly vs not at study (100% vs 70%).
# This is the experiment in which the failed attempt was only as good as
# equal study time, the equality the learning-graph simulator reproduces.
#
# `population.age: unreported`: the article prints no age figure for any
# experiment. No scoring-reliability figure is printed (answers were typed
# and scored as correct or not; how is not described).
#
# Read from the maintainer's Drive copy of the published article. Its text
# layer writes "=", "<", ">" and the minus sign as symbol-font glyphs; the
# source_quotes use the characters the article prints, so they differ from
# the text file in those symbols only. The numbers are clean.

schema_version: 2

study:
  key: kornell-2009-exp2
  citation: "Kornell, N., Hays, M. J., & Bjork, R. A. (2009). Unsuccessful retrieval attempts enhance subsequent learning. Journal of Experimental Psychology: Learning, Memory, and Cognition, 35(4), 989–998. Experiment 2."
  doi: "10.1037/a0015729"
  design:
    family: other
    design_detail: >-
      Laboratory experiment. Within-participants 2 x 2: question type
      (fictional, nonfictional) by condition (read only, test), with the
      materials and procedure of Experiment 1 except that total trial time was
      held constant. Read-only trial: question and answer together for 13 s.
      Test trial: question alone for 8 s, then question and answer for 5 s.
      5-min distractor, then cued recall of all 40 questions.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: pretesting-enhances-learning
    bearing: qualifies
    anchor: kornell-hays-and-bjork-2009

evidence_base:
  unit: participants
  size:
    value: 20
    unit: participants
  population:
    description: "University of California, Los Angeles (UCLA) undergraduates."
    age_or_stage: "Undergraduates; no age figure is printed"
    age: unreported
  context:
    setting: "Laboratory, computer-presented study phase and cued-recall test."
    materials: "The fictional and nonfictional general-knowledge questions of Experiment 1 (Berger, Hall and Bahrick, 1999); again no participant reported suspecting that some were fictional."
  arms:
    - id: read-only
      description: "Read-only: question and answer shown together for 13 s."
      elements:
        - term: "study of the question and answer presented together"
      dose:
        amount: 13
        unit: "s per trial (answer visible 13 s)"
    - id: test
      description: "Test: question alone for 8 s while the participant tried to answer, then question and answer together for 5 s. No fictional question was answered correctly at study."
      elements:
        - term: "unsuccessful retrieval attempt followed by the answer (feedback)"
          anchors:
            - principles/retrieval-practice
      dose:
        amount: 13
        unit: "s per trial (8 s attempt, answer visible 5 s)"

comparisons:
  - id: test-vs-read-only
    kind: other
    index_arm: test
    reference_arm: read-only
    description: "Within-participant contrast: each participant's final recall of items studied in the test condition against items in the read-only condition."

observations:

  - id: test-vs-read-only-fictional
    sample: {value: 20, unit: participants}
    comparison_ref: test-vs-read-only
    outcome:
      construct: "Cued recall of answers to fictional trivia questions (none retrievable at study)"
      source_language: "cued-recall accuracy on fictional items"
      measure: "Final cued-recall test of all 40 questions, typed answers, no feedback"
      scale: "proportion correct"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "after a 5-min distractor task"
      offset: {value: 5, unit: minutes, from: "end of the study phase"}
    result:
      measure_type: other
      statistic: "t(19) = 0.00"
      descriptives: "test M = 0.32 (SD 0.18) vs read-only M = 0.32 (SD 0.21)"
      interpretation: "No difference between conditions; no effect size is printed, and none is computed here."
    moderators:
      reported: []
      candidate:
        - "Material type: the authors suspect the benefit of unsuccessful tests was larger with weak associates than with trivia questions because associates allow deep semantic processing of cue and target, while the fictional answers were mostly arbitrary names. A conjecture across experiments, not a tested moderator."
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "there was no significant difference in cued-recall accuracy on fictional items between the read-only condition (M = .32, SD = .21) and the test condition (M = .32, SD = .18), t(19) = 0.00."
    source_location: "Experiment 2, Results and Discussion (p. 992)"

