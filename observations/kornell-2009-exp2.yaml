not_yet_extracted:
  - "Commission vs omission errors at study: too few to compare (8 of 20 participants made at least one commission error, 2 more than one)."
  - "Study-phase accuracy on nonfictional items was .18 here against .32 in Experiment 1; the authors read this as between-participant differences across the two experiments, run at different times from the same pool."
