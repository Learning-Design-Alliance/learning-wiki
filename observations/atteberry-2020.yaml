  - id: math-summer-summer-correlations
    comparison_ref: whole-sample-math
    outcome:
      construct: "Persistence of summer gains/losses across summers"
      source_language: "Correlations (Summer, Summer Gains) Across Grades"
      measure: "Student-level correlations among summer gain/loss random effects (off-diagonal elements of the L2 covariance matrix), NWEA MAP math"
      scale: "correlation"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "pairs of summers within Grades 1-5 and within Grades 5-8"
    result:
      measure_type: correlation
      estimate_range:
        lower: 0.10
        upper: 0.65
        over:
          value: 9
          unit: comparisons
      model: "Two-level growth model with unstructured student-level covariance; Grades 1-5 and 5-8 modelled separately, so no correlations across the two models"
      note: "ELA: all positive, between 0.12 and 0.65."
    moderators:
      reported: []
      candidate:
        - "Distance between summers (adjacent summers tend to correlate more strongly in Table 6)"
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      The range is the prose's. Table 6 prints nine summer-summer correlations
