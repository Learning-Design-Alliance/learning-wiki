  - "Table 6 lower panel (math summer vs school-year gain correlations) and Table 5 (ELA): negative values garbled the same way ('20.56', '20.68')."
  - "95% plausible value ranges for summer gains/losses in Tables 3-4, which mix '–' and '2' as the minus sign."
  - "Correlation of .996 (RMSE 2.3 points) between observed and projected fall ELA RIT scores: agreement of the projection with observed scores, not a reliability of the MAP test."
  - "Mean share of score fluctuations occurring in summer, Grades 1-5: 19.4% ELA, 19.3% math (Figure 6)."
  - "SD-to-mean ratios of summer gains (math 0.8 to 2.3; ELA 1.4 to 5.2) and Table 3 ELA rows."
