# Atteberry & McEachin (2021; online 2020): summer learning loss in NWEA MAP
# data, Grades 1-8, 2008-2016.
#
# The key is atteberry-2020 as assigned; the AERJ issue is April 2021, Vol. 58,
# No. 2, pp. 239-282, and the article's front matter carries "(c) 2020 AERA"
# (published online 2020). The DOI on the front matter matches.
#
# Read from a text layer of the publisher PDF (no page images available). The
# layer renders the minus sign in Tables 3-6 and in several prose figures as
# "2" ("2 4.6" for the Grade 3 math summer coefficient, "20.56" for a negative
# correlation, "26.6 to 20.9" for ELA summer losses that the text calls
# negative). Those signed figures are NOT recorded: see not_yet_extracted.
# Every figure below is unsigned in the source (school-year gains, percent of
# gain lost, SEs, student SDs, the positive summer-summer correlations).
#
# Grade 3-5 maths is the slice recorded per grade. The article prints grades,
# never ages, so population.age is `unreported`. It prints no reliability
# coefficient for the MAP scores: it says only that the raw SD of summer gains
# "reflects measurement error" and uses Bayesian (empirical-Bayes) variance
# estimates instead. The .996 correlation between observed and projected fall
# ELA scores is the agreement of two versions of one score, not a reliability
# of the instrument, and is left in not_yet_extracted.

schema_version: 2

study:
  key: atteberry-2020
  citation: "Atteberry, A., & McEachin, A. (2021). School's out: The role of summers in understanding achievement disparities. American Educational Research Journal, 58(2), 239-282. (Published online 2020.)"
  doi: "10.3102/0002831220937285"
  design:
    family: longitudinal
    design_detail: >-
      Secondary analysis of an administrative longitudinal panel of NWEA MAP
      scores (fall and spring each grade). Scores projected linearly to the
      first and last day of school from collected or extrapolated district
      calendars. Two-level random-effects growth model (repeated scores within
      students) with grade-semester dummies, so each L1 coefficient is a
      student's grade-specific school-year gain or summer gain/loss; fully
      unstructured L2 covariance matrix; Bayesian estimation of the variances.
      Balanced panels: Grades 1-5 (all 10 scores) and Grades 5-8 modelled
      separately. Descriptive; no intervention.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: mean-summer-losses-17-28-percent-ela-25-34-percent-math
    bearing: supports
    anchor: atteberry-2021
  - claim: consecutive-summer-losses-accumulate-same-students
    bearing: supports
    anchor: atteberry-2021
  - claim: school-year-gains-diminish-summer-losses-stable
    bearing: supports
    anchor: atteberry-2021

evidence_base:
  unit: participants
  size:
    value: 260037
    unit: participants
  additional_sizes:
    - value: 17955222
      unit: participants
      note: "students in the full NWEA data set (203,234,153 test scores, Grades K-11, 7,685 districts, 2008-2016)"
    - value: 7685
      unit: other
      note: "school districts administering MAP in the full data set"
  population:
    description: >-
      US students in districts using NWEA MAP, restricted to Grades 1-8, to the
      89% who neither repeat nor skip grades, and to balanced panels. Primary
      analytic sample in 2011-12: 12.4% Black, 9.2% Hispanic, 3.4% Asian,
      60.5% White, 50.3% male; school mean FRPL 51%. Not nationally
      representative (fewer Hispanic students, smaller schools than the US
      public-school population).
    age_or_stage: "Grades 1 through 8; no ages printed"
    age: unreported
  context:
    setting: "Low-stakes computer-adaptive formative assessment (MAP) given in fall and spring, scored on the vertical RIT scale; summers of about 3 months between 9-month school years"
  arms:
    - id: grade-3-math
      description: "Balanced Grades 1-5 math panel, Grade 3 school year and the following summer."
    - id: grade-4-math
      description: "Balanced Grades 1-5 math panel, Grade 4 school year and the following summer."
    - id: grade-5-math
      description: "Balanced Grades 1-5 math panel, Grade 5 school year and the following summer."

comparisons:
  - id: whole-sample-math
    kind: none
    description: "Math summer gains/losses across students in the balanced panels; no contrast between groups."
  - id: whole-sample-ela
    kind: none
    description: "ELA summer gains/losses across students in the balanced panels; no contrast between groups."

