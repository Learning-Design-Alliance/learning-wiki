  - id: math-summer-loss-share-range
    comparison_ref: whole-sample-math
    outcome:
      construct: "Summer learning loss relative to the preceding school-year gain"
      source_language: "The average student loses between 25% and 34% of each school-year gain during the following summer"
      measure: "Mean summer coefficient as a percentage of the mean preceding school-year coefficient, NWEA MAP math RIT, projected first/last-day scores"
      scale: "percent of school-year gain lost"
      direction: lower-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "summer after each of Grades 1-7 (about 3 months)"
    result:
      measure_type: other
      estimate_range:
        lower: 25
        upper: 34
        over:
          value: 7
          unit: other
      unit: percent
      note: "Range over the grade-specific summers in Table 4 (after Grades 1-7). ELA: 17% to 28%."
    moderators:
      reported: []
      candidate:
        - "Grade level (the share rises from 28% after Grade 3 to 34% after Grade 5)"
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      `over` counts summers (after Grades 1-7), for which Table 4 prints a
      share lost; the unit is `other` because no count unit names a summer.
    source_quote: "In math, the relative losses are a little larger: The average student loses between 25% and 34% of each school- year gain during the following summer."
    source_location: "Results, RQ1, During Summers (p. 254)"

