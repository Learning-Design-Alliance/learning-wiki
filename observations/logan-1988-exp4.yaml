# Logan (1988), Experiment 4: alphabet arithmetic (verify "A + 2 = C"),
# 80 problems each presented 72 times over 12 sessions.
#
# One of five experiments in a theory paper; Experiments 1-3 are their own
# records (logan-1988-exp1, -exp2, -exp3).
#
# Read from a pdftotext extraction of the published article. Added
# 2026-11-27 from PAGE IMAGES of the PDF (p. 508, Table 3): the fitted
# power-function parameters below (observations named fit-*). Their
# source_quote values are table rows as printed on the page image, not
# text-layer strings; every other quote is from the text layer.
#
# Table 3 prints no 'Constrained fits' / 'Separate fits' headings: its two
# blocks are told apart by their rows, C in the upper block and CRT and CSD in
# the lower, which the table's note defines as the simultaneous and the
# separate exponents. Each fit-* observation's source_location names its block.
#
# WHAT THIS ARTICLE DOES AND DOES NOT PRINT ABOUT THE EXPERIMENT. The procedure
# is given in outline and "Further details of the procedure can be found in
# Logan and Klapp (1988)". The article prints NO number of subjects and no
# description of them beyond "adult subjects". So `evidence_base` counts the
# 80 problems, the one count this article prints, and the number of people is
# left unstated rather than guessed. The power-function fits (Table 3) and the
# two-segment refit of the addend = 5 data are this article's own analyses
# and are recorded where the text states them.
#
# TABLE 3 IS GARBLED IN THE TEXT LAYER: values of its eight columns (true and
# false equations, addends 2-5) interleave there. It reads cleanly on the
# page image, and every column is recorded below as fit-* observations. Its printed caption reads "Alphabet Arithmetic Task of Experiment 5";
# the table belongs to this experiment (the text cites it as Table 3 here).
# Much of the experiment's Results text is two-column and interleaved in the
# text layer, so only clauses that read cleanly are quoted.
#
# Figures from Logan & Klapp (1988) that this article cites (verification slope
# of 400-500 ms per count with a 1,000 ms intercept; the 13th-session transfer
# to the untrained half of the alphabet, slope back to about 400 ms/count) are
# that study's figures and are not recorded here.
#
# WHAT THIS FILE USES:
#   * `population.age: unreported` (no age, and no N, printed).
#   * No reliability, no printed means.

schema_version: 2

study:
  key: logan-1988-exp4
  citation: "Logan, G. D. (1988). Toward an instance theory of automatization. Psychological Review, 95(4), 492–527."
  doi: "10.1037/0033-295x.95.4.492"
  design:
    family: other
    design_detail: >-
      Single-group practice study over 12 sessions with no comparison
      condition: subjects verified true and false alphabet-arithmetic
      equations, each of 80 problems presented 6 times per session (480 trials
      per session). The kind of false equation (true plus one or true minus
      one) varied between subjects. Power functions with a common exponent
      for means and standard deviations were fitted to group data per addend
      and response type.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

evidence_base:
  unit: items
  size:
    value: 80
    unit: items
  additional_sizes:
    - value: 12
      unit: sessions
      note: "training sessions, 480 trials each; each problem presented 6 times per session, 72 times in all"
  population:
    description: >-
      Adult subjects; the article prints neither their number nor how they
      were recruited, and refers to Logan and Klapp (1988) for details.
    age_or_stage: "Adults (\"adult subjects\"); no age figure printed"
    age: unreported
  context:
    setting: "Laboratory practice over 12 sessions; equation verification by keypress"
  arms:
    - id: alphabet-arithmetic-training
      description: "Training on 10 letters from one half of the alphabet (A-J or K-T), each with addends 2, 3, 4 and 5, in true and false equations: 80 problems, each presented 72 times, 6 per session for 12 sessions."
      dose:
        amount: 72
        unit: presentations per problem
        detail: "over 12 sessions of 480 trials"

comparisons:
  - id: presentations-within-subject
    kind: within-subject-baseline
    index_arm: alphabet-arithmetic-training
    description: "Verification reaction time and its standard deviation as a function of the number of presentations of a problem (1 to 72), within subject, by addend and by true or false response."

observations:

  - id: addend5-learning-curve-discontinuity
    comparison_ref: presentations-within-subject
    outcome:
      construct: "Response latency"
      source_language: "a discontinuity appeared in the learning curves at about 24 presentations"
      measure: "Mean verification reaction time for addend = 5 equations, by presentation"
      scale: "milliseconds"
      direction: lower-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "across 72 presentations over 12 sessions"
    result:
      measure_type: qualitative
      finding: >-
        For addend = 5 equations the single power function fitted badly: the
        learning curves showed a discontinuity at about 24 presentations, with
        learning apparently faster after it than before. Many subjects reported
        a strategy shift, deliberately learning the 5s with mnemonics. For
        addends 2, 3 and 4 the power functions fitted reasonably well but
        tended to overestimate the last few presentations.
      perspective: mixed
    moderators:
      reported:
        - variable: "Addend size"
          relationship: "The discontinuity appeared for addend = 5 equations; the deviation from the power function was much worse there than for addends 2, 3 and 4"
          source_quote: "curves at about 24 presentations; learning seems faster after the"
      candidate:
        - "A strategy shift to mnemonics (subjects' self-report), which the author offers as the explanation of the discontinuity"
    observability:
      population_detail: unreported
      implementation_detail: partial
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      The sentence stating the discontinuity is interleaved with the
      neighbouring column in the text layer; the quoted clause is the part
      that reads cleanly. The moderator's quote is the same clause, because
      the clause naming addend = 5 is the interleaved one.
    source_quote: "curves at about 24 presentations; learning seems faster after the"
    source_location: "Experiment 4, Results (p. 507)"

  - id: addend5-two-segment-fit-true
    comparison_ref: presentations-within-subject
    outcome:
      construct: "Fit of power functions to the practice curve"
      source_language: "For true responses, rmsd decreased from 206 ms to 90 ms"
      measure: "Root-mean-squared deviation of power functions fitted to addend = 5 true-equation means and SDs (common exponent): one function over all 72 presentations against separate functions before and after the 24th trial"
      scale: "rmsd, milliseconds"
      direction: lower-is-better
      role: other
      role_basis: ambiguous
      valued_by: []
    time:
      label: "across 72 presentations over 12 sessions"
    result:
      measure_type: other
      estimate: 90
      unit: "ms rmsd, two-segment fit (Trials 1-24 and 25-72)"
      model: "Single constrained power-function fit over all presentations: rmsd 206 ms. Separate constrained power functions before and after the 24th trial: rmsd 90 ms."
      interpretation: "Two learning curves fitted the addend = 5 data much better than one."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: unreported
      implementation_detail: partial
      outcome_timing: observed
      effect_size: unreported
    source_quote: "For true responses, rmsd decreased from 206 ms to 90 ms;"
    source_location: "Experiment 4, Results (p. 508)"

