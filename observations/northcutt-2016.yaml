# Northcutt, Ho & Chuang (2016): "multiple-account" cheating (CAMEO) in 115
# HarvardX and MITx MOOCs, fall 2012 to spring 2015.
#
# WHAT THIS FILE RECORDS:
#
#   * How common CAMEO is, at the three denominators the source prints: 1.3% of
#     certificates in the 69 courses with any CAMEO user (1,237 certificates);
#     1% of the 103,370 unique certificate earners across all 115 courses (657
#     accounts); and 25% of the 73 accounts earning 20 or more certificates.
#     All are lower bounds by design: five conjunctive filters with
#     conservative cutoffs, chosen to concede missed CAMEO users rather than
#     risk false ones, and no ground truth to check them against.
#   * CAMEO rates in STEM courses with and without prevention mechanisms
#     (0.1% against 1.2% for the typical course). Prevention was not assigned:
#     courses that happened to use it are compared with courses that did not.
#   * Median ages of the two groups of certificate earners in the 69 courses
#     (25 for CAMEO users, 32 for others), from Table 2A. The article prints no
#     age figure for the 1.9 million participants as a whole, so
#     `population.age` is `unreported` and the two subgroup medians are
#     observations on their arms.
#
# No reliability or agreement coefficient is printed: the authors say they
# have no "true" knowledge of cheating against which to evaluate the detector.
# Table 2's note says demographics come from edX surveys with response rates
# above 95%.
#
# The shares are written as the source prints them (percent), not rescaled.
#
# READ FROM THE PREPRINT (arXiv:1508.05699, 14 pp.), not the version of record.
# The wiki treats a preprint and its published version as one study, so the
# published article is cited and its DOI recorded; every figure and quote here
# comes from the preprint and may differ from Computers & Education 100, 71-80.
# The preprint prints no DOI; 10.1016/j.compedu.2016.04.008 resolves on
# Crossref to "Detecting and preventing "multiple-account" cheating in massive
# open online courses", Northcutt, Ho, Chuang, Computers & Education 100,
# 71-80, September 2016, matching the preprint's title, authors and year
# window. Table rows quoted below were checked against the page images
# (pp. 13-14), since the text layer reads Table 2's two panels interleaved.
# The curricular-area moderator quote was taken from the page images (pp. 5-6):
# the text layer splits that sentence around a footnote and a page break.

schema_version: 2

study:
  key: northcutt-2016
  citation: "Northcutt, C. G., Ho, A. D., & Chuang, I. L. (2016). Detecting and preventing \"multiple-account\" cheating in massive open online courses. Computers & Education, 100, 71-80."
  doi: "10.1016/j.compedu.2016.04.008"
  design:
    family: observational
    design_detail: >-
      Retrospective analysis of edX clickstream logs. A detection algorithm
      flags candidate harvester / master account pairs within a course by five
      conjunctive filters: a Bayesian criterion that 90% of the "show answer"
      to correct-submission time differences are positive (90% posterior
      probability), a 90th-percentile time difference under 5 minutes, a
      certified master with an uncertified harvester, a shared IP address
      (transitive closure of modal IP and account name across courses), and no
      more than 10 accounts on that IP. Prevalence is then tabulated by course,
      curricular area, demographics and number of certificates; nothing was
      assigned.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

