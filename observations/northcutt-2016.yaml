    outcome:
      construct: "Prevalence of multiple-account cheating"
      source_language: "CAMEO prevalence"
      measure: "Certificates earned by detected CAMEO users as a share of all certificates in the 69 courses with any CAMEO user"
      scale: "percent of certificates"
      direction: lower-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "each course to the analytic cutoff, 2 June 2015"
    result:
      measure_type: other
      estimate: 1.3
      unit: "percent of certificates"
      note: >-
        1,237 certificates, earned by 657 unique users with 674 harvester
        accounts; 1% across all 115 courses, and as many as 5% in some courses.
        A lower bound by the authors' design.
    moderators:
      reported:
        - variable: "Curricular area"
          relationship: "Highest in Government, Health, and Social Science (1.3%), lowest in Computer Science (0.1%)"
          source_quote: "Prevalence of CAMEO users is greatest in the Government, Health, and Social Science category (1.3%) and lowest in the Computer Science category (0.1%)."
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      The denominator (all certificates in the 69 courses) is not printed as
