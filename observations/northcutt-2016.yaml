evidence_base:
  unit: other
  size:
    value: 1893092
    unit: other
  additional_sizes:
    - value: 1067570
      unit: participants
      note: "unique accounts behind the 1,893,092 enrollments (users who clicked into course content at least once)"
    - value: 115
      unit: other
      note: "MOOCs (courses) from Harvard and MIT on edX"
    - value: 155301
      unit: other
      note: "certificates earned"
    - value: 103370
      unit: participants
      note: "unique accounts that earned a certificate"
  population:
    description: >-
      Participants in HarvardX and MITx MOOCs on edX. Among certificate earners
      in the 69 courses with CAMEO users, 33% female and 30% in the USA for
      non-CAMEO earners, 19% and 14% for CAMEO users (Table 2A, from edX
      surveys with response rates above 95%; country from modal IP address).
    age_or_stage: >-
      Adult and mixed-age MOOC participants. No age figure for the whole
      sample; Table 2A prints median ages only for the two groups of
      certificate earners in the 69 courses with CAMEO users, recorded as
      observations on those arms.
    age: unreported
  context:
    setting: >-
      115 open online courses, fall 2012 to spring 2015 (analytic cutoff 2 June
      2015), in four curricular areas. Most instructors allowed a "show answer"
      option after submitting an answer, which is what CAMEO exploits.
  arms:
    - id: cameo-users
      description: "Certificate earners identified as CAMEO users (master accounts) in the 69 courses with nonzero CAMEO users: 1,237 certificates."
    - id: non-cameo-certificate-earners
      description: "Certificate earners not identified as CAMEO users in the same 69 courses: 96,367 certificates."
    - id: earners-20-plus-certificates
      description: "Unique accounts that earned 20 or more certificates across the 115 courses."
    - id: stem-cameo-prevention
      description: "STEM courses that used mechanisms which logically prevent CAMEO (answers withheld until after the due date, or algorithmically generated items with varying solutions) in half or more of their assessment items: 18 courses, 11,717 certificates."
    - id: stem-no-or-limited-prevention
      description: "STEM courses with no or limited CAMEO prevention: 19 courses, 19,383 certificates."

comparisons:
  - id: whole-dataset
    kind: none
    description: "CAMEO prevalence across the course sample; no contrast between groups."

