# Sweller & Cooper (1985), Experiment 5: Year 8 students in matched pairs,
# with acquisition TIME equated: each worked-example student had as long as
# the matched conventional-problem student took for eight problems, then the
# dissimilar test set followed by the similar test set.
#
# One of five experiments; Experiments 2-4 are their own records.
#
# Read from a pdftotext extraction of the JSTOR copy; no PDF beside the text.
# TABLE 10 extracts as two clean rows and is recorded as single-group means.
# Some Results sentences are cropped at the right margin; quotes are the parts
# that survive whole.
#
# Wilcoxon T here is printed with "the number of matched pairs whose members
# received differing scores" in parentheses (the article's own note), so T(7)
# rests on 7 of the 12 pairs. Each observation's `sample` is the 12 pairs and
# its note says so; the count is not altered.
#
# WHAT THIS FILE USES:
#   * `measure_type: mean` for test time on both sets in both groups, from
#     Table 10. No SDs are printed. Error means ride as descriptives on the
#     error contrasts.
#   * `population.age: unreported`: school year and class only.
#   * No reliability.

schema_version: 2

study:
  key: sweller-1985-exp5
  citation: "Sweller, J., & Cooper, G. A. (1985). The use of worked examples as a substitute for problem solving in learning algebra. Cognition and Instruction, 2(1), 59–89."
  doi: "10.1207/s1532690xci0201_3"
  design:
    family: quasi-experimental
    design_detail: >-
      Matched-pairs design: students paired on ability from class tests, then
      one of each pair assigned to each condition (the article does not say
      how). The conventional-problem member was run first, and the
      worked-example member was given the same acquisition time. Dissimilar
      then similar test sets in the same session. Wilcoxon matched-pairs
      signed-ranks tests.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: worked-examples-improve-math-performance
    bearing: supports
    anchor: sweller-cooper-1985

evidence_base:
  unit: participants
  size:
    value: 24
    unit: participants
  additional_sizes:
    - value: 12
      unit: pairs
      note: "matched pairs, one member per condition"
  population:
    description: >-
      Year 8 students from a Sydney high school with eight Year 8 mathematics
      classes: the top eight students from each of the top three classes,
      which the school considered of parallel ability.
    age_or_stage: "Year 8"
    age: unreported
  context:
    setting: "Individual sessions, pencil and paper, a Sydney high school"
  arms:
    - id: worked-example
      description: "Worked-example acquisition (worked examples alternated with problems, four problem categories duplicated with altered variables) for the time the matched conventional student took; a mean of 24.92 problems studied or solved, against 8."
      size:
        value: 12
        unit: participants
    - id: conventional-problem
      description: "The eight acquisition problems of Experiment 4, solved conventionally."
      size:
        value: 12
        unit: participants

comparisons:
  - id: worked-example-vs-conventional-matched
    kind: between-groups
    index_arm: worked-example
    reference_arm: conventional-problem
    description: "Worked-example against conventional-problem member within matched pairs, on the dissimilar then the similar test set."

