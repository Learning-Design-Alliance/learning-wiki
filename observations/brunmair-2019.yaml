      value: 13
      unit: effect-sizes
    comparison_ref: interleaved-vs-blocked-words
    outcome:
      construct: "Category learning with word materials"
      source_language: "words"
      measure: "Final classification tests with word materials (names in conceptual categories, pronunciation rules, translations)"
