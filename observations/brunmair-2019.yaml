        interpretation: "I2 = 76.9% between samples, .0% within; QB = 202.3, p < .001 (text p. 1041 and Table 2)"
      model: "Multilevel random-effects model. Figure 5's RE-model diamond prints 0.34 [0.12, 0.57]."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: partial
      effect_size: observed
      pooled_k: observed
    source_quote: "In nonvisual stimuli, a positive interleaving effect was found only for mathematical tasks, g = 0.34 (p = .005, 95% CI [0.11, 0.57]) and no significant effect for expository texts."
    source_location: "Results, Generalizability across learning materials, p. 1041; Table 2, p. 1043"

  - id: interleaving-words
