  - id: interleaving-overall
    sample:
      value: 238
      unit: effect-sizes
    comparison_ref: interleaved-vs-blocked
    outcome:
      construct: "Inductive category learning"
      source_language: "interleaving effect"
      measure: "Final classification tests of studied (retention) or new (transfer) exemplars, as reported by the primary studies"
      scale: "Hedges' g, interleaved minus blocked"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "as tested in the primary studies; retention interval coded only as under 20 minutes or longer"
    result:
      measure_type: hedges_g
      estimate: 0.42
      ci_lower: 0.34
      ci_upper: 0.50
      interval_type: confidence
      p_value: "< .001"
      k:
        value: 238
        unit: effect-sizes
      heterogeneity:
        statistic: "I2"
        value: 77.3
        unit: percent
        interpretation: "Between samples; tau2 = .20; QB = 1201.1, p < .001; within-sample I2 .0% (Table 2)"
      model: "Multilevel random-effects model. A two-level model on 138 independent effects gave g = 0.43 [0.35, 0.51]; a two-level model ignoring nesting gave g = 0.36 [0.29, 0.42]."
    moderators:
      reported:
        - variable: "Type of learning material"
          relationship: "Effects differ significantly by material (QM = 52.64, p < .001): highest for paintings, positive for visual materials and mathematical tasks, not significant for expository texts, negative for words"
          source_quote: "Generalizability across learning materials. We found significant differences between types of learning materials (k = 238, QM = 52.64, p < .001)."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: partial
      effect_size: observed
      pooled_k: observed
    observability_notes: >-
      The type-of-material moderator quote was taken from the page image
      (p. 1041), where the subscript of QM is printed as a subscript.
    source_quote: "We found a moderate overall positive effect of interleaving (k = 238; g = 0.42; p < .001; 95% confidence interval, CI [0.34, 0.50])."
    source_location: "Results, Effect of interleaving, p. 1040; Table 2, p. 1043"

