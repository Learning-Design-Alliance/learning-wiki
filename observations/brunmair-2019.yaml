# Brunmair & Richter (2019): multilevel meta-analysis of interleaved versus
# blocked presentation in inductive (category) learning, and its moderators.
#
# Read from the publisher PDF. Its text layer renders "=" as a private-use
# glyph and scrambles the tables, so the quotes for the overall, mathematics
# and words estimates and the Table 1 and Table 3 rows were taken from the
# PAGE IMAGES (pp. 1035, 1040, 1041, 1043) in the article's own characters.
# The retention-interval and similarity quotes are clean in the text layer.
#
# WHAT THIS FILE HOLDS, and the discrepancies the article itself contains:
#
#   * Words, g = -0.39: the text prints "p > .001" and Table 2 prints p = .005;
#     the text gives the words I2 as 18.3% and Table 2 as 18.1% (between) and
#     39.7% (within); and Figure 6's RE-model diamond reads -0.39 [-0.62, -0.17]
#     where the text and Table 2 give [-0.64, -0.14]. The record keeps the
#     text and Table 2 interval (they agree) and names the others; it does not
#     choose between them.
#   * Similarity ratings: the text says five raters rated the materials, while
#     the Table 1 note says alpha was "estimated for four raters who rated all
#     71 materials". The record follows the table note for what alpha is
#     computed over.
#   * Moderator coefficients are unstandardised meta-regression weights on
#     Hedges' g, from Table 3; the quantitative predictors were centred.
#
# `population.age` holds the one age figure the article prints about its own
# corpus: a mean of 21.32 years over the 62 samples (97 effect sizes) that
# reported one. That is a mean of sample means over a subset, said so in the
# note; for 141 effect sizes age was not reported. The range 9.5 to 37 years
# is a range of SAMPLE MEANS (after excluding one sample with mean age 77), so
# it is kept in prose and not written as min/max.

schema_version: 2

study:
  key: brunmair-2019
  citation: "Brunmair, M., & Richter, T. (2019). Similarity matters: A meta-analysis of interleaved learning and its moderators. Psychological Bulletin, 145(11), 1029–1052."
  doi: "10.1037/bul0000209"
  design:
    family: meta-analysis
    design_detail: >-
      Multilevel meta-analysis of effect sizes (Hedges' g, blocked vs
      interleaved presentation) nested in samples, with a random-effects model
      for the overall and per-material estimates and three nested multilevel
      mixed-effect meta-regressions for moderators (study and intervention
      characteristics; rated material characteristics; type of learning
      material), plus an outlier model and sensitivity analyses.
  synthesis:
    model: "Multilevel random-effects model (metafor in R); multilevel mixed-effect meta-regression for moderators"
    heterogeneity_statistic: "I2"
    search:
      databases:
        - PsycINFO
        - Google Scholar
        - WorldCat
        - ProQuest
      date_range: "through June 30, 2018"
      records_included: 59
    data_handling:
      - "Between-groups effects converted to Cohen's d and within-group effects to d_av, then corrected to Hedges' g"
      - "Learning materials rated by expert raters on similarity within and between categories, complexity, familiarity and curiosity; curiosity dropped for low interrater reliability"
      - "Twelve outliers from five studies excluded from all models except the sensitivity analysis"
      - "Taste studies and studies that spaced time between item presentations excluded from the moderator analysis"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: interleaving-improves-inductive-learning
    bearing: supports
    anchor: brunmair-richter-2019
  - claim: interleaving-improves-discrimination
    bearing: supports
    anchor: brunmair-richter-2019
  - claim: desirable-difficulties-enhance-learning
    bearing: supports
    anchor: brunmair-richter-2019
  - claim: interleaving-limited-for-math-texts-and-words
    bearing: supports
    anchor: brunmair-2019
  - claim: interleaving-limited-for-math-texts-and-words
    bearing: supports
    anchor: brunmair-2019-2
  - claim: interleaving-null-moderators-retention-test-presentation
    bearing: supports
    anchor: brunmair-2019
  - claim: similarity-and-complexity-moderate-interleaving
    bearing: supports
    anchor: brunmair-2019

evidence_base:
  unit: reports
  size:
    value: 59
    unit: reports
  additional_sizes:
    - value: 238
      unit: effect-sizes
      note: "effect sizes in the meta-analysis"
    - value: 158
      unit: other
      note: "samples in which the 238 effect sizes are nested"
    - value: 8466
      unit: participants
      note: "participants across all included samples"
    - value: 71
      unit: other
      note: "distinct sets of learning materials, each rated for its characteristics"
  population:
    description: >-
      Mostly university student samples (173 effect sizes); also online
      samples, school students in classrooms, one older-adult study and one
      preschool study. Studies published 2003 to 2018.
    age_or_stage: >-
      Mean age reported for 97 effect sizes in 62 samples; not reported for
      141 effect sizes. After excluding one sample with mean age 77 years, the
      sample mean ages ranged from 9.5 to 37 years.
    age:
      unit: years
      mean: 21.32
      note: "Mean over the 62 samples (97 effect sizes) that reported a mean age; a mean of sample means, not of individuals across the corpus"
  context:
    setting: "Inductive category learning tasks: classifying exemplars (paintings, photographs, artificial pictures, mathematical problems, expository texts, words, tastes) after interleaved or blocked study"
  variation:
    - dimension: "Type of learning material (effect sizes)"
      distribution: "paintings 70, naturalistic photographs 19, artificial pictures 63, expository texts 25, mathematical tasks 45, words 13, tastes 3"
    - dimension: "Retention interval"
      distribution: "Dummy-coded short (< 20 min) vs longer; most studies did not report the exact interval"
  arms:
    - id: interleaved
      description: "Exemplars of different categories presented in an interleaved order during study, all materials."
    - id: blocked
      description: "Exemplars of each category presented together in blocks during study, all materials."
    - id: interleaved-maths
      description: "Interleaved practice in studies using mathematical tasks (e.g. volumes of geometric solids, choice of significance test)."
    - id: blocked-maths
      description: "Blocked practice in studies using mathematical tasks."
    - id: interleaved-words
      description: "Interleaved presentation in studies using words: names in conceptual categories, pronunciation rules, or translations."
    - id: blocked-words
      description: "Blocked presentation in studies using words."

comparisons:
  - id: interleaved-vs-blocked
    kind: other
    index_arm: interleaved
    reference_arm: blocked
    description: "Interleaved vs blocked presentation, pooled over between- and within-participant designs and all materials."
  - id: interleaved-vs-blocked-maths
    kind: other
    index_arm: interleaved-maths
    reference_arm: blocked-maths
    description: "Interleaved vs blocked presentation in the mathematical-tasks subset."
  - id: interleaved-vs-blocked-words
    kind: other
    index_arm: interleaved-words
    reference_arm: blocked-words
    description: "Interleaved vs blocked presentation in the words subset."
  - id: material-ratings
    kind: none
    description: "Raters' scores of the 71 learning materials on rated characteristics; no contrast between configurations."

