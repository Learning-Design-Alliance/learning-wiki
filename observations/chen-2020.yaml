      implementation_detail: partial
      outcome_timing: observed
      effect_size: observed
    source_quote: "with a 0.1 increase in misconception strength increasing the odds of answering a posttest item correctly by 4.3% (exp[(−0.899 + 1.322) × 0.1] − 1 = 0.043)."
    source_location: "Results, Item-Level Model; Table 3, M2"

