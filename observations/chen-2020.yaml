      standard_error: 0.224
      p_value: "< 0.001 (FDR-adjusted)"
      model: "Item-level model M2 with knowledge x misconception-strength interactions; no-SMK is the reference, so this is the no-SMK slope."
      interpretation: "The authors: a 0.1 increase in misconception strength reduces the odds of a correct posttest answer by 8.6% in this group."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: partial
      outcome_timing: observed
      effect_size: observed
    source_quote: "The no-SMK group had a negative slope of misconception strength, with a 0.1 increase in misconception strength reducing the odds of answering a posttest item correctly by 8.6% [exp(−0.899 × 0.1) − 1 = −0.086]."
    source_location: "Results, Item-Level Model; Table 3, M2"

  - id: m2-smk-kosm-by-misconception-strength
    comparison_ref: smk-kosm-vs-no-smk
    outcome:
      construct: "Item correctness at posttest, controlling item pretest correctness"
      source_language: "Interaction effects"
      measure: "Difference between the SMK and KOSM condition's slope of misconception strength and the no-SMK slope"
      scale: "log-odds interaction coefficient"
      direction: contextual
      role: proximal-outcome
      role_basis: inferred
