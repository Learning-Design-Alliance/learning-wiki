    result:
      measure_type: regression_coefficient
      estimate: 1.322
      standard_error: 0.233
      p_value: "< 0.001 (FDR-adjusted)"
      model: "Item-level model M2. The SMK-only x MS interaction was 0.525 (SE 0.239)."
      interpretation: "With the interaction the SMK and KOSM group is the only one with a positive slope: the authors compute a 4.3% rise in the odds of a correct answer per 0.1 of misconception strength."
    moderators:
