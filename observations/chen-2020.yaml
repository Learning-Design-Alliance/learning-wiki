      students of 187 teachers) used to select the items.
    source_quote: "Cronbach alpha = 0.88), a range of difficulty (from 0.25 to 0.84, mean of 0.56), high discrimination, low gender bias, and a range of misconception strength"
    source_location: "Data and Methods, Pre- and Posttest Development"

