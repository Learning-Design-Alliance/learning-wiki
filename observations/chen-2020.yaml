      standard_error: 0.011
      p_value: "< 0.001"
      model: >-
        Aggregate-level multilevel linear model (students clustered in teachers)
        with a strong/weak misconception-strength dummy, its interaction with
        the teacher category, and gender, age, race/ethnicity and parental
        education. Main effect of the category; SMK-only vs no-SMK was 0.039
        (SE 0.016). Teachers with KOSM above but SMK below threshold were
        excluded.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: partial
      outcome_timing: observed
      effect_size: observed
    observability_notes: "The thresholds that define the categories, and the analysed n after the exclusion, are not printed in the text read."
    source_quote: "Teacher correct rate category SMK+KOSM vs. no-SMK 0.048 0.011 *** SMK-only vs. no-SMK 0.039 0.016 *"
    source_location: "Table 2"

  - id: test-internal-consistency
    comparison_ref: whole-sample
