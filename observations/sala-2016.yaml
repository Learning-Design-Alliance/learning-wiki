      role_basis: inferred
      valued_by: []
    time:
      label: "post-test after the chess programme, as measured in the primary studies"
    result:
      measure_type: hedges_g
      estimate: 0.303
      ci_lower: 0.189
      ci_upper: 0.417
      interval_type: confidence
      p_value: "< .001"
      k:
        value: 12
        unit: effect-sizes
      model: "random-effects"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: unreported
      effect_size: observed
      pooled_k: observed
    source_quote: "while the overall effect size in studies with less than 25 h of training was g = 0.303, 95% CI [0.189; 0.417], p < .001, K = 12."
    source_location: "Section 4.1, Moderator analyses, p. 53"

