# Kitchener, Lynch, Fischer & Wood (1993): reflective judgment measured with
# and without contextual support, in 156 students aged 14 to 28.
#
# The support contrast is WITHIN the same people. The 104 students of the
# experimental condition answered the Reflective Judgment Interview (RJI, no
# support: functional level) and then the Prototypic Reflective Judgment
# Interview (PRJI, high support: optimal level) in one session, and both again
# about two weeks later after written practice material. 52 further students
# took only the RJI twice (test-retest control). The article does not say how
# students were allocated to the two conditions, so no assignment is claimed;
# the design family is `other`.
#
# What is recorded:
#   * the measure (support) effect, F(1, 363) = 59.99, PRJI above RJI mean;
#   * the same contrast against the RJI scored for its highest stage, which
#     did not differ from the PRJI, F(1, 363) = 0.02;
#   * the two mean differences the authors print themselves (RJI Time 1 to
#     PRJI Time 2: 0.61 for ages 14-18, 1.02 for ages 23-28);
#   * the Time 1 means and SDs of the RJI and the PRJI for each of the three
#     age groups (Table 2), which is the same-session with/without-support
#     contrast. The article prints no standardised effect size and no
#     correlation between the two measures within groups, so no paired d is
#     recorded or derivable here;
#   * the reliability figures printed for THIS sample: RJI rater agreement 78%
#     and interrater reliability .78, PRJI agreement 85%, PRJI split-half .85,
#     RJI test-retest r = .87 in the control group. The RJI reliabilities from
#     earlier studies (Sakalys 1982; Welfel 1982; Kitchener & King 1981) are
#     other samples' figures and are listed in not_yet_extracted.
#
# Age: the article prints the range (14-28) and the design (12 students at each
# age from 14 to 24, twelve aged 25-26 and twelve aged 27-28), no mean or SD.
#
# Read from the publisher PDF (a scan with an OCR text layer). The text layer
# escapes characters ("p \< .001"), misreads digits ("F(l, 363)", "F(\\, 363)")
# and scrambles Table 2. The source_quote of `support-measure-effect`,
# `rji-highest-stage-vs-prji`, the two mean differences and every Table 2 mean
# was therefore copied from the page images (pp. 897-898), in the article's
# own characters; Table 2 row quotes are the row as printed on the page.
#
# DOI: the article (1993) prints none. 10.1037/0012-1649.29.5.893 matches its
# journal, volume, issue and pages, and Crossref's record for it gives this
# title and these four authors.

schema_version: 2

study:
  key: kitchener-1993
  citation: "Kitchener, K. S., Lynch, C. L., Fischer, K. W., & Wood, P. K. (1993). Developmental range of reflective judgment: The effect of contextual support and practice on developmental stage. Developmental Psychology, 29(5), 893–906."
  doi: "10.1037/0012-1649.29.5.893"
  design:
    family: other
    design_detail: >-
      Cross-sectional age design (ages 14-28) with repeated measures. In the
      experimental condition the same students took a low-support interview
      (RJI) and then a high-support interview (PRJI) in one 2-hr session, were
      given practice material, and took both again about 2 weeks later
      (Age x Measure x Time general linear models). A test-retest control
      group took only the RJI at both sessions. Allocation of students to the
      two conditions is not described, and no randomisation is stated.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

