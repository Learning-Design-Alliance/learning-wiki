    - value: 52
      unit: participants
      note: "test-retest control condition, 4 per age group, RJI only"
  population:
    description: >-
      Volunteers from local middle and high schools (drawn from the upper
      third of their class on standardised achievement tests) and
      undergraduate and graduate volunteers at a private university
      (undergraduates from the upper half of the University of Denver on
      college entrance scores). Six female and six male students at each age.
    age_or_stage: "14 to 28 years: twelve at each age from 14 to 24, twelve aged 25-26 and twelve aged 27-28"
    age:
      unit: years
      min: 14
      max: 28
  context:
    setting: "Individual interviews (five trained interviewers) over one year; two sessions about 2 weeks apart, each with the same interviewer"
  arms:
    - id: rji-ages-14-18
      description: "Experimental condition, ages 14-18 (Group 1): the Reflective Judgment Interview, two ill-structured problems (chemical additives, pyramids) answered without support; scored as mean stage."
      size: {value: 40, unit: participants}
    - id: prji-ages-14-18
      description: "Experimental condition, ages 14-18 (Group 1): the Prototypic Reflective Judgment Interview, the same two problems with prototypic stage statements (Stages 2-7) to read, discuss and summarise, memory prompts and a question list; scored as highest stage hit."
      size: {value: 40, unit: participants}
      elements:
        - term: "contextual support (prototypic statements, memory prompts, guiding questions)"
    - id: rji-ages-19-22
      description: "Experimental condition, ages 19-22 (Group 2): the RJI without support, scored as mean stage."
      size: {value: 32, unit: participants}
    - id: prji-ages-19-22
      description: "Experimental condition, ages 19-22 (Group 2): the PRJI with contextual support."
      size: {value: 32, unit: participants}
      elements:
        - term: "contextual support (prototypic statements, memory prompts, guiding questions)"
    - id: rji-ages-23-28
      description: "Experimental condition, ages 23-28 (Group 3): the RJI without support, scored as mean stage."
      size: {value: 32, unit: participants}
    - id: prji-ages-23-28
      description: "Experimental condition, ages 23-28 (Group 3): the PRJI with contextual support."
      size: {value: 32, unit: participants}
      elements:
        - term: "contextual support (prototypic statements, memory prompts, guiding questions)"
    - id: rji-highest-stage-experimental
      description: "Experimental condition, all ages: the same RJI responses scored for the highest stage represented at least twice among the two raters' six digits."
      size: {value: 104, unit: participants}
    - id: rji-test-retest-control
      description: "Test-retest control condition: the 1-hr RJI only, at both sessions, with no practice material or instructions."
      size: {value: 52, unit: participants}

