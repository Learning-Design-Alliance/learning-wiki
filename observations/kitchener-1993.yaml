    comparison_ref: prji-vs-rji-mean
    outcome:
      construct: "Reflective judgment stage"
      source_language: "PRJI scores higher than RJI mean scores"
      measure: "Reflective judgment stage (1-7) on two ill-structured problems; RJI mean stage against PRJI highest stage hit"
      scale: "reflective judgment stage"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "Time 1 and Time 2, about 2 weeks apart"
    result:
      measure_type: other
      statistic: "F(1, 363) = 59.99"
      p_value: "< .001"
      model: >-
        Age (13 groups, 25-26 and 27-28 combined) x Measure x Time general
        linear model on the experimental group; overall F(51, 363) = 9.14,
        R2 = .56. Time effect F(1, 363) = 13.12; age effect F(12, 363) =
        30.93. No Age x Measure or Age x Time x Measure interaction was
        significant.
      interpretation: "Scores were higher with high support (PRJI) than without (RJI mean)"
    moderators:
      reported: []
      candidate:
        - "Age group: the RJI Time 1 to PRJI Time 2 difference was 0.61 at ages 14-18 and 1.02 at ages 23-28, but no interaction involving age was significant; the authors attribute this to heteroscedasticity reducing power."
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      No standardised effect size is printed for the measure effect. The
