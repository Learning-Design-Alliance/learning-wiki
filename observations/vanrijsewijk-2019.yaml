# van Rijsewijk, Snijders, Dijkstra, Steglich & Veenstra (2019 online, 2020
# issue): friendship and help networks of Dutch seventh-grade classrooms over
# one school year, and how each shapes the other (SNARE, Bayesian RSiena).
#
# Read from the PubMed Central full text (PMC7064895, Wiley Open Access, CC
# BY-NC 4.0), converted from JATS XML to text. There is no PDF and no page
# image. Tables 2-5 come through the conversion one cell per line with clean
# numbers, so their rows are quoted as a run of cells (row label, then the
# values in column order, whitespace normalised). Table 1 is graphical (arrow
# diagrams per parameter) and could not be read; nothing is taken from it.
#
# The key says 2019 because the article was first published online on 10 April
# 2019; the issue is Journal of Research on Adolescence 30(1), March 2020,
# which the citation gives.
#
# WHAT THIS RECORD HOLDS:
#
#   * Table 2's help- and friendship-network descriptives per wave, averaged
#     over classrooms: help density, help and friendship reciprocity, helpers
#     named (outdegree), and the wave-to-wave stability of help ties (Jaccard
#     index). Each prints one value per wave, so each is held as a range over
#     waves (or periods), never as an invented midpoint; the per-wave values
#     are in `descriptives`.
#   * The three RSiena multiplex parameters behind the claim pages: mutual
#     versus one-sided help on friendship maintenance, and one-sided and
#     mutual friendship on help. These are the article's own fitted estimates
#     (posterior means of fixed log-odds parameters), recorded as printed. The
#     printed SD is a posterior standard deviation and the printed p is a
#     posterior probability that the parameter exceeds zero; neither is
#     written into standard_error or a frequentist p-value field.
#   * `population.age` with the wave-1 mean the text prints (12.7).
#
# No reliability or agreement coefficient is printed for the nominations. The
# Jaccard index is the share of ties stable between waves (change plus any
# measurement error), not a reliability coefficient, so it is recorded as
# `other`, not `reliability`.
#
# The help question covers any kind of help (homework, a flat bicycle tyre,
# feeling down) by design: the authors chose the broad wording to capture the
# general tendency to help.

schema_version: 2

study:
  key: vanrijsewijk-2019
  citation: "van Rijsewijk, L. G. M., Snijders, T. A. B., Dijkstra, J. K., Steglich, C., & Veenstra, R. (2020). The interplay between adolescents' friendships and the exchange of help: A longitudinal multiplex social network study. Journal of Research on Adolescence, 30(1), 63-77. First published online 10 April 2019."
  doi: "10.1111/jora.12501"
  design:
    family: longitudinal
    design_detail: >-
      Three-wave longitudinal social network study within one school year
      (October, December, April; 2011-2012) of all seventh-grade classrooms of
      two Dutch secondary schools in SNARE. Unlimited within-classroom
      nominations to "who are your best friends" and "who helps you with
      problems". Descriptive network statistics, configuration tables of
      friendship-by-help at one wave against the next, and a Bayesian
      random-effects multiplex stochastic actor-based model (RSienaTest
      1.2.5) of the co-evolution of the two networks, with hypothesis
      parameters fixed across classrooms and control parameters varying
      between them. Observational: no condition was assigned.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: friendship-help-networks-partial-overlap
    bearing: supports
    anchor: van-rijsewijk-2019
  - claim: mutual-help-friendship-maintenance
    bearing: supports
    anchor: van-rijsewijk-2019
  - claim: friendship-context-for-help
    bearing: supports
    anchor: van-rijsewijk-2019
  - claim: friendship-context-for-help
