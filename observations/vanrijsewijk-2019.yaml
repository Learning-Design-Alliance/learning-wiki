      source_language: "% Density"
      measure: "Help nominations present relative to possible nominations in the classroom, per classroom, averaged over classrooms"
      scale: "percent of possible help relations"
      direction: contextual
      role: other
      role_basis: ambiguous
      valued_by: []
    time:
      label: "each of Waves 1-3 (October, December, April of one school year)"
    result:
      measure_type: other
      estimate_range:
        lower: 11.8
        upper: 12.1
        over:
          value: 3
          unit: other
      unit: "percent of possible help relations, classroom average"
      descriptives: "Table 2 help network: 11.8 (W1), 12.1 (W2), 11.9 (W3). Friendship network density in the same classrooms: 24.8, 26.0, 26.0. Help ties summed over classrooms 2,664, 2,751, 2,627."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      The range is over the three waves (the `over` unit is `other` because
      the count vocabulary has no unit for measurement waves). The row's first
      three values are the friendship network, the last three the help
      network.
    source_quote: "% Density 24.8 26.0 26.0 11.8 12.1 11.9"
    source_location: "Results, Descriptive Results; Table 2"

