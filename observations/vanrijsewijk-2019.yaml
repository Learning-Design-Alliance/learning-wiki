  - id: mutual-help-friendship-maintenance
    comparison_ref: rsiena-multiplex-model
    outcome:
      construct: "Maintenance of a friendship nomination"
      source_language: "friendship maintenance"
      measure: "RSiena maintenance-function parameter 4: effect of mutual versus one-sided help on keeping an existing best-friend nomination"
      scale: "log-odds contribution to the actor's objective function"
      direction: contextual
      role: other
      role_basis: ambiguous
      valued_by: []
    time:
      label: "network change from Wave 1 to Wave 2 and Wave 2 to Wave 3"
    result:
      measure_type: regression_coefficient
      estimate: 1.14
      p_value: "posterior probability that the parameter is > 0: > .99"
      model: >-
        Bayesian random-effects multiplex stochastic actor-based model, 41
        classrooms, 953 students; hypothesis parameters fixed across
        classrooms. Posterior SD .22; odds 3.13. One-sided help versus no help
        on maintenance (parameter 2) 0.92 (SD .14); mutual versus no help
        (parameters 2+4) 2.05 (SD .18).
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      A posterior mean of a fitted model parameter, which the authors report
      as a finding. The authors caution that its odds reading assumes all else
      equal, which is strong because parameters correlate.
    source_quote: "In line with our first hypothesis, there was a positive effect of mutual versus one‐sided help on friendship maintenance (parameter 4; η = 1.14, SD  = .22, p  = > .99)."
    source_location: "Results, RSiena Results, Multiplex network parameters; Table 5 parameter 4"

