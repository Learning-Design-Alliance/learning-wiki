evidence_base:
  unit: participants
  size:
    value: 953
    unit: participants
  additional_sizes:
    - value: 41
      unit: classes
      note: "seventh-grade classrooms analysed (mean size 23.2 at wave 1); nominations only within the classroom"
    - value: 51
      unit: classes
      note: "classrooms initially in the sample; 10 were excluded from the analyses because their rate parameters were very large and the model could not converge"
    - value: 2
      unit: schools
      note: "large regional secondary schools, one in the north and one in the middle of the Netherlands"
  population:
    description: >-
      Seventh-grade students (first year of secondary education) of two Dutch
      secondary schools, part of SNARE; at wave 1, 50.5% boys and 84.5% Dutch.
      Sample sizes 953, 956 and 960 at the three waves; 11 students refused
      consent across the year. Outgoing nominations of students who named
      (almost) everyone at one wave but hardly anyone at the next were
      recoded as missing (1, 13 and 8 students by wave).
    age_or_stage: "Seventh grade, first year of secondary education"
    age:
      unit: years
      mean: 12.7
      note: "Wave 1 mean as printed in the text and abstract. Table 2 gives wave means of 12.66, 12.82 and 13.16."
  context:
    setting: "Classroom computer questionnaire during regular school hours, about 45 minutes, with a teacher and research assistant present; passive (opt-out) consent; waves in October (six weeks into the school year), December and April"
  arms:
    - id: seventh-grade-classrooms
      description: "All 41 analysed seventh-grade classrooms and their students, as one group; Table 2's network descriptives are computed per classroom and averaged over them (tie counts summed)."

comparisons:
  - id: rsiena-multiplex-model
    kind: none
    description: "Fixed parameters of the Bayesian random-effects multiplex RSiena model of friendship and help; each parameter is a tendency within the networks of all 41 classrooms, not a contrast between groups of students."

