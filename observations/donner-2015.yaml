evidence_base:
  unit: participants
  size:
    value: 22460
    unit: participants
  additional_sizes:
    - value: 25280
      unit: other
      note: "individual learning curves of 500 scores each (one curve per participant per task); the unit most analyses are over"
    - value: 13933
      unit: participants
      note: "participants who provided gender, education level, country and age; the demographic analyses rest on these"
  population:
    description: >-
      Registered users of Lumosity worldwide with at least 500 completions of a
      task. Of the 13,933 who gave demographics, 73.6% female, 57.8% gave an
      academic degree, over 65% gave the USA as their country. 91.4% of
      participants contributed a curve for one task only.
    age_or_stage: "Adults; ages between 18 and 80 among those who reported demographics"
    age:
      unit: years
      min: 18
      max: 80
      mean: 50.92
      note: "Among the 13,933 participants who provided demographics. Printed as 50.92 ± 12.94 years overall (females 52.2 ± 12.36, males 47.32 ± 13.8), without saying what the ± figure is; it is not recorded as an SD. The range may be a reporting bound rather than the observed extremes."
  context:
    setting: "Self-directed online cognitive-training games outside any course; scores are correct answers in 45 s (one-back, two-back, flanker) or words generated in 60 s (verbal fluency)"
  arms: []

comparisons:
  - id: whole-sample
    kind: none
    description: "Model fits and fitted-transition properties over all 25,280 curves, and regressions over the participants with demographics; no contrast between configurations."

observations:

