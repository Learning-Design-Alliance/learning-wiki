    comparison_ref: whole-sample
    outcome:
      construct: "Immediate performance change at a fitted strategy transition"
      source_language: "Immediately posttransition, performance dropped"
      measure: "Whether the fitted post-transition power-law piece started below the pre-transition piece at the transition point, over every fitted transition"
      scale: "percent of fitted transitions"
      direction: contextual
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "at the transition point, within the first 500 completions of a task"
    result:
      measure_type: probability
      estimate: 78
      unit: "percent of fitted transitions followed by an immediate drop"
      interpretation: "No interval and no per-task value printed; the number of transitions is not printed"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      A share of fitted breakpoints, so it depends on the fitting and model
      selection procedure. The authors' averaged transition curves (Fig. 2a)
      subtract a shuffled-piece control; the article does not say whether the
      78% is computed against such a control.
    source_quote: "Immediately posttransition, performance dropped in 78 % of the transitions, but within 50 exercises, the posttransition PL exceeded the pretransition PL in over 80 % of the transitions."
    source_location: "Results, Properties of transitions, p. 1313; Fig. 2b"

  - id: surpass-within-50-share
