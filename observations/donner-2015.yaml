# Donner & Hardy (2015): piecewise power laws in 25,280 individual learning
# curves from four Lumosity tasks.
#
# Read from a text layer of the open-access published article (Psychonomic
# Bulletin & Review 22:1308-1319), whose front matter prints the DOI
# 10.3758/s13423-015-0811-x. Parts of the text layer have scrambled spacing
# ("n =2 5 , 2 8 0l e a r n i n g curves", "R2 >. 9 9f o ra l l tasks",
# "R2 =. 0 7 2"); no page image was available, so no figure is taken from a
# scrambled passage. The sample counts are taken from the abstract and the
# data-processing paragraph, which print them cleanly.
#
# What the record holds and what it does not:
#
#   * The authors' own fitted results are recorded as printed: the share of
#     fitted transitions followed by a drop, the share in which the
#     post-transition piece overtook the pre-transition one within 50
#     exercises (printed only as "over 80 %", so a bound), the variance
#     explained by the piecewise and single power-law models, and the age
#     coefficients in the regression on the number of transitions.
#   * Transitions are breakpoints of a fitted piecewise power law, chosen by
#     the authors' strict pairwise AICc procedure; they are not observed
#     strategy reports. Every observation about transitions is about fitted
#     breakpoints.
#   * `population.age` holds the figures the article prints for the 13,933
#     participants who gave demographics: an age range of 18-80 and a mean of
#     50.92. The article writes "50.92 ± 12.94 years" without saying whether
#     12.94 is an SD, so it is not recorded as one.
#   * No reliability coefficient is printed for the task scores. The authors
#     estimate measurement-noise variance instead (sigma squared = 0.096, estimated
#     from the real data), which is not a reliability coefficient and is not
#     recorded as one.
#   * Scores are rank-based inverse-normal transformed within task, so every
#     figure is on that transformed scale.

schema_version: 2

study:
  key: donner-2015
  citation: "Donner, Y., & Hardy, J. L. (2015). Piecewise power laws in individual learning curves. Psychonomic Bulletin & Review, 22, 1308–1319."
  doi: "10.3758/s13423-015-0811-x"
  design:
    family: observational
    design_detail: >-
      Secondary analysis of learning curves logged by the online
      cognitive-training program Lumosity on four tasks (one-back speed of
      processing, two-back memory updating, Eriksen flanker, verbal fluency).
      The first 500 scores of every curve with at least 500 completions were
      rank-normalised within task, cleaned of low-score outliers, and fitted
      with a single four-parameter power law and with piecewise power laws of
      up to ten pieces (windows of 50 or more scores); the number of pieces was
      chosen by AICc followed by a strict pairwise criterion (spAICc), selected
      in a simulation study. Transition properties were computed against
      position-matched windows and a shuffled-piece control; linear regressions
      related demographics and curve properties to the number of transitions.
      No condition was assigned.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

