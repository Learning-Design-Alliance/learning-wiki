      estimate: -0.009
      standard_error: 0.0008
      statistic: "t = −10.756"
      p_value: "< 10^-15"
      model: >-
        Linear regression of the number of transitions (Table 6), with
        absolute performance and improvement (or the decorrelated skill and
        growth components) as controls, education level, gender, and age
        entered separately for females and males. Unstandardised. The
        coefficient for males is -0.012 (SE 0.0012).
      interpretation: "Fewer transitions with age after accounting for absolute score and improvement"
    moderators:
