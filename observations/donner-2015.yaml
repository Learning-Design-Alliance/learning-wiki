    outcome:
      construct: "Post-transition piece overtaking the pre-transition piece"
      source_language: "the posttransition PL exceeded the pretransition PL"
      measure: "For each fitted transition, the number of exercises it would take the post-transition power law to exceed the pre-transition power law; share doing so within 50 exercises"
      scale: "percent of fitted transitions"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "within 50 exercises after the transition"
      offset:
        value: 50
        unit: sessions
        from: "the transition point; one session is one exercise completion"
    result:
      measure_type: probability
      bound:
        operator: ">"
        value: 80
      unit: "percent of fitted transitions"
      interpretation: "Printed only as 'over 80 %'; a comparison of fitted curves (the post-transition fit against the pre-transition fit extrapolated), not of raw scores"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "Immediately posttransition, performance dropped in 78 % of the transitions, but within 50 exercises, the posttransition PL exceeded the pretransition PL in over 80 % of the transitions."
    source_location: "Results, Properties of transitions, p. 1313; Fig. 2b"

  - id: variance-explained-ppl
    sample:
      value: 25280
      unit: other
    comparison_ref: whole-sample
    outcome:
      construct: "Fit of a piecewise power law to individual learning curves"
      source_language: "noise-subtracted variance ... explained"
      measure: "Variance of the rank-normalised scores explained by the four-parameter piecewise power law, after a degrees-of-freedom correction and subtraction of the estimated measurement noise, all tasks"
      scale: "percent of noise-subtracted variance"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "first 500 completions of each curve"
    result:
      measure_type: other
      estimate: 90.74
      unit: "percent of noise-subtracted variance explained"
      statistic: "likelihood-ratio test of PPL against a single power law, all tasks: chi-square(94205) = 534,030"
      p_value: "ps < 10^-7000 for all tests after Bonferroni correction"
      model: >-
        Four-parameter piecewise power law, up to ten pieces per curve, pieces
        chosen by spAICc. By task (Table 4): two-back 93.75, one-back 71.66,
        flanker 88.93, verbal fluency 94.97. Three-parameter PPL 90.57;
        three-parameter piecewise exponential 90.43. PPL explained 33.99% of
        the variance remaining after the single power law.
      interpretation: "The authors' fitted result; the comparison figures are the single power law (85.97) and an autoregressive model (33.88)"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "The PPL model explained 90.74 % of the learning variance (overall variance minus noise; see the Method), as compared to 85.97 % for PL1, and accounted for over one-third of the variance remaining in PL1."
    source_location: "Discussion, p. 1316; Results, Piecewise power laws, p. 1312; Table 4, All row"

  - id: variance-explained-single-pl
    sample:
      value: 25280
      unit: other
    comparison_ref: whole-sample
    outcome:
      construct: "Fit of a single power law to individual learning curves"
      source_language: "noise-subtracted variance ... explained"
      measure: "Variance of the rank-normalised scores explained by one four-parameter power law per curve, after a degrees-of-freedom correction and subtraction of the estimated measurement noise, all tasks"
      scale: "percent of noise-subtracted variance"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "first 500 completions of each curve"
    result:
      measure_type: other
      estimate: 85.97
      unit: "percent of noise-subtracted variance explained"
      model: >-
        Single four-parameter power law f(t) = u - a(t + d)^c. By task
        (Table 4): two-back 88.79, one-back 63.49, flanker 83.49, verbal
        fluency 91.16. The Results text rounds the overall figure to 86%.
        The autoregressive model explained 33.88 (33.9 in the text).
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "All 33.88 85.97 90.74 78.78 33.99"
    source_location: "Table 4, All row (columns AR, PL1, PPL, ΔPL1, ΔPPL), p. 1314"

