    - value: 1
      unit: other
      note: "synthetic dataset (Synthetic-5): 2000 simulated students answering 50 exercises from five hidden concepts, in both training and testing sets"
  population:
    description: >-
      Three real datasets of student responses: ASSISTments2009 and
      ASSISTments2015 from the ASSISTments online tutoring platform
      (mathematics), and Statics2011 from a college-level engineering statics
      course. Records without skill names were discarded from ASSISTments2009
      and records with correctness outside {0, 1} from ASSISTments2015.
    age_or_stage: "Statics2011 is a college-level course; no age or grade is stated for any dataset."
    age: unreported
  context:
    setting: "Offline prediction of the correctness of the next answer from logged exercise sequences, padded to length 200"
  arms:
    - id: dkvmn
      description: "DKVMN: static key memory of N latent concepts and a dynamic value memory of concept states, read and written through the exercise's correlation weight over the keys."
    - id: dkt
      description: "DKT as implemented by the authors: an LSTM, with norm clipping and early stopping."
    - id: mann
      description: "A standard memory-augmented neural network with a single memory matrix, cosine-similarity reading attention and LRUA writing attention."

