# Zhang, Shi, King & Yeung (2017): Dynamic Key-Value Memory Networks (DKVMN)
# for knowledge tracing.
#
# A model paper, not an experiment with learners in conditions. Its own printed
# figures are the test AUCs of DKVMN, DKT (the authors' own LSTM
# implementation) and a MANN baseline on four datasets (Table 1), the
# DKT-versus-DKVMN comparison over state dimensions and parameter counts
# (Table 2), and the adjusted mutual information of DKVMN's concept clustering
# on the synthetic dataset. The arms are model configurations, not groups of
# people.
#
# Read from the publisher's text layer (WWW 2017 proceedings, pp. 765-774),
# whose front matter gives the DOI recorded here. No PDF was supplied. Table 1
# prints its DKT/MANN pairs and the DKVMN column cleanly but its BKT+ column
# incompletely, and Table 2 comes out cell by cell; every AUC below is quoted
# from the Section 4.3 prose, which states each one, and the SDs from the
# Table 1 DKVMN column, which reads cleanly in dataset order.
#
# BKT and BKT+ AUCs in the paper are taken from earlier papers ([11], [32]),
# not computed here, so they are not this study's figures and are not recorded.
# Synthetic-5 is simulated students: only its concept-discovery result is
# recorded, marked as such, because it is the one test with a ground truth.
#
# No age, no reliability, no single-group mean: the article prints no age for
# any dataset (Statics2011 is described only as a college-level course), no
# reliability or agreement coefficient, and no group mean.

schema_version: 2

study:
  key: zhang-2017
  citation: "Zhang, J., Shi, X., King, I., & Yeung, D.-Y. (2017). Dynamic key-value memory networks for knowledge tracing. In Proceedings of the 26th International Conference on World Wide Web (WWW 2017) (pp. 765–774). International World Wide Web Conferences Steering Committee."
  doi: "10.1145/3038912.3052580"
  design:
    family: other
    design_detail: >-
      Computational benchmark. DKVMN keeps a static key matrix of latent
      concepts and a dynamic value matrix of concept states; each exercise
      attends over the keys (correlation weight w_t, a softmax), the model
      reads a weighted sum of value slots to predict correctness, and after
      the response writes to every slot by an erase-then-add step weighted by
      w_t. It is compared with an LSTM DKT, a standard MANN and published BKT
      results on one synthetic and three real datasets. 30% of sequences held
      out as test (synthetic: equal train and test), 20% of training split for
      validation and early stopping, hyperparameters by five-fold cross
      validation, each training repeated five times with different
      initialisations. No conditions were assigned to learners.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

