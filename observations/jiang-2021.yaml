# Jiang & Zhang (2021): perceived teaching style, approach goals and agentic
# engagement among Chinese university EFL learners.
#
# WHAT THIS RECORD HOLDS: from Table 1, the zero-order correlations of agentic
# engagement with perceived autonomy support, mastery-approach goals and
# performance-approach goals; from the structural model (text, Figure 2), the
# standardised paths from the same three variables to agentic engagement; and
# the authors' own Cronbach's alphas for those four scales. All self-report,
# one cross-sectional online questionnaire.
#
# Two things in the source are recorded as printed and not repaired:
#   * The path from social relatedness to agentic engagement is printed as
#     "β = 17, p = 0.187". It is not recorded here (a value of 17 is not a
#     standardised coefficient, and restoring it would be a guess).
#   * Table 1 prints the social relatedness-controlling correlation as "0.4"
#     with no significance mark, beside 0.24** and 0.26**. Not recorded.
#
# Autonomy support's path to mastery-approach goals is negative (beta -.32)
# while their zero-order r is positive (.23): the authors note the sign is
# "a bit beyond expectation". The model also enters social relatedness, which
# Table 1 correlates with autonomy support at .67.
#
# Read from a pdftotext text layer of the publisher's open-access article;
# the PDF itself was not available to view. Figure 2 is an image and did not survive; every path
# coefficient below is quoted from the Results text, which gives them all.

schema_version: 2

study:
  key: jiang-2021
  citation: "Jiang, A. L., & Zhang, L. J. (2021). University teachers' teaching style and their students' agentic engagement in EFL learning in China: A self-determination theory and achievement goal theory integrated perspective. Frontiers in Psychology, 12, 704269."
  doi: "10.3389/fpsyg.2021.704269"
  design:
    family: observational
    design_detail: >-
      Cross-sectional online questionnaire (Wenjuanxing), distributed through
      nine university EFL teachers mid winter semester 2020. Descriptive
      statistics and bivariate correlations in SPSS 22; confirmatory factor
      analysis and a structural equation model (AMOS 23) with perceived
      autonomy support, social relatedness and controlling predicting
      mastery-approach and performance-approach goals and agentic engagement;
      mediation tested by bootstrapping. All measures self-report.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

