      note: "university EFL teachers who distributed the questionnaire; not a unit of sampling or analysis"
  population:
    description: >-
      632 undergraduate non-English majors in mainland China (71.5% female,
      28.5% male), admitted after the Gaokao and attending an English course
      for at least half a semester; 73% at national and 27% at provincial
      universities; 86% in northern China, 14% in eastern and southern China.
    age_or_stage: "Undergraduates, 77% Year 1 and 22% Year 2. No age figure is printed."
    age: unreported
  context:
    setting: "University English-as-a-foreign-language courses in mainland China; questionnaire completed online, voluntary and anonymous"
  arms: []

