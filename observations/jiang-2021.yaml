  - id: beta-autonomy-support-to-agentic-engagement
    sample:
      value: 632
      unit: participants
    comparison_ref: whole-sample
    outcome:
      construct: "Agentic engagement"
      source_language: "agentic engagement"
      measure: "Latent agentic engagement factor in the structural model, regressed on perceived autonomy support, social relatedness and controlling and on mastery- and performance-approach goals"
      scale: "standardised path coefficient"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "mid winter semester 2020, cross-sectional"
    result:
      measure_type: regression_coefficient
      estimate: 0.70
      p_value: "< 0.001"
      model: >-
        SEM in AMOS 23; chi2/df = 2.59, CFI = 0.95, TLI = 0.94, RMSEA = 0.05,
        SRMR = 0.06. Direct path from perceived autonomy support, with the
        other two teaching styles and both goals in the model.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: partial
      outcome_timing: partial
      effect_size: observed
    observability_notes: >-
      A direct path in a model with correlated predictors (autonomy support
      and social relatedness r .67), not a zero-order association. No standard
      error or interval is printed for the path. The indirect effect through
      mastery-approach goals is negative (95% CI [-0.135, -0.003]), because
      the autonomy support to mastery-approach path is negative.
    source_quote: "perceived autonomy support negatively predicted mastery-approach goals ( β = −0.32, p = 0.008) and positively predicted agentic engagement (β = 0.70, p < 0.001)."
    source_location: "Results, Structural Model Analyses; Figure 2"

