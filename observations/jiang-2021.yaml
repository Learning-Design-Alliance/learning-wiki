    anchor: jiang-al-and-zhang-lj-2021
  - claim: approach-goals-positively-predict-agentic-engagement
    bearing: supports
    anchor: jiang-al-and-zhang-lj-2021
  - claim: teaching-style-bivariate-correlations-agentic-engagement
    bearing: supports
