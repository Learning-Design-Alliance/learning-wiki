    comparison_ref: anchored-vs-abstract
    outcome:
      construct: "Arithmetic accuracy"
      source_language: "correctly answering ... anchored problems and ... abstract problems"
      measure: "Oral addition and multiplication problems"
      scale: "proportion of problems answered correctly"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "single survey session"
    result:
      measure_type: regression_coefficient
      estimate: -0.06
      standard_error: 0.03
      ci_lower: -0.11
      ci_upper: -0.01
      interval_type: confidence
      p_value: "0.028"
      unit: "proportion correct (anchored minus abstract)"
      model: "Coefficient as printed in the Results; full specification in Supplementary Table 18, not read. Figure 5 says its P values come from two-tailed t-tests without adjustment for multiple comparisons."
      interpretation: "School children were less accurate on anchored problems than on the same problems framed abstractly."
    moderators:
      reported: []
      candidate:
        - "Where the arithmetic was learned (school rather than market work): the article contrasts this estimate with the opposite one for working children (study 3a) and attributes the difference to the contexts in which the two groups learned, but prints no interaction test."
    observability:
