    source_quote: "correctly answering 73% of anchored problems and 78% of abstract problems (β = –0.06, s.e.m. = 0.03, 95% CI = –0.11 to –0.01, P = 0.028;"
    source_location: "Results, 'Meaningfulness'; Fig. 5a; Supplementary Table 18"

