# Banerjee, Bhattacharjee, Chattopadhyay, Duflo, Ganimian, Rajah & Spelke
# (2025), study 3b: Delhi school children with no market-selling experience,
# oral abstract versus oral anchored arithmetic with the same numbers.
#
# The article reports three studies. Study 3 has two samples: 3a (working
# children in Delhi markets, two waves) and 3b (school children in nearby
# government schools, grades 7 and 8). They are different people recruited in
# different places, so 3a is its own record (banerjee-2025-study3a). The
# "meaningfulness" paragraph reports one estimate per sample; this file holds
# the 3b one. The two estimates point in opposite directions, and the article
# reads that as a difference between the groups, which no single record here
# tests: no interaction estimate is printed.
#
# Read from the publisher's open-access full text (text layer, including the
# Methods and the Nature reporting summary). The Supplementary Tables (18 and
# 24 above all) were not read.

schema_version: 2

study:
  key: banerjee-2025-study3b
  citation: "Banerjee, A. V., Bhattacharjee, S., Chattopadhyay, R., Duflo, E., Ganimian, A. J., Rajah, K., & Spelke, E. S. (2025). Children's arithmetic skills do not transfer between applied and academic mathematics. Nature, 639(8055), 673-681."
  doi: "10.1038/s41586-024-08502-w"
  design:
    family: other
    design_detail: >-
      Classroom survey of school children. Every child answered oral abstract
      and oral anchored addition and multiplication problems; children were
      randomised into one of four survey versions so that abstract and
      anchored problems used the exact same numbers across versions. The
      framing contrast is therefore within children, with item numbers
      counterbalanced by randomisation. Incentives and a market word-problem
      hint were separately randomised in the same sample. Children with
      market-selling experience (27) were excluded under the authors'
      analysis plan.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: anchoring-helps-working-hurts-school-children
    bearing: supports
    anchor: banerjee-2025-2

evidence_base:
  unit: participants
  size:
    value: 271
    unit: participants
  additional_sizes:
    - value: 300
      unit: participants
      note: "children surveyed in study 3b, half in grade 7 and half in grade 8; all who were approached agreed"
    - value: 27
      unit: participants
      note: "children with market-selling experience, excluded under the analysis plan"
  population:
    description: >-
      Children with no market-selling experience in government schools near
      the Delhi markets of study 3a, selected to be of a similar age to the
      working children.
    age_or_stage: "Grades 7 and 8 (half in each). The article prints no age figure for this sample."
    age: unreported
  context:
    setting: "Survey conducted in the children's classrooms, Delhi, India, November-December 2022"
  arms:
    - id: oral-abstract
      description: "Oral addition and multiplication problems framed abstractly, as in school."
    - id: oral-anchored
      description: "Oral addition and multiplication problems with the same numbers, anchored to a concrete, familiar context."
      implementation_notes:
        - "Problem versions were randomised so that the anchored and abstract problems used the exact same numbers across versions."

comparisons:
  - id: anchored-vs-abstract
    kind: other
    index_arm: oral-anchored
    reference_arm: oral-abstract
    description: "Within-child contrast of item framing (anchored against abstract), item numbers balanced across four randomised survey versions."

