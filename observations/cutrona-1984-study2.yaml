# Cutrona, Russell & Jones (1984), Study 2: does attributional style on the
# ASQ predict attributions for actual negative events? 85 women, pregnancy to
# eight weeks postpartum.
#
# Study 1 of the same article (1,133 students) is cutrona-1984-study1.
#
# Read from a scanned repository copy whose text layer is OCR. Tables 4, 5 and
# 6 (alphas per measure and interview; correlations of the ASQ with each other
# measure, for the whole sample and for the consistent subsample) come out as
# scrambled column runs with significance marks fused to the numbers, so no
# table cell is recorded. Every figure below is an average the text prints.
# Quotes drop the OCR's escape backslashes and keep its spellings ("intemality",
# "giobality").
#
# The article says the averages are over the correlations between the
# interview-1 ASQ and "the other attribution measures"; for the total score it
# says five composite scores. Whether the ASQ test-retest correlation enters the
# dimension averages is not stated, and is not inferred here.

schema_version: 2

study:
  key: cutrona-1984-study2
  citation: "Cutrona, C. E., Russell, D., & Jones, R. D. (1984). Cross-situational consistency in causal attributions: Does attributional style exist? Journal of Personality and Social Psychology, 47(5), 1043–1058."
  doi: "10.1037/0022-3514.47.5.1043"
  design:
    family: longitudinal
    design_detail: >-
      Secondary analysis of a prospective study of postpartum depression
      (Cutrona, 1983). Three interviews: third trimester, about 2 weeks and
      about 8 weeks after delivery, plus a 14-day daily record. The ASQ at
      interview 1 was correlated with attributions, on the same 7-point
      internality, stability and globality scales, for recent life events,
      childcare stresses (interviews 2 and 3), maternity-blues symptoms and
      daily stressful events, and with the ASQ at interview 3.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: asq-poor-predictor-actual-attributions
    bearing: supports
    anchor: cutrona-1985
  - claim: consistent-subsample-no-predictive-gain
    bearing: supports
    anchor: cutrona-1985
  - claim: internality-weakest-consistency-dimension
    bearing: supports
    anchor: cutrona-1985

evidence_base:
  unit: participants
  size:
    value: 85
    unit: participants
  population:
    description: >-
      Women expecting their first baby, recruited in the third trimester:
      about 50% from a university obstetrics clinic, 25% from Lamaze classes
      and 25% from newspaper advertisements. No serious medical complications
      in pregnancy or childbirth; paid $25.
    age_or_stage: "All at least 18 years of age (an inclusion condition); the article prints no age distribution."
    age: unreported
  context:
    setting: "Interviews in pregnancy and postpartum, and a 14-day self-kept record of stressful events"
  arms:
    - id: consistent-subsample
      description: >-
        The 22 women (approximately 25% of the sample) with the lowest
        variance of their summed attribution score across all six ASQ negative
        events.
      size:
        value: 22
        unit: participants

comparisons:
  - id: whole-sample
    kind: none
    description: "Correlations between the interview-1 ASQ and the actual-event attribution measures in the whole sample; no contrast between groups."

