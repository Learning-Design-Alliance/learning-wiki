  - "Table 1: means and SDs of each emotion scale and of achievement by year, the alphas of the other emotion scales, the Rasch person reliabilities of the test scores (.74, .75, .77, italic in the page image), and the manifest and latent correlations. Table 1 prints the same means and SDs (4.68/1.01, 4.62/.90, 4.36/1.04) for grades and for test scores, which may be a typesetting duplication; not recorded."
