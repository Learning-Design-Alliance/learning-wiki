# Lichtenfeld, Pekrun, Marsh, Nett & Reiss (2023): achievement emotions and
# mathematics achievement across Grades 2 to 4, in reciprocal effects models.
#
# Read from the accepted author manuscript ("Journal of Educational Psychology,
# in press (accepted February 22, 2022)", 66 pp., text layer). The published
# volume, issue and pages are taken from Crossref. The manuscript prints the
# tables at the end, and the text layer runs every table's columns into one
# line. Table 1 (p. 56) and Table 4 (p. 59) were therefore read from the PDF
# page images to know which column each figure belongs to; each source_quote
# below is the text layer's own run of characters for that row, which contains
# the figure, and source_location names the column as the page image shows it.
#
# What is recorded: the learning-related enjoyment and grades model of Table 4
# (enjoyment's year-to-year autoregression, and the cross-lagged paths in both
# directions), and the Cronbach's alphas of the learning-related enjoyment
# scale in Table 1. All paths come from the model the authors interpret, with
# autoregressive and cross-lagged effects constrained equal across the two
# one-year intervals; the standardized coefficients can still differ between
# intervals, as the authors note. The boredom and anxiety models, test
# emotions and test-score models are listed in not_yet_extracted.

schema_version: 2

study:
  key: lichtenfeld-2023
  citation: "Lichtenfeld, S., Pekrun, R., Marsh, H. W., Nett, U. E., & Reiss, K. (2023). Achievement emotions and elementary school children's academic performance: Longitudinal models of developmental ordering. Journal of Educational Psychology, 115(4), 552–570."
  doi: "10.1037/edu0000748"
  design:
    family: longitudinal
    design_detail: >-
      Three-wave longitudinal panel, annual assessments towards the end of
      Grades 2, 3 and 4. Latent neighbor change models for each emotion and
      latent reciprocal effects (cross-lagged) structural equation models of
      each emotion with end-of-year mathematics grades and, separately, with
      Rasch-scaled achievement test scores, controlling for gender, number of
      books at home and parental education; Mplus 8, type = complex to correct
      for students nested in classes. No manipulation.
    preregistration:
      status: not-preregistered
      source_quote: "This study’s design and its analysis were not pre-registered."

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-author-manuscript
  verification: unverified

appears_in:
  - claim: enjoyment-grades-positive-reciprocal-effects
    bearing: supports
    anchor: lichtenfeld-2022

evidence_base:
  unit: participants
  size:
    value: 670
    unit: participants
  additional_sizes:
    - value: 593
      unit: participants
      note: "students in the Year 2 assessment"
    - value: 534
      unit: participants
      note: "students in the Year 3 assessment"
    - value: 519
      unit: participants
      note: "students in the Year 4 assessment"
    - value: 30
      unit: schools
      note: "elementary schools, one class tested in each; not a unit of assignment, but the models corrected for clustering in classes"
  population:
    description: >-
      German elementary school students (51.0% female) from 30 schools, 98.7%
      of all students in the tested classrooms; 70% rural and 30% urban areas;
      for 71.2% both parents born in Germany; German the native language for
      86.7%. Students from the same classes who had not taken part before could
      join in Years 3 and 4; 84.0% took part in all three assessments.
    age_or_stage: "Grades (Years) 2 to 4; the age figures are for the Year 2 sample of 593"
    age:
      unit: years
      mean: 8.45
      sd: 0.40
      note: "At the first assessment (Year 2), n = 593"
  context:
    setting: >-
      Annual classroom assessments towards the end of each school year, given
      by trained external test administrators: the Achievement Emotions
      Questionnaire-Elementary School (AEQ-ES) and the Mathematics Competency
      Test-Elementary School (MCT-ES); end-of-year mathematics grades from
      school records (1 = excellent to 6 = poor, reversed before analysis).
  arms: []

comparisons:
  - id: whole-sample
    kind: none
    description: "Paths and scale properties in the whole longitudinal sample; no contrast between groups."

observations:

  - id: enjoyment-autoregression-y2-y3
    comparison_ref: whole-sample
    outcome:
      construct: "Stability of learning-related enjoyment in mathematics"
      source_language: "Autoregressive effects"
      measure: "Latent learning-related enjoyment factor (AEQ-ES, 5-point face scale), Year 3 regressed on Year 2"
      scale: "standardized path coefficient"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "Year 2 to Year 3 (one school year)"
      offset:
        value: 1
        unit: years
        from: "Year 2 assessment"
    result:
      measure_type: regression_coefficient
      estimate: 0.59
      standard_error: 0.04
      model: >-
        Reciprocal effects model of learning-related enjoyment and grades,
        autoregressive and cross-lagged effects constrained equal across waves,
        with gender, cultural capital and parental education as covariates and
        strong invariance of parameters across waves. Bold in Table 4 (p < .05).
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    source_quote: "Y2 → Y3 .59 (.04) .66 (.04) .49 (.05) .68 (.04) .57 (.06) .62 (.04)"
    source_location: "Table 4 (manuscript p. 59), Autoregressive effects, Y2 → Y3, Learning enjoyment column (read from the page image)"

