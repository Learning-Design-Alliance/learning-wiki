    result:
      measure_type: probability
      estimate: 39
      unit: "percent of the sample"
      note: "24% were absent at both T5 and T6, and an additional 15% at T6 only"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      Dropout is inferred from attendance at the data collection, not from
      course records; the authors note that nearly all students present took
      part.
    source_quote: "Students’ lack of attendance at the end of the semester (T6) was used as an indicator of course dropout in our analyses (39% of the sample)."
    source_location: "Study 1a Measures, Course Dropout"

  - id: expectancy-value-scales-alpha
