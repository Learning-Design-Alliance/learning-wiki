      source_language: "The internal consistencies of these constructs"
      measure: "Expectancy (three items), intrinsic value, utility value, psychological cost and effort cost (two items each), 6-point scale, at Weeks 2, 8 and 15"
      scale: "Cronbach's alpha"
      direction: higher-is-better
      role: other
