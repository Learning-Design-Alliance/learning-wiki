    sample:
      value: 824
      unit: effect-sizes
    comparison_ref: retention-vs-final-acquisition
    outcome:
      construct: "Procedural skill performance, accuracy-based measures"
      source_language: "accuracy-based performance measures"
      measure: "Accuracy-based performance on the trained procedural task, as reported by the primary studies"
      scale: "meta-regression slope: change in Cohen's d (retention minus final acquisition) per month of retention interval"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "retention intervals from 24 hours to 24 months after final acquisition"
    result:
      measure_type: regression_coefficient
      estimate: -0.08
      ci_lower: -0.10
      ci_upper: -0.05
      interval_type: confidence
      unit: "SD units per month"
      k:
        value: 824
        unit: effect-sizes
      heterogeneity:
        statistic: "Q"
        value: 3820.34
        interpretation: "Residual heterogeneity after retention interval, p < 0.01"
      model: "Linear random-effects meta-regression with robust variance estimation, 311 reports"
    moderators:
      reported:
        - variable: "Task type (laboratory/artificial vs real-world)"
          relationship: "Shallower decline for real-world tasks than for laboratory tasks (interaction 0.11, p < 0.01)"
          source_quote: "The slope of the regression line between retention interval and effect size was shallower (i.e., the relationship was weaker) for real-world tasks than for laboratory/artificial tasks, which indicates that performance on laboratory tasks declined faster over time than performance on real-world tasks did (ß Accuracy = 0.11, p < 0.01, ß Speed = 0.07, ns)."
        - variable: "Component complexity"
          relationship: "Shallower decline for higher component complexity (interaction 0.03, p < 0.05)"
          source_quote: "Component complexity was a statistically significant moderator of the relationship between retention interval and effect size for accuracy-based and mixed performance measures (ß Accuracy = 0.03, p < 0.05; ß Mixed = 0.07, p < 0.05)."
        - variable: "Intervening performance opportunities during the retention interval"
          relationship: "Shallower decline when the skill was performed during the interval (interaction 0.07, p < 0.05)"
          source_quote: "Performance opportunities during the retention interval was a statistically significant moderator of the relationship between retention interval and effect size for accuracy-based performance measures (ß Accuracy = 0.07, p < 0.05)."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: observed
      effect_size: observed
      pooled_k: observed
    observability_notes: >-
      A linear model was retained although a quadratic fitted the accuracy data
      better, because the quadratic was U-shaped. The intercept is in Table 2,
      which the manuscript does not contain. d was computed with the
      independent-samples formula on repeated measures of the same learners.
    source_quote: "strengthen by 0.08 per month of intermittent or non-use (ß = -0.08 [-0.10, -0.05]) for accuracy"
    source_location: "Results, RQ 1, pp. 34-35"

