# Tatel & Ackerman (2025): procedural skill retention and decay, a
# meta-analysis of 1,344 effect sizes from 457 reports.
#
# Read from the APA author manuscript (140 pp., "not the copy of record");
# volume, issue and pages from Crossref. The manuscript has NO tables: Tables
# 1-7 are referred to but not included, so every figure below is from the
# text. The intercepts of the meta-regressions (Tables 2-4) and the predicted
# d by interval (Table 5) are therefore not recorded.
#
# Two estimands, kept apart on purpose:
#
#   * The DECAY SLOPES are the meta-regression coefficient of retention
#     interval (months) on the d between final acquisition and retention,
#     fitted LINEARLY (a quadratic fitted accuracy better but was rejected as
#     U-shaped). Negative = decline.
#   * The HALF-GAIN TIMES (6.5, 13 and 11 months) are the authors' own
#     derived estimates: predicted retention d from those linear models,
#     subtracted from the pooled acquisition d. They are recorded as printed
#     ("approximately", "about"); nothing is recomputed here.
#
# The speed slope's interval is printed across a line break and the text
# layer drops its second minus sign ("[-0.11, 0.02]"); the PDF page (p. 35)
# reads "[-0.11, -0.02]", which is what is recorded. Its source_quote is the
# abstract sentence, which the text layer reproduces cleanly.
#
# Age: samples were adults by inclusion ("ages 17 and up"); sample age was
# coded but is reported only in the Supplemental Materials, which were not
# read, so `age: unreported`.

schema_version: 2

study:
  key: tatel-2025
  citation: "Tatel, C. E., & Ackerman, P. L. (2025). Procedural skill retention and decay: A meta-analytic review. Psychological Bulletin, 151(6), 696–736."
  doi: "10.1037/bul0000481"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-analysis of studies measuring a procedural skill with a significant
      non-verbal motor component at least twice, separated by a retention
      interval of at least 24 hours of non-use or intermittent use. Effect
      sizes are within-sample Cohen's d between performance occasions,
      computed with the independent-samples formula. Random-effects
      meta-regressions of the final-acquisition-to-retention d on retention
      interval (months), run separately for accuracy, speed and mixed
      performance measures, with moderators entered as interaction terms.
    preregistration:
      status: not-preregistered
      source_quote: "This work was not preregistered."
  synthesis:
    model: "Random-effects meta-regression (REML, metafor) with robust variance estimation for dependent effect sizes"
    heterogeneity_statistic: "Q"
    search:
      databases:
        - Scopus
        - Google Scholar
        - Web of Science Core Collection
        - PubMed
        - PsycINFO
        - ProQuest
        - National Technical Reports Library (NTIS)
      date_range: "Published up to October 2022"
      records_screened: 20379
      records_included: 457
    inclusion:
      - "Non-clinical adult samples (ages 17 and up)"
      - "A task requiring a behavioural output with a significant non-verbal motor component"
      - "At least two objective performance measurements separated by a retention interval of at least 24 hours of non-use or intermittent use"
      - "Continuous performance measures at acquisition and retention with central tendency and variation statistics"
      - "Published in English"
    exclusion:
      - "Observational learning only during acquisition"
      - "A performance-affecting treatment (e.g. sleep deprivation, alcohol) with no control group"
    data_handling:
      - "Analyses use the 1,273 effect sizes from 425 reports computed with the independent-samples d formula; t- and author-reported d analysed separately (Supplemental Materials)"
      - "Two retention-interval outliers (60 and 120 months) removed from meta-regressions, leaving 1,268 effect sizes"
      - "Effect sizes on the same task within a measure category averaged; dependence handled by robust variance estimation"
      - "Most study variables coded by a single coder; task characteristics coded independently by both authors"
      - "Publication bias examined by publication type and PET-PEESE (Supplemental Materials)"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-author-manuscript
  verification: unverified

appears_in:
  - claim: procedural-skill-decay-rate-per-month
    bearing: supports
    anchor: tatel-2025
  - claim: half-acquisition-gains-lost-months
    bearing: supports
    anchor: tatel-2025

evidence_base:
  unit: effect-sizes
  size:
    value: 1344
    unit: effect-sizes
  additional_sizes:
    - value: 457
      unit: reports
      note: "reports included"
    - value: 1273
      unit: effect-sizes
      note: "effect sizes computed with the independent-samples formula, from 425 reports: the set analysed"
    - value: 1268
      unit: effect-sizes
      note: "effect sizes in the meta-regressions after removing the two retention-interval outliers"
    - value: 496
      unit: other
      note: "distinct retention intervals across the 425 reports"
  population:
    description: >-
      Non-clinical adult samples learning procedural skills with motor
      components. 70% of tasks real-world (medical/dental procedures 40% of
      effect sizes, sports 17%, military/transportation 7%, miscellaneous 6%)
      and 30% laboratory/artificial.
    age_or_stage: "Adults by inclusion ('ages 17 and up'); sample age coded but reported only in the Supplemental Materials."
    age: unreported
  context:
    setting: "Training studies of procedural skills (e.g. CPR, laparoscopic surgery, sports skills, marksmanship) followed by a retention interval of non-use or intermittent use"
  variation:
    - dimension: "Performance measure"
      distribution: "Accuracy 65%, speed 21%, mixed 14% of effect sizes"
    - dimension: "Retention interval"
      distribution: "Positively skewed: 44% under one week, 28% two days or fewer; 47 intervals longer than six months, 14 longer than one year; longest analysed 24 months"
  arms:
    - id: initial-acquisition
      description: "Performance at the start of skill acquisition (training)."
    - id: final-acquisition
      description: "Performance at the end of skill acquisition (training)."
    - id: retention-test
      description: "Performance after a retention interval of at least 24 hours of non-use or intermittent use of the skill."

comparisons:
  - id: retention-vs-final-acquisition
    kind: within-subject-baseline
    index_arm: retention-test
    reference_arm: final-acquisition
    description: "The same learners' performance at retention against their performance at the end of acquisition; negative d is decline."
  - id: final-vs-initial-acquisition
    kind: within-subject-baseline
    index_arm: final-acquisition
    reference_arm: initial-acquisition
    description: "The same learners' performance at the end of acquisition against the start; the acquisition gain."
  - id: retention-loss-as-share-of-acquisition-gain
    kind: other
    index_arm: retention-test
    reference_arm: initial-acquisition
    description: >-
      Predicted retention d from the linear decay meta-regression subtracted
      from the pooled acquisition d, read as the share of the acquisition gain
      lost after a given interval.
  - id: effect-size-coding
    kind: none
    description: "Agreement between two authors coding the same sample of effect sizes; no contrast between configurations."

