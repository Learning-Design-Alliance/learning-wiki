    comparison_ref: testing-vs-reexposure
    outcome:
      construct: "Transfer of learning"
      source_language: "transfer effect sizes"
      measure: "Final tests differing from the practice test in format, items, cues, or required application, as in the primary studies"
      scale: "Cohen's d"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "final test after the primary studies' retention intervals, pooled"
    result:
      measure_type: cohens_d
      estimate: 0.40
      standard_error: 0.046
      ci_lower: 0.31
      ci_upper: 0.50
      interval_type: confidence
      p_value: "< .00001"
      k:
        value: 192
        unit: effect-sizes
      heterogeneity:
        statistic: tau2
        value: 0.084
        interpretation: "Between-paper variance; within-paper (experiment) variance omega2 = 0.050"
      publication_bias:
        method: "PET-PEESE (PEESE indicated in all cases) and Vevea-Woods weight-function sensitivity analyses"
        finding: "Highly significant sampling-variability slope (p < .0001) suggesting publication bias; moderator estimates minimally affected, intercept effectively zero"
      model: "Hierarchical random-effects with robust variance estimation; adjusted df 43.016"
    moderators:
      reported:
        - variable: "Response congruency"
          relationship: "Single-moderator fit: d = 0.28 without congruency, increase of 0.30 with it"
          source_quote: "In those fits, only response congruency was significant (p = .0006)."
        - variable: "Elaborated retrieval practice and response congruency (simultaneous fit)"
          relationship: "Increase of d = 0.35 with response congruency and 0.22 with elaborated retrieval practice; 0.78 with both"
          source_quote: "In the final model, the moderators of response congruency and elaborated retrieval practice were significant (ps ≤ .0094)."
      candidate: []
    observability:
      population_detail: partial
