# Pan & Rickard (2018): transfer of test-enhanced learning, a meta-analysis.
#
# Read from the APA author manuscript (text layer; 48 pp. of text plus tables).
# Volume, issue and pages are from Crossref. The manuscript gives the corpus as
# N = 10,396; the version of record's abstract may differ, and this file records
# the manuscript's figure only.
#
# WHAT THIS FILE RECORDS:
#
#   * The pooled transfer estimate (d = 0.40) and the six category-level
#     estimates from Table 2. The categories are kinds of TRANSFER TEST, so they
#     are recorded as different outcomes of the one testing-vs-reexposure
#     contrast, not as different arms.
#   * The two intercepts that answer "how much transfer with no enhancing
#     moderator": the random-effects final model (d = 0.21) and the PEESE model
#     adjusted for publication bias (d = 0.015). They are the paper's own fitted
#     estimates and differ by an order of magnitude, which is the finding.
#   * `measure_type: reliability` for the coding of the two moderators the final
#     model retains (response congruency, kappa .82; elaborated retrieval
#     practice, kappa .92). The effect sizes themselves carry no printed
#     extraction agreement.
#   * `population.age: unreported`. The article says nearly all samples were
#     university students and gives an age range (50-66) only for the two
#     studies of older adults; no figure describes the corpus.
#
# `k` counts EFFECT SIZES throughout (192 from 122 experiments in 67 papers).
# Standard errors come from robust variance estimation with small-sample
# adjusted df, printed beside each estimate in Table 2.

schema_version: 2

study:
  key: pan-2018
  citation: "Pan, S. C., & Rickard, T. C. (2018). Transfer of test-enhanced learning: Meta-analytic review and synthesis. Psychological Bulletin, 144(7), 710–756."
  doi: "10.1037/bul0000151"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-analysis of transfer effect sizes (Cohen's d) comparing practice
      testing with a non-testing reexposure control (e.g., restudy) on a final
      test that differs from the practice test. Hierarchical random-effects
      model with two random effects (study, and experiment within study) and
      robust variance estimation; single and simultaneous moderator fits over
      seven candidate moderators; PET-PEESE and Vevea-Woods weight-function
      sensitivity analyses for publication bias; category-level meta-analyses
      for six transfer categories. Included experiments used between- or
      within-subjects designs.
  synthesis:
    model: "Hierarchical random-effects meta-analysis with robust variance estimation (Stata robumeta, hierarchical weights)"
    heterogeneity_statistic: "tau2 (between papers) and omega2 (experiments within paper)"
    search:
      databases:
        - PsycINFO
        - ProQuest Dissertations and Theses
      date_range: "1963 to 2016 in the database records; included studies dated 1975 to 2016"
      records_screened:
        value: 280
        unit: reports
      records_included:
        value: 67
        unit: reports
    data_handling:
      - "Two raters screened PsycINFO titles (Cohen's kappa .81) and abstracts (kappa .83); the first author screened full texts and dissertations"
      - "Candidate moderators coded by the authors, with a second coding by a trained research assistant (all published articles for five moderators, a random 25% of effect sizes for the other two); discrepancies resolved by discussion"
      - "Initial test performance missing for 30% of effect sizes; analyses involving it use the 135 effect sizes with that data"
      - "Ancestral searches and requests to 52 researchers for unpublished studies"

