evidence_base:
  unit: effect-sizes
  size:
    value: 192
    unit: effect-sizes
  additional_sizes:
    - value: 122
      unit: other
      note: "experiments contributing the 192 effect sizes"
    - value: 67
      unit: reports
      note: "studies (papers): 53 published and 14 unpublished by the end of the search"
    - value: 10396
      unit: participants
      note: "total N across the corpus, as printed in the manuscript's abstract"
  population:
    description: >-
      Nearly all samples recruited from young adult (university student)
      populations; exceptions were 3 studies with elementary school children,
      2 with high school students and 2 with older adults. All studies but one
      written in English.
    age_or_stage: >-
      Mostly young adults (university students); the two older-adult studies
      are described as 50-66 years. No age figure is printed for the corpus.
    age: unreported
  context:
    setting: "Laboratory and some classroom and medical-training studies of practice testing, 1975-2016"
  variation:
    - dimension: "Transfer category"
      distribution: "Test format 56 effect sizes, application and inference questions 41, stimulus-response rearrangement 33, mediator and related word cues 27, problem-solving skills 18, untested materials seen during initial study 17"
    - dimension: "Initial test performance reported"
      distribution: "135 of 192 effect sizes"
  arms:
    - id: practice-testing
      description: "Training on studied materials by testing (retrieval practice), with or without correct-answer feedback, followed by a final test that differs from the practice test."
      elements:
        - term: "practice testing"
    - id: nontesting-reexposure
      description: "Non-testing reexposure control during training (e.g., restudy), with the same number of item repetitions as the testing condition."

comparisons:
  - id: testing-vs-reexposure
    kind: other
    index_arm: practice-testing
    reference_arm: nontesting-reexposure
    description: >-
      Practice testing against non-testing reexposure on a transfer test, pooled
      across experiments that assigned the conditions between or within
      subjects.
  - id: moderator-coding-agreement
    kind: none
    description: "Agreement between the authors' coding and a trained research assistant's second coding of the candidate moderators."

