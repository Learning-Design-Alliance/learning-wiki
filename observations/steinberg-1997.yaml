    unit: participants
  additional_sizes:
    - value: 128
      unit: participants
      note: "students in three fall 1995 lecture classes who completed the FCI and exam problem 2 (Newton's Third Law); a separate sample, recorded on its own arms"
  population:
    description: >-
      Students in first-semester introductory calculus-based physics lecture
      classes at the University of Maryland who completed both the FCI and the
      final exam: one class in spring 1996 (28 students, exam problem 1) and
      three classes in fall 1995 (128 students, exam problem 2).
    age_or_stage: "University, first-semester introductory calculus-based physics; no age figure printed"
    age: unreported
  context:
    setting: "End of the semester, after instruction: FCI in the last week of the semester, final exam the following week"
  arms:
    - id: fci-diagnostic
      description: "FCI items (five-option multiple choice, colloquial everyday framing), administered as an ungraded diagnostic in the last week of the semester."
      size:
        value: 28
        unit: participants
    - id: final-exam-problem
      description: "Exam problem 1 (open-ended: free-body diagrams, force comparisons and velocity vectors in a formal physics setting), on the graded final exam the following week."
      size:
        value: 28
        unit: participants
    - id: fci-n3-items
      description: "Fall 1995 sample: the four FCI Newton's Third Law questions (2, 11, 13, 14; five-option multiple choice), ungraded, in the last week of the semester."
      size:
        value: 128
        unit: participants
    - id: final-exam-problem-2
      description: "Fall 1995 sample: exam problem 2 (open-ended: free-body diagrams of two carts and a ranking of all horizontal forces by magnitude), on the graded final exam the following week."
      size:
        value: 128
        unit: participants

comparisons:
