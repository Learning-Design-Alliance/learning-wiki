# Steinberg & Sabella (1997): performance on Force Concept Inventory (FCI)
# items against matched open-ended final-exam problems.
#
# SOURCE TEXT: an OCR transcription of a scan of the published article (pages
# 2-7), not a PDF text layer. The quotes of the first eight observations were
# matched against that OCR text; OCR can misread characters, so those quotes are
# only as exact as the transcription.
#
# EXTENDED 2026-11-26 FROM PAGE IMAGES: the scanned PDF was viewed page by page
# and three observations were added whose quotes and figures were read from
# the page images, not the OCR text: n3-fci-count-by-exam-success,
# q13-exam2-response-matrix (Table I, p. 154; its row and column labels are
# legible on the image) and impetus-items-answered-inconsistently. Their
# source_quote fields copy the printed words of pp. 152-154.
#
# Figures 3, 4 and 6 (histograms) print no numbers: Fig. 3 and Fig. 4 carry
# only axis ticks (0-14, 0-12) and Fig. 6 (0-24), so the exam percent correct
# for the impetus items (Fig. 4) and the N3 group sizes (Fig. 6) are not
# recorded. Reading bar heights off a 3-D histogram would be estimating, not
# transcribing.
# DOI 10.1119/1.2344625 checked against the article's front matter and
# Crossref (volume 35, issue 3, pp. 150-155).
#
# WHAT THIS RECORD HOLDS:
#
#   * The one lecture class (spring 1996) in which 28 students took both the
#     FCI (last week of the semester, ungraded) and exam problem 1 on the
#     final exam (graded) the following week. The two instruments are the
#     arms; its single-group percentages are `mean`s naming their arm, and
#     its consistency figures (a count, a printed bound) rest on the
#     comparison. The paper prints no difference, no test and no
#     interval; the 54% vs 90% gap is two observations, not one.
#   * The instruments differ in format (multiple choice vs open ended),
#     framing (colloquial vs formal), stakes (ungraded vs graded) and timing
#     (one week apart) together, as the authors themselves list. Nothing here
#     isolates any one of them.
#   * The Newton's Third Law results come from a different sample: 128
#     students in three fall 1995 lecture classes, FCI in the last week of the
#     semester and exam problem 2 on the final. They are recorded on their own
#     arms (fci-n3-items, final-exam-problem-2) with sample 128, never against
#     the 28. Table I prints PERCENTAGES of students, not counts, and does not
#     restate its N; its cells are recorded as printed, in `descriptives`, on
#     one observation, with the authors' own reading (about half on the
#     diagonal). No diagonal total, marginal or count is computed from it.
#   * No reliability coefficient is printed for either instrument, and no age.

schema_version: 2

study:
  key: steinberg-1997
  citation: "Steinberg, R. N., & Sabella, M. S. (1997). Performance on multiple-choice diagnostics and complementary exam problems. The Physics Teacher, 35(3), 150–155."
  doi: "10.1119/1.2344625"
  design:
    family: observational
    design_detail: >-
      Descriptive comparison of the same students' responses to FCI items and
      to open-ended final-exam problems written to correspond to them. No
      inferential statistics; the authors state the number of students is
      "perhaps too small for statistical confidence".
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

