    unit: participants
  additional_sizes:
    - value: 128
      unit: participants
      note: "students in three fall 1995 lecture classes who took the FCI and exam problem 2 (Newton's Third Law); a separate sample, not recorded here"
  population:
    description: >-
      Students in a first-semester introductory calculus-based physics lecture
      class at the University of Maryland, spring 1996, who completed both the
      FCI and the final exam.
    age_or_stage: "University, first-semester introductory calculus-based physics; no age figure printed"
    age: unreported
  context:
    setting: "End of the semester, after instruction: FCI in the last week of the semester, final exam the following week"
  arms:
    - id: fci-diagnostic
      description: "FCI items (five-option multiple choice, colloquial everyday framing), administered as an ungraded diagnostic in the last week of the semester."
      size:
        value: 28
        unit: participants
    - id: final-exam-problem
      description: "Exam problem 1 (open-ended: free-body diagrams, force comparisons and velocity vectors in a formal physics setting), on the graded final exam the following week."
      size:
        value: 28
        unit: participants

comparisons:
