# Steinberg & Sabella (1997): performance on Force Concept Inventory (FCI)
# items against matched open-ended final-exam problems.
#
# SOURCE TEXT: an OCR transcription of a scan of the published article (pages
# 2-7), not a PDF text layer. Every quote below was matched against that OCR
# text; OCR can misread characters, so the quotes are only as exact as the
# transcription. Figures 3, 4 and 6 (histograms) are images and were not read.
# DOI 10.1119/1.2344625 checked against the article's front matter and
# Crossref (volume 35, issue 3, pp. 150-155).
#
# WHAT THIS RECORD HOLDS:
#
#   * The one lecture class (spring 1996) in which 28 students took both the
#     FCI (last week of the semester, ungraded) and exam problem 1 on the
#     final exam (graded) the following week. The two instruments are the
#     arms, and every figure is a single-group percentage, so each is a
#     `mean` naming its arm. The paper prints no difference, no test and no
#     interval; the 54% vs 90% gap is two observations, not one.
#   * The instruments differ in format (multiple choice vs open ended),
#     framing (colloquial vs formal), stakes (ungraded vs graded) and timing
#     (one week apart) together, as the authors themselves list. Nothing here
#     isolates any one of them.
#   * The Newton's Third Law results come from a different sample (128
#     students in three fall 1995 classes, exam problem 2) and are listed in
#     not_yet_extracted rather than recorded against this sample.
#   * No reliability coefficient is printed for either instrument, and no age.

schema_version: 2

study:
  key: steinberg-1997
  citation: "Steinberg, R. N., & Sabella, M. S. (1997). Performance on multiple-choice diagnostics and complementary exam problems. The Physics Teacher, 35(3), 150–155."
  doi: "10.1119/1.2344625"
  design:
    family: observational
    design_detail: >-
      Descriptive comparison of the same students' responses to FCI items and
      to open-ended final-exam problems written to correspond to them. No
      inferential statistics; the authors state the number of students is
      "perhaps too small for statistical confidence".
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

