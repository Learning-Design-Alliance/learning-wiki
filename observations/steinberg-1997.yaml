    anchor: steinberg-and-sabella-1997
  - claim: motion-diagram-fci-exam-mismatch
    bearing: supports
    anchor: steinberg-and-sabella-1997
  - claim: fci-exam-correlation-but-substantial-mismatch
    bearing: supports
