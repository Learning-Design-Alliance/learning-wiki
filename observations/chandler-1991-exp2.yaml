# Chandler & Sweller (1991), Experiment 2: integrated against conventional
# lighting-circuit notes where each wiring diagram was intelligible without its
# text. The boundary case for Experiment 1: no benefit of integration.
#
# Read from the University of Wollongong repository copy (text layer only).
# Table 3 (written-test means and SDs) is scrambled in the text layer: its cells
# come out out of order, with one SD separated from the rest, so no Table 3
# mean is recorded. The F prints as "F(l, 26)" in the text layer; the figure is
# in `statistic` and the quote is the clause in front of it.
#
# Same 28 apprentices as Experiment 1 (chandler-1991-exp1), run at the same time.

schema_version: 2

study:
  key: chandler-1991-exp2
  citation: "Chandler, P., & Sweller, J. (1991). Cognitive load theory and the format of instruction. Cognition and Instruction, 8(4), 293–332."
  doi: "10.1207/s1532690xci0804_2"
  design:
    family: randomized-controlled-trial
    design_detail: >-
      Two-group between-subjects experiment inside a company's normal training
      programme, run alongside Experiment 1 with the same apprentices. Subjects
      were randomly allocated; the experimenter and senior instructor were
      unaware of the allocation. Written test at the end of the course and
      about 12 weeks later (2 x 2 ANOVA, repeated measures on test period); a
      practical construction test one week after the course.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: integration-no-benefit-redundant-sources-exp2
    bearing: supports
    anchor: chandler-1991

evidence_base:
  unit: participants
  size:
    value: 28
    unit: participants
  additional_sizes:
    - value: 20
      unit: participants
      note: "available for the practical test, 10 from each group"
  population:
    description: >-
      First-year trade apprentices of a Sydney company (the Experiment 1
      sample); none had previous training in wiring lighting circuits.
    age_or_stage: "First-year apprentices; Experiment 1 says all had completed at least Year 10 of high school"
    age: unreported
  context:
    setting: "The training centre of a Sydney company; the one-week domestic wiring course"
  arms:
    - id: conventional
      description: "Conventional split-source lighting notes (10-page booklet virtually identical to the company's own): internal wiring diagrams with the written explanation presented separately. The diagrams were intelligible without the text."
    - id: modified
      description: "The same lighting notes in an integrated format, text placed on the diagrams where possible."
      elements:
        - term: "physically integrated text and diagram"

comparisons:
  - id: modified-vs-conventional
    kind: between-groups
    index_arm: modified
    reference_arm: conventional
    description: "Integrated (modified) lighting notes against conventional split-source notes, same content, on material whose diagrams were self-explanatory."

observations:

  - id: written-test-group-main-effect
    sample:
      value: 28
      unit: participants
    comparison_ref: modified-vs-conventional
    outcome:
      construct: "Lighting-circuit knowledge"
      source_language: "written test on lighting"
      measure: "31 questions identifying components and wires on internal wiring diagrams and on the operating principles of fluorescent lamps, marked correct or incorrect"
      scale: "F for the Groups main effect, 2 x 2 repeated-measures ANOVA over test periods 1 and 3"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "end of course and about 12 weeks later, pooled in the main effect"
    result:
      measure_type: other
      statistic: "F(1, 26) = 1.76, MSe = 64.29"
      interpretation: "No significant difference between the groups; on inspection of the means the conventional group was marginally better on both occasions. Test period F(1, 26) = .02; Group x Test Period F(1, 26) = 2.43, both not significant."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      No standardised effect size is printed, and Table 3's means cannot be read
      cleanly from the text layer.
    source_quote: "Inspection of means indicated that the conventional group performed marginally better than the modified group on both test occasions. Nevertheless, there was no significant difference between the groups,"
    source_location: "Experiment 2, Results and Discussion, p. 308"

  - id: practical-test-successes-conventional
    sample:
      value: 10
      unit: participants
    arm_ref: conventional
    outcome:
      construct: "Light-circuit construction skill"
      source_language: "successfully constructed an intermediate light switch"
      measure: "Construct an intermediate light switch on a training board within 40 minutes, without notes; a senior instructor classified the circuit operative or inoperative"
      scale: "number of apprentices with an operative circuit, of 10"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "test period 2, one week after the course"
      offset:
        value: 1
        unit: weeks
        from: "end of the domestic wiring course"
    result:
      measure_type: count
      estimate: 7
      unit: "apprentices of 10"
      note: "A Fisher exact test against the modified group's 4 of 10 found no significant difference."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "Seven of the 10 apprentices from the conventional group successfully constructed an intermediate light switch."
    source_location: "Experiment 2, Results and Discussion, p. 308"

  - id: practical-test-successes-modified
    sample:
      value: 10
      unit: participants
    arm_ref: modified
    outcome:
      construct: "Light-circuit construction skill"
      source_language: "successful constructions"
      measure: "Construct an intermediate light switch on a training board within 40 minutes, without notes; a senior instructor classified the circuit operative or inoperative"
      scale: "number of apprentices with an operative circuit, of 10"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "test period 2, one week after the course"
      offset:
        value: 1
        unit: weeks
        from: "end of the domestic wiring course"
    result:
      measure_type: count
      estimate: 4
      unit: "apprentices of 10"
      note: "A Fisher exact test against the conventional group's 7 of 10 found no significant difference."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "This compared with four successful constructions from the modified group. A Fisher Exact Test on these frequencies failed to find any significant difference between the two groups."
    source_location: "Experiment 2, Results and Discussion, p. 308"

not_yet_extracted:
  - "Table 3 written-test means and SDs for both groups at periods 1 and 3: the text layer scrambles the cells, so none is recorded."
  - "No reliability or agreement coefficient is printed."
