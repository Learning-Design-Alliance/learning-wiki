    result:
      measure_type: correlation
      estimate: -0.21
      statistic: "F(1,323)=14.89"
      p_value: "p<0.001"
      interpretation: "Students who liked maths class less gamed more"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
