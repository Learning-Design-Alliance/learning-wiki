# Pardos, Baker, San Pedro, Gowda & Gowda (2014): detector-estimated affect and
# behaviour across a school year in ASSISTments, and end-of-year state test
# scores.
#
# WHAT THIS FILE RECORDS:
#
#   * Gaming the system against raw MCAS mathematics score: four Pearson
#     correlations (original and scaffold items, 2004-2005 and 2005-2006). The
#     two school-year cohorts are arms named by `arm_ref`; each correlation is a
#     result about one cohort, not a contrast between two. Estimates are Table
#     4's printed values (five decimals); the text rounds them to two.
#   * `measure_type: reliability` three times: the two field observers'
#     agreement on affect (kappa 0.72) and on behaviour (kappa 0.86), and the
#     gaming detector's cross-validated kappa against those observers' labels
#     (0.370). The detector kappa is agreement between a model and human
#     coders, recorded as `over: other`.
#   * `population.age: unreported`. The article says the students came from
#     middle schools and prints no age or grade distribution. The tutor's
#     problem set sampled "8th grade math test prep questions"; that describes
#     the items, not the students, so no grade is inferred.
#
# Two inconsistencies in the source, recorded as printed and not resolved:
#   * The text gives the gaming detector an F-measure of 0.687; Table 2 prints
#     0.750. F-measure is not recorded as an observation.
#   * The text gives the 2004-2005 scaffold gaming correlation t(624) = -11.92
#     and the 2005-2006 one t(760) = -8.71, the same t values it gives for the
#     original-item correlations of -0.43 and -0.30. Those t values are kept
#     only in notes, flagged.
#
# The analysed n per correlation is not printed. The cohorts are 629 and 764
# students; the t statistics carry df 624 and 760. No n is deduced from the df.
#
# Read from the ERIC copy (pdftotext text layer). The text layer prints minus
# signs as U+2010 hyphens ("‐0.43083"); the quotes give them as minus signs and
# hyphens, as the article prints them. DOI
# checked against Crossref (title, five authors, 2014, JLA 1(1), 107-128); the
# ERIC copy itself prints no DOI.

schema_version: 2

study:
  key: pardos-2014
  citation: "Pardos, Z. A., Baker, R. S. J. d., San Pedro, M. O. C. Z., Gowda, S. M., & Gowda, S. M. (2014). Affective states and state tests: Investigating how affect and engagement during the school year predict end-of-year learning outcomes. Journal of Learning Analytics, 1(1), 107–128."
  doi: "10.18608/jla.2014.11.6"
  design:
    family: observational
    design_detail: >-
      Correlational analysis of log data. Affect (boredom, engaged
      concentration, confusion, frustration) and behaviour (off-task, gaming)
      detectors were built from synchronised field observations of 229
      students in 2010 (student-level 5-fold cross-validation), then applied to
      every action in two full school years of ASSISTments logs (2004-2005 and
      2005-2006, 1,393 students, about 810,000 actions). Each student's
      estimates were averaged per skill and then across skills, separately for
      original and scaffolding questions, and correlated (Pearson) with the raw
      end-of-year MCAS mathematics score. A separate prediction analysis used
      linear regression.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

