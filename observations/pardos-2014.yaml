  population:
    description: >-
      Students in middle schools in one city in central Massachusetts
      (Worcester), described as diverse racially and socio-economically. The
      detector-development school was 40% Hispanic, 14% African-American, 4%
      Asian-American and 39% Caucasian, with per capita income significantly
      below the state average.
    age_or_stage: "Middle-school students; the article prints no age or grade figures."
    age: unreported
  context:
    setting: "ASSISTments web-based mathematics tutor, used in classroom computer lab sessions for state-test preparation, two hours twice a week for the school year; the most popular problem set randomly sampled 8th grade test-prep questions"
