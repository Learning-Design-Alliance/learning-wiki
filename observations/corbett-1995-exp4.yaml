  - "Experiment 2 (20 college students, n = 19 for test 3): tutor fit r = 0.75 across 345 goals (0.90 with best-fitting estimates); test 3 rAE r = 0.69; tutor error rate with test accuracy -0.25, -0.64, -0.68; with post hoc individual weights test 2 r = 0.51 (Table II). Table I's text layer is scrambled for Tests 2 and 3; the prose gives these figures."
  - "Experiment 3 (20 students, dynamic weights): tutor fit r = 0.79 across 345 goals; test 2 r = 0.31 (p < 0.10) with tutor error rate r = -0.63; test 3 r = 0.81; the report says test-2 sensitivity rests on between-student differences in the slip estimates. Table III."
