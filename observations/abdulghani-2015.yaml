# Abdulghani et al. (2015): a faculty development programme on MCQ item
# writing, evaluated by comparing one college's final examinations before
# (2012-2013) and after (2013-2014) two training workshops.
#
# WHAT THIS RECORD HOLDS: the test reliability (Kuder-Richardson 20) of each of
# the six 80-item final examinations, as Table 1 prints them, one observation
# per examination. KR-20 is computed over the items of one examination, so it
# varies per examination and is recorded at that grain.
#
# The Results text says the KR-20 of all examinations "were more than 0.92",
# and the Discussion repeats it; Table 1 prints 0.92 for two of the six. The
# table's per-examination values are recorded; the text's bound is not
# recorded as a separate figure, because it disagrees with the table at its
# own lower edge.
#
# The design is what the article calls it: "a quasi-experimental study", with
# one group of 25 faculty and no control group. Pre and post are different
# student cohorts sitting different examinations written by the same faculty.
#
# Read from a pdftotext text layer of the publisher's open-access article;
# the PDF itself was not available to view. Many inline statistics in that layer have lost their
# symbols ("=" printed as "5", "<" as ",", "±" as "6"), so the chi-square
# and mean-score figures are listed in not_yet_extracted rather than quoted.

schema_version: 2

study:
  key: abdulghani-2015
  citation: "Abdulghani, H. M., Ahmad, F., Irshad, M., Khalil, M. S., Al-Shaikh, G. K., Syed, S., Aldrees, A. A., Alrowais, N., & Haque, S. (2015). Faculty development programs improve the quality of Multiple Choice Questions items' writing. Scientific Reports, 5, 9556."
  doi: "10.1038/srep09556"
  design:
    family: quasi-experimental
    design_detail: >-
      Single-group pre-post comparison described by the authors as
      quasi-experimental: the MCQ final examinations of three first-year
      medical courses (respiratory, cardiovascular, renal) written by the same
      25 newly joined faculty before (academic year 2012-2013) and after
      (2013-2014) two workshops on MCQ item writing. No control group. Items
      analysed for difficulty, discrimination, non-functioning distractors,
      Bloom's level and item-writing flaws; examinations for KR-20 reliability;
      students for mean score and pass rate. Chi-square and ANOVA tests.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

evidence_base:
  unit: participants
  size:
    value: 25
    unit: participants
  additional_sizes:
    - value: 6
      unit: other
      note: "final MCQ examinations analysed: three courses in each of two academic years"
    - value: 80
      unit: items
      note: "MCQ items in each examination (Table 1: total number of MCQs 80; marks 30)"
  population:
    description: >-
      25 newly joined faculty members (demonstrators to professors) teaching
      first-year courses at the College of Medicine, Princess Nourah
      University, Riyadh, the largest female university in Saudi Arabia, whose
      College of Medicine opened in 2012-2013. The examinations were sat by
      first-year medical students, 61 to 80 per examination (Table 1).
    age_or_stage: "Newly joined faculty; first-year medical students. No age is printed for either group."
    age: unreported
  context:
    setting: "Final MCQ examinations of the respiratory, cardiovascular and renal blocks of a five-phase Bachelor's medicine curriculum; examinations reviewed by the Assessment and Evaluation Center, College of Medicine, King Saud University"
  arms:
    - id: pre-training-exams
      description: "Final examinations of academic year 2012-2013, written by the faculty before the workshops."
      size:
        value: 240
        unit: items
    - id: post-training-exams
      description: "Final examinations of academic year 2013-2014, written by the same faculty after a two-day workshop (interactive didactic sessions, revision of an MCQ construction checklist, small-group hands-on item writing) and following the checklist, with departmental review of items."
      size:
        value: 240
        unit: items
      dose:
        amount: 2
        unit: days
        detail: "Described both as 'Two days full time workshop' and as two workshops, at the beginning of academic year 2013-2014"
      delivery:
        grouping: small-group
        role: other
        basis: stated
      implementation_notes:
        - "On the second day participants worked in small groups of three to four to write five MCQs each against the agreed checklist."

comparisons: []

