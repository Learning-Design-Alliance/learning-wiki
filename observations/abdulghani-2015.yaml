not_yet_extracted:
  - "Overall mean scores before (18.29) and after (20.33) training with their spread: the text layer prints the plus-minus sign as '6' ('mean score 18.29 6 0.77'), so the SDs are not recorded."
  - "Per-examination mean scores (out of 30) and pass rates in Table 1, and the overall pass rate rising from 49.2 to 56.3%."
  - "Difficulty index distribution (Table 2: moderate items 150 of 240 pre, 183 of 240 post; easy 88 and 54), chi-square 11.61, p 0.003. The inline text statistics have lost their '=' and '<' symbols in the text layer."
  - "Discrimination index (DI > 0.15: 221 of 240 pre, 229 of 240 post), chi-square 2.27, p 0.13 in Table 2 (0.131 in the text)."
  - "Non-functioning distractors (28 pre, 13 post), chi-square 6.00, p 0.02; Bloom's K2 items (84 pre, 123 post), chi-square 12.91; item-writing flaws (47 pre, 5 post), chi-square 38.04. Table 2's p-value cells for the last two are garbled in the text layer ('( ,0.0001)', '(0. ,0001)')."
  - "Table 3 per-course ANOVA F and p values for difficulty, discrimination, distractors, Bloom's level and item-writing flaws."
