# Olds, Maher, Blunden & Matricciani (2010): normative sleep durations,
# bedtimes and wake times of 4,032 Australians aged 9-18 (three surveys,
# 2001-2007, one instrument).
#
# WHAT THIS FILE RECORDS:
#
#   * School-day bedtime (Table 4) and wake-up time (Table 5) means with their
#     within-age SDs, for boys and girls separately, at ages 9 to 14 and for
#     all ages together, as `measure_type: mean` named by `arm_ref`. Each
#     sex-by-age cell is its own arm and its own observation, as the source
#     prints it; nothing is pooled across sexes or ages. Non-school-day
#     columns and ages 15, 16 and 17+ are listed in not_yet_extracted.
#     The "all" rows' SDs include the spread between ages, so they are not
#     within-age SDs.
#   * The school-day rate at which bedtime gets later with age, the article's
#     own regression estimate, which the two bedtime and wake-time claims cite.
#   * `population.age` from Table 1 (All: mean 14.0, SD 2.2) and the stated
#     range, 9 to 18.
#   * No reliability is recorded. The article's one coefficient, the MARCA's
#     same-day test-retest ICC of 0.87 for sleep duration, is cited to the
#     instrument's development paper (ref. 22), not measured in this sample.
#
# CLOCK TIMES are recorded as minutes after midnight so that a mean and its
# SD share one unit (20:34 = 1234; SD 0:44 = 44). This is a change of notation
# for the clock reading, not a conversion of metric; each observation keeps
# the printed value in `interpretation` and in `unit`.
#
# Read from the PubMed Central copy (text only; no PDF). Each table row
# extracts one cell per line, so a quote is the whole row, whitespace
# normalised: age, then n and mean (SD) for boys' school days, boys'
# non-school days, girls' school days and girls' non-school days. The bedtime
# "all" row prints the girls' non-school-day mean as "10:16 (1:20)", which
# cannot be an evening bedtime as printed; that cell is not recorded.

schema_version: 2

study:
  key: olds-2010
  citation: "Olds, T., Maher, C., Blunden, S., & Matricciani, L. (2010). Normative data on the sleep habits of Australian children and adolescents. Sleep, 33(10), 1381–1388."
  doi: "10.1093/sleep/33.10.1381"
  design:
    family: observational
    design_detail: >-
      Cross-sectional normative study pooling three surveys (2007 Australian
      National Children's Nutrition and Physical Activity Survey, n = 2,367;
      2005 Health of Young Victorians Survey, n = 896; South Australian
      school studies 2001-2004, n = 769), all using the Multimedia Activity
      Recall for Children and Adults (MARCA), a computerised 24-h use-of-time
      recall over at least two sequential days. One night per participant
      randomly selected. Means and SDs by sex, one-year age group and day type
      (school or non-school day); three-factor ANOVAs; regressions on age.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: bedtimes-later-with-age-no-sex-difference
    bearing: supports
    anchor: olds-t-maher-c-blunden-s-matricciani-l-2010
  - claim: wake-times-stable-school-days-later-non-school
    bearing: supports
    anchor: olds-t-maher-c-blunden-s-matricciani-l-2010

evidence_base:
  unit: participants
  size:
    value: 4032
    unit: participants
  additional_sizes:
    - value: 1973
      unit: participants
      note: "boys (Table 1)"
    - value: 2059
      unit: participants
      note: "girls (Table 1)"
  population:
    description: >-
      Australians aged 9-18 from three surveys conducted 2001-2007; South
      Australia and Victoria over-represented, New South Wales
      under-represented; 5.8% obese, 17.6% overweight (Table 1).
    age_or_stage: "9 to 18 years; one-year age groups by age at last birthday, 17 and 18 grouped as 17+"
    age:
      unit: years
      min: 9
      max: 18
      mean: 14.0
      sd: 2.2
      note: "Table 1, All column (boys 14.1, SD 2.2; girls 14.0, SD 2.2)"
  context:
    setting: "Self- or interviewer-administered computerised 24-h use-of-time recall; school days are days the participant spent the bulk of the day at school"
    geography: "Australia"
  arms:
    - id: boys-age-9
      description: "Boys aged 9 (age at last birthday)."
    - id: boys-age-10
      description: "Boys aged 10 (age at last birthday)."
    - id: boys-age-11
      description: "Boys aged 11 (age at last birthday)."
    - id: boys-age-12
      description: "Boys aged 12 (age at last birthday)."
    - id: boys-age-13
      description: "Boys aged 13 (age at last birthday)."
    - id: boys-age-14
      description: "Boys aged 14 (age at last birthday)."
    - id: boys-all-ages
      description: "All boys in the pooled sample, ages 9-18 (17 and 18 grouped as 17+)."
    - id: girls-age-9
      description: "Girls aged 9 (age at last birthday)."
    - id: girls-age-10
      description: "Girls aged 10 (age at last birthday)."
    - id: girls-age-11
      description: "Girls aged 11 (age at last birthday)."
    - id: girls-age-12
      description: "Girls aged 12 (age at last birthday)."
    - id: girls-age-13
      description: "Girls aged 13 (age at last birthday)."
    - id: girls-age-14
      description: "Girls aged 14 (age at last birthday)."
    - id: girls-all-ages
      description: "All girls in the pooled sample, ages 9-18 (17 and 18 grouped as 17+)."

