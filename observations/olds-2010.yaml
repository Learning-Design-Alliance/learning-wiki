    comparison_ref: whole-sample-school-days
    outcome:
      construct: "Bedtime"
      source_language: "Bedtimes got later with age"
      measure: "Reported bedtime on school days, regressed against age"
      scale: "minutes later per year of age"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "school-day nights, cross-sectional across ages 9-18"
    result:
      measure_type: regression_coefficient
      estimate: 17
      ci_lower: 16
      ci_upper: 18
      interval_type: confidence
      unit: "minutes per year of age"
      p_value: "< 0.0001"
      model: "Bedtime regressed against age separately for school and non-school days; 16 (14-18) min per year on non-school days"
    moderators:
      reported:
        - variable: "Sex"
          relationship: "No difference in bedtimes between boys and girls"
          source_quote: "There were no differences in bedtimes between boys and girls."
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      The bracketed interval is not labelled at this point; the article labels
      the same format a 95% confidence interval at its first use, for sleep
      duration ("12 (95% confidence interval 10-13) min/ night"). The n behind
      the regression is not printed.
    source_quote: "Bedtimes got later with age (P < 0.0001), at the rate of 17 (16-18) min per year of age on school days, and 16 (14-18) min on non-school days."
    source_location: "Results, Bedtimes"

