  - "Table 9 (p. 798): d against the no-retrieval control, Experiment 1: multiple-choice 1.41 [0.69, 2.13], short-answer 1.31 [0.59, 2.03], hybrid-massed 1.61 [0.89, 2.33], hybrid-spaced 1.22 [0.50, 1.94]; confirmed on the page image."
  - "Table 10 (p. 798) hybrid contrasts for Experiment 1, from the page image: Hybrid-M − SA 0.47 [−0.25, 1.19], Hybrid-S − SA 0.34 [−0.38, 1.06], Hybrid-M − MC 0.06 [−0.66, 0.78], Hybrid-S − MC 0.03 [−0.69, 0.75]."
  - "Response times (Table 2): multiple-choice M = 11.3 s faster than short-answer M = 14.3 s, F(1, 30) = 10.74, partial eta squared .26."
