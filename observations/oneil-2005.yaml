  - "Self-efficacy and worry means by group (Tables 3 and 4)"
  - "Math means by gender and booklet and the significant treatment x gender x booklet interaction, whose post hoc comparisons were not significant (Table 1)"
  - "Easy-item and difficult-item subscores by group (p. 197)"
  - "Omitted items, incentive 1.45 against control 1.11 (F = 8.23; the text says the incentive group omitted more, and later says fewer); not recorded because the article contradicts itself on the direction"
  - "Effort correlations with self-efficacy (.44) and worry (.14), Table 5"
