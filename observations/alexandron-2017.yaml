# Alexandron, Ruipérez-Valiente, Chen, Muñoz-Merino & Pritchard (2017):
# CAMEO (copying answers using multiple existence online) in one MITx
# introductory physics MOOC on edX, 2014.
#
# Read from the authors' post-print (text layer); the citation is to the
# published version. Prevalence figures are the authors' log-mining results:
# accounts flagged by a detection algorithm (shared IP group, a harvester
# account obtaining the answer in the previous 24 hours, and six filters),
# checked by manual reading of 10 of the 65 flagged certified masters. They are
# detections, not confessions, and the authors call them a lower bound on
# cheating of all kinds.
#
# THRESHOLD AMBIGUITY IN THE SOURCE. Filter 3 (Section 2.2.2) requires that
# more than 5% of a master's correct submissions be potentially harvested,
# raised from the 1% used in the authors' earlier paper. Yet the Summary of
# findings and the Discussion describe the same 65 accounts (12.9%) as having
# obtained "more than 1%" of their correct answers by CAMEO, and the abstract
# says "about 10%" used it for more than 1%. The record keeps the 65 / 12.9%
# as printed and does not resolve which threshold describes them.
#
# The article prints no reliability or agreement coefficient for the
# detection. Its verification (all 10 sampled masters judged real CAMEO users;
# "90% confidence that at least 52") is recorded as the interval the authors
# give, not as a reliability.

schema_version: 2

study:
  key: alexandron-2017
  citation: "Alexandron, G., Ruipérez-Valiente, J. A., Chen, Z., Muñoz-Merino, P. J., & Pritchard, D. E. (2017). Copying@Scale: Using harvesting accounts for collecting correct answers in a MOOC. Computers & Education, 108, 96–114."
  doi: "10.1016/j.compedu.2017.01.015"
  design:
    family: observational
    design_detail: >-
      Educational data mining of the edX clickstream logs of one course run:
      a time-series detection algorithm for master:harvester account pairs,
      verified by comparing the delay distribution with random account pairs
      (Appendix B) and by in-depth reading of the logs of 10 masters drawn at
      random from the 65 certified masters. Descriptive prevalence, plus
      associations between question features (randomization, 'show answer'
      availability) and harvesting. No assigned conditions; the 'show answer'
      contrasts arose from settings enabled by mistake.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-author-manuscript
  verification: unverified

appears_in:
  - claim: cameo-prevalence-certificate-earners
    bearing: supports
    anchor: alexandron-2017
  - claim: cameo-prevalence-certificate-earners
    bearing: supports
    anchor: alexandron-2017-2

evidence_base:
  unit: other
  size:
    value: 502
    unit: other
  additional_sizes:
    - value: 502
      unit: other
      note: "accounts that earned a certificate (the headline size, and the denominator of the 12.9% and 3.7% figures)"
    - value: 1079
      unit: other
      note: "non-certificated accounts that completed at least 5% of the assessment items; the denominator of the 7.7% figure"
    - value: 13500
      unit: participants
      note: "registrants, given as 'about 13500'"
  population:
    description: >-
      Registrants of a 14-week introductory physics MOOC on edX in 2014. 83%
      male, 17% female; 37.7% secondary diploma or less, 34.5% college degree,
      24.9% advanced degree; US 27%, India 18%, UK 3.6%, Brazil 2.8%, 152
      countries in all. All demographics self-reported, and they describe the
      course's participants, not specifically the certificate earners.
    age_or_stage: "Adults and older adolescents; 45% under 26, 39% aged 26 to 40, 16% 41 and above (self-reported)"
    age: unreported
  context:
    setting: >-
      MITx introductory physics MOOC on edX, 2014 run: 12 mandatory and two
      optional units, about 1000 questions, many with randomized parameters.
      Honor certificates were given automatically at 60% of the course points.
      'Show answer' was available after attempts were exhausted, but disabled
      for most quiz questions; correct/incorrect feedback was always given.
  arms:
    - id: certificate-earners
      description: "Accounts that earned a certificate in the course."
      size:
        value: 502
        unit: other
    - id: non-certificate-earners
      description: "Accounts that did not earn a certificate but completed at least 5% of the assessment items."
      size:
        value: 1079
        unit: other

comparisons: []

