      source_language: "master accounts"
      measure: "Certificated accounts flagged by the CAMEO detection algorithm as master accounts (all six filters passed)"
      scale: "number of accounts"
      direction: lower-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "whole 14-week course run"
    result:
      measure_type: count
      estimate: 65
      unit: "certificated master accounts"
      ci_lower: 52
      ci_upper: 65
      interval_type: confidence
      descriptives: "65 master accounts = 12.9% of the 502 certificate earners; they operated 78 harvesting accounts"
      note: >-
        The interval is the authors' 90% confidence interval, from the manual
        verification of a random sample of 10 of the 65 masters ("90%
        confidence that at least 52 of the master accounts receiving
        certificates are demonstrably using this technique").
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      A detection count, not an effect. The share of correct answers that
      qualified an account is stated as more than 5% in filter 3 but as more
      than 1% in the Summary and Discussion (see header). The interval is
      90%, not 95%.
    source_quote: "It shows that our algorithm detected 65 master accounts – 12.9% of the certificate earners in the course."
    source_location: "Section 3.2 and Table 1; interval in Section 2.2.4 and Section 4.1"

