    source_language: reading comprehension
    measure: SAT reading comprehension questions from The College Board, vocabulary-only questions removed;
      number correct
    scale: number of correct responses
    direction: higher-is-better
    role: proximal-outcome
    role_basis: inferred
    valued_by: []
  time: &id001
    label: questions answered after reading each passage, no time limit
  result:
    measure_type: cohens_d
    estimate: 2.37
    statistic: t(23) = 11.63
    p_value: < .001
    descriptives: interruption M = 9.04 (SD 2.03, 95% CI [8.23, 9.85]) vs no interruption M = 10.8 (SD
      2.11, 95% CI [9.96, 11.64])
    note: The source does not say how d was computed for the paired design. Individual analyses showed
      no participant scoring higher on an interruption condition than on a no-interruption condition.
