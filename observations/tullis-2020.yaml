    source_quote: "Broadly, only 5% of correct answers were switched to in- correct, while 28% of incorrect answers were switched to correct following discussion."
    source_location: "Results, Does accuracy change through discussion?; Fig. 2"

  - id: keep-own-answer-on-disagreement
    comparison_ref: disagreement-trials
    outcome:
      construct: "Keeping one's own answer when the partner disagrees"
      source_language: "they kept their own answer"
      measure: "Share of disagreement trials on which the student's final answer was their own initial answer"
      scale: "percent of disagreement trials"
      direction: contextual
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "immediately after discussion of the same question"
    result:
      measure_type: probability
      estimate: 66
      unit: "percent"
      note: "When the partner was more confident, students switched to the partner's answer 50% of the time; final answers aligned with the more confident peer 58% of the time."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "When students disagreed with their partner, they were more likely to stick with their own answer than switch; they kept their own answer 66% of the time."
    source_location: "Discussion, p. 9"

  - id: keep-answer-own-correct-or
    comparison_ref: disagreement-trials
    outcome:
      construct: "Keeping one's own answer when the partner disagrees"
      source_language: "the odds of keeping one’s answer"
      measure: "Whether the student kept their initial answer on a disagreement trial"
      scale: "odds ratio for an initially correct own answer, both partners' confidence controlled"
      direction: contextual
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
