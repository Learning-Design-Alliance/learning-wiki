    result:
      measure_type: odds_ratio
      estimate: 4.48
      ci_lower: 2.92
      ci_upper: 6.89
      interval_type: confidence
      model: >-
        Logit mixed-level regression on disagreement trials predicting keeping
        one's answer from own confidence (mean-centred), partner confidence
        (mean-centred) and own initial correctness (Table 5: own correct beta
        1.50, SE 0.22, Wald z 6.73, p < .0001).
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      The number of disagreement trials in the model is not printed in the
      text.
    source_quote: "the odds of keeping one’s answer increased 4.48 times (2.92–6.89)."
    source_location: "Results, Does correctness predict switching beyond confidence?; Table 5"

  - id: keep-answer-own-confidence-or
    comparison_ref: disagreement-trials
    outcome:
      construct: "Keeping one's own answer when the partner disagrees"
      source_language: "the odds of keeping one’s answer"
      measure: "Whether the student kept their initial answer on a disagreement trial"
