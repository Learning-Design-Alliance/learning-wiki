# NWEA (2026), MAP Growth Technical Report for 2024-2025: score reliability of
# the MAP Growth Math test in grades 3-8.
#
# The report's own front matter reads "MAP Growth Technical Report for
# 2024–2025", dated April 2, 2026, "(c) 2026 HMH Education Company". That
# matches the register's "MAP Growth technical report 2024-2025, NWEA 2026";
# only the PDF's file name says "2025". It names no individual authors, so the
# citation names NWEA as corporate author with HMH Education Company as
# publisher. Grey literature with no DOI on the front matter: `doi` omitted.
# Read from the publisher PDF (147 pp.); only chapter 7's reliability section
# (7.6, Tables 7.7 and 7.10) and the demographics section (9.1) were read.
#
# Tables 7.7 and 7.10 come out of the text layer column by column. Each
# source_quote is a verbatim run of that text; the grade on each row was
# checked on the page images (report pp. 71 and 76). In Table 7.7 an (N,
# reliability) pair stays together in the text, so the quotes are the grade
# 3-8 pairs; in Table 7.10 the N column is separate, so the quote is the
# reliability column for Math grades K-12.
#
# Ranges over grades 3-8 are the lowest and highest of six printed per-grade
# values; the report does not print the range itself, and each observation
# says so. The report prints grades, never ages: `age: unreported`.
#
# Test-retest here is the Pearson correlation of RIT scores from two terms of
# one school year on adaptive (so alternate) forms: the report calls it a mix
# of test-retest and alternate-forms reliability, spread over months, which
# includes true growth between terms. It is recorded as `reliability` over
# `occasions` with statistic `other` and the report's own description in
# `form`, never as a plain test-retest coefficient.

schema_version: 2

study:
  key: nwea-2026
  citation: "NWEA. (2026, April 2). MAP Growth technical report for 2024–2025. HMH Education Company. https://www.nwea.org/uploads/MAP-Growth-Technical-Report-2025.pdf"
  design:
    family: observational
    design_detail: >-
      Psychometric technical report on operational 2024-2025 MAP Growth test
      events (computer-adaptive interim tests, Rasch-scaled RIT scores, given
      fall, winter and spring). Reliability analysed as IRT marginal
      reliability per subject, grade and term, and as the Pearson correlation
      between RIT scores of the same students in two terms. No intervention
      and no comparison group.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: map-growth-reliability-095-subject-and-interval-variation
    bearing: supports
    anchor: map-growth-technical-report-for-20242025-2026

evidence_base:
  unit: other
  size:
    value: 6
    unit: other
  additional_sizes:
    - value: 785629
      unit: participants
      note: "Math grade 4 students with fall-winter, fall-spring and winter-spring score pairs analysed for test-retest reliability (Table 7.10)"
  population:
    description: >-
      US K-12 students who took MAP Growth in 2024-2025; the records below are
      Math, grades 3-8, one row of the report's tables per grade (the six
      grades counted in `size`). Per-grade Ns are several hundred thousand to
      about a million students per term (Tables 7.7 and 7.10). Across Math and
      Reading the report gives examinee counts above 8.5 million students per
      term, with female students about 48.9% to 49.3%. Operational data from schools using the
      test, not a designed sample.
    age_or_stage: "Grades 3 to 8 (the report covers K-12); the report prints no ages"
    age: unreported
  context:
    setting: "Operational MAP Growth Math testing in US schools, fall, winter and spring of the 2024-2025 school year, proctored, in school or remote"
  arms:
    - id: math-grade-4
      description: "Grade 4 students taking MAP Growth Math in 2024-2025."

comparisons:
  - id: math-grades-3-8
    kind: none
    description: "MAP Growth Math score reliability across grades 3-8, each grade analysed separately; no contrast between groups."

observations:

  - id: math-test-retest-fall-spring-grades-3-8
    comparison_ref: math-grades-3-8
    outcome:
      construct: "Stability of MAP Growth Math scores from fall to spring"
      source_language: "Test-retest with alternate forms reliability"
      measure: "Pearson correlation between MAP Growth Math RIT scores of the same students in fall and spring 2024-2025, computed per grade"
      scale: "correlation coefficient"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "fall to spring of the 2024-2025 school year"
    result:
      measure_type: reliability
      estimate_range:
        lower: 0.85
        upper: 0.89
        over:
          value: 6
          unit: other
      reliability:
        statistic: other
        over: occasions
        form: "Pearson correlation of RIT scores in two terms; 'a mix between test-retest reliability and a type of alternate forms reliability', spread over several months"
      descriptives: >-
        Math Fall/Spring per grade as printed: grade 3 0.85 (N 813,405),
        grade 4 0.87 (785,629), grade 5 0.89 (788,428), grade 6 0.87
        (740,051), grade 7 0.88 (707,251), grade 8 0.85 (600,893).
      note: >-
        Lowest and highest of the six printed per-grade values (grades 3 and 8;
        grade 5); the report prints no grade 3-8 range.
      interpretation: "The report reads fall-spring as the lowest of the three windows because true growth over the longer interval attenuates the stability coefficient"
    moderators:
      reported:
        - variable: "Interval between test occasions"
          relationship: "Winter-spring coefficients highest, then fall-winter, fall-spring lowest"
          source_quote: "Reliability was generally highest for winter–spring comparisons, followed by fall–winter, with fall–spring comparisons yielding the lowest coefficients."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      Quote is the Fall/Spring column of Table 7.10 for Math, grades K to 12
      top to bottom, as the text layer gives it; grades 3-8 are the fourth to
      ninth values, checked on the page image (p. 76). A stability
      coefficient over months includes true growth, not only measurement
      error, as the report says.
    source_quote: "Fall/Spring Reliability 0.70 0.79 0.82 0.85 0.87 0.89 0.87 0.88 0.85 0.76 0.74 0.74 0.72"
    source_location: "Section 7.6.2, Table 7.10 (p. 76), Math rows, Fall/Spring column"

