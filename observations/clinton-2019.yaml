# Clinton (2019): reading from paper compared to screens, a systematic review
# and meta-analysis of randomised experiments, 2008-2018.
#
# SIGN CONVENTION. "A positive Hedges' g indicates that the mean values for
# reading from screens were greater." The text layer read first drops the
# minus signs ("g = .25 ... 95% CI = [ .37, .12]"). The signs were checked
# against page images of the publisher PDF: the overall estimate and interval
# on p. 19, and every point estimate in the abstract (p. 1). The subgroup
# intervals were not viewed; their signs follow from interval order around
# the confirmed estimates. The quotes give the article's characters: g = −.25
# [−.37, −.12] overall, −.32 expository, −.04 [−.18, .11] narrative, −.33
# literal, −.26 inferential, .08 [−.32, .48] reading time, .20 [.07, .33]
# calibration.
#
# Each of the 33 studies contributes one independent effect size per analysis,
# so k counts studies. Table 1 (the studies) and Tables 2-6 (per-study g) are
# scrambled in the text layer and are not recorded.

schema_version: 2

study:
  key: clinton-2019
  citation: "Clinton, V. (2019). Reading from paper compared to screens: A systematic review and meta-analysis. Journal of Research in Reading, 42(2), 288–325."
  doi: "10.1111/1467-9817.12269"
  design:
    family: meta-analysis
    design_detail: >-
      Systematic review and random-effects meta-analysis of experiments with
      random assignment to screen or paper reading of the same texts (or
      within-subject designs counterbalancing texts), disseminated 2008-2018,
      with readers who had fundamental reading skills and read in their native
      language. Outcomes: reading performance (general, literal, inferential),
      reading time and calibration. Moderators genre and age group.
  synthesis:
    model: "Random effects models (Comprehensive Meta-Analysis v3), Hedges' g"
    heterogeneity_statistic: "I2"
    heterogeneity_thresholds: "I2 above 20% taken to warrant moderator analysis; at least six effect sizes per moderator category"
    quality_tool: "Study Design and Implementation Assessment Device (Study DIAD), selected questions"
    reporting_guideline: "PRISMA flow diagram (Moher et al., 2009)"
    search:
      databases:
        - Educational Resources Information Center
        - Science Direct
        - Taylor and Francis Online
        - Sage
        - Springerlink
        - PsychINFO
        - Wiley Online
      date_range: "Database searches October-November 2016; forward search in Google Scholar May 2018"
      records_screened: 2042
      records_included: 29
    data_handling:
      - "Means of outcomes used when a study reported more than one performance outcome or condition per medium"
      - "Authors contacted for missing statistics; one report excluded for lack of them"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: screen-reading-performance-disadvantage
    bearing: supports
    anchor: clinton-2019
  - claim: genre-moderates-screen-paper-performance
    bearing: supports
    anchor: clinton-2019
  - claim: age-not-moderator-screen-paper-performance
    bearing: supports
    anchor: clinton-2019
  - claim: literal-inferential-both-screen-disadvantage
    bearing: supports
    anchor: clinton-2019
  - claim: literal-inferential-both-screen-disadvantage
    bearing: supports
    anchor: clinton-2019-2
  - claim: no-reading-time-difference-medium
    bearing: supports
    anchor: clinton-2019
  - claim: paper-better-calibration-metacognition
    bearing: supports
    anchor: clinton-2019

evidence_base:
  unit: studies
  size:
    value: 33
    unit: studies
  additional_sizes:
    - value: 29
      unit: reports
      note: "reports containing the 33 studies"
    - value: 2799
      unit: participants
      note: "participants across the 33 studies of reading performance"
    - value: 1233
      unit: participants
      note: "participants in the 14 studies of reading time"
    - value: 698
      unit: participants
      note: "participants in the 11 studies of calibration"
  population:
    description: >-
      Readers with fundamental reading skills, no reported disabilities,
      reading in their native language. Adult studies were almost entirely
      college students.
    age_or_stage: >-
      Coded as child (under 18 and/or secondary school or younger) or adult
      (over 18 and/or college); 26 adult and 7 child studies. Table 1 gives
      participants per study; no pooled age figure is printed.
    age: unreported
  context:
    setting: "Supervised classroom or laboratory sessions; texts longer than one sentence, the same texts in both media"
  variation:
    - dimension: "Age group"
      distribution: "26 adult studies, 7 child studies (reading performance)"
    - dimension: "Genre"
      distribution: "22 expository, 7 narrative in the genre analysis; 4 studies excluded for lack of results by genre"
  arms:
    - id: screen
      description: "Reading the texts from a screen (computer, tablet, e-reader and similar)."
    - id: paper
      description: "Reading the same texts from paper."
    - id: screen-expository
      description: "Screen reading in studies using expository texts."
    - id: paper-expository
      description: "Paper reading in studies using expository texts."
    - id: screen-narrative
      description: "Screen reading in studies using narrative texts (only the narrative texts where a study used both)."
    - id: paper-narrative
      description: "Paper reading in studies using narrative texts."

comparisons:
  - id: screen-vs-paper
    kind: other
    index_arm: screen
    reference_arm: paper
    description: "Screen against paper reading of the same texts, by random assignment between groups or within-subject with counterbalanced texts, pooled across studies."
  - id: screen-vs-paper-expository
    kind: other
    index_arm: screen-expository
    reference_arm: paper-expository
    description: "Screen against paper, studies with expository texts."
  - id: screen-vs-paper-narrative
    kind: other
    index_arm: screen-narrative
    reference_arm: paper-narrative
    description: "Screen against paper, studies with narrative texts."
  - id: coding-agreement
    kind: none
    description: "Agreement between the author's coding and an independent research assistant's on 25% of the reviewed articles."

observations:

  - id: reading-performance-overall
    sample:
      value: 33
      unit: studies
    comparison_ref: screen-vs-paper
    outcome:
      construct: "Reading comprehension"
      source_language: "reading performance"
      measure: "Reading comprehension assessments (multiple-choice, open-ended, free recall); means of literal and inferential measures where a study had both"
      scale: "Hedges' g, screens minus paper"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "immediately after reading, within the session"
    result:
      measure_type: hedges_g
      estimate: -0.25
      standard_error: 0.06
      ci_lower: -0.37
      ci_upper: -0.12
      interval_type: confidence
      p_value: "< .001"
      k:
        value: 33
        unit: studies
      heterogeneity:
        statistic: I2
        value: 70.35
        unit: percent
        interpretation: "Sufficient to warrant moderator analysis"
      publication_bias:
        method: "Funnel plot and Egger's test of the intercept"
        finding: "Funnel plot symmetrical; Egger intercept 1.29, p = .20; publication bias judged unlikely"
      model: "random-effects"
      note: "n = 2,799 participants. One-study-removed analyses changed nothing."
    moderators:
      reported:
        - variable: "Text genre (expository or narrative)"
          relationship: "Significant moderator; the screen deficit was found for expository texts and not narrative texts"
          source_quote: "The genre of the experimental texts was significant as a moderator, Qbetween(1) = 6.86, p = .01, R2 = .13."
        - variable: "Age group (child or adult)"
          relationship: "Not a significant moderator (26 adult against 7 child studies)"
          source_quote: "The age group (child or adult) of the participants was examined, but it was not a significant moderator, Qbetween(1) = .07, p = .80, R2 = .04, indicating that the negative effect on performance for reading text from screens rather than paper did not vary for readers who were adults or children."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: partial
      effect_size: observed
      pooled_k: observed
    source_quote: "Based on the random effects model, reading text from screens had a small, but significant negative effect on performance scores compared to reading from paper, g = −.25, k = 33, SE = .06, 95% CI = [−.37, −.12], p < .001"
    source_location: "RQ1, Overall performance; Table 2"

