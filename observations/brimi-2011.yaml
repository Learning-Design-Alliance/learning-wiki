# Brimi (2011): 73 English teachers in one district, all trained in the same
# writing-assessment scheme (NWREL 6+1 Traits), grade one copy of the same
# student essay on a 100-point scale.
#
# READ FROM the publisher's full text (PARE 16(17), 12 pp., text layer), with
# pages 6 and 12 viewed as images to confirm Table 1 and Appendix C.
#
# WHAT IS RECORDED: the spread of the 73 grades as the article prints it.
# Table 1's mean and SD (to the decimals printed), the range in points, and the
# letter-grade counts. The article computes NO reliability coefficient (no ICC,
# kappa or agreement figure): its "reliability" is this spread. So there is no
# measure_type reliability observation, and none is derived from the SD.
#
# AN INTERNAL INCONSISTENCY, left as printed: the Results text says "eight of
# 75", but Appendix C lists a frequency of 5 for a score of 75 (its cumulative
# percent, 20.5 to 27.4, agrees with 5). The letter-grade counts in the text
# (10/18/30/9/6) do agree with Appendix C under the district's printed grading
# scale. Nothing below rests on the per-score counts.
#
# No claim page cites this source, so there is no appears_in.

schema_version: 2

study:
  key: brimi-2011
  citation: "Brimi, H. M. (2011). Reliability of grading high school work in English. Practical Assessment, Research & Evaluation, 16(17)."
  doi: "10.7275/j531-fz38"
  design:
    family: observational
    design_detail: >-
      Descriptive single-group study, framed as a replication of Starch and
      Elliot (1912). After mandatory district training in the 6+1 Traits of
      Writing, ninth- and tenth-grade English teachers were each given a copy
      of the same student argumentative essay at spring 2008 follow-up
      sessions, asked to build a 6+1 rubric and score the essay on a 100-point
      scale, with unlimited time and without consulting colleagues. Only the
      distribution of grades is analysed; no inferential statistics.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

evidence_base:
  unit: participants
  size:
    value: 90
    unit: participants
  additional_sizes:
    - value: 89
      unit: participants
      note: "teachers who returned a graded paper (one refused)"
    - value: 86
      unit: participants
      note: "after three papers were discarded (letter grades only, or illegible trait scores)"
    - value: 73
      unit: participants
      note: "teachers who gave a numerical grade on the 100-point scale as asked; the analysed group"
    - value: 12
      unit: schools
      note: "schools the 90 trained teachers came from"
    - value: 1
      unit: other
      note: "student essay graded by every teacher (\"Why Abortion Should Be Illegal\", Appendix B)"
  population:
    description: >-
      Ninth- and tenth-grade English (Language Arts) teachers in one public
      school district serving over 400,000 residents and 17,000 public-school
      students; the district's K-12 population 80.3% Caucasian, 14.7%
      African-American. No data were recorded on the teachers' gender,
      experience or educational background, to keep them anonymous.
    age_or_stage: "Practising high school teachers; no age figure recorded or printed"
    age: unreported
  context:
    setting: >-
      Follow-up professional development sessions at each teacher's school,
      spring 2008. State-mandated grading scale: A 93-100, B 85-92, C 75-84,
      D 70-74, F below 70. The essay was a final draft of a research paper by
      a former Advanced Placement student of the author, who had scored it 83.
  arms:
    - id: trained-teachers-100-point
      description: >-
        The 73 teachers who graded the essay on a 100-point scale, each using a
        rubric of their own built on the 6+1 traits (Ideas, Organization,
        Voice, Word Choice, Sentence Fluency, Conventions, Presentation).
      size:
        value: 73
        unit: participants
      dose:
        amount: 16
        unit: hours
        detail: "Two summer days with the district writing coach (16 hours total), plus three hours earlier for ninth-grade teachers and two hours in the fall for tenth-grade teachers, and in-year reinforcement sessions"
      implementation_notes:
        - "Not all teachers complied with the request to construct a 100-point rubric; some gave a grade with few or no comments."

comparisons: []

