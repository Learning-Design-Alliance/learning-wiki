  - id: grade-mean-sd
    sample:
      value: 73
      unit: participants
    arm_ref: trained-teachers-100-point
    outcome:
      construct: "Grade assigned to one student essay"
      source_language: "Final Grade"
      measure: "Each teacher's final score for the same essay on a 100-point scale"
      scale: "points out of 100"
      direction: contextual
      role: other
      role_basis: ambiguous
      valued_by: []
    time:
      label: "spring 2008, after the training"
    result:
      measure_type: mean
      estimate: 81.1599
      sd: 9.55938
      unit: "points on a 100-point scale"
      descriptives: "N 73, minimum 50.00, maximum 96.00 (Table 1)"
      interpretation: "The SD is the spread of 73 teachers' grades for one paper, i.e. between-grader variation, not variation between students."
    moderators:
      reported: []
      candidate:
        - "Graders' own views on the essay's topic (abortion), which the author acknowledges could have skewed judgement"
        - "Whether a teacher built and followed a 100-point 6+1 rubric as asked"
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      A descriptive mean, not an effect. Population detail is partial because
      the teachers' characteristics were deliberately not recorded.
    source_quote: "Final Grade 73 Minimum Maximum 50.00 96.00 Mean Std. Deviation 81.1599 9.55938"
    source_location: "Table 1, p. 6 (text layer runs the header and row together; confirmed on the page image)"

