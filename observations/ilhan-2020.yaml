# İlhan, Boztunç Öztürk & Şahin (2020): item type, cognitive level and item
# difficulty in the TIMSS 2015 Turkey mathematics tests.
#
# The unit of analysis is the ITEM, not the student. Each item's difficulty
# index is the proportion of Turkish students answering it correctly (for 0-1-2
# items, Formula 1), so a correlation here is computed over 215 or 178 items.
# The 12,535 students are the population whose answers produced the indices;
# they are not the n of any test below.
#
# The difficulty index runs toward 1 for EASY items. A negative correlation of
# cognitive level with the index therefore means higher-level items were
# harder. Item type was dummy-coded "multiple-choice: 1, open-ended: 0", so a
# positive type correlation means multiple-choice items were easier.
#
# The two grades are two strata of the item pool, recorded as two arms; every
# result rests on one stratum (`arm_ref`) and none is a contrast between them.
# The authors' "25% at eighth grade, 7% at fourth" compares a step-1 R2 (.25)
# with a step-2 R2 increment (.19 - .12); both figures are recorded as printed
# in the model text and no like-for-like comparison is computed.
#
# Read from the text layer only (no PDF). Tables 3 and 4 came out in reading
# order with their columns flattened; the rows quoted below are legible and
# their values agree with the prose. Formula 1 is glyph codes in the text layer
# and is not recorded. The article prints no student ages and no reliability
# coefficient for any measure.

schema_version: 2

study:
  key: ilhan-2020
  citation: "İlhan, M., Boztunç Öztürk, N., & Şahin, M. G. (2020). The effect of the item's type and cognitive level on its difficulty index: The sample of TIMSS 2015. Participatory Educational Research, 7(2), 47–59."
  doi: "10.17275/per.20.19.7.2"
  design:
    family: observational
    design_detail: >-
      Descriptive secondary analysis of published TIMSS 2015 item statistics
      for Turkey ("depicting the facts without any intervention"). Item
      information tables (type, cognitive level) were joined to item percent
      correct statistics; item difficulty indices were then compared by
      independent-samples t-test (type) and one-way ANOVA (cognitive level),
      correlated with type and level, and regressed on both by stepwise
      multiple regression, separately for Grades 8 and 4.

