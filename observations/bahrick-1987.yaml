# Bahrick & Phelps (1987): recall and recognition of 50 English-Spanish word
# pairs about 8 years after they were learned and relearned at intersession
# intervals of 0, 1 or 30 days (Bahrick, 1979).
#
# The front matter names two authors, Harry P. Bahrick and Elizabeth Phelps.
# Crossref's record spells the second author "Phelphs"; the article's spelling
# is used.
#
# First read from the text layer of a scan of the published article, in which
# Tables 1 to 5 came out as runs of digits whose columns cannot be told apart
# (Table 2's recall row read "15861"). On 2026-11-27 the article was re-read
# from the rendered page images (pp. 344-348), and every table is legible there.
# FROM PAGE IMAGES: the Table 2 observations (table2-*), whose source_quote is
# the printed row (interval, recall %, recognition %, failed-both %); the Table 1
# rows quoted in the arms' implementation_notes; the ANOVA observations
# (anova-*); and the prose figures overall-recall-approx-10 and
# recall-words-one-two-presentations, whose sentences the text layer had
# interleaved with table digits. The older prose quotes were checked against the
# same images. Quotes avoid line-break hyphens ("presenta- tion").
#
# Table 1 prints N per training-condition row, not per primary interval, so the
# arms carry the rows as printed and no size: a total would be a sum the
# article does not print.
#
# There is no reliability figure: the article prints none for the recall or
# recognition scoring. There is no age figure: participants are described only
# as former undergraduates.

schema_version: 2

study:
  key: bahrick-1987
  citation: "Bahrick, H. P., & Phelps, E. (1987). Retention of Spanish vocabulary over 8 years. Journal of Experimental Psychology: Learning, Memory, and Cognition, 13(2), 344-349."
  doi: "10.1037/0278-7393.13.2.344"
  design:
    family: longitudinal
    design_detail: >-
      Eight-year follow-up retention test of participants from an earlier
      training study (Bahrick, 1979). In that study the interval between
      successive relearning sessions (0, 1 or 30 days) was a between-subjects
      independent variable; the article does not say how participants were
      assigned to intervals. Intervals were changed for most participants
      after five to seven relearning sessions, with one to four further
      sessions; the analysis groups participants by their primary interval
      without regard to the change, which the authors say dilutes the
      interval's effect. Participants received six to nine sessions; the
      average number varied only slightly across primary intervals (7.3-7.8).
      Each session ran, with a dropout technique, until a test trial on which
      all remaining items were passed. Participants with Spanish exposure in the retention
      interval were excluded. A control group of alumni who never took part in
      the training took the same tests. Word difficulty (presentations needed
      during training) is an observed, not a manipulated, variable.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

evidence_base:
  unit: participants
  size:
    value: 35
    unit: participants
  additional_sizes:
    - value: 10
      unit: participants
      note: "control group: alumni of the same graduating classes who had no formal Spanish training and did not take part in the original study"
    - value: 64
      unit: participants
      note: "original participants sent a letter asking them to take part"
    - value: 48
      unit: participants
      note: "affirmative responses; 13 of those willing were then eliminated for Spanish exposure or for not returning a test"
    - value: 50
      unit: items
      note: "English-Spanish word pairs learned and tested"
  population:
    description: >-
      Former undergraduates (most of them former students of one of the
      investigators) who had learned and relearned 50 English-Spanish word
      pairs in the Bahrick (1979) study, with no residence in Spanish-speaking
      or bilingual areas and no formal Spanish instruction during the
      retention interval.
    age_or_stage: "Former college students tested about 8 years after training; no age figure is printed."
    age: unreported
  context:
    setting: "Recall and then recognition tests mailed to participants and completed at home at their own pace; five participants in central Ohio were tested individually by the investigators."
  arms:
    - id: interval-30-day
      description: "Relearning sessions spaced 30 days apart (primary interval)."
      implementation_notes:
        - "Table 1 rows (sessions prior to change; changed interval; sessions after change; N): '30 7 1 1 7' and '30 7 none 0 4'."
    - id: interval-1-day
      description: "Relearning sessions spaced 1 day apart (primary interval)."
      implementation_notes:
        - "Table 1 rows (sessions prior to change; changed interval; sessions after change; N): '1 6 none 0 1', '1 6 30 1 2', '1 6 30 2 6', '1 3 30-1 2, 2 5'."
    - id: interval-0-day
      description: "Each relearning session begun immediately after the previous one ended (primary interval)."
      implementation_notes:
        - "The zero interval is associated with the largest number of sessions."
        - "Table 1 rows (sessions prior to change; changed interval; sessions after change; N): '0 6 none 0 1', '0 5 30 1 1', '0 6 1 1 3', '0 6 30-1 1, 2 5'."
    - id: control-untrained
      description: "Alumni who never learned the word pairs, tested with the same recall and recognition tests as a baseline for incidental knowledge and chance."

comparisons:
  - id: interval-30-vs-0
    kind: between-groups
    index_arm: interval-30-day
    reference_arm: interval-0-day
    description: "Primary intersession interval of 30 days against 0 days, recall after about 8 years."
  - id: interval-omnibus
    kind: between-groups
    index_arm: interval-30-day
    reference_arm:
      - interval-1-day
      - interval-0-day
    description: >-
      Main effect of the primary intersession interval across the three
      trained groups (ANOVA on the Table 4 data). An omnibus test over three
      arms has no single index and reference; read it as the three interval
      arms.
  - id: trained-sample-pooled
    kind: none
    description: "All trained participants and all 50 words pooled over the three intervals; no counterfactual."
  - id: trained-sample-word-difficulty
    kind: none
    description: "All trained participants pooled over the three intervals, words grouped by the number of presentations each needed during training."

observations:

  - id: recall-ratio-30-vs-0-day
    comparison_ref: interval-30-vs-0
    outcome:
      construct: "Long-term vocabulary recall"
      source_language: "recall probability"
      measure: "Written recall of the Spanish word for each of 50 English words; minor spelling errors disregarded, phonetically unambiguous responses scored correct"
      scale: "ratio of recall probabilities"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "about 8 years after training ended"
      offset:
        value: 8
        unit: years
        from: "end of training"
    result:
      measure_type: other
      estimate: 2.5
      unit: "ratio (30-day recall probability over 0-day recall probability)"
      interpretation: "Recall after 30-day spacing was 2.5 times recall after 0-day spacing. Elsewhere the authors call it 'a factor of at least 2.5 to 1'."
    moderators:
      reported: []
      candidate:
        - "Changes of interval during training, which the authors say dilute and underestimate the interval effect."
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: partial
    observability_notes: >-
      A ratio as the prose states it. The recall percentages behind it are
      recorded from Table 2 as table2-recall-30-day and table2-recall-0-day.
      The retention interval averaged about 8 years, ranging from 81 to 103
      months. The ANOVA main effect of interval on recall is
      anova-interval-recall.
    source_quote: "The recall probability associated with the 30-day interval is 2.5 times the probability associated with the zero interval."
    source_location: "Results and Discussion, The Effect of the Intersession Interval"

  - id: control-recognition
    arm_ref: control-untrained
    outcome:
      construct: "Recognition without training (incidental knowledge and chance)"
      source_language: "were able to identify 62% of the Spanish words on the recognition test"
      measure: "Multiple-choice recognition: each English word with the correct Spanish word and five Spanish foils matched on part of speech; guessing required"
      scale: "percent of words identified"
      direction: contextual
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "tested at the time of the 8-year follow-up"
    result:
      measure_type: mean
      estimate: 62
      unit: "percent of words identified on the recognition test"
      interpretation: "The baseline against which the trained groups' recognition of unrecalled words must be read; the authors attribute it mainly to knowledge of French or Latin."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: "No SD is printed. Table 2 prints the same 62 in the control row's recognition column (percent of nonrecalled words recognized); the control group's recall is table2-recall-control."
    source_quote: "in the control group were able to identify 62% of the Spanish words on the recognition test, probably because most subjects had some knowledge of French or Latin."
    source_location: "Results and Discussion, The Effect of the Intersession Interval"

