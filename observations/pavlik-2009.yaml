  size:
    value: 4
    unit: other
  additional_sizes:
    - value: 4
      unit: other
      note: "datasets: Fractions and Algebra (Bridge to Algebra Cognitive Tutor), Geometry (Geometry Cognitive Tutor, Angles and Areas units), Physics (Andes); the number of students and observations per dataset is in the observations' descriptives as printed"
  population:
    description: >-
      Logged responses of students using Carnegie Learning's Bridge to Algebra
      and Geometry Cognitive Tutors and the Andes Physics tutor, with each step
      labelled with the knowledge component(s) it was coded to need. The
      Geometry and Physics data came from the PSLC DataShop. The number of
      students is not printed.
    age_or_stage: "Fractions and Algebra grades 5-8; Geometry and Physics grades 9-12"
    age: unreported
  context:
    setting: "Intelligent tutoring systems in use (the three Carnegie Learning datasets came from tutors that used knowledge tracing)"
  arms:
    - id: pfa
      description: "Performance Factors Analysis: KC easiness plus separately weighted counts of the student's prior successes and failures on each KC, no student parameter."
    - id: lfa
      description: "Learning Factors Analysis: student ability, KC easiness and a per-KC learning rate on the count of prior opportunities."
    - id: lfa-ns
      description: "LFA without the student ability parameter."
    - id: kt-1
      description: "Knowledge tracing fitted with Beck and Leszczenski's code as adapted by Cen."
    - id: kt-2
      description: "Knowledge tracing fitted with Baker's exhaustive bounded search on sum of squared error; initial learning bounded at 0.85, transition at 0.3."
    - id: kt-2ll
      description: "KT 2 re-fitted on log-likelihood instead of squared error (Fractions and Geometry only)."

comparisons:
  - id: pfa-vs-lfa
    kind: other
    index_arm: pfa
    reference_arm: [lfa, lfa-ns]
    description: "PFA against full LFA and LFA without a student parameter, fitted to the same data with multiple KCs per step (Table 2)."
  - id: pfa-vs-kt
    kind: other
    index_arm: pfa
    reference_arm: [kt-1, kt-2, kt-2ll]
    description: "PFA against knowledge tracing fits, on the data recoded to one KC per step (Table 3)."

