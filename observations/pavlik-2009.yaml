# Pavlik, Cen & Koedinger (2009): Performance Factors Analysis (PFA) against
# Learning Factors Analysis (LFA) and knowledge tracing (KT).
#
# A model-comparison paper on existing tutor logs, not a study of learners. The
# "arms" below are MODELS fitted to the same four datasets, and every
# observation is a published model-fit result for one dataset. The model form
# (Equation 3: a logit summing beta per KC, gamma times prior successes and
# rho times prior failures, with the student parameter alpha removed) is the
# paper's contribution and is described in design_detail; it is not a result.
#
# Read from a text-only copy of the author's upload to ResearchGate (the
# AIED 2009 paper with a ResearchGate cover page); no PDF was available here.
# THE TABLES COME OUT COLUMN BY COLUMN: each dataset's block prints its model
# names, then Par., Obs., LL, BIC and the last column(s) as runs of values, and
# the dataset labels (Physics, Geometry, Algebra, Fractions) come after all four
# blocks. Blocks are matched to datasets in the order of those labels. The match
# is checked, for Table 3, by the text: the KT 2LL rows appear in the second
# and fourth blocks, and the text says KT 2LL was run "for the fractions and
# geometry datasets", which are the fourth and second labels. Each source_quote
# is one dataset's block as the text layer prints it. Equations 1 and 3 did not
# survive extraction and are not quoted.
#
# Table 2's Algebra block prints its LL values without a minus sign
# (1.629E+4, 1.564E+4, 1.58E+4) where every other LL is negative. It is
# recorded as printed in this copy and flagged; the sign could not be checked
# against a page image.
#
# Of the 2026-11-25 additions: no age (the article gives grade bands only, so
# `age: unreported`), no reliability and no single-group mean. The paper prints
# no fitted parameter values (Table 1 shows model predictions for one example
# student, not parameters).
#
# DOI checked against Crossref on 2026-11-26: 10.3233/978-1-60750-028-5-531 is
# "Performance Factors Analysis – A New Alternative to Knowledge Tracing",
# first author Pavlik, 2009, in Frontiers in Artificial Intelligence and
# Applications (Artificial Intelligence in Education). Title, first author and
# year agree with the article; the copy's cover page prints the same DOI.

schema_version: 2

study:
  key: pavlik-2009
  citation: "Pavlik, P. I., Jr., Cen, H., & Koedinger, K. R. (2009). Performance factors analysis – A new alternative to knowledge tracing. In Artificial Intelligence in Education (Frontiers in Artificial Intelligence and Applications). IOS Press."
  doi: "10.3233/978-1-60750-028-5-531"
  design:
    family: other
    design_detail: >-
      Secondary model comparison on logged tutor data. Three logistic models
      were fitted by maximum likelihood to four datasets: LFA (student ability
      alpha, KC easiness beta, and a learning rate gamma per prior opportunity),
      LFA without the student parameter (LFA ns), and PFA, which drops alpha and
      replaces the opportunity count with separate counts of prior successes
      (scaled by gamma, bounded at 0 or above) and prior failures (scaled by
      rho), summing over the KCs a step needs. PFA was then compared with two
      fits of Corbett's knowledge tracing (KT 1, KT 2; KT 2LL a re-fit of KT 2
      on log-likelihood) on the same data recoded to one KC per step, KT
      predictions floored at 0.01 and capped at 0.99, slip bounded at 0.1 and
      guess at 0.3. No learners were assigned to anything.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

