# Wang et al. (2021): HawkesKT, temporal cross-effects in knowledge tracing.
#
# A model paper, not an experiment with learners in conditions. Its own printed
# figures are the 5-fold cross-validated test AUCs of HawkesKT on three public
# datasets (Table 3), an ablation against three variants of the model
# (Figure 4), the agreement of three expert annotators who labelled skill-pair
# helpfulness (kappa .52), and the NDCG of the model's prerequisite ranking
# against those labels. The arms are model configurations, not groups of
# people; every dataset is an existing log of student responses.
#
# Read from the publisher's text layer (WSDM '21 proceedings, pp. 517-525),
# which matches the DOI in the article's own front matter. No PDF was supplied.
# The text layer prints Table 3's HawkesKT row cleanly and is recorded; the
# baseline rows and Tables 2 and 4 come out column by column and Figure 4's bar
# labels come out as loose numbers, so those are listed in not_yet_extracted
# rather than reassembled. The ablation is therefore recorded only as the
# authors' own words about it.
#
# No age, no single-group mean: the article prints no age figure for any
# dataset (age: unreported) and no mean with SD. The kappa is the agreement of
# the annotation that serves as ground truth for the prerequisite-score
# evaluation, not of the AUC outcome, which has no rater.

schema_version: 2

study:
  key: wang-2021
  citation: "Wang, C., Ma, W., Zhang, M., Lv, C., Wan, F., Lin, H., Tang, T., Liu, Y., & Ma, S. (2021). Temporal cross-effects in knowledge tracing. In Proceedings of the Fourteenth ACM International Conference on Web Search and Data Mining (WSDM '21) (pp. 517–525). ACM."
  doi: "10.1145/3437963.3441802"
  design:
    family: other
    design_detail: >-
      Computational benchmark. HawkesKT, a Hawkes-process model in which each
      earlier (skill, response) interaction adds a mutual-excitation term to
      the target skill's intensity, decaying through a per-pair power-law
      kernel exp(-(1 + beta) log dt), with question and skill base intensities
      and low-rank factorised alpha and beta, is compared with six baseline
      knowledge-tracing models (IRT, DKT, SAKT, DKT-Forgetting, KTM, AKT-R)
      by 5-fold cross validation split on users, AUC as the metric, and with
      three ablated variants. An empirical study of conditional mutual
      information between interaction pairs precedes the model. No conditions
      were assigned to learners.
    preregistration:
      status: unreported

