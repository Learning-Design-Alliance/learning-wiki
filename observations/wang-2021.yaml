evidence_base:
  unit: other
  size:
    value: 3
    unit: other
  additional_sizes:
    - value: 6
      unit: other
      note: "baseline knowledge-tracing models compared with HawkesKT"
    - value: 3
      unit: participants
      note: "experts who annotated binary helpfulness between each pair of the top-20 frequency skills in ASSISTments 12-13"
  population:
    description: >-
      Three public datasets of student responses: ASSISTments 09-10 and
      ASSISTments 12-13 from the ASSISTments online mathematics tutoring
      system, and slepemapy.cz from an online geography practice system. Users
      with fewer than 5 interactions were discarded and only each user's first
      50 interactions kept. ASSISTments 09-10 has no timestamps, so a fixed
      1-second gap was assumed. The empirical study uses ASSISTments 12-13,
      described as 2.7M interactions involving 265 skills.
    age_or_stage: "Not stated for any dataset."
    age: unreported
  context:
    setting: "Offline prediction of the correctness of the next response from logged interactions; folds split on users, 10% of training users held out for validation and early stopping"
  arms:
    - id: hawkeskt
      description: "HawkesKT: base intensity per question and skill plus mutual excitation alpha and per-pair kernel decay beta for each earlier (skill, response) event and target skill, factorised by matrix factorisation; sigmoid of the intensity gives the predicted probability."
    - id: no-temporal
      description: "The \\Temporal variant: HawkesKT with the kernel function removed, so no forgetting."
    - id: global-decay
      description: "The \\Cross variant: one global parameter beta controls the decay instead of a decay rate per skill pair."
    - id: no-cf
      description: "The \\CF variant: alpha and beta optimised directly as 2|S| x |S| matrices, without matrix factorisation."
    - id: baselines
      description: "The six baselines: IRT, DKT, SAKT (no temporal information), DKT-Forgetting, KTM and AKT-R (time-varying effects)."
    - id: dkt-forgetting
      description: "DKT-Forgetting: DKT with past trials and time gaps as extra features."

