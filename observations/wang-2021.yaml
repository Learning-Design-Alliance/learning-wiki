    description: "Conditional mutual information between the responses of pre- and post-interaction pairs in ASSISTments 12-13, by skill pair and by log time interval; no model and no contrast of configurations."
  - id: expert-annotation
    kind: none
    description: "Agreement among the three expert annotators on binary helpfulness between skill pairs."

