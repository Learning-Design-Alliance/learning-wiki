# Kalyuga, Chandler, Tuovinen & Sweller (2001), Experiment 2: worked examples
# against problem solving for the same apprentices, now more experienced,
# learning to write Boolean switching equations, tested at two stages.
#
# Read from a text extraction of the published article (OCR'd scan). No PDF of
# this article was available beside the text, so no page image was checked.
#
# TABLE 2 IN THE TEXT. The "Questions scores" row comes out as one clean
# sequence, M 9.4 8.2 10.2 10.6 and SD 3.1 3.2 2.3 1.7, but the column header
# is garbled ("Worked examples Stage / Problem / of testing / solving Stage of
# testing / I 2 2"). The column order (worked examples Stages 1 and 2, then
# problem solving Stages 1 and 2) was checked against the article's own text
# before recording: the Stage 1 means average to the printed "9.8 out of 12",
# and the Stage 2 means and SDs reproduce the printed simple effect F(1, 22) =
# 5.26 to rounding. The instructional-efficiency row is scrambled and is not
# recorded.
#
# WHAT THIS FILE USES:
#   * `measure_type: mean` with SD, one observation per arm and stage.
#   * `population.age: unreported`, as in Experiment 1: the same 24
#     apprentices, and the article gives no age.
#   * No reliability: none is printed for the test.
#
# Quotes containing "p < ." are cut before it where possible, because the OCR
# text writes it as "p \<". Where a quote keeps it, it is reproduced as the
# text file has it.

schema_version: 2

study:
  key: kalyuga-2001-exp2
  citation: "Kalyuga, S., Chandler, P., Tuovinen, J., & Sweller, J. (2001). When problem solving is superior to studying worked examples. Journal of Educational Psychology, 93(3), 579-588."
  doi: "10.1037/0022-0663.93.3.579"
  design:
    family: randomized-controlled-trial
    design_detail: >-
      Two-group experiment with the Experiment 1 participants randomly
      re-allocated to worked examples (n = 12) or problem solving (n = 12),
      tested at two stages a week apart with two common training sessions
      between them. Analysed by 2 (instructional procedure) x 2 (stage) ANOVAs
      with repeated measures on stage, and simple effects per stage.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: redundancy-effect-problem-solving-superior-experienced-learners
    bearing: supports
    anchor: kalyuga-2001
  - claim: no-advantage-either-procedure-stage1-experiment2
    bearing: supports
    anchor: kalyuga-2001
  - claim: instruction-experience-interaction-performance-measures
    bearing: supports
    anchor: kalyuga-2001

evidence_base:
  unit: participants
  size:
    value: 24
    unit: participants
  population:
    description: >-
      The 24 Australian trade apprentices of Experiment 1, most somewhat
      experienced in writing simple PLC programs by its end, familiar with
      general rules of algebra, with no previous exposure to the switching-
      equation materials.
    age_or_stage: "Had completed at least Year 10 of high school; first-year trade apprentices who had completed Experiment 1"
    age: unreported
  context:
    setting: "Natural training environment (apprentice training centres); computer-based training"
  arms:
    - id: worked-examples
      description: "Studied 23 worked examples of relay circuits with their Boolean switching equations, each followed by a similar problem (46 circuits) at Stage 1; 12 examples alternating with 12 problems at Stage 2."
      size:
        value: 12
        unit: participants
    - id: problem-solving
      description: "Typed a Boolean equation for each of the same 46 circuits (24 at Stage 2), three attempts of up to 3 min each, with the correct equation shown after a third failure."
      size:
        value: 12
        unit: participants

comparisons:
  - id: problem-solving-vs-worked-examples
    kind: between-groups
    index_arm: problem-solving
    reference_arm: worked-examples
    description: "Problem solving against worked examples on the 12-question switching-equation test, at a given stage, or in its change across stages."

