  unit: participants
  size:
    value: 123
    unit: participants
  additional_sizes:
    - value: 158
      unit: participants
      note: "students who took part; 123 completed both sessions"
    - value: 8
      unit: scales
      note: "speeded cognitive scales (six EAS scales, word memory, sentence memory), plus an EAS composite"
  population:
    description: >-
      Undergraduates at a large Midwestern US university, participating for
      course credit. Operational sample 56.90% male, mostly freshmen (49.60%)
      or sophomores (28.50%); average reported GPA 3.02 (SD 0.63) on a 4.0 scale.
    age_or_stage: "Undergraduates"
    age:
      unit: years
      mean: 19.93
      sd: 3.70
  context:
    setting: "Two scripted, timed group testing sessions of 100 minutes, one week apart; low stakes, no performance contingencies"
  arms: []

