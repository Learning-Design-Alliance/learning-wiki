# Reeve, Heggestad & George (2005): transient error in eight speeded cognitive
# ability scales and their composite, two administrations one week apart.
#
# A replication of Schmidt, Le & Ilies (2003) with cognitive scales (six Employee
# Aptitude Survey scales and two memory tests). TEV, as in that paper, is the
# transient error share of OBSERVED score variance (CE minus CES), recorded as
# printed and not converted.
#
# The average over the eight scales and the composite's figures are separate
# observations: the authors themselves say the composite is the more direct
# comparison with Schmidt et al.'s Wonderlic estimate, and the two differ (.09
# against .04).
#
# Table 2 is printed column by column in the text layer, so the quote for the
# composite's CE and CES (`composite-ce`, `composite-ces`) was taken from the
# page image of p. 319. All other quotes are from the text layer.

schema_version: 2

study:
  key: reeve-2005
  citation: "Reeve, C. L., Heggestad, E. D., & George, E. (2005). Estimation of transient error in cognitive ability scales. International Journal of Selection and Assessment, 13(4), 316–320."
  doi: "10.1111/j.1468-2389.2005.00328.x"
  design:
    family: observational
    design_detail: >-
      Two-occasion measurement study: the full battery given twice, one week
      apart, in groups of at most 16. Odd and even items formed post hoc
      randomly parallel half scales. CE was the Spearman-Brown corrected
      split-half correlation, averaged over the two occasions; CES from
      Equations 16 and 17a of Schmidt et al. (2003); TEV = CE - CES. Standard
      errors from a Monte Carlo simulation of 1,000 data sets per scale. No
      conditions were assigned.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

