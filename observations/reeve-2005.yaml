        unit: weeks
        from: "first occasion"
    result:
      measure_type: other
      estimate: 0.09
      unit: "proportion of observed score variance, mean over 8 scales"
      model: >-
        Range over the eight scales .01 (verbal comprehension) to .18 (symbolic
        reasoning). The 90% confidence intervals included zero for three scales
        (verbal comprehension, verbal reasoning, sentence memory).
    moderators:
      reported: []
      candidate:
        - "Verbal content (the three scales whose intervals included zero all measure verbal ability, which the authors offer as a possibility needing replication)"
