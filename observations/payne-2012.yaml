evidence_base:
  unit: participants
  size:
    value: 207
    unit: participants
  population:
    description: >-
      Healthy, medication-free Harvard students with no history of mood or
      sleep disorders who habitually slept at least 6 hours a night; paid or
      given course credit. 30 min condition N = 60 (37 female), 12 h N = 80
      (52 female), 24 h N = 67 (40 female).
    age_or_stage: "University students; mean age 20.6 in the 30 min condition, 20.3 in the 12 h and 20.3 in the 24 h condition"
    age: unreported
  context:
    setting: "Sleep laboratory, Harvard Medical School; computer-presented cued recall; participants left the laboratory between training and retest, with no naps, caffeine or alcohol"
  arms:
    - id: thirty-min-am
      description: "Trained at 9am, retested 30 min later."
      size: {value: 29, unit: participants}
    - id: thirty-min-pm
      description: "Trained at 9pm, retested 30 min later."
      size: {value: 31, unit: participants}
    - id: wake-12h
      description: "Trained at 9am, retested 12 h later after a day awake."
      size: {value: 40, unit: participants}
    - id: sleep-12h
      description: "Trained at 9pm, retested 12 h later after a night of sleep."
      size: {value: 40, unit: participants}
    - id: immediate-sleep-24h
      description: "Trained at 9pm, retested 24 h later: a night of sleep, then a day awake."
      size: {value: 33, unit: participants}
    - id: delayed-sleep-24h
      description: "Trained at 9am, retested 24 h later: a day awake, then a night of sleep."
      size: {value: 34, unit: participants}

comparisons:
  - id: sleep-vs-wake-12h
    kind: between-groups
    index_arm: sleep-12h
    reference_arm: wake-12h
    description: "A night of sleep against a day awake over the 12 h after training."
  - id: immediate-vs-delayed-sleep-24h
    kind: between-groups
    index_arm: immediate-sleep-24h
    reference_arm: delayed-sleep-24h
    description: "Over 24 h, sleep in the first 12 h after training against sleep in the second 12 h."
  - id: evening-vs-morning-30min
    kind: between-groups
    index_arm: thirty-min-pm
    reference_arm: thirty-min-am
    description: "Training at 9pm against 9am, retested 30 min later: time of day with no sleep or long wake between."
  - id: wake-first-vs-wake-second-12h
    kind: other
    index_arm: [wake-12h, thirty-min-am, thirty-min-pm]
    reference_arm: [immediate-sleep-24h, sleep-12h]
    description: >-
      Forgetting across 12 h awake straight after training (12 h Wake change
      against the 30 min reference) against forgetting across 12 h awake that
      followed a night of sleep (24 h Immediate Sleep change minus 12 h Sleep
      change). A difference between differences across separate groups.

observations:

  - id: change-12h-sleep
    sample:
      value: 40
      unit: participants
    arm_ref: sleep-12h
    outcome:
      construct: "Change in cued recall of word pairs"
      source_language: "change from training"
      measure: "% correct at retest minus % correct on the final training trial, related and unrelated pairs together"
      scale: "percentage points"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "12 h after training, after a night of sleep"
      offset: {value: 12, unit: hours, from: "end of training"}
    result:
      measure_type: mean
      estimate: 6.6
      unit: "percentage points change in recall from training to retest"
    moderators:
      reported:
        - variable: "Word-pair type"
          relationship: "Related and unrelated pairs were recalled equally after sleep; after wake unrelated pairs fell behind"
          source_quote: "although recall of related and unrelated pairs was equivalent in the sleep condition (t 38 = 0.03, p = .98, Figure 2a)"
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      No SD or SEM is printed in the text (Figure 2b shows SEMs). Feedback on
      the final training trial is itself a learning event, so change scores
      tend to rise (the authors say so).
    source_quote: "ANOVA revealed a significant main effect of Condition (change from training: 12 hr Sleep: +6.6%, 12 hr Wake: +0.8%, F1,76 = 7.23, p = .009; Figure 2b), indicating that word pair recall was superior 12 hr later when the retention interval spanned a night of sleep, rather than a day of wakefulness."
    source_location: "Results, 12-Hour Retest (p. 3)"

  - id: change-12h-wake
    sample:
      value: 40
      unit: participants
    arm_ref: wake-12h
    outcome:
      construct: "Change in cued recall of word pairs"
      source_language: "change from training"
      measure: "% correct at retest minus % correct on the final training trial, related and unrelated pairs together"
      scale: "percentage points"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "12 h after training, after a day awake"
      offset: {value: 12, unit: hours, from: "end of training"}
    result:
      measure_type: mean
      estimate: 0.8
      unit: "percentage points change in recall from training to retest"
    moderators:
      reported:
        - variable: "Word-pair type"
          relationship: "After wake, unrelated pairs were recalled worse than related pairs"
          source_quote: "significant difference between recall of related and unrelated pairs in the wake condition (t 38 = 3.63, p = .001)."
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      No SD or SEM is printed in the text. Per word-pair type the means are in
      Figure 2a only, which is not readable from this copy.
    source_quote: "ANOVA revealed a significant main effect of Condition (change from training: 12 hr Sleep: +6.6%, 12 hr Wake: +0.8%, F1,76 = 7.23, p = .009; Figure 2b), indicating that word pair recall was superior 12 hr later when the retention interval spanned a night of sleep, rather than a day of wakefulness."
    source_location: "Results, 12-Hour Retest (p. 3)"

  - id: sleep-vs-wake-12h-anova
    sample:
      value: 80
      unit: participants
    comparison_ref: sleep-vs-wake-12h
    outcome:
      construct: "Change in cued recall of word pairs"
      source_language: "word pair recall was superior 12 hr later"
      measure: "% correct at retest minus % correct on the final training trial"
      scale: "2 (Condition) x 2 (Word-pair type) between-subjects ANOVA, main effect of Condition"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "12 h after training"
      offset: {value: 12, unit: hours, from: "end of training"}
    result:
      measure_type: other
      statistic: "F(1, 76) = 7.23"
      p_value: ".009"
      interpretation: "Recall change greater after a night of sleep than after a day awake."
      note: >-
        The Condition x Word-pair type interaction was F(1, 76) = 7.94,
        p = .006: related pairs did not differ between sleep and wake
        (t(40) = 0.01, p = .92); unrelated pairs did (t(36) = 3.62, p = .001).
    moderators:
      reported:
        - variable: "Word-pair type (semantically related or unrelated)"
          relationship: "The sleep advantage was confined to unrelated pairs; related pairs were recalled equally after sleep and wake"
          source_quote: "while wake and sleep led to equivalent recall of related word pairs (t 40 = 0. 01, p = .92), recall of unrelated pairs was disrupted in the wake relative to the sleep condition (t 36 = 3.62, p = .001, white bars)."
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: "No standardised effect size is printed."
    source_quote: "ANOVA revealed a significant main effect of Condition (change from training: 12 hr Sleep: +6.6%, 12 hr Wake: +0.8%, F1,76 = 7.23, p = .009; Figure 2b), indicating that word pair recall was superior 12 hr later when the retention interval spanned a night of sleep, rather than a day of wakefulness."
    source_location: "Results, 12-Hour Retest (p. 3)"

  - id: immediate-vs-delayed-sleep-24h-anova
    sample:
      value: 67
      unit: participants
    comparison_ref: immediate-vs-delayed-sleep-24h
    outcome:
      construct: "Change in cued recall of word pairs"
      source_language: "performed much better than the Delayed Sleep Condition at retest"
      measure: "% correct at retest minus % correct on the final training trial"
      scale: "2 (Condition) x 2 (Word-pair type) between-subjects ANOVA, main effect of Condition"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "24 h after training: one night of sleep and one day awake in either order"
      offset: {value: 24, unit: hours, from: "end of training"}
    result:
      measure_type: other
      statistic: "F(1, 63) = 5.44"
      p_value: ".02"
      interpretation: "Better recall change when sleep came in the first 12 h after training."
      note: >-
        Word-pair type also had an effect (F(1, 63) = 10.5, p = .002) with no
        interaction with Condition (F(1, 63) = 0.03, p = .86). The two groups'
        mean change scores are printed with symbols the text layer garbles and
        are not recorded.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: "No standardised effect size is printed; group means not recorded (garbled in this copy)."
    source_quote: "As with the 12 hr retest condition, there was a main effect of Condition (F 1,63 = 5.44, p = .02; Figure 3b) demonstrating that participants in the Immediate Sleep Condition performed much better than the Delayed Sleep Condition at retest"
    source_location: "Results, 24 Hour Retest (p. 4)"

  - id: wake-forgetting-first-vs-second-12h
    comparison_ref: wake-first-vs-wake-second-12h
    outcome:
      construct: "Forgetting across 12 h awake"
      source_language: "forgetting"
      measure: "Change in recall across a 12 h waking interval, estimated by subtracting group means across conditions (Figure 4b)"
      scale: "ratio of forgetting across wake in the first 12 h to forgetting across wake in the second 12 h, unrelated pairs"
      direction: contextual
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "first against second 12 h after training"
    result:
      measure_type: other
      estimate: 2
      unit: "times as much forgetting (stated as 'twice'), unrelated pairs"
      p_value: ".04"
      statistic: "overall first-against-second 12 h wake difference F = 5.6, p = 0.019 (degrees of freedom not printed)"
      note: "For related pairs, 3.4 times more forgetting in the first 12 h, not significant."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      The ratio is printed in words ("twice"), not as a computed value; the
      forgetting amounts behind it are in Figure 4b only. The quantity is a
      difference between separate groups' means (12 h Wake against the 30 min
      groups; 24 h Immediate Sleep against 12 h Sleep), so no sample size for
      it is given.
    source_quote: "Post-hoc tests demonstrat- ed twice as much forgetting of unrelated pairs during wake in the first 12 hr than in the second 12 hr post-training (p = .04), and 3.4 times more forgetting of related pairs, although this difference did not reach significance."
    source_location: "Results, 12 h v. 24 hr Comparisons (p. 4)"

  - id: sleep-interval-forgetting
    arm_ref: [sleep-12h, immediate-sleep-24h, delayed-sleep-24h]
    outcome:
      construct: "Forgetting across 12 h containing a night of sleep"
      source_language: "forgetting across 12 hr intervals including a night of sleep"
      measure: "Change in recall across a 12 h interval containing sleep, first or second 12 h after training (Figure 4c)"
      scale: "percent of studied word pairs"
      direction: lower-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "a 12 h interval containing a night of sleep, first or second 12 h after training"
    result:
      measure_type: mean
      estimate: 5.8
      unit: "percent of studied word pairs forgotten across the 12 h interval, averaged over related and unrelated pairs and over first and second 12 h"
      interpretation: "No significant differences by word-pair type or by whether sleep came in the first or second 12 h."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: partial
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      An average the authors report over four estimates built from group
      differences; how the first-12 h sleep forgetting was derived (against the
      30 min groups) is described for wake only, so implementation_detail is
      partial. The article's own 12 h Sleep change from training is +6.6%, a
      gain; this 5.8% is measured against a different baseline and the two are
      not interchangeable. No SD printed.
    source_quote: "In contrast, forgetting across 12 hr intervals including a night of sleep (Figure 4c) averaged 5.8% of studied word pairs for both related and unrelated pairs across both the first and second 12 hr post-training, with no significant differences based on word pair type or whether the sleep came in the first or second 12 hr."
    source_location: "Results, 12 h v. 24 hr Comparisons (p. 4)"

  - id: time-of-day-30min-anova
    sample:
      value: 60
      unit: participants
    comparison_ref: evening-vs-morning-30min
    outcome:
      construct: "Change in cued recall of word pairs"
      source_language: "initial memory performance at 30 min"
      measure: "% correct at retest minus % correct on the final training trial"
      scale: "2 (Condition) x 2 (Word-pair type) between-subjects ANOVA, main effect of Condition"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "30 min after training"
      offset: {value: 30, unit: minutes, from: "end of training"}
    result:
      measure_type: other
      statistic: "F(1, 56) = 1.05"
      p_value: ".31"
      interpretation: "No effect of training time; no effect of word-pair type (F(1, 56) = 0.20, p = .89) and no interaction (F(1, 56) = 0.47, p = .50)."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: "A non-significant test, not an equivalence test; no effect size printed."
    source_quote: "no effect of Word-pair type (F 1,56 = 0.20, p = .89) or Condition (F1,56 = 1.05, p = .31)"
    source_location: "Results, 30 Minute Retest (p. 3)"

