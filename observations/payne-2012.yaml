# Payne, Tucker, Ellenbogen, Wamsley, Walker, Schacter & Stickgold (2012):
# sleep, wake and time of day for semantically related and unrelated word pairs.
#
# One experiment, 207 Harvard students in three retention-interval conditions
# (30 min, 12 h, 24 h), each split by training time (9am or 9pm) and word-pair
# type (related or unrelated). Training time decides sleep: a 9pm group sleeps
# in the first 12 h after training, a 9am group is awake through it. The
# outcome throughout is the change in cued recall from the final training
# trial to retest (% correct at retest minus % correct at training), so a
# positive value is a gain, not retention.
#
# Read from a text-only copy (pdftotext) of the open-access article; no PDF was
# available. The text layer turns some symbols into digits: the multiplication
# sign and the plus-minus sign come out as "6", and some minus signs as "2"
# ("0.762.1% vs. 26.562.6%" for the 24 h groups). Figures that rest on those
# symbols are NOT recorded; they are listed in not_yet_extracted. Every quote
# below avoids them.
#
# Of the 2026-11-25 additions:
#   * mean: the 12 h Sleep and Wake groups' mean change scores (+6.6% and
#     +0.8%), and the average forgetting across sleep-filled 12 h intervals
#     (5.8%). No SD is printed for any of them (figures show SEMs).
#   * age: the article prints a mean age per condition, not for the whole
#     sample; see the note on population.age.
#   * reliability: none printed (cued recall of word pairs, scored correct or
#     not).

schema_version: 2

study:
  key: payne-2012
  citation: "Payne, J. D., Tucker, M. A., Ellenbogen, J. M., Wamsley, E. J., Walker, M. P., Schacter, D. L., & Stickgold, R. (2012). Memory for semantically related and unrelated declarative information: The benefit of sleep, the cost of wake. PLoS ONE, 7(3), e33079."
  doi: "10.1371/journal.pone.0033079"
  design:
    family: randomized-controlled-trial
    design_detail: >-
      Laboratory experiment. Participants were randomly assigned to study
      related or unrelated word pairs at 9am or 9pm, trained to a 60% criterion
      with feedback, and retested once without feedback after 30 min, 12 h or
      24 h. The article says participants were "assigned" to the three
      retention-interval conditions without saying how, so contrasts ACROSS
      interval conditions (the 12 h against 24 h comparisons) rest on groups
      whose assignment is not described as random. Within an interval
      condition, sleep against wake is training time, which was randomised.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

