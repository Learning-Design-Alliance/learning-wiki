      measurement unreliability.
    source_quote: "As predicted by the internal/external frame of refer- ence (I/E) model, math and verbal achievements were highly correlated over- all (. 67), but the correlation between math and verbal self concepts (. 10) was close to zero."
    source_location: "Abstract; Table 3, All samples, MAch-VAch row"

