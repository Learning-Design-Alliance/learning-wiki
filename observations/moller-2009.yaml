  - id: path-math-achievement-to-math-self-concept
    sample:
      value: 69
      unit: studies
    comparison_ref: whole-corpus
    outcome:
      construct: "Math self-concept"
      source_language: "positive paths from achievement to the corresponding self concepts"
      measure: "Path from math achievement to math self-concept, estimated on the pooled correlation matrix with verbal achievement in the model"
      scale: "path coefficient (beta weight)"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "as measured in the primary studies, mostly cross-sectional"
    result:
      measure_type: regression_coefficient
      estimate: 0.61
      k:
        value: 69
        unit: studies
      model: >-
        Saturated path model (maximum likelihood) fitted to the weighted mean
        correlation matrix of all 69 samples; .64 without the PISA samples.
        The alternative route (path analysis within each study, then
        meta-analysis of the paths) is reported as giving almost identical
        results.
    moderators:
      reported:
        - variable: "Achievement measure (teacher grades vs standardized tests)"
          relationship: "Positive within-domain paths higher with grades (.75 math, .68 verbal) than with tests (.57 math, .47 verbal), Table 8"
          source_quote: "The sec- ond finding of this multigroup analysis was that grades had a stronger impact on corresponding self-concepts than objective test scores."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: unreported
      outcome_timing: unreported
      effect_size: observed
      pooled_k: observed
    observability_notes: >-
      No standard error or confidence interval is printed for any path. The
      saturated model has no fit index.
    source_quote: "A path analysis revealed support for the I/E model, with positive paths from achievement to the corresponding self concepts (.61 for math, .49 for verbal) and negative paths from achievement in one subject to self-concept in the other subject (-.21 from math achievement on verbal self-concept, -.27 from verbal achievement to math self-concept)."
    source_location: "Abstract; Table 8, All samples"

