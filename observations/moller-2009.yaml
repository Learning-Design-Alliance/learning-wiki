evidence_base:
  unit: studies
  size:
    value: 69
    unit: studies
  additional_sizes:
    - value: 125308
      unit: participants
      note: "total participants across the 69 independent samples"
    - value: 26
      unit: studies
      note: "of the 69 samples come from one report, the Marsh and Hau (2004) PISA 2000 data"
    - value: 43
      unit: studies
      note: "samples that are not PISA data (N = 67,726), analysed separately as a check"
  population:
    description: >-
      69 independent samples of school students (and, for SDQ III studies,
      older students) from Asia, Australia, Europe and the United States or
      Canada. Year in school and percentage female were coded per sample; for
      10 samples there was no information on gender distribution.
    age_or_stage: >-
      Coded as years in school and tested as a continuous moderator; the
      article reports strata before Year 7, Years 7 to 9, and beyond Year 9.
      No age range or mean is printed for the samples.
    age: unreported
  context:
    setting: "Correlational studies of academic self-concept in schools; achievement measured by standardized tests (40 samples) or teacher-assigned grades (32 samples)"
  variation:
    - dimension: "Achievement measure"
      distribution: "Test 40 samples (N = 100,637), grades 32 (N = 43,069); three studies included both"
    - dimension: "Self-concept measure"
      distribution: "SDQ I 8, SDQ II 37, SDQ III 3, cognitive 19, self-efficacy 5"
    - dimension: "Country"
      distribution: "Asia 7, Australia 12, Europe 39, United States 7 (66 samples coded for country)"
  arms:
    - id: before-year-7
      description: "The samples of students before Year 7 in school."
    - id: years-7-to-9
      description: "The samples of students between Years 7 and 9."
    - id: beyond-year-9
      description: "The samples of students beyond Year 9."

comparisons:
  - id: whole-corpus
    kind: none
    description: "Pooled correlations and path coefficients across all 69 samples; no contrast between groups."

