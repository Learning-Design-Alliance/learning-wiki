# Möller, Pohlmann, Köller & Marsh (2009): a meta-analytic path analysis of the
# internal/external frame of reference (I/E) model.
#
# WHAT THIS FILE RECORDS, and what the source does not print:
#
#   * The two headline pooled correlations (math-verbal achievement .67, math-
#     verbal self-concept .10) and the four path coefficients of the I/E model,
#     all from the all-samples analysis (k = 69, N = 125,308).
#   * The years-in-school moderation of the self-concept correlation, as three
#     strata (before Year 7, Years 7-9, beyond Year 9). The article prints the
#     three r values and nothing else for them: no k, no CI, no N per stratum.
#     So each stratum is an arm named by `arm_ref`, and `pooled_k: unreported`.
#   * `population.age: unreported`. Year in school was coded per sample and
#     tested as a continuous moderator, but the article prints no age figure
#     for the samples. The SDQ age bands it mentions (up to 12, up to 17, 16 to
#     25) describe the instruments' intended ranges, not the samples.
#   * No reliability observation: the article prints no reliability for any
#     achievement or self-concept measure in the corpus, and does not correct
#     the pooled correlations for attenuation. Its own coding agreement is
#     described only as "very few occasional disagreements", with no
#     coefficient.
#   * No single-group means: a correlation meta-analysis prints none.
#
# Read from a JSTOR repository copy of the published article. Table 2 (the
# per-study correlations) is unreadable in the text layer and nothing below
# rests on it.

schema_version: 2

study:
  key: moller-2009
  citation: "Möller, J., Pohlmann, B., Köller, O., & Marsh, H. W. (2009). A meta-analytic path analysis of the internal/external frame of reference model of academic achievement and academic self-concept. Review of Educational Research, 79(3), 1129–1167."
  doi: "10.3102/0034654309337522"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-analysis of the six correlations among math achievement, verbal
      achievement, math self-concept and verbal self-concept, then a path
      analysis (maximum likelihood) of the pooled correlation matrix, with
      multiple-group analyses for achievement measure and self-concept
      measure. Observational correlations throughout; no study in the corpus
      is described as experimental.
  synthesis:
    model: "Random-effects procedures (Rosenberg, Adams & Gurevitch, 2000) for weighted mean correlations; mixed-effects models for moderators"
    heterogeneity_statistic: "Q"
    search:
      databases:
        - PsycINFO
        - Education Resources Information Center
        - Social Science Index
      date_range: "reports available by the end of 2006"
    inclusion:
      - "Reports all six bivariate correlations among math achievement, verbal achievement, math self-concept and verbal self-concept"
      - "Verbal achievement in the native language only (standardized tests or teacher grades)"
      - "Math achievement only; science subjects excluded"
      - "Self-reports of verbal and math capability (SDQ scales, cognitive scales or self-efficacy measures)"
    exclusion:
      - "Foreign-language achievement"
      - "Indirect achievement indicators such as time spent on homework"
      - "Reports re-using a sample already included"
    data_handling:
      - "Coefficients retrieved by two coders independently; disagreements resolved by consulting a third person"
      - "Correlations transformed to Fisher's z, inverse-variance weighted, and transformed back to r"
      - "Multiple operations of one variable averaged for the overall analysis; entered separately for the test-versus-grades analyses"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: ie-model-achievement-self-concept-correlation-contrast
    bearing: supports
    anchor: möller-2009
  - claim: ie-model-path-coefficients-supported
    bearing: supports
