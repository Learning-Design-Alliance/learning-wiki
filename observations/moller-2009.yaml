      k:
        value: 69
        unit: studies
      heterogeneity:
        statistic: "Q"
        value: 111.28
        interpretation: "Significant at p < .001 (Table 3)"
      model: "random-effects; weighted mean effect size E = .81 (pooled variance .07) back-transformed to r"
    moderators:
