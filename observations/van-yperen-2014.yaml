  # The reliability of the CODING, not of any instrument in the corpus. It is
  # what a reader needs to judge the moderator analyses: a domain or nationality
  # code agreed at kappa .58 before discussion is a moderately reliable code.
  - id: coder-agreement-kappa
    comparison_ref: coding-agreement
    outcome:
      construct: "Inter-coder agreement"
      source_language: "rate of agreement between the two independent coders"
      measure: "Two coders' codes for effect-size statistics and the moderators domain, goal measure, age, sex, nationality and publication status"
      scale: "Cohen's kappa"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "during coding, before disagreements were resolved"
    result:
      measure_type: reliability
      estimate: 0.58
      reliability:
        statistic: cohens_kappa
        over: raters
      interpretation: "Described by the authors as 'not very high, but acceptable'"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      effect_size is `unreported` because a reliability coefficient is not an
      effect and the source reports none for this outcome. The analysed data
      are the consensus codes, so this figure bounds how far the codes could be
      trusted before discussion, not after.
    source_quote: "The overall rate of agreement between the two independent coders with respect to effect size statistics and moderators (domain, AG measure, age, sex, nationality, and publication status) was not very high, but acceptable: 79.5% (Cohen’s k = .58)."
    source_location: "Methods, Statistical Methods"

