  - "Figure 2 gain estimates per teacher-knowledge category and nonscience level: printed only in the figure."
  - "Test-level analysis: 'Our test-level analysis resulted in a similar relationship to teacher knowledge (0.05 to 0.10 SD between teachers low or high in overall measures of knowledge).' Analysis not shown; what the range spans is not stated."
  - "Item-level SD of dichotomous teacher responses: 37.2% (KOSM) and 48.2% (SMK)."
  - "Teacher background variables (years teaching, degrees) not significant when entered with SMK and KOSM (p .05); no estimates printed."
