  - "Table 3 (p. 1037) terms not recorded: intercept, grade level, gender, highest parental education, race, fraction of year, pretest score by item, item difficulty, and item difficulty x pretest score by item (each with F, logistic coefficient, SE, t and p). Readable on the page image; no claim page or simulator figure needs their values."
