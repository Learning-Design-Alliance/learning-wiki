  - id: kosm-vs-smk-only
    kind: between-groups
    index_arm: smk-and-kosm
    reference_arm: smk-only
    description: "Student gains on misconception items whose teacher had SMK and KOSM, against items whose teacher had SMK only; item-level categories within the logistic model, not randomised groups."
  - id: smk-only-vs-no-smk
    kind: between-groups
    index_arm: smk-only
    reference_arm: no-smk-misconception
    description: "Student gains on misconception items whose teacher had SMK only, against items whose teacher lacked SMK."
  - id: smk-vs-no-smk-non-misconception
    kind: between-groups
    index_arm: smk-non-misconception
    reference_arm: no-smk-non-misconception
    description: "Student gains on non-misconception items whose teacher had SMK, against items whose teacher lacked it."
  - id: test-reliability
    kind: none
    description: "Internal consistency of the 20 common items at each administration."
  - id: t3-smk-kosm-vs-blank-row
    kind: between-groups
    index_arm: smk-and-kosm
    reference_arm: no-smk-non-misconception
    description: >-
      Table 3 teacher-knowledge category 'SMK, KOSM' within the 'SMK & KOSM by
