# Sadler, Sonnert, Coyle, Cook-Smith & Miller (2013): teachers' subject matter
# knowledge (SMK) and knowledge of student misconceptions (KOSM) and student
# gains in middle school physical science.
#
# Read from a repository copy of the published article (text layer). DOI
# 10.3102/0002831213477680 checked against the article's own front matter.
#
# WHAT THIS RECORD HOLDS, and what it deliberately leaves out:
#
#   * The teacher-knowledge categories are ITEM-LEVEL categories, not groups of
#     teachers or students: a teacher is "SMK and KOSM" on one item and "no
#     SMK" on another. The arms below are those categories.
#   * The headline contrasts (SMK and KOSM against SMK only on misconception
#     items, for high-nonscience students) are printed in Figure 2 only. The
#     text states their significance and direction, never a value, so those
#     observations carry no estimate and `effect_size: unreported`.
#   * Table 3's logistic coefficients are not recorded: in the text layer the
#     minus signs come out as a leading "2" ("20.069 (0.051) 21.37"), so the
#     sign of several coefficients cannot be read cleanly.
#   * The authors call the study correlational ("it is not an experimental
#     study"); teacher knowledge was observed, not assigned.

schema_version: 2

study:
  key: sadler-2013
  citation: "Sadler, P. M., Sonnert, G., Coyle, H. P., Cook-Smith, N., & Miller, J. L. (2013). The influence of teachers' knowledge on student learning in middle school physical science classrooms. American Educational Research Journal, 50(5), 1020–1049."
  doi: "10.3102/0002831213477680"
  design:
    family: observational
    design_detail: >-
      Correlational pre-post study. The same 20 five-option multiple-choice
      items were given to students (pretest, midyear and/or year-end test) and
      to their teachers, who answered each item and also identified the most
      common wrong student answer. Item-level hierarchical logistic regression
      (scores within students within classrooms, SAS PROC GLIMMIX) of the
      student posttest item score on teacher SMK and KOSM for that item, with
      student controls (grade, gender, parental education, race, fraction of
      year, reading and math score, pretest item score) and item difficulty.
      Coefficients converted by the authors to gains in SD units of the 20-item
      pretest. Volunteer teachers; not randomly selected.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

