evidence_base:
  unit: participants
  size:
    value: 9556
    unit: participants
  additional_sizes:
    - value: 181
      unit: other
      note: "teachers (classrooms) whose students' data were analysed"
    - value: 12642
      unit: participants
      note: "students matched across at least two tests, before the demographic-completeness restriction"
    - value: 24654
      unit: other
      note: "physical science pretests returned by 219 teachers"
    - value: 210240
      unit: other
      note: "cases (student-by-item scores) in the item-level logistic model, Table 3"
    - value: 20
      unit: items
      note: "items common to the pretest, midyear and year-end tests; 12 misconception items and 8 non-misconception items"
  population:
    description: >-
      US students of 181 volunteer seventh- and eighth-grade physical science
      teachers recruited by a nationwide mailing; 91% of represented schools
      public. Compared with national K-8 statistics the sample under-represents
      Black and Hispanic students and over-represents students whose parents
      hold college degrees. Teachers had a mean 15.6 years teaching (SD 7.0).
    age_or_stage: "Grades 7 and 8: eighth graders 78% of the sample, seventh graders 22%. Birth dates were collected for matching, but no age figure is printed."
    age: unreported
  context:
    setting: "Middle school physical science classrooms over one or two semesters; low-stakes tests, not counted for credit"
  arms:
    - id: all-students
      description: "The whole analysed student sample, pretest to posttest, on one item category."
      size:
        value: 9556
        unit: participants
    - id: teachers
      description: "The participating teachers answering the same items on the pretest form, and naming the most common wrong student answer on misconception items."
      size:
        value: 181
        unit: participants
    - id: smk-and-kosm
      description: "Misconception item on which the student's teacher answered correctly and identified the most common wrong student answer (40.7% of teacher responses on misconception items)."
    - id: smk-only
      description: "Misconception item on which the teacher answered correctly but did not identify the most common wrong student answer (41.8% of teacher responses)."
    - id: no-smk-misconception
      description: "Misconception item on which the teacher answered incorrectly (the authors combine 'No SMK, KOSM' 2.0% and 'No SMK, no KOSM' 15.5%)."
    - id: smk-non-misconception
      description: "Non-misconception item on which the teacher answered correctly (84.6% of teacher responses on those items); Table 3's 'No dist, SMK' row."
    - id: no-smk-non-misconception
      description: "Non-misconception item on which the teacher answered incorrectly (15.4% of teacher responses); Table 3's 'No dist, no SMK' row, printed with no coefficient."

