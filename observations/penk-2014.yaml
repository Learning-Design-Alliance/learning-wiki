# Penk, Pöhlmann & Roppelt (2014): test-taking motivation and mathematics
# performance in the German PISA 2000 extension sample (ninth-graders).
#
# Read from the open-access publisher PDF and its text layer. Tables 1-3 were
# checked against page images (pp. 7, 9, 10); the text layer linearises the
# tables in reading order but every recorded cell agrees with the images, and
# each table quote below is the linearised run as it stands in the text layer.
#
# The design is a cross-sectional secondary analysis of a national assessment:
# multiple regressions of the mathematics score on self-reported motivation
# scales, all measured on one testing occasion. The effort scale was answered
# AFTER the test, so a coefficient on effort is an association, not the effect
# of effort on the score.
#
# Units: every b is in points on the PISA mathematics scale per one point of the
# four-point motivation scale. The article prints the scale SDs (Table 1) and
# the score SD (500.75, SD 79.50) but no standardised coefficient; none is
# computed here.

schema_version: 2

study:
  key: penk-2014
  citation: "Penk, C., Pöhlmann, C., & Roppelt, A. (2014). The role of test-taking motivation for students’ performance in low-stakes assessments: an investigation of school-track-specific differences. Large-scale Assessments in Education, 2, 5."
  doi: "10.1186/s40536-014-0005-4"
  design:
    family: observational
    design_detail: >-
      Cross-sectional secondary analysis of the German national extension
      sample of PISA 2000. Multiple regressions (Mplus 6, five plausible
      values, standard errors corrected for students clustered in classes,
      population weights) of the national PISA mathematics score on
      mathematics self-concept and post-test test-taking motivation subscales,
      entered in four nested models, for the whole sample and separately for
      academic-track (Gymnasium) and nonacademic-track students. Only effects
      with p < .001 were interpreted because of the sample size.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

evidence_base:
  unit: participants
  size:
    value: 31740
    unit: participants
  population:
    description: >-
      German ninth-graders in the national PISA 2000 extension sample,
      described as nationally representative of German ninth-graders; 50%
      female; 30% in academic-track schools and 70% in nonacademic-track
      schools; 88% reported German as their first language. Schools were
      sampled at random by the IEA Data Processing and Research Center.
    age_or_stage: "Grade 9; average age 15.7 years (SD = 0.56)"
    age:
      unit: years
      mean: 15.7
      sd: 0.56
  context:
    setting: >-
      PISA 2000 in Germany, spring 2000: the international assessment on day
      one and the national extension assessment on day two, about three hours
      in all. The motivation questions analysed were administered after the
      test on the second day. The test has no consequences for students: they
      receive no information about their performance and it does not count
      towards grades.
  arms:
    - id: all-students
      description: "The whole analysed sample of German ninth-graders, both school tracks together."
      size:
        value: 31740
        unit: participants
    - id: nonacademic-track
      description: "Students in nonacademic-track schools (all tracks other than the Gymnasium); 70% of the sample."
    - id: academic-track
      description: "Students in academic-track schools (Gymnasium); 30% of the sample."

comparisons:
