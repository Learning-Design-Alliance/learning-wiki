# Bahrick, Bahrick, Bahrick & Bahrick (1993): 300 foreign-language word pairs
# per subject, relearned in 13 or 26 sessions at 14-, 28- or 56-day intervals,
# with recall tested 1, 2, 3 and 5 years after training ended.
#
# Read from the text layer of a scanned copy of the printed article (pp.
# 316-321; the copy carries a "scanned copy of a printed document" notice). The
# text layer interleaves the two columns of the abstract and the Subjects
# paragraph, and Tables 2, 3 and 4 came out as runs of digits whose columns
# cannot be told apart (Table 4 reads "435650ai 70- 57" and "6876"). No page
# image was available, so no figure is taken from any table: every number
# below is from running prose, and each quote is a contiguous run of the text
# layer.
#
# Four subjects took every condition: the 300 words of each subject were split
# 50 to each of the six training conditions by systematic alternation on rated
# difficulty, so a condition is a set of words, not a group of people. The
# arms below are those word sets, collapsed over subjects (and, for the
# interval arms, over 13 and 26 sessions) as the article reports them.
#
# There is no reliability figure: the article prints none for the recall or
# recognition scoring.

schema_version: 2

study:
  key: bahrick-1993
  citation: "Bahrick, H. P., Bahrick, L. E., Bahrick, A. S., & Bahrick, P. E. (1993). Maintenance of foreign language vocabulary and the spacing effect. Psychological Science, 4(5), 316-321."
  doi: "10.1111/j.1467-9280.1993.tb00571.x"
  design:
    family: longitudinal
    design_detail: >-
      Nine-year longitudinal investigation with four subjects, who were also
      the investigators. Within each subject, 300 English-foreign word pairs
      (French for three subjects, German for one) were assigned 50 to each
      cell of a 2 x 3 factorial (13 or 26 retraining sessions x 14-, 28- or
      56-day intersession interval) by systematic alternation within
      ease-of-learning rating levels; not randomised. Sessions were
      self-administered and ran with a dropout procedure until every remaining
      word had been recalled once. Words in each condition were then assigned
      to retention tests at 1, 2, 3 or 5 years by systematic alternation on
      training difficulty (12 or 13 words each); each test was a self-paced
      recall trial followed by a five-alternative recognition test for the
      words not recalled. The authors report departures from schedule (up to
      10% of an interval), unscheduled extra sessions, one omitted terminal
      session, one 3-year test given at 4 years (2.14% of acquisition data,
      2.08% of retention data, omitted from Figure 2), and some uncontrolled
      exposure to the target languages.

