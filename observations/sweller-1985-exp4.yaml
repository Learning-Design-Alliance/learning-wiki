# Sweller & Cooper (1985), Experiment 4: Year 8 students; worked examples or
# conventional problems in acquisition, then test problems SIMILAR to the
# acquisition problems and test problems DISSIMILAR in structure (same
# algebraic operations, different order of moves), in two orders.
#
# One of five experiments; Experiments 2, 3 and 5 are their own records.
#
# Read from a pdftotext extraction of the JSTOR copy; no PDF beside the text.
#
# TABLE 8 IS GARBLED IN THE TEXT: the four groups' rows break apart and their
# values interleave, so no table mean is recorded. Every observation below is
# a test statistic printed in the Results text, and the text names which pair
# of groups and which problem set each one compares. Some statistics are
# cropped at the right margin of p. 82 ("U (10,10) =" with no value) and are
# not recorded.
#
# WHAT THIS FILE USES:
#   * `population.age: unreported`: school year only.
#   * No `measure_type: mean` (Table 8 unreadable here) and no reliability.

schema_version: 2

study:
  key: sweller-1985-exp4
  citation: "Sweller, J., & Cooper, G. A. (1985). The use of worked examples as a substitute for problem solving in learning algebra. Cognition and Instruction, 2(1), 59–89."
  doi: "10.1207/s1532690xci0201_3"
  design:
    family: quasi-experimental
    design_detail: >-
      Four groups of 10: worked example or conventional problem acquisition
      (as in Experiment 3), crossed with the order of the two test sets
      (similar then dissimilar, or dissimilar then similar). Allocation to
      groups not described. All tests in the same session as acquisition.
      Mann-Whitney U between pairs of groups; Wilcoxon signed-rank for the
      similar-dissimilar difference over all groups.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: worked-examples-improve-math-performance
    bearing: supports
    anchor: sweller-cooper-1985

evidence_base:
  unit: participants
  size:
    value: 40
    unit: participants
  population:
    description: >-
      Year 8 students from a Sydney high school; pilot studies indicated they
      were comparable on algebra manipulation problems to the Year 9 students
      of the previous experiments (Year 9 students at this school solved the
      problems rapidly and without errors).
    age_or_stage: "Year 8"
    age: unreported
  context:
    setting: "Individual sessions, pencil and paper, a Sydney high school"
  arms:
    - id: worked-example-similar-dissimilar
      description: "Worked-example acquisition (as in Experiment 3; examples to be fully understood before being covered), then the similar test set, then the dissimilar set."
      size:
        value: 10
        unit: participants
    - id: worked-example-dissimilar-similar
      description: "Worked-example acquisition, then the dissimilar test set, then the similar set."
      size:
        value: 10
        unit: participants
    - id: conventional-similar-dissimilar
      description: "Conventional-problem acquisition, then the similar test set, then the dissimilar set."
      size:
        value: 10
        unit: participants
    - id: conventional-dissimilar-similar
      description: "Conventional-problem acquisition, then the dissimilar test set, then the similar set."
      size:
        value: 10
        unit: participants

comparisons:
  - id: we-vs-cp-similar-first
    kind: between-groups
    index_arm: worked-example-similar-dissimilar
    reference_arm: conventional-similar-dissimilar
    description: "Worked example against conventional problem, both taking the similar test set first (the replication of Experiment 3)."
  - id: we-vs-cp-dissimilar-first
    kind: between-groups
    index_arm: worked-example-dissimilar-similar
    reference_arm: conventional-dissimilar-similar
    description: "Worked example against conventional problem, both taking the dissimilar test set first."
  - id: dissimilar-vs-similar-all-groups
    kind: none
    description: "Within-subject difference between the dissimilar and the similar test sets, over all four groups."

observations:

  - id: similar-time-similar-first
    sample:
      value: 20
      unit: participants
    comparison_ref: we-vs-cp-similar-first
    outcome:
      construct: "Time to solve algebra test problems similar to those learned"
      source_language: "time on the similar test problems"
      measure: "Seconds per problem on four test problems identical to Experiment 3's"
      scale: "seconds per problem"
      direction: lower-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "test phase, immediately after acquisition in the same session"
    result:
      measure_type: other
      statistic: "U(10,10) = 27"
      model: "Mann-Whitney U test"
      interpretation: "The worked example group required significantly less time on the similar test problems."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: "The sentence begins \"The worked example group required signifi-\" before a line-end hyphen; the quote starts after it."
    source_quote: "less time on the similar test problems than did the conventional problem group, U (10,10) = 27."
    source_location: "Results, p. 81"

  - id: dissimilar-time-similar-first
