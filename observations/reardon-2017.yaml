    source_quote: "When the true CV is 0.2, the optimal models (among those we tried) would be PHOP50, PHOP100, PHOP75, and PHOP150 for the many, mid, wide, and skewed cut score conditions, respectively."
    source_location: "Section 2.4, PHOP Model Simulation Results; Figure 6"

