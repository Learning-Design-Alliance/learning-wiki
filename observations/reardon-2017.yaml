    sample:
      value: 1000
      unit: other
    comparison_ref: phop-thresholds-vs-hetop-homop
    outcome:
      construct: "RMSE-minimising constraint threshold for group SDs"
      source_language: "the optimal models (among those we tried)"
      measure: "Aggregate RMSE of group standard deviation estimates, across all group sizes (Figure 6)"
      scale: "PHOP threshold: largest group n constrained to the shared SD"
      direction: contextual
      role: other
      role_basis: ambiguous
      valued_by: []
    time:
      label: "not applicable: simulated replications"
    result:
      measure_type: other
      estimate: 100
      unit: "students per group (PHOP threshold, groups with n at or below it constrained)"
      interpretation: "PHOP100 minimised aggregate RMSE of group SDs among the models tried, CV of group variances 0.2, ICC 0.20, 'mid' cut scores (20th/50th/80th percentiles)."
    moderators:
      reported:
        - variable: "Cut-score locations"
          relationship: "The optimal threshold at CV 0.2 differed by cut-score set: 50 (many), 100 (mid), 75 (wide), 150 (skewed)"
          source_quote: "When the true CV is 0.2, the optimal models (among those we tried) would be PHOP50, PHOP100, PHOP75, and PHOP150 for the many, mid, wide, and skewed cut score conditions, respectively."
        - variable: "CV of group variances"
          relationship: "With CV 0 the homoskedastic model minimised RMSE in every cut-score condition"
          source_quote: "When the true CV is 0, the HOMOP model minimizes RMSE in all conditions."
      candidate: []
