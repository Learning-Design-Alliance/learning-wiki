      source_language: "constraining the standard deviations of groups smaller than 100 is generally near optimal"
      measure: "Authors' summary of the section 2.4 RMSE results"
      direction: contextual
      role: other
      role_basis: ambiguous
      valued_by: []
    time:
      label: "not applicable: simulated replications"
    result:
      measure_type: qualitative
      finding: >-
        When the CV of group variances is about 0.2, which the authors call
        roughly the average value in the real data they analysed, constraining
        the SDs of groups smaller than 100 is generally near optimal for RMSE
        in their simulations. A smaller threshold suits an analyst less willing
        to tolerate bias than error variance; the choice matters little if
        group means are of primary interest.
      perspective: researcher
    moderators:
      reported:
        - variable: "Analyst's tolerance of bias versus error variance"
          relationship: "Less tolerance of bias favours a smaller constraint threshold"
          source_quote: "For analysts who are less willing to tolerate bias than error variance, a smaller constraint threshold would be preferable and vice versa."
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      The real-data CV the authors call "roughly the average" is not printed
      in the article text; it would be in the online Appendix D tables.
    source_quote: "When the CV of group variances is approximately 0.2 (roughly the average value observed in the data we analyzed), constraining the standard deviations of groups smaller than 100 is generally near optimal in our simulations."
    source_location: "Section 4, Discussion"

