# Reardon, Shear, Castellano & Ho (2017): heteroskedastic ordered probit (HETOP)
# models for recovering group means and SDs from proficiency-category counts.
#
# A METHODS PAPER. Its model form (the HETOP likelihood, the standardisation to
# a population scale with total variance 1, eqs. 8-10, and the sampling-variance
# corrections in Appendix A, eqs. A8-A10 and A13) is model form, not a result,
# and is named in design_detail only. What is recorded is what the paper's own
# Monte Carlo simulation printed:
#
#   * Section 2.4: with CV = 0.2 the RMSE-minimising PHOP threshold was 50, 100,
#     75 and 150 for the many, mid, wide and skewed cut-score conditions. Four
#     observations, one per cut-score condition, because the source prints four.
#   * Section 2.2.2: the largest absolute bias in HETOP SD estimates in any
#     condition, "approximately 0.045".
#   * Section 4: the authors' recommendation that constraining groups smaller
#     than 100 is generally near optimal when the CV is about 0.2, recorded as a
#     qualitative researcher finding because it summarises the simulation.
#
# THE CV IS OF GROUP VARIANCES, NOT OF GROUP SDs. The paper defines it as the SD
# of the group variances over their mean (section 2.1). A reader carrying "CV of
# group SDs is about 0.2" into another model is carrying a different quantity.
#
# The "sample" is simulated datasets: no learners were studied in section 2.
# Section 3's 18 real datasets (state NAEP and one state's tests) are not used
# here. All quotes were checked as substrings of the pdftotext layer; none of
# them contains the glyph codes that the layer uses for equals signs.

schema_version: 2

study:
  key: reardon-2017
  citation: "Reardon, S. F., Shear, B. R., Castellano, K. E., & Ho, A. D. (2017). Using heteroskedastic ordered probit models to recover moments of continuous test score distributions from coarsened data. Journal of Educational and Behavioral Statistics, 42(1), 3–45."
  doi: "10.3102/1076998616666279"
  design:
    family: simulation
    design_detail: >-
      Statistical methods paper evaluated by Monte Carlo simulation (family
      `simulation`: the results are properties of estimators on simulated
      data, not observations of learners). Section 2.1-2.2: four
      simulated populations of 100 groups (ICC 0.05 or 0.20 by CV of group
      variances 0.0 or 0.3), group sizes 25, 50, 100 or 400, scores coarsened
      by four cut-score sets ("mid" 20/50/80th, "wide" 5/50/95th, "skewed"
      5/30/55th, "many" 5/25/50/75/95th percentiles), HETOP and homoskedastic
      (HOMOP) models fitted, 1,000 replications per scenario. Section 2.3-2.4:
      five populations with ICC 0.20 and CV 0.0 to 0.4, 36 group types each
      sampled at n = 25, 50, 75, 100, 150, 200 and 400 (252 groups), the same
      four cut-score sets, and eight models fitted (HETOP, HOMOP and partially
      heteroskedastic PHOP models constraining groups of n at or below 25, 50,
      75, 100, 150 or 200 to one SD), 1,000 replications. Model form named but
      not recorded as results: the HETOP likelihood, the standardisation of
      estimates to the population scale (eqs. 8-10) and the sampling-variance
      corrections of Appendix A (eqs. A8-A10, A13). Section 3 applies the
      model to 18 real datasets.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-repository-copy
  verification: unverified

evidence_base:
  unit: other
  size:
    value: 1000
    unit: other
  additional_sizes:
    - value: 128000
      unit: other
      note: "total replications in the section 2.1 HETOP/HOMOP simulation (64 scenarios, two models); all but 5 converged"
    - value: 40000
      unit: other
      note: "replications per cut-score condition in the section 2.3 PHOP simulation (five CVs by eight models by 1,000)"
    - value: 252
      unit: other
      note: "simulated groups per dataset in the section 2.3 PHOP simulation (36 group types by seven sample sizes)"
    - value: 100
      unit: other
      note: "simulated groups per population in the section 2.1 simulation"
  population:
    description: >-
      Simulated test-score data: groups (standing for schools, districts or
      demographic subgroups) whose scores are drawn from normal distributions
      with set means and SDs, so that the population has a stated ICC and CV
      of group variances, overall mean 0 and total variance 1, then coarsened
      into ordered proficiency categories. No learners were studied in the
      simulation.
    age_or_stage: "Not applicable to the simulation; the real-data section uses Grades 4 to 8 state test data and Grades 4 and 8 NAEP, with no age figure printed."
    age: unreported
  context:
    setting: "Coarsened proficiency-category data as reported by US state testing programmes and EDFacts"
  arms:
    - id: hetop
      description: "Heteroskedastic ordered probit model: every group's mean and SD freely estimated from its category counts."
    - id: homop
      description: "Homoskedastic ordered probit model: every group's SD constrained to be equal."
    - id: phop
      description: "Partially heteroskedastic ordered probit models PHOP25 to PHOP200: groups with n at or below the threshold share one SD, larger groups' SDs are freely estimated."

comparisons:
  - id: phop-thresholds-vs-hetop-homop
    kind: other
    index_arm: phop
    reference_arm:
      - hetop
      - homop
    description: "Aggregate RMSE of group SD estimates compared across the eight fitted models (HETOP, HOMOP and six PHOP thresholds) within one CV-by-cut-score condition; the model with the lowest RMSE is reported as optimal."

