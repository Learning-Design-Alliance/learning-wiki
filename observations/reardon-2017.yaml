  - id: hetop-sd-largest-absolute-bias
    sample:
      value: 1000
      unit: other
    arm_ref: hetop
    outcome:
      construct: "Bias of estimated group standard deviations"
      source_language: "the largest absolute bias in any condition"
      measure: "Average bias of HETOP group SD estimates across groups and replications, per simulation condition (Figure 1, top panel)"
      scale: "SD units of the standardised population score scale (total variance 1)"
      direction: lower-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "not applicable: simulated replications"
    result:
      measure_type: other
      estimate: 0.045
      unit: "absolute bias in SD units of the standardised population scale"
      interpretation: >-
        The source writes "approximately 0.045" for the largest absolute bias
        across the 64 section 2.1 conditions; the bias is negative, a function
        mainly of group size, and larger with skewed or wide cut scores. The
        source puts it beside average true group SDs of about 0.89 (ICC 0.20)
        and 0.97 (ICC 0.05), and says the average bias is typically under 1%
        of the true SD except with n below 50 and skewed or wide cut scores.
    moderators:
      reported:
        - variable: "Group sample size and cut-score locations"
          relationship: "Negative bias in HETOP SDs mainly a function of sample size, exacerbated by skewed or wide cut scores"
          source_quote: "This figure illustrates that there is some negative bias in the standard deviation estimates from the HETOP model and that the bias is primarily a function of sample size that is exacerbated when cut scores are skewed or wide."
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      The figure is printed as an approximation and the condition it occurs in
      is not named in the text; per-condition biases are in Figure 1 and in
      the online Appendix C tables, neither read here.
    source_quote: "the largest absolute bias in any condition is approximately 0.045"
    source_location: "Section 2.2.2, Recovery of standard deviations (the close of a parenthesis after: 'Note the average bias for standard deviations is quite small compared to the true standard deviation of scores, typically less than 1% of the size of the true standard deviations, except when sample sizes are less than 50 and the cut scores are skewed or wide')"

