    source_quote: "cued recall accuracy on the final test was significantly higher in the test condition (M = .69, SD = .15) than the read-only condition (M = .60, SD = .22), t(82) = 2.04, p < .05, prep = .88, d = 0.44."
    source_location: "Experiment 6, Results and Discussion (p. 995)"

  - id: mean-read-only-final-recall
