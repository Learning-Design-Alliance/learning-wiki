# Kornell, Hays & Bjork (2009), Experiment 6: Experiment 4 (weak associates,
# equal 13-s trials, 5-min delay) with condition manipulated BETWEEN
# participants, 42 per condition, to rule out displaced rehearsal of tested
# items during read-only trials.
#
# Records the two group means with SDs and the printed d. How participants
# were allocated to conditions is not described, so the family is `other`.
#
# `population.age: unreported`: the article prints no age figure for any
# experiment. No scoring-reliability figure is printed (answers were typed
# and scored as correct or not; how is not described).
#
# Read from the maintainer's Drive copy of the published article. Its text
# layer writes "=", "<", ">" and the minus sign as symbol-font glyphs; the
# source_quotes use the characters the article prints, so they differ from
# the text file in those symbols only. The numbers are clean.

schema_version: 2

study:
  key: kornell-2009-exp6
  citation: "Kornell, N., Hays, M. J., & Bjork, R. A. (2009). Unsuccessful retrieval attempts enhance subsequent learning. Journal of Experimental Psychology: Learning, Memory, and Cognition, 35(4), 989–998. Experiment 6."
  doi: "10.1037/a0015729"
  design:
    family: other
    design_detail: >-
      Laboratory experiment. Between-participants: condition (read only,
      test), 42 participants each, otherwise identical to Experiment 4 (13-s
      trials; cue alone 8 s then cue and target 5 s in the test condition).
      Method of allocation to conditions not described. Correct guesses at
      study removed. 5-min delay, then a cued-recall test.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: pretesting-enhances-learning
    bearing: supports
    anchor: kornell-hays-and-bjork-2009

evidence_base:
  unit: participants
  size:
    value: 84
    unit: participants
  additional_sizes:
    - value: 42
      unit: participants
      note: "participants in each condition"
  population:
    description: "University of California, Los Angeles (UCLA) undergraduates."
    age_or_stage: "Undergraduates; no age figure is printed"
    age: unreported
  context:
    setting: "Laboratory, computer-presented study phase and cued-recall test."
    materials: "The 60 weak-associate pairs of Experiments 3 to 5."
  arms:
    - id: read-only
      description: "Read-only group: cue and target shown together for 13 s on every trial."
      elements:
        - term: "study of the question and answer presented together"
      dose:
        amount: 13
        unit: "s per trial (target visible 13 s)"
    - id: test
      description: "Test group: cue alone for 8 s while the participant tried to produce the target, then cue and target together for 5 s. Correct guesses (5.4% of trials) removed."
      elements:
        - term: "unsuccessful retrieval attempt followed by the answer (feedback)"
          anchors:
            - principles/retrieval-practice
      dose:
        amount: 13
        unit: "s per trial (8 s attempt, target visible 5 s)"

comparisons:
  - id: test-vs-read-only
    kind: between-groups
    index_arm: test
    reference_arm: read-only
    description: "Between-participants contrast: the test group's final recall against the read-only group's."

observations:

  - id: test-vs-read-only-final-recall
    sample: {value: 84, unit: participants}
    comparison_ref: test-vs-read-only
    outcome:
      construct: "Cued recall of weak-associate targets not retrieved at study"
      source_language: "cued-recall accuracy on the final test"
      measure: "Final cued-recall test: cue shown, participant types the target; items guessed correctly at study excluded"
      scale: "proportion correct"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "5 minutes after the study phase"
      offset: {value: 5, unit: minutes, from: "end of the study phase"}
    result:
      measure_type: cohens_d
      estimate: 0.44
      statistic: "t(82) = 2.04"
      p_value: "< .05"
      descriptives: "test M = 0.69 (SD 0.15) vs read-only M = 0.60 (SD 0.22)"
      note: "Also printed: prep = .88 (probability of replication). The source does not say which SD forms the denominator of d."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    source_quote: "cued recall accuracy on the final test was significantly higher in the test condition (M = .69, SD = .15) than the read-only condition (M = .60, SD = .22), t(82) = 2.04, p < .05, prep = .88, d = 0.44."
    source_location: "Experiment 6, Results and Discussion (p. 995)"

  - id: mean-test-final-recall
    sample: {value: 42, unit: participants}
