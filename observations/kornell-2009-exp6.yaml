not_yet_extracted:
  - "77% of study-phase responses were commission errors. Items answered with an incorrect response at study were later recalled better (M = .71, SD = .15) than items left blank (M = .63, SD = .25), t(36) = 2.62, p < .05, prep = .94, d = 0.42; the authors ask for caution given the null results of Experiments 3 to 5."
