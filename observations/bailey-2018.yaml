  size:
    value: 834
    unit: participants
  allocation:
    value: 42
    unit: schools
  population:
    description: >-
      Children in state-funded preschool programmes in Massachusetts and New
      York, followed through Grade 5. Demographic detail is in the appendix,
      which is not in the text read.
    age_or_stage: "Pre-kindergarten at baseline, followed to Grade 5"
    age: unreported
  context:
    setting: "State-funded preschool classes, then the elementary schools most of the children attended"
  arms:
    - id: building-blocks
      description: >-
        TRIAD treatment: the Building Blocks preschool mathematics curriculum,
        implemented in preschool classes over the preschool year, within the
        TRIAD scale-up model (technology, instruction, assessment and
        professional development).
      elements:
        - term: "Building Blocks preschool mathematics curriculum"
    - id: control
      description: "Preschool mathematics taught as usual."

comparisons:
