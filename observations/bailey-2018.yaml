    kind: between-groups
    index_arm: building-blocks
    reference_arm: control
    description: "Treatment schools against control schools, by random assignment of schools."
  - id: ms-path-averages
    kind: none
    description: >-
      The paper's own averages of one-year math-skill (MS) paths across the
      datasets and experiments listed in Table 1; no contrast between arms.

