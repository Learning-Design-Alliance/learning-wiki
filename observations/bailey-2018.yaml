# Bailey, Duncan, Watts, Clements & Sarama (2018): correlation and causation in
# longitudinal studies of skill development, tested on the TRIAD cluster-
# randomised trial of the Building Blocks preschool mathematics curriculum.
#
# An argument paper that reanalyses data and prints its own estimates, so it
# gets a record. The evidence base is the TRIAD trial as this paper reanalyses
# it: 42 schools randomly assigned, followed from pre-K to Grade 5.
#
# Two observations are NOT about the TRIAD sample alone, and say so: the
# weighted study averages of one-year "MS" (math skill) paths in Table 1 are
# this paper's own averages over three datasets (state-trait estimates from the
# Missouri Math Study, SECCYD and TRIAD) and over three experiments (TRIAD in
# this paper, TRIAD in Hofer et al. 2013, Smith et al. 2013). The individual
# rows of other studies are those studies' figures and are not recorded here.
#
# Read from the PMC author manuscript (text layer). Figures 1, 2 and 5 are
# images: the regression-adjusted correlations and the impact confidence
# intervals plotted there are not in the text, and only the values the prose
# prints are recorded. The appendix and supplementary materials (sample and
# measure details) are not in the text read.
#
# Ambiguity: footnote 2 says the end-of-kindergarten impact "is shown as .29 SD
# (= .18/.63)", while the prose and Table 1 give the rescaled value as .46. The
# footnote's arithmetic does not match either reading cleanly, so no figure is
# taken from the footnote.

schema_version: 2

study:
  key: bailey-2018
  citation: "Bailey, D. H., Duncan, G. J., Watts, T., Clements, D. H., & Sarama, J. (2018). Risky business: Correlation and causation in longitudinal studies of skill development. American Psychologist, 73(1), 81–94."
  doi: "10.1037/amp0000146"
  design:
    family: cluster-randomized-controlled-trial
    design_detail: >-
      Reanalysis of the TRIAD evaluation: 42 schools with state-funded preschool
      programmes in Massachusetts and New York randomly assigned to the Building
      Blocks curriculum in preschool or to preschool mathematics as usual, with
      mathematics measured in fall and spring of pre-K, spring of K, Grade 1,
      fall and spring of Grade 4, and Grade 5. The paper sets experimental
      impacts against regression-adjusted correlations computed in the control
      group, and against one-year paths from latent state-trait models. Standard
      errors adjusted for school-level clustering.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-author-manuscript
  verification: unverified

appears_in:
