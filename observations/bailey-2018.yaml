not_yet_extracted:
  - "Figure 1 (ECLS-K 1998–99 within- and cross-domain correlations with fall-of-kindergarten measures, including the math-to-reading falsification test) and Figure 2's per-wave regression-adjusted correlations and confidence intervals are images; no values are printed in the text beyond those recorded."
  - "ECLS-K inter-wave mathematics correlations of .77, .80 and .89 (SE .01 each), spring K to spring G1, G1 to G3 and G3 to G5: a different sample (the ECLS-K cohort), which would be its own record."
  - "Footnote 2's '.29 SD (= .18/.63)' for the end-of-kindergarten impact does not agree with the prose's rescaled .46; not recorded."
  - "Individual rows of Table 1 from other studies (Bailey et al., 2014b; Watts et al., 2016; Hofer et al., 2013; Smith et al., 2013) are those studies' figures."
  - "Arm sizes, ages and demographics are in the appendix and supplementary materials, not in the text read."
