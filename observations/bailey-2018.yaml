    anchor: bailey-2018
  - claim: correlational-estimates-overstate-skill-building-effects
    bearing: supports
    anchor: bailey-2018
  - claim: state-trait-model-reproduces-experimental-decay
    bearing: supports
    anchor: bailey-2018

evidence_base:
