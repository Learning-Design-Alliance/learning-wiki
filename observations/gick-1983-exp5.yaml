# Gick & Holyoak (1983), Experiment 5: two dissimilar story analogs, with or
# without a verbal statement of the convergence principle appended to each.
#
# Read from a text layer of the published article (Cognitive Psychology 15,
# 1-38); no PDF was available beside it. Table 7A is flattened by the text
# layer row by row (before hint, after hint, total, N); each frequency agrees
# with its percentage and N. The recorded percentages are also printed in the
# running text, which every source_quote cites.
#
#   * Shares before the hint and in total are recorded per condition as
#     `probability`, in percent as printed, beside the two contrasts.
#   * `population.age: unreported`: the article says only that subjects were
#     tested "in several different classrooms".
#   * No reliability figure: schema descriptions were scored "in essentially
#     the same manner as in Experiment 4" (two judges), with no coefficient.
#   * Design `quasi-experimental`: 143 subjects "were divided about evenly
#     between the two conditions"; how is not stated.

schema_version: 2

study:
  key: gick-1983-exp5
  citation: "Gick, M. L., & Holyoak, K. J. (1983). Schema induction and analogical transfer. Cognitive Psychology, 15(1), 1–38. Experiment 5."
  doi: "10.1016/0010-0285(83)90002-6"
  design:
    family: quasi-experimental
    design_detail: >-
      Two between-subjects conditions, both reading the same pair of
      dissimilar analogs ("The General" and "The Fire Chief"): with the verbal
      statement of the convergence principle appended as each story's final
      paragraph, or without it. Subjects studied the stories for 5 minutes,
      then from memory summarised them, described their similarities and rated
      them, and attempted the radiation problem first without and then with a
      hint to use the stories. Method of dividing subjects not stated.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: schema-aids-beneficial-with-two-analogs
    bearing: supports
    anchor: gick-1983
  - claim: two-analogs-induce-schema-predicting-transfer
    bearing: supports
    anchor: gick-1983

evidence_base:
  unit: participants
  size:
    value: 143
    unit: participants
  population:
    description: "143 subjects tested in several different classrooms; the article does not otherwise describe them for this experiment."
    age_or_stage: "Not described for this experiment"
    age: unreported
  context:
    setting: "Classroom testing; written story task from memory, then the radiation problem in the two-pass procedure"
  arms:
    - id: with-principle
      description: "Two dissimilar analogs, each ending with the verbal statement of the convergence principle (worded as in Experiment 2: many smaller forces applied simultaneously from different directions may work as well as one large force)."
      size:
        value: 73
        unit: participants
      elements:
        - term: "comparing two analogous cases"
        - term: "explicit statement of the underlying principle"
    - id: without-principle
      description: "The same two dissimilar analogs without the principle statement."
      size:
        value: 70
        unit: participants
      elements:
        - term: "comparing two analogous cases"

comparisons:
  - id: principle-vs-none
    kind: between-groups
    index_arm: with-principle
    reference_arm: without-principle
    description: "Two analogs with the appended principle statement against two analogs without it."

