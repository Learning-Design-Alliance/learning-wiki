# Bao & Redish (2006): model analysis of Force Concept Inventory responses,
# force-motion concept, University of Maryland introductory mechanics.
#
# WHAT THIS FILE RECORDS:
#
#   * The diagonal of each class model density matrix in Table II, as
#     `measure_type: mean` named by `arm_ref`. The diagonal element D_ii is the
#     average over students of n_ik / m (Eq. 8), that is the class-average
#     probability of a student using model i on the five force-motion items, so
#     it is a single-group mean on a 0-1 scale. No SD is printed.
#     Model order is the paper's: model 1 the correct (Newtonian) expert model,
#     model 2 "there is always a force in the direction of motion", model 3 the
#     null model (Sec. IV.A).
#   * The primary (largest) eigenvalue of each class density matrix, the
#     paper's measure of how consistent the class is, as `other`.
#   * Arms: tutorial-recitation classes and traditional-recitation classes; pre
#     and post are times, not arms. Nothing in the source says how classes came
#     to have one recitation type or the other, so no assignment is inferred and
#     the family is `observational`.
#   * `population.age: unreported`: engineering majors in a calculus-based
#     course, no age figure printed.
#
# No reliability coefficient is printed for the five-item cluster; the paper's
# own validity argument (low null-model eigenvalues, the mixed post state of the
# traditional classes) is a model-based argument, not a reliability statistic,
# and is not recorded as one.
#
# Read from the published PDF (PRST-PER 2, 010103). The density matrices'
# bracket glyphs extract as codes (/H20900, /H20901); the numbers themselves
# extract cleanly and match the maintainer's reading of the printed table, so
# quotes below are the number runs only.

schema_version: 2

study:
  key: bao-2006
  citation: "Bao, L., & Redish, E. F. (2006). Model analysis: Representing and assessing the dynamics of student learning. Physical Review Special Topics - Physics Education Research, 2(1), 010103."
  doi: "10.1103/physrevstper.2.010103"
  design:
    family: observational
    design_detail: >-
      Methods paper introducing model analysis, demonstrated on pre-post Force
      Concept Inventory data from 14 introductory mechanics classes (Physics 161,
      University of Maryland, data collected by J. M. Saul). Each student's
      answers to the five force-motion items (FCI 5, 9, 18, 22, 28) are mapped
      to three models (Table I), giving a model probability vector, a model
      state vector and a density matrix; the class matrix is the average over
      students and is eigen-decomposed. Half of the classes had tutorial
      recitations, half traditional recitations; how classes came to have each
      is not stated and no inferential test between them is reported.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: model-analysis-quantifies-alternate-knowledge-probabilities
    bearing: supports
    anchor: bao-2006
  - claim: alternate-frameworks-context-dependent-use
    bearing: supports
    anchor: bao-2006

evidence_base:
  unit: participants
  size:
    value: 778
    unit: participants
  additional_sizes:
    - value: 14
      unit: classes
      note: "introductory mechanics classes (Physics 161); half with tutorial recitations, half with traditional recitations"
  population:
    description: >-
      Students in the calculus-based introductory mechanics course at the
      University of Maryland, mostly engineering majors. The 778 is the count
      for the combined initial (pre-instruction) state across all classes.
    age_or_stage: "Undergraduate, introductory calculus-based physics"
    age: unreported
  context:
    setting: >-
      All classes had traditional lectures three hours a week, weekly readings
      and textbook homework, and one hour a week of small-group (N about 30)
      TA-led recitation. FCI given pre and post a semester of instruction.
  arms:
    - id: tutorial-recitation
      description: >-
        Classes whose recitations were taught with Tutorials (McDermott &
        Shaffer, 1998): students in groups of three to five on research-based
        guided-discovery worksheets, often using a cognitive-conflict model.
      implementation_notes:
        - "Half of the 14 classes; the per-arm number of students is not printed"
    - id: traditional-recitation
      description: >-
        Classes whose recitations were traditional TA-led problem-solving
        sessions: students asking questions and the TA modelling solutions on
        the board.
      implementation_notes:
        - "Half of the 14 classes; the per-arm number of students is not printed"

comparisons: []

observations:

  - id: tutorial-pre-model2-probability
    arm_ref: tutorial-recitation
    outcome:
      construct: "Use of the naive force-motion model"
      source_language: "model 2: there is always a force in the direction of motion"
      measure: "Density-matrix diagonal element D22 from the five FCI force-motion items mapped to models by Table I"
      scale: "class-average probability of using model 2, 0-1"
      direction: lower-is-better
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "pre-test, before the semester's instruction"
    result:
      measure_type: mean
      estimate: 0.69
      unit: "class-average probability of using model 2 (incorrect), 0-1"
      note: "Diagonal of the Tutorial pre matrix: model 1 0.27, model 2 0.69, null 0.04."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: partial
      effect_size: unreported
    observability_notes: >-
