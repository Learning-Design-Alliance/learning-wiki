    scale: number of correct responses
    direction: higher-is-better
    role: proximal-outcome
    role_basis: inferred
    valued_by: []
  time: *id001
  result:
    measure_type: partial_eta_squared
    estimate: 0.67
    statistic: F(1,23) = 46.00
    p_value: < .001
    note: Interaction of question type and interruption. Main effect of interruption F(1,23) = 40.92,
      partial eta squared .64; main effect of question type F(1,23) = 237.23, .91. The manuscript prints
      the symbol as 'η2∂'.
  moderators:
    reported: []
    candidate: []
  observability:
    population_detail: partial
    implementation_detail: observed
    outcome_timing: partial
    effect_size: observed
  source_quote: A 2 x 2 (Question x Interruption) repeated-measures ANOVA revealed a main effect of interruption,
    F(1,23) = 40.92, p < .001, η2∂ = .64, a main effect of question type, F(1,23) = 237.23, p < .001,
    η2∂ = .91, and a significant interaction, F(1,23) = 46.00, p < .001, η2∂ = .67 (see Figure 2).
  source_location: Experiment 2, Results (manuscript p. 11)
