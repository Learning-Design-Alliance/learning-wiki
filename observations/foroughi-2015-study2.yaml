# Foroughi, Werner, Barragán & Boehm-Davis (2015), Experiment 2: interruptions
# hurt comprehension questions and not recognition questions.
#
# Read from the authors' manuscript version (text layer), not the copy of
# record; page numbers are the manuscript's. Each of the three experiments has
# its own 24 participants, so each is its own file
# (foroughi-2015-study1/-study2/-study3). The article does not say whether
# the same students took part in more than one experiment.
#
# Design family `other`: a within-subjects laboratory experiment, conditions
# counterbalanced across passages, which the vocabulary has no value for.
# The article does not call the counterbalancing random assignment, so no
# randomised design is inferred. The ds are printed beside paired t tests;
# the article does not say how they were computed.
#
# No reliability figure is printed for any measure (number of correct
# responses). Age: each experiment prints a mean and SD.
#
# The manuscript prints partial eta squared as 'η2∂'; quoted as printed.

schema_version: 2
study:
  key: foroughi-2015-study2
  citation: 'Foroughi, C. K., Werner, N. E., Barragán, D., & Boehm-Davis, D. A. (2015). Interruptions
    disrupt reading comprehension. Journal of Experimental Psychology: General, 144(3), 704-709. Experiment
    2.'
  doi: 10.1037/xge0000074
  design:
    family: other
    design_detail: Within-subjects laboratory experiment, 2 x 2 (question type x interruption). Passages
      one and two carried the Experiment 1 comprehension questions, passages three and four true-false
      recognition questions. Each participant had two interrupted and two uninterrupted passages, one
      of each question type, counterbalanced so that each passage appeared in each position six times.
      Repeated-measures ANOVA with Bonferroni-corrected simple main effects.
    preregistration:
      status: unreported
provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: '2026-11-26'
  extraction_method: manual-from-author-manuscript
  verification: unverified
appears_in:
- claim: interruptions-disrupt-reading-comprehension
  bearing: supports
  anchor: foroughi-2015
- claim: interruptions-disrupt-comprehension-not-recognition
  bearing: supports
  anchor: foroughi-2015
evidence_base:
  unit: participants
  size:
    value: 24
    unit: participants
  population:
    description: Twenty-four George Mason University students participating for course credit (18 female,
      6 male), fluent in English and with English as their first language. Sample size set a priori at
      24.
    age_or_stage: Undergraduates
    age:
      unit: years
      mean: 20.7
      sd: 2.3
  context:
    setting: Laboratory, computer-presented reading and interruption tasks; no time limits for reading
      or answering
    materials: Four SAT reading passages and questions from The College Board, approximately equal in
      word count and Flesch-Kincaid grade level, four paragraphs each
  arms:
  - id: interruption
    description: 'Interruption: after each paragraph, pressing the space bar brought up a 15-second interruption
      task (a series of math problems) that occluded the passage; the next paragraph appeared when it
      ended.'
    elements:
    - term: interruption by an unrelated task between paragraphs
  - id: no-interruption
    description: 'No interruption: pressing the space bar after each paragraph displayed the next paragraph.'
comparisons:
- id: comprehension-interruption-vs-none
  kind: other
  index_arm: interruption
  reference_arm: no-interruption
  description: 'Within-participant contrast on the comprehension-question passages (one and two): interrupted
    against uninterrupted.'
- id: recognition-interruption-vs-none
  kind: other
  index_arm: interruption
  reference_arm: no-interruption
  description: 'Within-participant contrast on the recognition-question passages (three and four): interrupted
    against uninterrupted.'
- id: question-by-interruption
  kind: other
  index_arm: interruption
  reference_arm: no-interruption
  description: 2 x 2 repeated-measures ANOVA, question type (comprehension, recognition) by interruption;
    the interaction term.
observations:
- id: comprehension-interruption-vs-none
  sample:
    value: 24
    unit: participants
  comparison_ref: comprehension-interruption-vs-none
  outcome:
    construct: Reading comprehension requiring information connected across the passage
    source_language: reading comprehension
    measure: SAT reading comprehension questions from The College Board, vocabulary-only questions removed;
      number correct
    scale: number of correct responses
    direction: higher-is-better
    role: proximal-outcome
    role_basis: inferred
    valued_by: []
  time: &id001
    label: questions answered after reading each passage, no time limit
  result:
    measure_type: cohens_d
    estimate: 1.9
    statistic: t(23) = 9.30
    p_value: < .001
    descriptives: interruption M = 4.38 (SD .97, 95% CI [3.97, 4.78]) vs no interruption M = 5.42 (SD
      1.21, 95% CI [4.91, 5.93])
    note: The source does not say how d was computed for the within-subjects design.
  moderators:
    reported: []
    candidate: []
  observability:
    population_detail: partial
    implementation_detail: observed
    outcome_timing: partial
    effect_size: observed
  source_quote: Tests of simple main effects using a Bonferroni correction (α = .05) within the comprehension
    questions revealed significantly poorer performance under the interruption condition (M = 4.38, SD
    = .97, 95% CI [3.97, 4.78]) than under the no interruption condition (M = 5.42, SD = 1.21, 95% CI
    [4.91,5.93]), t(23) = 9.30, p < .001, d = 1.90.
  source_location: Experiment 2, Results (manuscript p. 11)
- id: recognition-interruption-vs-none
  sample:
    value: 24
    unit: participants
  comparison_ref: recognition-interruption-vs-none
  outcome:
    construct: Recognition of information from the text
    source_language: recognition
    measure: 'True-false recognition questions modelled on Oulasvirta and Saariluoma (2006) and Glanzer
      et al. (1984) (''Was it claimed in the text that: X.''); number correct'
    scale: number of correct responses
    direction: higher-is-better
    role: proximal-outcome
    role_basis: inferred
    valued_by: []
  time: *id001
  result:
    measure_type: mean_difference
    p_value: '> .249'
    note: 'Not significant. Means: interruption 6.46 (SD 1.28, 95% CI [5.92, 7.00]), no interruption 6.50
      (SD 1.14, 95% CI [6.01, 6.98]).'
  moderators:
    reported: []
    candidate: []
  observability:
    population_detail: partial
    implementation_detail: observed
    outcome_timing: partial
    effect_size: unreported
  observability_notes: The source reports only that the difference was not significant (p > .249); no
    difference, test statistic or effect size is printed for it.
  source_quote: Tests of simple main effects within recognition questions showed no significant difference
    between the interruption (M = 6.46, SD = 1.28, 95% CI [5.92, 7.00]) and no interruption conditions
    (M = 6.50, SD = 1.14, 95% CI [6.01, 6.98]), p > .249.
  source_location: Experiment 2, Results (manuscript p. 11)
