  - "Table 10 (p. 798) overall row for the hybrid contrasts, from the page image: Hybrid-M − SA −0.02 [−0.59, 0.56], Hybrid-S − SA 0.02 [−0.56, 0.59], Hybrid-M − MC 0.03 [−0.63, 0.68], Hybrid-S − MC −0.09 [−0.45, 0.36]."
