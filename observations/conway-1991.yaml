    source_quote: "main effects of RI, F(11, 361) = 5.07, MSe = 5,356, p < .0001, and the interaction of RI by type of test, F(11, 361) = 3.54, MSe = 802, p < .0001, were observed."
    source_location: "Results, Analysis of Measures of Retention (p. 401)"

  - id: recognition-names-vs-concepts-27m
    comparison_ref: names-vs-concepts
