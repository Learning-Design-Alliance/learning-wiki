not_yet_extracted:
  - "Per-interval recognition and cued-recall percentages: plotted in Figures 1 and 2 only; not read off the figures."
  - "Fact verification: no RI effect (F < 1.76), RI x type interaction F(11, 361) = 3.32; general facts around 65% at every RI; specific facts a linear decline, F(1, 361) = 10.30. Concept grouping: RI effect F(11, 361) = 4.20. Research methods: RI effect F(11, 361) = 2.88, around 75% correct."
  - "Table 2 (p. 404): percentage of retention variance accounted for by grade (averaging 5.6%), contact, interest rating, age, RI and confidence rating, per test; scrambled in the OCR but legible on the page image (e.g. recognition of concepts: grade 4.3, contact 0, IRAT 3.7, age 2.4, RI 9.5, CR 1.5, total 19.3)."
  - "Confidence ratings: recognition CR RI effect F(11, 361) = 5.80, type F(1, 361) = 168.60; mean CR names 1.91 vs concepts 2.14."
  - "Questionnaire accuracy: a 20% subset of responses checked against central student records for grade and age at course; 'No discrepancies were found.' Not a reliability coefficient for any memory test."
  - "Table 1 (p. 398) grade and contact means and SDs per RI cohort, legible on the page image."
  - "Table 3 (p. 405): loadings of the tests, CRs, RI and age on four factors."
