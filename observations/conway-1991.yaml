    source_quote: "At these points, recognition of concepts was reliably more accurate than recognition of names: F(1,361) = 4.58, MSe = 0.32, p < .033, for the 27-month RI, and F(1,361) = 5.88, MSe = 0.32, p < .016, for the 39-month RI."
    source_location: "Results, Analysis of Measures of Retention, simple main effects (p. 400)"

