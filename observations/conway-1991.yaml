      statistic: "F(11, 361) = 5.07, MSe = 5,356"
      p_value: "p < .0001"
      interpretation: "Cued recall varied with RI, with an RI x test type interaction, F(11, 361) = 3.54, p < .0001; the main effect of test type was not significant, F(1, 361) = 3.401, p = .06."
    moderators: {reported: [], candidate: []}
