      grade. Per-grade n and the Grade 4-7 means are shown only in Figure 2.
    source_quote: "A weighted polynomial contrast assessing the linear trend across grade levels proved highly significant, F(1, 791) = 92.58, p < .001, and accounted for 96% of the between- groups variance."
    source_location: "Results, Age Differences, Intrinsic motivation"

