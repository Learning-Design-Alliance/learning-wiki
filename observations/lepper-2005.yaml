      role_basis: inferred
      valued_by: []
    time:
      label: "test in the new academic period following the survey year"
    result:
      measure_type: correlation
      estimate: 0.28
      p_value: "< .01"
      note: "Table 2 also prints CAT5 Reading .21 (p < .05) with intrinsic motivation, and -.28 (p < .01) for extrinsic motivation with CAT5 Math."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: partial
      effect_size: observed
    observability_notes: >-
