# Lepper, Corpus & Iyengar (2005): intrinsic and extrinsic motivation in
# Grades 3-8, age differences and academic correlates.
#
# One cross-sectional sample (797 students, two San Francisco Bay Area
# districts). The two achievement measures come from DIFFERENT subsets: the
# California Achievement Test only for 136 students in the first district, and
# report-card GPA only for 216 in the second. Each correlation carries its own
# analysed n, because reading the .27 or .28 as resting on 797 would overstate
# its precision several-fold.
#
# Reliability: the authors print their own alpha (.90) and 6-week test-retest
# r (.74, second district only) for the 17-item intrinsic scale. They print no
# reliability for the California Achievement Test.
#
# Age: the questionnaire asked students their age, but the article prints no
# age figure, only grade levels, so `age: unreported`.
#
# Read from the publisher full text as a pdftotext text layer; no PDF of this
# article was available to view. The text layer renders "=", the minus sign and
# "<" with symbol-font substitutes; the source_quote fields use the characters
# the article prints. Table 2's asterisks appear escaped ("\*") as in the text
# layer. Every figure recorded below was read in running text or in the
# Table 2 row, where the layer is not interleaved.

schema_version: 2

study:
  key: lepper-2005
  citation: "Lepper, M. R., Corpus, J. H., & Iyengar, S. S. (2005). Intrinsic and extrinsic motivational orientations in the classroom: Age differences and academic correlates. Journal of Educational Psychology, 97(2), 184–196."
  doi: "10.1037/0022-0663.97.2.184"
  design:
    family: observational
    design_detail: >-
      Cross-sectional questionnaire study across Grades 3 to 8. Harter's forced-
      choice intrinsic-versus-extrinsic scale decomposed into separate 5-point
      Likert-type intrinsic (17 items) and extrinsic (13 items) scales. One-way
      ANOVAs across the six grade levels with a weighted polynomial linear
      contrast; correlations of each scale with report-card GPA (concurrent,
      second district) and with California Achievement Test scores (the next
      academic period, first-district subset).

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: intrinsic-motivation-positively-correlated-achievement
    bearing: supports
    anchor: lepper-2005
  - claim: intrinsic-motivation-positively-correlated-achievement
    bearing: supports
    anchor: lepper-2005-2
  - claim: intrinsic-motivation-linear-decline-grades-3-8
    bearing: supports
    anchor: lepper-2005

evidence_base:
  unit: participants
  size:
    value: 797
    unit: participants
  additional_sizes:
    - value: 577
      unit: participants
      note: "first district, large urban; the California Achievement Test subset (136) comes from here"
    - value: 220
      unit: participants
      note: "second district, suburban; report-card GPA (216) and the test-retest subsample (208) come from here"
  population:
    description: >-
      Third- to eighth-grade students in two public school districts in the San
      Francisco Bay Area, roughly equally divided across the six grades; 401
      girls and 395 boys (one not reporting sex). 42% Asian American (76% of
      them Chinese American), 34% Caucasian, 2% African American, 5% Hispanic,
      10% other, 7% not reporting.
    age_or_stage: "Grades 3 through 8; age was asked on the questionnaire but no age figure is printed"
    age: unreported
  context:
    setting: "Classroom questionnaire of about 30 minutes, administered by one of seven administrators with parental consent; achievement data taken from school records several months later"
  arms:
    - id: grade-3
      description: "Third-grade students in the cross-sectional sample (n not printed per grade)."
    - id: grade-8
      description: "Eighth-grade students in the cross-sectional sample (n not printed per grade)."

comparisons:
  - id: whole-sample
    kind: none
    description: "Scale properties, correlations and the grade-level trend in the whole sample or the district subset that had the measure; no contrast between assigned groups."

observations:

  - id: intrinsic-cat5-overall-r
    sample:
      value: 136
      unit: participants
    comparison_ref: whole-sample
    outcome:
      construct: "Standardized achievement"
      source_language: "standardized test scores"
      measure: "California Achievement Test (CAT5), overall score, collected for the academic period after the survey"
      scale: "correlation with the 17-item intrinsic motivation scale"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "test in the new academic period following the survey year"
    result:
      measure_type: correlation
      estimate: 0.27
      p_value: "< .01"
      note: "Extrinsic motivation correlated -.32 (p < .001) with the same scores. In a regression with both scales, intrinsic beta = .21 (p = .01), extrinsic beta = -.27 (p < .01), footnote 4."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: partial
      effect_size: observed
    observability_notes: >-
      First-district subset only; its grade and ethnic make-up is not printed
      separately. The article reports no reliability for the California
      Achievement Test, and too few scores for a comparison by grade.
    source_quote: "standardized test scores proved both positively correlated with intrinsic motivation (r = .27, p < .01)"
    source_location: "Results, Relationship to Achievement, Test scores; Table 2"

  - id: intrinsic-cat5-math-r
