    source_quote: 'CAT5—Overall .27\*\* −.32\*\*\* CAT5—Reading .21\* −.30\*\*\* CAT5—Math .28\*\* −.28\*\*'
    source_location: "Table 2, CAT5 rows (intrinsic column first)"

  - id: intrinsic-gpa-r
