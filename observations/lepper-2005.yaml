      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "concurrent with the survey year"
    result:
      measure_type: correlation
      estimate: 0.34
      p_value: "< .001"
      note: "Extrinsic motivation correlated -.23 (p < .01) with GPA. In a regression with both scales, intrinsic beta = .29 (p < .01), extrinsic beta = -.10 (ns), footnote 3."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      Second district only. The authors say the correlation was positive at all
