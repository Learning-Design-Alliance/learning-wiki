    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: "Second district only."
    source_quote: "test–retest data collected from participants in the second school district (n = 208) 6 weeks after the initial administration revealed a strong positive correlation between the two test administrations (r = .74, p < .001)."
    source_location: "Method, Measures, Motivational orientation"

  - id: intrinsic-linear-trend-share
    sample:
      value: 797
      unit: participants
    comparison_ref: whole-sample
    outcome:
      construct: "Intrinsic motivation across grade levels"
      source_language: "reported intrinsic motivation"
      measure: "17-item intrinsic motivation scale, mean item rating"
      scale: "share of between-grade variance on a weighted linear contrast across Grades 3-8"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "cross-sectional, one administration"
    result:
      measure_type: other
      estimate: 96
      unit: "percent of between-groups variance"
      statistic: "F(1, 791) = 92.58"
      p_value: "< .001"
      model: "Weighted polynomial linear contrast within a one-way ANOVA across six grade levels; omnibus F(5, 791) = 19.27, p < .001"
      interpretation: "Lower intrinsic motivation at each higher grade, almost wholly linear. Cross-sectional: different children at each grade, not change within children."
    moderators:
      reported: []
      candidate:
        - "Social desirability: CSDS scores were higher in Grade 3 than Grade 8; with CSDS as covariate the grade effect (F(5, 212) = 3.00) and linear trend (F(1, 212) = 13.69) remained (second district only)"
    observability:
