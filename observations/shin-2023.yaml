      ci_lower: 0.15
      ci_upper: 0.34
      interval_type: other
      statistic: "posterior SD 0.05; Bayesian p > 0.99"
      model: "Multilevel random-coefficients SAOM, Bayesian estimation; controls for gender ego, alter and similarity, engagement ego and similarity effects"
      note: "Interval from Table 3, 'Behavioral academic engagement alter' row, Helpers column; labelled '95% CI'."
    moderators:
      reported: []
      candidate: []
    observability:
