not_yet_extracted:
  - "Table 1: behavioral engagement mean (SD) 3.37 (1.01) at Wave 1 and 3.36 (0.91) at Wave 2; emotional 3.33 (1.02) and 3.28 (0.91); fractions increased, decreased and stable."
  - "Table 2: reciprocity, transitivity, indegree and outdegree centrality per network and wave; tie changes, Hamming distance and Jaccard index (0.42 friends, 0.31 helpers)."
  - "Similarity selection effects (behavioral: friends 0.33, helpers 0.36; emotional: friends 0.20), average similarity influence effects (behavioral 1.81 / 2.53; emotional 1.42 / 1.06), and behavior effects of help-network indegree on engagement (0.19 behavioral, 0.10 emotional)."
  - "Table 3 structural-effect values in the second column group (e.g. help indegree popularity 0.16), whose meaning the table's headings do not make clear."
