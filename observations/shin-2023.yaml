# Shin (2023): co-evolution of friend and help networks in Korean Grade 5-6
# classrooms, with behavioral and emotional academic engagement.
#
# Read from the publisher's open-access full text (text layer). Network
# densities come from Table 2; model parameters from the Results text, with
# intervals from Table 3.
#
# The model parameters are the paper's own published estimates from a
# multilevel Bayesian stochastic actor-oriented model (SAOM). They are on the
# SAOM objective-function scale and are not effect sizes in the d or r sense.
# The text's "SD" beside each estimate is the posterior standard deviation
# (Table 3 column "psd"); it is kept in `statistic`, not written as a
# standard error. Table 3 labels its intervals "95% CI"; the estimates are
# Bayesian posteriors, so the interval type is recorded as `other`, not
# guessed as credible or confidence.
#
# Table 3 is ambiguous in one place: its two column groups are headed
# "Friends" and "Helpers", yet the "Friend network structural effects" and
# "Help network structural effects" blocks each carry a value in both groups.
# Only structural values the Results text itself names are recorded, and the
# second-column structural values are left in not_yet_extracted.

schema_version: 2

study:
  key: shin-2023
  citation: "Shin, H. (2023). The co-evolution of friend and help relationships and their different relationship formation and social influence. Scientific Reports, 13, 15974."
  doi: "10.1038/s41598-023-43346-w"
  design:
    family: longitudinal
    design_detail: >-
      Two-wave panel over one school semester (August and December). Peer
      nominations of friends and helpers within classrooms and self-reported
      behavioral and emotional academic engagement, analysed with a multilevel
      random-coefficients SAOM (Bayesian estimation) of the multiplex friend
      and help networks. No intervention.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: friend-help-network-structural-differences
    bearing: supports
    anchor: shin-2023
  - claim: engaged-adolescents-nominated-helpers-not-friends
    bearing: supports
    anchor: shin-2023
  - claim: engaged-adolescents-nominated-helpers-not-friends
    bearing: supports
    anchor: shin-2023-2
  - claim: help-friendship-coevolution-multiplex
    bearing: supports
    anchor: shin-2023

evidence_base:
  unit: participants
  size:
    value: 542
    unit: participants
  additional_sizes:
    - value: 514
      unit: participants
      note: "students at Wave 2"
    - value: 20
      unit: classes
      note: "classrooms analysed, from 26 in four schools; three did not take part in Wave 2 and three were excluded for model fit below the customary value"
    - value: 4
      unit: schools
      note: "public elementary schools in urban areas of one district in South Korea"
  population:
    description: >-
      Fifth- and sixth-grade students in four urban public elementary schools
      in one South Korean district serving a sizable proportion of
      middle-income families; about half female (52%), more than 99% South
      Korean. Participation 97%, attrition 2.2% from Wave 1 to 2.
    age_or_stage: "Grades 5 and 6 (early adolescence)"
    age:
      unit: years
      mean: 11.46
  context:
    setting: "Self-contained classrooms (one teacher and the same peers all day); classroom surveys at the start (August) and end (December) of a semester; average class size 27 (range 23-31)"
  arms:
    - id: friend-network
      description: "Within-classroom friendship nominations ('who are your close friends that you hang around with and talk to the most?'), unlimited nominations."
    - id: help-network
      description: "Within-classroom help nominations ('who do you most often ask for help with your academic difficulties?'), unlimited nominations."

comparisons:
  - id: friend-vs-help-structure
    kind: other
    index_arm: friend-network
    reference_arm: help-network
    description: "Network descriptives of the same students' friend and help networks, compared by independent t tests in Table 2."
  - id: cross-network
    kind: none
    description: "Effects of one network on tie formation in the other, estimated jointly in the multiplex SAOM."
  - id: engagement-scale-reliability
    kind: none
    description: "Internal consistency of the engagement scales in the whole sample."

