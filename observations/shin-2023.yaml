  - id: help-indegree-popularity
    sample:
      value: 542
      unit: participants
    arm_ref: help-network
    outcome:
      construct: "Concentration of help nominations on already-nominated peers"
      source_language: "indegree popularity effect"
      measure: "SAOM network structural effect: tendency of individuals who already receive many nominations to attract more"
      scale: "SAOM objective-function parameter (posterior mean, random across classes)"
      direction: contextual
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "change from Wave 1 to Wave 2"
    result:
      measure_type: regression_coefficient
      estimate: 0.13
      ci_lower: 0.11
      ci_upper: 0.15
      interval_type: other
      statistic: "posterior SD 0.01; Bayesian p > 0.99"
      model: "Multilevel random-coefficients SAOM, Bayesian estimation; the friend-network indegree popularity effect was -0.10 (SD 0.03, p < 0.01)"
      note: "Interval from Table 3, first column of the 'Help network structural effects' row; Table 3 labels it '95% CI'."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    source_quote: "The indegree popularity effect was negative for friend networks (μ = − 0.10, SD = 0.03, p < 0.01), while it was positive for help networks (μ = 0.13, SD = 0.01, p > 0.99), thus indicating that individuals ask for help from certain peers whom others often ask for help as well."
    source_location: "Results, The network structural effects; Table 3"

