# Rowland (2014): a meta-analysis of testing versus restudy on retention.
#
# Read from the publisher's online-first PDF (33 pp.). Its text layer prints
# mathematical signs as substitute glyphs: "=" for "=", "<" for "<", ">" for
# ">", "≤" for "<=", "≥" for ">=" and "−" for a minus sign. Every source_quote
# below keeps those glyphs exactly as the text layer has them, so a substring
# search of the text finds it; read them as the signs they stand for.
#
# Table 1 (p. 13) runs together into one column in reading-order text, so its
# rows cannot be quoted. Every estimate and interval below is quoted from the
# Results text instead, and each k was read from Table 1 in the PDF's own
# layout (pdftotext -layout, then checked against the page image), where the
# rows are clean. Two places where the text and Table 1 disagree are noted on
# the observations concerned; the text's figures are recorded.
#
# All observations are from the FULL data set (159 effect sizes). The
# high-exposure data set (feedback or > 75% initial success only; g = 0.66) is
# a second analysis of a subset and is listed in not_yet_extracted.
#
# Initial-test success is a property of the studies pooled, not a manipulated
# arm: a "no feedback, <= 50%" stratum is the set of no-feedback studies whose
# observed initial test performance was at or below 50%. The testing arms below
# are named for those strata, each contrasted with restudy.

schema_version: 2

study:
  key: rowland-2014
  citation: "Rowland, C. A. (2014). The effect of testing versus restudy on retention: A meta-analytic review of the testing effect. Psychological Bulletin, 140(6), 1432–1463."
  doi: "10.1037/a0037559"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-analysis of experiments comparing final retention of information
      given an initial test with information given restudy, after an initial
      study phase of equal duration. One effect size per independent sample;
      Hedges's g; categorical moderator analyses (QB between levels) and
      method-of-moments meta-regressions for continuous moderators. Studies
      of learning for a real or simulated class, and clinical samples, were
      excluded, so the corpus is laboratory research.
  synthesis:
    model: "Random-effects model; tau2 by the method of moments; inverse-variance weights"
    heterogeneity_statistic: "Q"
    search:
      databases:
        - PsycINFO
        - Google Scholar
        - Dissertation Abstracts
      date_range: "No date constraint; studies gathered by March 2013; included studies reported 1975 through 2013"
    inclusion:
      - "An initial learning phase of similar duration for all information, a test versus restudy manipulation in an intervening phase, and a final assessment of the learned material"
      - "Memory assessed for the same information that was initially tested or restudied"
    exclusion:
      - "Learning of information for a real or simulated class in which participants were enrolled (13 studies)"
      - "Clinical participant populations (1 study)"
      - "Insufficient data to calculate an effect size (8 studies)"
    data_handling:
      - "Where one sample gave several memory measures, one was randomly selected"
      - "All studies coded by the author; a random 20% coded by an independent trained coder, discrepancies resolved by discussion"
      - "Sensitivity analyses with the imputed correlation r changed from .5 to .25 and .75 left every pattern and test outcome unchanged"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: retrieval-practice-improves-retention
    bearing: supports
    anchor: rowland-2014
  - claim: testing-effect-robust-versus-restudy-control
    bearing: supports
    anchor: meta-1
  - claim: retention-interval-moderates-testing-effect
    bearing: supports
    anchor: rowland-2014
  - claim: retrieval-failure-reduces-benefit
    bearing: supports
    anchor: rowland-2014
  - claim: retrieval-effort-support-testing-effect
    bearing: supports
    anchor: meta-2

evidence_base:
  unit: effect-sizes
  size:
    value: 159
    unit: effect-sizes
  additional_sizes:
    - value: 61
      unit: studies
      note: "studies the 159 effect sizes were drawn from, reported 1975 through 2013"
    - value: 136
      unit: effect-sizes
      note: "effect sizes from college-student samples (Table 1, sample source)"
    - value: 23
      unit: effect-sizes
      note: "effect sizes from other, noncollege or unspecified samples (Table 1, sample source)"
  population:
    description: >-
      Almost entirely undergraduate college students; a few studies used
      Internet samples, older adults, high-school students and younger
      children, collapsed into one "other" level because each group gave
      very few effect sizes.
    age_or_stage: "Mostly undergraduates; the article prints no age figures for the samples."
    age: unreported
  context:
    setting: "Laboratory memory experiments; learning for an enrolled class was an exclusion criterion"
  variation:
    - dimension: "Sample source"
      distribution: "136 effect sizes college, 23 other"
    - dimension: "Stimulus type"
      distribution: "71 paired associates, 58 single words, 23 prose, 7 other"
    - dimension: "Retention interval"
      distribution: "103 effect sizes under 1 day, 56 at 1 day or more"
    - dimension: "Feedback after the initial test"
      distribution: "107 without, 52 with"
  arms:
    - id: testing
      description: "Information given an initial test (with or without corrective feedback) in the intervening phase."
    - id: restudy
      description: "Information re-presented for additional study in the intervening phase."
    - id: testing-no-feedback-le50
      description: "Testing in studies without feedback whose initial test performance was at or below 50%."
    - id: testing-no-feedback-gt75
      description: "Testing in studies without feedback whose initial test performance was above 75%."
    - id: testing-feedback-low-success
      description: "Testing in studies with feedback whose initial test performance was low (printed as under 50%)."
    - id: testing-feedback-high-success
      description: "Testing in studies with feedback whose initial test performance was high (above 75%)."

comparisons:
  - id: testing-vs-restudy
    kind: other
    index_arm: testing
    reference_arm: restudy
    description: "Final retention of tested versus restudied information. Pooled designs include both between-participants (53 effect sizes) and within-participant (106) manipulations."
  - id: no-feedback-le50-vs-restudy
    kind: other
    index_arm: testing-no-feedback-le50
    reference_arm: restudy
    description: "Testing versus restudy, no-feedback studies with initial test performance at or below 50%."
  - id: no-feedback-gt75-vs-restudy
