    description: "Testing versus restudy, no-feedback studies with initial test performance above 75%."
  - id: feedback-low-success-vs-restudy
    kind: other
    index_arm: testing-feedback-low-success
    reference_arm: restudy
    description: "Testing versus restudy, feedback studies with low initial test performance."
  - id: feedback-high-success-vs-restudy
    kind: other
    index_arm: testing-feedback-high-success
    reference_arm: restudy
    description: "Testing versus restudy, feedback studies with high initial test performance."
  - id: coding-agreement
    kind: none
    description: "Agreement between the author and an independent coder on a random 20% of studies; no contrast between configurations."

observations:

  - id: testing-vs-restudy-overall
    sample:
      value: 159
      unit: effect-sizes
    comparison_ref: testing-vs-restudy
    outcome:
      construct: "Retention"
      source_language: "memory performance, defined as the proportion of previously learned items correctly remembered on the final assessment"
      measure: "Final recall or recognition test"
      scale: "Hedges's g, testing minus restudy"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "all retention intervals pooled"
    result:
      measure_type: hedges_g
      estimate: 0.50
      ci_lower: 0.42
      ci_upper: 0.58
      interval_type: confidence
      p_value: "< .001"
      statistic: "Z = 12.38"
      k:
        value: 159
        unit: effect-sizes
      heterogeneity:
        statistic: "Q"
        value: 1009.42
        interpretation: "tau2 = 0.21, p < .001; I2 = 84.35"
      model: "random-effects"
      note: "Mean unweighted g = 0.54, median 0.55; 81% of effect sizes positive, 18% negative, 1% zero."
    moderators:
      reported:
        - variable: "Retention interval"
          relationship: "Larger at 1 day or more (g = 0.69) than under 1 day (g = 0.41)"
          source_quote: "Studies with retention intervals of at least 1 day were associated with larger testing effects (g = 0.69, CI [0.56, 0.81]) than those with retention intervals less than 1 day (g = 0.41, CI [0.31, 0.51])."
        - variable: "Feedback"
          relationship: "Larger with feedback (g = 0.73) than without (g = 0.39)"
          source_quote: "The moderator analysis of feedback yielded significant heterogeneity between levels, with studies providing feedback (i.e., a re-presentation of originally studied information at least once after a testing opportunity) yielding larger testing effects (g = 0.73, CI [0.61, 0.86]) than studies not providing feedback (g = 0.39, CI [0.29, 0.49])."
        - variable: "Publication status"
          relationship: "Larger in published (g = 0.58) than unpublished (g = 0.25) studies"
          source_quote: "Studies classified as published had a larger mean weighted effect size (g = 0.58, CI [0.49, 0.67]) than those unpublished (g = 0.25, CI [0.10, 0.41]), although both were reliably greater than 0."
        - variable: "Sample source (college versus other)"
          relationship: "No heterogeneity between college and other samples"
          source_quote: "In the sample source moderator analysis, effect sizes were homogeneous between levels representing studies utilizing college-enrolled participant samples and those utilizing samples drawn from other, noncollege or unspecified populations."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: partial
      effect_size: observed
      pooled_k: observed
    observability_notes: >-
      k is the full data set of 159 effect sizes, which the overall analysis
      pools; the text does not print k beside the estimate.
    source_quote: "With the full data set, the mean weighted effect size from the random-effects model, g = 0.50 (CI [0.42, 0.58]), was greater than 0, indicating a reliable testing effect (Z = 12.38, p < .001) when contrasted with a restudy control condition."
    source_location: "Results, p. 12"

  - id: testing-vs-restudy-ri-ge-1day
