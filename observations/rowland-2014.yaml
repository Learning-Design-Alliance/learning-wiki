    source_quote: "Heterogeneity was detected (p < .01), such that studies utilizing feedback with low (<50%) initial test performance yielded numerically larger effects (g = 0.99) than those with moderate (51%– 75%; g = 0.68) and high (>75%; g = 0.40) initial test performance, thereby providing an additional result in support of retrieval effort theories."
