      outcome_timing: observed
      effect_size: observed
    source_quote: "There was a strong correlation between users’ individual effects of sequential errors on quitting (random slopes) in the addition and the subtraction game (r = .64; p < .001)."
    source_location: "Section 2.2.4; Figure 4"

not_yet_extracted:
  - "Replication part (Section 2.1, Table 1, Tables A1-A4): multi-state survival model transition intensities (persisting to hard-quit 0.0227, soft-quit to hard-quit 0.0284) and hazard ratios for 1, 2, 3 and >3 sequential errors by application and transition; 24,859 users. Figure 1's extracted labels are scrambled; Tables A1-A4 read cleanly but were not encoded."
  - "Two-state Markov models on the addition game (Section 2.2.1, Tables B1-B3): baseline persisting-to-quitting rate 0.018; hazard ratios 7.36, 22.93, 17.61 and 17.65 for 1, 2, 3 and >3 vs 0 sequential errors (training); interaction effects. Figure 2's extracted text is scrambled; Table B1 reads cleanly."
  - "About 31% of addition-game sessions ended prematurely (both datasets)."
  - "Testing-data fixed and random effects (Tables C1, C2) beyond the values quoted in notes, and the ICCs for the testing data (69% and 56%)."
  - "Figure 3 (post-error vs post-correct quit probability by session count): figure only."
  - "Measures inconsistency: Section 2.2.3 says sequential errors range from 0 to 10, Section 4.4 says 0 to 9."
  - "No reliability coefficient is printed for any measure; ability is the platform's Elo rating."
