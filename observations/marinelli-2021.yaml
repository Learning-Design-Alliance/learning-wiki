      note: >-
        Tukey contrasts as printed, each p < 0.0001: a decrease of "about 94 s"
        from A1 to A20; an increase of "about 75 s" from A20 to B1; B1 faster
        than A1 by "about 19 s". The differences are given only as approximate.
    moderators:
