      direction: lower-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "matrices A1 to A20 over two consecutive days"
    result:
      measure_type: other
      statistic: "F(19, 2,356) = 361.21"
      p_value: "< 0.0001"
      model: "Repeated-measures ANOVA over the 20 repetitions"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "As far as response times, an ANOV A with repetition indicated a significant learning effect across the 20 repetitions ( F(19, 2,356)  = 361.21; p < 0.0001)."
    source_location: "Results, Learning Effects in the Experimental Task"

  - id: time-a1-a20-b1-anova
    sample:
      value: 125
