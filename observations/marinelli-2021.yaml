# Marinelli, Angelelli, Martelli, Trenta & Zoccolotti (2021): practice curves
# on a paper-and-pencil alphabet-rule task in Italian fifth graders.
#
# WHAT THIS FILE RECORDS:
#
#   * `population.age` for the analysed subsample of 125 (mean 10.34, SD 0.61).
#     The full tested sample of 137 (mean 10.36, SD 0.60) is in the prose.
#   * `measure_type: mean` for the time per 36-letter matrix at the first
#     practised matrix (A1), the last (A20) and the first matrix of new letters
#     (B1), each with its SD, as the Results print them. The matrices are the
#     arms, as the phases are in a single-case record: one group of children
#     met all of them, in order, on two consecutive days.
#   * The F tests for practice across the 20 repetitions and across A1, A20
#     and B1, as printed. No effect size is printed for either.
#   * Error rates at A1, A20 and B1.
#   * The power-function fits: the median individual R2 and the group R2.
#
# No reliability coefficient is printed for the experimental task or for any
# other test. The fitted group parameters (equation in the Results) are garbled
# in the text layer and are not recorded; see not_yet_extracted.
#
# Read from the publisher's open-access PDF text layer (pdftotext). No page
# image was viewed.

schema_version: 2

study:
  key: marinelli-2021
  citation: "Marinelli, C. V., Angelelli, P., Martelli, M., Trenta, M., & Zoccolotti, P. (2021). Ability to consolidate instances as a proxy for the association among reading, spelling, and math learning skill. Frontiers in Psychology, 12, 761696."
  doi: "10.3389/fpsyg.2021.761696"
  design:
    family: other
    design_detail: >-
      Single group, within-subject repeated measures. Every child did 20
      matrices of the same six target letters (A1-A20; ten on each of two
      consecutive days) and then two matrices of six new letters (B1, B2), in
      that fixed order. Power functions fitted per child and to the median
      curve; repeated-measures ANOVAs on time and errors; then multiple
      regressions of reading, spelling, maths and control tests on each
      child's fitted parameters. No comparison group and no random assignment.

