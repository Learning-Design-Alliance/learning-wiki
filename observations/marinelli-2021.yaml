      outcome_timing: observed
      effect_size: unreported
    source_quote: "The condition effect was highly significant (F(2, 248)  = 484.74; p < 0.0001), indicating a significant decrease in times with practice (of about 94 s., p < 0.0001, Tukey’s test) and a significant increase in times in the condition with new stimuli (B1) with respect to the A20 presentation (of about 75 s., p < 0.0001, Tukey’s test)"
    source_location: "Results, Learning Effects in the Experimental Task; Figure 4"

