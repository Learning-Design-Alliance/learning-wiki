evidence_base:
  unit: participants
  size:
    value: 125
    unit: participants
  additional_sizes:
    - value: 140
      unit: participants
      note: "children who agreed to take part; 3 excluded for impaired Raven's CPM performance"
    - value: 137
      unit: participants
      note: "children tested; 12 more excluded because their individual power fit had R2 below 0.30"
  population:
    description: >-
      Typically developing Italian fifth graders in schools in areas of Lecce
      and Rome described as middle-class. Analysed subsample 78 boys and 47
      girls; mean Raven's CPM z score 0.20 (SD 0.91). The 137 tested: 82 boys,
      55 girls, mean age 10.36 (SD 0.60).
    age_or_stage: "Fifth grade"
    age:
      unit: years
      mean: 10.34
      sd: 0.61
      note: "Analysed subsample of 125"
  context:
    setting: "Tested individually in a quiet room at school on two consecutive days"
  arms:
    - id: matrix-a1
      description: "First practised matrix (A1): 36 letters, six target letters (A, M, T, N, F, I) six times each; rule 'letter +2 positions ahead in the alphabet', with an example at the top of the sheet."
    - id: matrices-a1-a20
      description: "The twenty practised matrices A1-A20, the same six target letters in a different order on each; A1-A10 on day 1, A11-A20 on day 2."
    - id: matrix-a20
      description: "Last practised matrix (A20), day 2."
    - id: matrix-b1
      description: "First matrix of six new letters (U, C, R, E, Q, L), given on day 2 after A20, to test generalisation to letters not practised."

comparisons:
  - id: practice-over-20-repetitions
    kind: within-subject-baseline
    index_arm: matrices-a1-a20
    description: "Change in time (or errors) across the 20 repetitions of the practised matrices."
  - id: a1-a20-b1
    kind: other
    index_arm: [matrix-a20, matrix-b1]
    reference_arm: matrix-a1
    description: "Three-condition repeated-measures comparison of A1, A20 and B1 in the same children."

