      effect_size: observed
    observability_notes: "A null measured as such: the source prints the contrast and its effect size. Analysed n not stated; df = 69."
    source_quote: "No difference was found between mastery goal manipulation and the no-goal condition, F(1, 69) = .07, ns, ηp² = 0.00."
    source_location: "Study 1, Results, Openness in Information Giving (p. 1440); quote from page image"

