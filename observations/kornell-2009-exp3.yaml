# Kornell, Hays & Bjork (2009), Experiment 3: weak-associate word pairs,
# answer shown for equal time (5 s) in both conditions, so a test trial was
# longer in total (13 s) than a read-only trial (5 s), as in Experiment 1.
#
# Records the final cued-recall means with SDs and the printed d. Items the
# participant guessed correctly at study (4.4% of test trials) were excluded,
# participant by participant, which the authors note biases the comparison
# toward the read-only condition.
#
# `population.age: unreported`: the article prints no age figure for any
# experiment. No scoring-reliability figure is printed (answers were typed
# and scored as correct or not; how is not described).
#
# Read from the maintainer's Drive copy of the published article. Its text
# layer writes "=", "<", ">" and the minus sign as symbol-font glyphs; the
# source_quotes use the characters the article prints, so they differ from
# the text file in those symbols only. The numbers are clean.

schema_version: 2

study:
  key: kornell-2009-exp3
  citation: "Kornell, N., Hays, M. J., & Bjork, R. A. (2009). Unsuccessful retrieval attempts enhance subsequent learning. Journal of Experimental Psychology: Learning, Memory, and Cognition, 35(4), 989–998. Experiment 3."
  doi: "10.1037/a0015729"
  design:
    family: other
    design_detail: >-
      Laboratory experiment. Within-participants: condition (read only, test),
      with the procedure of Experiment 1 (read-only trial: cue and target
      together for 5 s; test trial: cue alone for 8 s, then cue and target for
      5 s) and 60 items per participant. Correct guesses at study excluded
      from analysis participant by participant. 5-min delay, then a cued-
      recall test.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: pretesting-enhances-learning
    bearing: supports
    anchor: kornell-hays-and-bjork-2009

evidence_base:
  unit: participants
  size:
    value: 15
    unit: participants
  population:
    description: "University of California, Los Angeles (UCLA) students."
    age_or_stage: "UCLA students; no age figure is printed"
    age: unreported
  context:
    setting: "Laboratory, computer-presented study phase and cued-recall test."
    materials: "60 cue-target pairs from D. L. Nelson, McEvoy and Schreiber's (1998) norms (e.g., freckle-mole), forward association strength .050 to .054, every word at least four letters long."
  arms:
    - id: read-only
      description: "Read-only: cue and target shown together for 5 s."
      elements:
        - term: "study of the question and answer presented together"
      dose:
        amount: 5
        unit: "s per trial (target visible 5 s)"
    - id: test
      description: "Test: cue alone for 8 s while the participant tried to produce the target, then cue and target together for 5 s. Correct guesses (4.4% of trials) excluded."
      elements:
        - term: "unsuccessful retrieval attempt followed by the answer (feedback)"
          anchors:
            - principles/retrieval-practice
      dose:
        amount: 13
        unit: "s per trial (8 s attempt, target visible 5 s)"

comparisons:
  - id: test-vs-read-only
    kind: other
    index_arm: test
    reference_arm: read-only
    description: "Within-participant contrast: each participant's final recall of items studied in the test condition against items in the read-only condition."

observations:

  - id: test-vs-read-only-final-recall
    sample: {value: 15, unit: participants}
    comparison_ref: test-vs-read-only
    outcome:
      construct: "Cued recall of weak-associate targets not retrieved at study"
      source_language: "cued-recall accuracy on the final test"
      measure: "Final cued-recall test: cue shown, participant types the target; items guessed correctly at study excluded"
      scale: "proportion correct"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "5 minutes after the study phase"
      offset: {value: 5, unit: minutes, from: "end of the study phase"}
    result:
      measure_type: cohens_d
      estimate: 1.49
      statistic: "t(14) = 5.77"
      p_value: "< .0001"
      descriptives: "test M = 0.71 (SD 0.20) vs read-only M = 0.50 (SD 0.19)"
      note: "Also printed: prep > .99 (probability of replication). The source does not say which SD forms the denominator of d."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      Within-participant t test; the source does not say how d was computed
      for the paired design.
    source_quote: "cued recall accuracy on the final test was significantly higher in the test condition (M = .71, SD = .20) than it was in the read-only condition (M = .50, SD = .19), t(14) = 5.77, p < .0001, prep > .99, d = 1.49."
    source_location: "Experiment 3, Results and Discussion (p. 994)"

