    index_arm: oe
    reference_arm: ce
    description: "OE against CE, quantitative knowledge, effect sizes from 15-to-17-year-olds."
  - id: oe-ce-association
    kind: none
    description: "Correlation between the same test-takers' OE and CE scores, pooled across studies."
  - id: extraction-agreement
    kind: none
    description: "Agreement between the two raters who extracted sample sizes and effect sizes."

observations:

  - id: dav-overall
    sample:
      value: 303
      unit: effect-sizes
    comparison_ref: oe-vs-ce
    outcome:
      construct: "Test score"
      source_language: "differences between scores from OE and CE response formats"
      measure: "Achievement and aptitude test scores, all cognitive ability categories"
      scale: "Cohen's d_av, OE minus CE"
      direction: contextual
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "same assessment or sitting in most primary studies"
    result:
      measure_type: cohens_d
      estimate: -0.65
      standard_error: 0.066
      ci_lower: -0.78
      ci_upper: -0.53
      interval_type: confidence
      p_value: "< 0.001"
      k:
        value: 303
        unit: effect-sizes
      heterogeneity:
        statistic: I2
        value: 99.83
        unit: percent
        interpretation: "Q(302) = 159 858.74, p < 0.001; I2 within studies 25.38, between studies 74.45"
      publication_bias:
        method: "Kendall's tau rank correlation and Egger's regression test, adjusted for nesting"
        finding: "Kendall's tau = 0.30, p < 0.001 and Egger's z = -6.06, p < 0.001 indicated possible publication bias overall"
      model: "multi-level random-effects, d_av = M_diff / ((SD1 + SD2)/SD_pooled)"
    moderators:
      reported:
        - variable: "Stem-equivalency of items"
          relationship: "Smaller OE-CE difference for stem-equivalent items (d -0.52, k 242) than non-stem-equivalent (d -0.88, k 61); d_diff -0.36, p = 0.004"
          source_quote: "Overall, analyses revealed a significantly smaller difference between scores from OE and CE formats for stem-equivalent items than for non-stem-equivalent items ( d diff = −0.36, p = 0.004), as hypothesized."
        - variable: "Country of data collection"
          relationship: "Larger difference for United States data (d -0.75, k 109) than other countries (d -0.55, k 194); d_diff 0.20, p = 0.032"
          source_quote: "When the data had been collected in the United States, the difference between scores from OE and CE formats was significantly higher than for data collected in other countries overall ( d diff = 0.20, p = 0.032; table 3 )."
        - variable: "Age group"
          relationship: "No significant moderation; CE scores higher at every age"
          source_quote: "Our meta-analyses indicated that age did not significantly moderate the magnitude of the gap between scores from OE and CE assessments, indicating that significantly higher scores were reached in CE response formats irrespective of the test-takers' age ( table 6 )."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: partial
      effect_size: observed
      pooled_k: observed
    observability_notes: >-
      The test reliabilities of the primary studies are not reported or
      corrected for; the authors say the effects are probably underestimations.
    source_quote: "total*** 303 −0.65 (0.066) [−0.78, −0.53] <0.001 Q (302) = 159 858.74, p < 0.001 99.83 25.38 74.45"
    source_location: "Table 2, row total"

