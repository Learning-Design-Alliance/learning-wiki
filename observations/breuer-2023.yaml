# Breuer, Scherndl & Ortner (2023): open-ended (OE) against closed-ended (CE)
# response formats in achievement and aptitude tests, three groups of
# multi-level random-effects meta-analyses.
#
# Read from the Europe PMC full-text XML (CC BY), flattened to text: table rows
# survive as runs of cells in reading order and are quoted as such; the XML's
# "&lt;" is quoted as the article's "<".
#
# SIGN. d_av is OE minus CE: "a negative effect size revealed that higher
# average scores were obtained in CE formats". So the OE arm is the index arm
# throughout, and every negative estimate means CE scores were higher.
#
# k counts EFFECT SIZES, not studies (each table's note says so). Meta-Analyses
# A (differences) rest on 81 studies and 303 effect sizes, B (correlations) on
# 34 studies and 98 effect sizes, out of 102 primary studies and 392 effect
# sizes in all. The subgroup rows of Tables 3 and 6 print k and d only: no
# standard error or interval, and none is derived here.

schema_version: 2

study:
  key: breuer-2023
  citation: "Breuer, S., Scherndl, T., & Ortner, T. M. (2023). Effects of response format on achievement and aptitude assessment results: Multi-level random effects meta-analyses. Royal Society Open Science, 10(5), 220456."
  doi: "10.1098/rsos.220456"
  design:
    family: meta-analysis
    design_detail: >-
      Three groups of multi-level random-effects meta-analyses (effect sizes
      nested in studies): A, standardised mean differences between OE and CE
      scores (Cohen's d_av, Lakens); B, correlations between OE and CE scores;
      C, moderation by test-taker characteristics (age group, sex, test
      anxiety, risk propensity, motivation) and relations with school
      performance. Moderators of A and B by meta-regression on test and
      situation features. Within- and between-subject, randomised and
      non-randomised primary studies were all eligible.
  synthesis:
    model: "Multi-level random-effects models, metafor robust.rma.mv() with random part ~1|citation/id, clubSandwich CR2 robust standard errors"
    heterogeneity_statistic: "Q and I2 (total, within studies, between studies)"
    reporting_guideline: "MARS and PRISMA"
    search:
      databases:
        - Web of Science (all citation indices)
        - PsycINFO
      date_range: "From inception to 1 September 2022; unpublished data received by 2 November 2022"
      records_screened: 1022
      records_included: 102
    data_handling:
      - "Two raters screened titles and abstracts and full texts and extracted data; disagreements resolved by discussion"
      - "Outliers removed: d > 3 or < -3, r > 0.90"
      - "Scores on different scales converted to percentages; SDs computed from SEs"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: ce-response-format-higher-scores-than-oe-pooled-meta-analysis
    bearing: supports
    anchor: breuer-sonja-2023
  - claim: oe-ce-response-format-scores-correlation-r-067
    bearing: supports
    anchor: breuer-sonja-2023
  - claim: stem-equivalency-moderates-oe-ce-score-difference
    bearing: supports
    anchor: breuer-sonja-2023

evidence_base:
  unit: effect-sizes
  size:
    value: 392
    unit: effect-sizes
  additional_sizes:
    - value: 102
      unit: studies
      note: "primary studies (records) whose data were extracted"
    - value: 303
      unit: effect-sizes
      note: "effect sizes in Meta-Analyses A, from 81 primary studies"
    - value: 98
      unit: effect-sizes
      note: "effect sizes in Meta-Analyses B, from 34 primary studies"
  population:
    description: >-
      Healthy test-takers of all ages. In Meta-Analyses A, studies mostly from
      the United States (49.4%), the United Kingdom (6.2%), Canada (6.2%) and
      Taiwan (4.9%), with school students (54.3%) and university students
      (39.5%); 15 to 191,040 test-takers per record.
    age_or_stage: >-
      Effect sizes coded into age groups 6-10, 11-14, 15-17 and over 18 years
      for the age moderation (Table 6); mean age was coded where reported, but
      the article prints no age distribution for the corpus.
    age: unreported
  context:
    setting: "Achievement and aptitude tests: school and university exams, entrance tests, psychometric ability tests, international student assessments; low- and high-stakes, small- and large-scale"
  variation:
    - dimension: "Cognitive ability (CHC category), Meta-Analyses A"
      distribution: "Domain-specific knowledge 46.2%, reading and writing 24.3%, quantitative knowledge 23.1%"
    - dimension: "Design and items, Meta-Analyses A"
      distribution: "Within-subject design 77.8%; non-stem-equivalent items 61.7%; low-stakes 71.6%; small-scale 70.4%; 44.4% of data collected before 2000"
  arms:
    - id: oe
      description: "Test scores under an open-ended response format (written short answer, cloze, essay, mixed, oral or practical task)."
    - id: ce
      description: "Test scores under a closed-ended response format (single-choice, multiple-choice, true-false)."

comparisons:
  - id: oe-vs-ce
    kind: other
    index_arm: oe
    reference_arm: ce
    description: "OE against CE scores on achievement or aptitude tests, pooled over within- and between-subject primary studies."
  - id: oe-vs-ce-stem-equivalent
    kind: other
    index_arm: oe
    reference_arm: ce
    description: "OE against CE, restricted to stem-equivalent items (the CE version differs only by offering response options)."
  - id: oe-vs-ce-non-stem-equivalent
    kind: other
    index_arm: oe
    reference_arm: ce
    description: "OE against CE, restricted to non-stem-equivalent items."
  - id: oe-vs-ce-gq-stem-equivalent
    kind: other
    index_arm: oe
    reference_arm: ce
    description: "OE against CE, quantitative knowledge (maths and statistics) with stem-equivalent items."
  - id: oe-vs-ce-gq-age-6-10
    kind: other
    index_arm: oe
    reference_arm: ce
    description: "OE against CE, quantitative knowledge, effect sizes from 6-to-10-year-olds."
  - id: oe-vs-ce-gq-age-11-14
