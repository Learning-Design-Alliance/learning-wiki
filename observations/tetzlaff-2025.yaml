      ci_upper: -0.209
      interval_type: confidence
      k:
        value: 88
        unit: effect-sizes
      heterogeneity:
        statistic: "Q"
        value: 284.457
        interpretation: "Q(df = 88), p < .001; I2 = 87.55%, strong heterogeneity. The df is printed as 88 here and 87 for the low prior knowledge effect, both with k = 88."
      publication_bias:
        method: "Funnel plot with trim and fill; Egger's regression"
        finding: "Egger's tests for the two effects were z = 0.568, p = .57 and z = 0.299, p = .77 (the article does not say which is which); funnel plot symmetry, no evidence of publication bias"
      model: "metafor, dependency among effect sizes accounted for, clubSandwich robust SEs; j = 60 studies"
    moderators:
      reported:
        - variable: "Content domain"
          relationship: "Not a significant moderator for high prior knowledge learners"
          source_quote: "the content area did not significantly moderate the effect for learners with high prior knowledge."
        - variable: "Type of prior knowledge assessment"
          relationship: "Significant moderator (R2 = 50.00%); most pronounced when prior knowledge was defined by grade level, weakest when defined by measurement or intervention"
          source_quote: "For high prior knowledge learners, the moderation was significant (R2 = 50.00 %), with especially pronounced effect sizes when prior knowledge was defined by differences in grade level and weakest when defined by measurement or intervention."
