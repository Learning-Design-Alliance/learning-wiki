study:
  key: carter-2014
  citation: 'Carter, M. J., Carlsen, A. N., & Ste-Marie, D. M. (2014). Self-controlled feedback is effective
    if it is based on the learner’s performance: a replication and extension of Chiviacowsky and Wulf
    (2005). Frontiers in Psychology, 5, 1325.'
  design:
    family: quasi-experimental
    design_detail: '2 (Choice: Self, Yoked) × 3 (Decision: Before, After, Both) between-subjects design;
      the first 24 participants were randomly assigned to one of the self-controlled groups and the last
      24 to one of the yoked groups; practice on Day 1, retention and transfer tests on Day 2.'
    preregistration:
      status: unreported
