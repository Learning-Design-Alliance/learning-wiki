  - "Utilization of received low-quality information: definition main effect F(1, 96) = 4.60, partial eta squared 0.05; contrasts performance vs mastery 0.03 (p = .06), performance vs no goal 0.05, mastery vs no goal 0.01."
  - "Mediation of the mastery-vs-performance openness effect by reciprocity and exploitation orientation (bootstrap 95% CIs -.0864 to -.0055; -.0536 to -.0011; -.0568 to -.0025), and of the utilization effect by perceived quality (.0041 to .0536); regression coefficients in the text."
  - "Table 2 means and SDs per pooled condition for the five dependent variables, as separate measure_type mean observations."
  - "Reciprocity orientation and perceived quality are single items; no reliability printed."
  - "Manipulation check, chi-square(16, N = 125) = 323.78, p < .001."
