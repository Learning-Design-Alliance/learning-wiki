# Paschke, Steinmayr, Mertens, Neubauer & Spinath (2025), Dataset 1: competence
# beliefs and intrinsic motivation in maths, Grades 2-3, RI-CLPM and CLPM.
#
# The article reanalyses two independent samples; this file is Dataset 1
# (Spinath and Steinmayr 2008) and paschke-2025-study2 is Dataset 2. Read from
# the PMC full text (PMC12598449), whose tables are tab-separated and clean.
#
# A within-person autoregressive path in an RI-CLPM and a CLPM autoregressive
# path are different statistics: the first is carry-over of a child's deviation
# from their own mean, the second rank-order stability. Each observation's
# model field says which. All coefficients are standardised as printed.
#
# N: the abstract says 670, the Participants section 664. 664 is recorded.

schema_version: 2
study:
  key: paschke-2025-study1
  citation: Paschke, P., Steinmayr, R., Mertens, A., Neubauer, A. B., & Spinath, B. (2025). Re-examination of the
    reciprocal relation between intrinsic motivation and competence beliefs in math using the random-intercept cross-lagged
    panel framework. Child Development, 96(6), 2201–2220.
  doi: 10.1111/cdev.70028
  design:
    family: longitudinal
    design_detail: 'Dataset 1 (Spinath and Steinmayr 2008), reanalysed: four waves 3 to 4 months apart, June 2002
      (Grade 2) to May 2003 (Grade 3). Multi-indicator RI-CLPMs and traditional CLPMs, each in an autoregressive
      and a cross-lagged version, in Mplus 8.501 with MLR and FIML; gender as a time-varying covariate; type = complex
      with class as cluster. Residual measurement invariance held for both constructs. No assignment of conditions.'
