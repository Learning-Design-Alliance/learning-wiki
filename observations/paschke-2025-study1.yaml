    source_language: t S1–t S2 IV → IV
    measure: Three items, how much the child likes mental arithmetic, math problems and doing calculations; 5-point
      scale, recoded so higher is more intrinsic motivation
    scale: standardised path coefficient
    direction: contextual
    role: learner-characteristic
    role_basis: inferred
    valued_by: []
  time:
