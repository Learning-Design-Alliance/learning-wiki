  result:
    measure_type: regression_coefficient
    estimate: 0.37
    standard_error: 0.14
    p_value: 0.008
    model: Autoregressive RI-CLPM (no cross-lagged paths), the best-fitting model in Dataset 1 by AIC and BIC; gender
      as a time-varying covariate. The cross-lagged RI-CLPM gives 0.08 (SE 0.28) for this interval.
