  - value: 13
    unit: schools
    note: elementary schools in North-Rhine Westphalia
  population:
    description: German elementary students, 44.7% male, 51.8% female, 3.5% gender not reported; 98% reported being
      white, 86% German citizenship. The abstract gives 670 students; the Participants section gives 664, which
      is recorded.
    age_or_stage: Grade 2 at the first wave, Grade 3 at the fourth
    age:
      unit: years
      mean: 8.81
      sd: 0.56
      note: at the first measurement occasion; the abstract rounds the mean to 8.80
  context:
    setting: North-Rhine Westphalia, Germany, 2002-2003; about 30-minute test sessions administered by teachers
      who did not teach the class
  arms: []
comparisons:
