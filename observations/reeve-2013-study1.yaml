# Reeve (2013), Study 1: developing the Agentic Engagement Scale (AES).
#
# One article, three studies with three different samples, so three records:
# reeve-2013-study1, reeve-2013-study2, reeve-2013-study3.
#
# WHAT THIS FILE RECORDS: Table 1's correlations of each of the five items kept
# in the final AES with the two measures of "agentic motivation" (psychological
# need satisfaction and academic efficacy), one observation per item and
# measure, and the alphas the article prints for its own sample. The article
# prints no range or average over the retained items, so none is recorded.
#
#   * `population.age: unreported`: the sample is described as college
#     students, and no age figure is printed.
#   * `measure_type: reliability`: alphas for need satisfaction (.83), academic
#     efficacy (.88) and the five-item AES (.86, Table 3).
#
# QUOTES. The text layer of this PDF renders "=" as "⫽", alpha as "␣", "<" as
# "⬍", minus as "⫺" and significance stars as "ⴱⴱ", and scrambles two-column
# pages. Every source_quote containing one of those characters, and every table
# row, was taken from the page image of the publisher's PDF and is written in
# the article's own characters ("=", "α", "<", "−", "**"); the words around them
# are as in the text layer, including its line-break hyphens ("in- cluded").
# Read back into the text layer's glyphs, the Table 1 rows and the single-column
# sentences match it exactly. Table 3, the Table 5 row, the Study 2 engagement
# alphas and every Study 3 quote come out of the text layer interleaved or
# garbled, and were read from the page images (pp. 585, 588, 589) only.

schema_version: 2
study:
  key: reeve-2013-study1
  citation: >-
    Reeve, J. (2013). How students create motivationally supportive learning environments for themselves:
    The concept of agentic engagement. Journal of Educational Psychology, 105(3), 579–595.
  doi: 10.1037/a0032690
  design:
    family: observational
    design_detail: >-
      Cross-sectional questionnaire study for scale development: ten candidate agentic engagement items
      correlated with two self-reported measures of agentic motivation (psychological need satisfaction,
      academic efficacy), then an exploratory factor analysis (principal axis factoring, oblique rotation)
      with behavioural, emotional and cognitive engagement items. All measures self-report.
