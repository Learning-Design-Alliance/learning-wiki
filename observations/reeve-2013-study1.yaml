  size:
    value: 271
    unit: participants
  additional_sizes:
  - value: 6
    unit: classes
    note: courses in the College of Engineering; not a unit of assignment or of analysis
  population:
    description: >-
      South Korean college students (48 female, 222 male, 1 unknown), engineering majors at a large university
      in Incheon; all students and teachers ethnic Korean.
    age_or_stage: University students; the article prints no age figure
    age: unreported
  context:
    setting: >-
      Questionnaire at the beginning of a class period midway through the semester, 5–10 min, rated in
      reference to that course; Korean-translated scales, 1–7 Likert
  arms: []
comparisons:
- id: whole-sample
  kind: none
  description: Item-level correlations and scale reliabilities in the whole Study 1 sample; no contrast
    between groups.
