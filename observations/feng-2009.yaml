# Feng, Heffernan & Koedinger (2009): predicting end-of-year state test scores
# from ASSISTments tutoring-interaction data.
#
# VERSION READ: the authors' typescript of the 2009 UMUAI journal article (22
# numbered pages, headed with the journal citation, 19(3), 243-266), not the
# publisher's typeset version and not the earlier conference papers by the same
# authors (Feng, Heffernan & Koedinger 2006), which it cites as prior work. Its
# section 4 (two school years, four models, Tables 1-8) is the journal
# article's content. Page and table locations below are the typescript's.
#
# SCOPE: the 2004-2005 data set (391 Grade 8 students, 2005 MCAS). The
# 2005-2006 replication is a different sample (616 students from Worcester
# Public Schools) and is listed in not_yet_extracted rather than recorded here.
#
# THE SHAPE: no contrast between groups of students. Each result is a
# correlation, over the same 391 students, between one regression model's
# leave-one-out predicted MCAS score and the actual score, so each model is a
# `kind: none` comparison and the four correlations are four observations. The
# models differ in their predictors, not in what the students did.
#
# No reliability coefficient is printed for MCAS or for any online metric, and
# no age figure (only "8th grade"), so `age: unreported` and no reliability
# observation.

schema_version: 2

study:
  key: feng-2009
  citation: "Feng, M., Heffernan, N., & Koedinger, K. (2009). Addressing the assessment challenge with an online system that tutors as it assesses. User Modeling and User-Adapted Interaction, 19(3), 243–266."
  doi: "10.1007/s11257-009-9063-7"
  design:
    family: observational
    design_detail: >-
      Predictive modelling of log data, read from the authors' manuscript of the
      journal article. ASSISTments interaction logs from one school year
      (2004-2005, two Massachusetts middle schools) were used to predict each
      student's raw score on the Grade 8 MCAS mathematics test taken in May
      2005. Four linear regression models: lean (a Rasch proficiency estimate
      from correctness on original items), assistance (stepwise over online
      assistance metrics, without original-item correctness), mixed (Rasch
      proficiency plus stepwise assistance metrics) and help (Rasch proficiency
      plus stepwise hint metrics). Models compared on MAD, BIC and the
      correlation of leave-one-out predicted scores with actual scores; absolute
      deviations compared pairwise with paired t-tests.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-author-manuscript
  verification: unverified

appears_in:
  - claim: interaction-data-improves-mcas-prediction-0405
    bearing: supports
    anchor: feng-2009

evidence_base:
  unit: participants
  size:
    value: 391
    unit: participants
  additional_sizes:
    - value: 912
      unit: participants
      note: "Grade 8 students whose logs were kept in the system in 2004-2005"
    - value: 417
      unit: participants
      note: "students with complete data, before the 25 who did fewer than 39 questions were excluded"
    - value: 14274
      unit: participants
      note: "students whose responses (Sept 2004 to Jan 2008, 2,797 original items) were used to fit the Rasch item parameters for the lean model"
  population:
    description: >-
      Grade 8 students in two Massachusetts middle schools using ASSISTments in
      2004-2005, with complete data and at least 39 questions done.
    age_or_stage: "8th grade"
    age: unreported
  context:
    setting: >-
      Web-based tutoring on released MCAS items with scaffolding questions and
      hints, typically one class period in the school computer lab every few
      weeks, September to May; outcome the state's end-of-year MCAS
      mathematics test (raw score 0 to 54).
  arms:
    - id: cohort-2004-05
      description: "The 391 Grade 8 students in the final 2004-2005 data set."
      size:
        value: 391
        unit: participants

comparisons:
  - id: lean-model
    kind: none
    description: "Lean model: MCAS raw score regressed on the Rasch (1-PL IRT) proficiency estimate from correctness on original questions only; 1 variable."
  - id: help-model
    kind: none
    description: "Help model: Rasch proficiency estimate plus hint-related metrics, stepwise; 3 variables entered (proficiency, Avg_Hint_Request, Hint_Request_Count)."
  - id: assistance-model
    kind: none
    description: "Assistance model: online assistance metrics only, stepwise, original-question correctness excluded; 6 variables entered."
  - id: mixed-model
    kind: none
    description: "Mixed model: Rasch proficiency estimate plus online assistance metrics, stepwise; 5 variables entered (proficiency, Scaffold_Percent_Correct, Avg_Question_Time, Avg_Attempt, Avg_Hint_Request)."

observations:

  - id: lean-model-r
    sample:
      value: 391
      unit: participants
    comparison_ref: lean-model
    outcome:
      construct: "Mathematics achievement on the state test"
      source_language: "Correlation with 2005 8th grade MCAS"
      measure: "MCAS Grade 8 mathematics raw score, May 2005"
      scale: "Pearson correlation between leave-one-out predicted score and actual raw score"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "logs September 2004 to May 2005; MCAS taken May 2005"
    result:
      measure_type: correlation
      estimate: 0.733
      descriptives: "MAD 6.40; R Square .537; BIC -295; 1 variable"
      model: "Linear regression of MCAS raw score on the Rasch proficiency estimate"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      A model's predictive accuracy, not an effect of anything done to the
      students. No interval is printed.
    source_quote: 'The lean model 6.40 .537 \-295 1 .733'
    source_location: "Section 4.4.1, Table 2 (manuscript p. 14)"

