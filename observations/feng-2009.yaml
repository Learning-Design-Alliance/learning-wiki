    outcome:
      construct: "Mathematics achievement on the state test"
      source_language: "Correlation with 2005 8th grade MCAS"
      measure: "MCAS Grade 8 mathematics raw score, May 2005"
      scale: "Pearson correlation between leave-one-out predicted score and actual raw score"
