# Starch & Elliott (1913): mathematics teachers grade the same geometry
# final-examination paper.
#
# Read from the publisher's scanned full text (JSTOR copy), through its OCR text
# layer. That layer reads digits as letters in places ("i" for 1, "io" for 10,
# "I.I" for 1.1, "Ioo" for 100) and garbles the dot charts (Figs. 1-4) and the
# reproduced answer paper. Quotes below are copied from the text layer as it
# stands, OCR letters included. No PDF was available, so nothing was checked
# against page images.
#
# The "probable error" is the spread of one paper's marks across graders (the
# article: "roughly, though not exactly, equivalent to the average amount of
# error or deviation of the mark from the median"). It is not a reliability
# coefficient, since one paper has no between-pupil variance, so it is recorded
# as measure_type `other`. No SD is printed and none is derived. The "mean
# variation" of the within-school sets is likewise recorded as printed.
#
# The article's counts do not add up: "One hundred and forty papers were
# returned. Twelve had to be discarded", then "Of the remaining 138", which it
# splits 43 + 75 + 10 (= 128). `size` holds the 138 the article states, and the
# three group counts are kept beside it; neither is corrected.
#
# The per-paper English probable errors (4.0 and 4.8) that this article quotes
# belong to the 1912 study's sample, not to this one, and are not recorded as
# observations here.
#
# The wiki's claim pages date this article 2017 (anchor `starch-and-elliott-2017`,
# the JSTOR download year); Crossref and the journal give April 1913, School
# Review 21(4).

schema_version: 2

study:
  key: starch-1913
  citation: "Starch, D., & Elliott, E. C. (1913). Reliability of grading work in mathematics. The School Review, 21(4), 254–259."
  doi: "10.1086/436086"
  design:
    family: observational
    design_detail: >-
      Descriptive study. One pupil's geometry final examination from one of the
      largest high schools in Wisconsin was reproduced exactly (plates printed
      on foolscap) and sent with the questions to approximately 180 North
      Central Association high schools, whose principal mathematics teacher
      graded it according to the school's own practices and standards. Marks
      are presented as distributions with medians and probable errors, by the
      school's passing grade; within-school sets of teachers and per-question
      marks are reported as well. No assignment of any kind.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: wide-variation-grades-same-geometry-paper
    bearing: supports
    anchor: starch-and-elliott-2017
  - claim: geometry-marks-vary-more-than-english
    bearing: supports
    anchor: starch-and-elliott-2017
  - claim: within-school-grading-variation-geometry
    bearing: supports
    anchor: starch-and-elliott-2017
  - claim: single-question-marks-vary-as-widely-as-whole-paper
    bearing: supports
    anchor: starch-and-elliott-2017

evidence_base:
  unit: participants
  size:
    value: 138
    unit: participants
  additional_sizes:
    - value: 140
      unit: schools
      note: "graded papers returned of approximately 180 sent; twelve discarded for missing data"
    - value: 43
      unit: participants
      note: "teachers in schools whose passing grade is 70 (Fig. 1)"
    - value: 75
      unit: participants
      note: "teachers in schools whose passing grade is 75 (Fig. 2)"
    - value: 10
      unit: participants
      note: "teachers in schools whose passing grade is 80; their ten marks are listed in the text, not charted. 43 + 75 + 10 is 128, against the article's 'remaining 138'"
    - value: 62
      unit: participants
      note: "returns carrying a mark for each separate question: 49 on one scale, 13 on a 0-to-10 scale"
  population:
    description: >-
      The principal teacher of mathematics in North Central Association high
      schools, each grading on their own school's standards; plus the five
      geometry teachers of the pupil's own school and four geometry teachers in
      a large Ohio high school, each grading independently.
    age_or_stage: "Practising high-school mathematics teachers"
    age: unreported
  context:
    setting: >-
      One reproduced geometry final-examination answer paper (eight questions
      chosen from ten), of decidedly poor form, make-up and appearance; teachers
      differed in whether and how much they penalised form (deductions of 3 to
      13 points). Separate grades and comments usually accompanied each answer.
  arms:
    - id: passing-70-teachers
      description: "Teachers in the 43 schools whose passing grade is 70 (Fig. 1)."
      size:
        value: 43
        unit: participants
    - id: passing-75-teachers
      description: "Teachers in the 75 schools whose passing grade is 75 (Fig. 2)."
      size:
        value: 75
        unit: participants
    - id: source-school-teachers
      description: "The five geometry teachers of the Wisconsin school the paper came from, each grading independently; passing grade 70."
      size:
        value: 5
        unit: participants
    - id: ohio-school-teachers
      description: "Four geometry teachers in a large Ohio high school; passing grade 70."
      size:
        value: 4
        unit: participants
    - id: question-ten-graders
      description: "The 49 teachers who marked each question separately on the larger per-question scale, marking the answer to question ten (Fig. 4)."
      size:
        value: 49
        unit: participants

comparisons: []

observations:

  - id: probable-error-composite
    arm_ref:
      - passing-70-teachers
      - passing-75-teachers
    outcome:
      construct: "Spread of one paper's marks across graders"
      source_language: "The probable error of the geometry marks"
      measure: "Marks on a 100-point scale given to the geometry paper, composite of Figs. 1 and 2 with the passing-70 schools' marks raised three points (Fig. 3)"
      scale: "points of the 100-point marking scale"
      direction: lower-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "single grading of the paper"
    result:
      measure_type: other
      statistic: "probable error (deviation of individual marks from the group median)"
      estimate: 7.5
      unit: "points of 100"
      descriptives: "Median 70 (Fig. 3)"
      interpretation: "The article reads this as wider variation than either English paper of the authors' former study, and says the distribution is normal."
      note: >-
        The article gives no grader count for Fig. 3; it describes it as the
        values assigned by the entire group of teachers, combining the
        passing-70 and passing-75 schools. The spread includes the schools'
        differing standards.
    moderators:
      reported: []
      candidate:
        - "Whether a teacher penalised the paper's poor form and make-up, which the authors offer as why this paper varied more than the English papers"
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: unreported
      effect_size: unreported
    observability_notes: >-
      effect_size is `unreported` because a probable error is a dispersion,
      not an effect. No sample is recorded for this observation because the
      article prints none for Fig. 3.
    source_quote: "The probable error of the geometry marks is 7.5 (Fig. 3), whereas the probable error of the English papers was 4.0 and 4.8 respectively."
    source_location: "p. 257; Fig. 3, p. 256"

