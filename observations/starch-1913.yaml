      source_language: "the probable error"
      measure: "Marks given to the answer to question ten by the 49 teachers who marked each question on the larger per-question scale (Fig. 4)"
      scale: "points of the per-question scale (the text layer garbles its maximum as 'I22' and 'I2?'); the article multiplies by 8 to reach the 0-to-100 scale"
      direction: lower-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "single grading of the paper"
    result:
      measure_type: other
      statistic: "probable error (deviation of individual marks from the group median)"
      estimate: 1.1
      unit: "points of the per-question scale"
      descriptives: "Median 5.1"
      note: >-
        The article transposes this to the 0-to-100 scale by multiplying by 8,
        giving 8.8, which it compares with the whole paper's 7.5 and reads as
        a single answer varying about as widely as the entire paper. The 8.8
        is the article's figure; nothing was converted here.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: unreported
      effect_size: unreported
    observability_notes: >-
      The text layer reads the median and probable error as "5.I" and "I.I";
      the article's own transposition (1.1 times 8 = 8.8) confirms the
      reading. The per-question scale's maximum is garbled and is not
      recorded.
    source_quote: "The median is 5.I and the probable error is I.I. If we transpose this probable error into terms of the usual scale of o to Ioo by multiplying it by 8, we obtain a probable error of 8.8."
    source_location: "p. 259; Fig. 4"

