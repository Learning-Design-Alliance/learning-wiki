      elements:
        - term: "problem solving"
    - id: errex
      description: "Erroneous examples only: students watched a game character play and make mistakes, then corrected the character's errors."
      elements:
        - term: "erroneous examples"
    - id: errex-ps
      description: "Erroneous examples, then problem solving."
      elements:
        - term: "erroneous examples then problem solving"
    - id: ps-errex
      description: "Problem solving, then erroneous examples."
      elements:
        - term: "problem solving then erroneous examples"

