# Mogessie, Richey, McLaren, Andres-Bray & Baker (2020): confrustion and gaming
# the system while learning with erroneous examples in the Decimal Point game.
#
# Read from the PMC copy (PMC7334704), which carries the whole six-page short
# paper: Methods, Results, Table 1 and Discussion, not only the abstract.
#
# Points a reader needs:
#
#   * The gaming results are whole-sample correlations and one regression
#     (N = 191), so they rest on no contrast between conditions
#     (`comparisons: kind none`).
#   * The paper says the participants "were divided into four groups" and does
#     not say how. Random assignment is not stated, so the design family is
#     quasi-experimental and nothing stronger is inferred.
#   * The paper prints the same F(2, 188) = 181.14 for the confrustion model
#     and for the gaming model. Both are recorded as printed; one of them may
#     be a copy error, and the record does not decide which.
#   * Two reliability figures: the inter-rater agreement of the text-replay
#     labels (kappa .74) and the gaming detector's kappa (.62). They are
#     different objects: the first is agreement between human coders, the
#     second is how well a classifier reproduces those labels.
#   * No age figure is printed: "middle schools" is all the paper says.
#
# The PMC record lists the volume editors (Bittencourt, Cukurova, Muldner,
# Luckin, Millán) before the authors; the authors are the five named below.

schema_version: 2

study:
  key: mogessie-2020
  citation: "Mogessie, M., Richey, J. E., McLaren, B. M., Andres-Bray, J. M. L., & Baker, R. S. (2020). Confrustion and gaming while learning with erroneous examples in a decimals game. In I. I. Bittencourt, M. Cukurova, K. Muldner, R. Luckin, & E. Millán (Eds.), Artificial Intelligence in Education (AIED 2020), Lecture Notes in Computer Science, vol. 12164 (pp. 208–213). Springer."
  doi: "10.1007/978-3-030-52240-7_38"
  design:
    family: quasi-experimental
    design_detail: >-
      Four conditions in the Decimal Point game (problem solving only,
      erroneous examples only, erroneous examples then problem solving,
      problem solving then erroneous examples); the paper says participants
      "were divided into four groups" and does not state random assignment.
      Pretest and posttest on isomorphic test forms. Confrustion and gaming
      were measured from game logs by machine-learned detectors trained on
      text-replay labels. Analyses: whole-sample correlations, multiple
      regressions of posttest on pretest plus confrustion or gaming, and
      one-way ANOVAs across conditions with Tukey post-hoc tests.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-repository-copy
  verification: unverified

