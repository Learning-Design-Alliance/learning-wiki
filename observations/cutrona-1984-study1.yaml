# Cutrona, Russell & Jones (1984), Study 1: cross-situational consistency of
# attributions on the Attributional Style Questionnaire (ASQ), 1,133 students.
#
# Study 2 of the same article is a different sample (85 women assessed in
# pregnancy and postpartum) and is its own record, cutrona-1984-study2.
#
# Read from a scanned repository copy whose text layer is OCR: "intemality" for
# "internality", "A" for the normed fit index Delta, and escaped brackets. Quotes
# are copied from that text with the escapes dropped. Table 1 survives as
# column runs (".33 .59 .62 / .66" under "Intemality Stability Globality / Total
# score"); its row order is the column order, and the text confirms internality
# is the lowest alpha. Tables 2 and 3 (item correlations) are too garbled to
# read and are not recorded.
#
# The wiki's claim pages cite this article as "Cutrona 1985"; Crossref and the
# article's copyright line give 1984 (vol. 47, no. 5, November 1984).

schema_version: 2

study:
  key: cutrona-1984-study1
  citation: "Cutrona, C. E., Russell, D., & Jones, R. D. (1984). Cross-situational consistency in causal attributions: Does attributional style exist? Journal of Personality and Social Psychology, 47(5), 1043–1058."
  doi: "10.1037/0022-3514.47.5.1043"
  design:
    family: observational
    design_detail: >-
      Cross-sectional questionnaire study. Internal consistency of the ASQ's
      six negative events, correlations with the Beck Depression Inventory,
      and confirmatory factor analyses (LISREL V, maximum likelihood) testing
      whether attributions are consistent across situations; repeated for a
      subsample selected as highly consistent on three of the six events.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: asq-weak-reliability-validity-study1
    bearing: supports
    anchor: cutrona-1985
  - claim: internality-weakest-consistency-dimension
    bearing: supports
    anchor: cutrona-1985
  - claim: consistent-subsample-still-situation-specific
    bearing: supports
    anchor: cutrona-1985

evidence_base:
  unit: participants
  size:
    value: 1133
    unit: participants
  additional_sizes:
    - value: 1200
      unit: participants
      note: "students who took part; 67 gave incomplete data and were dropped"
  population:
    description: >-
      Students in an introductory psychology course at the University of
      Iowa, taking part for course credit.
    age_or_stage: "Undergraduate introductory psychology students; the article prints no age figure."
    age: unreported
  context:
    setting: "Questionnaire administration (ASQ negative events and Beck Depression Inventory)"
  arms:
    - id: consistent-subsample
      description: >-
        The 337 students (29.6% of the sample) with the lowest variance in
        summed attribution scores across three randomly chosen ASQ negative
        events; their other three events were then analysed.
      size:
        value: 337
        unit: participants

comparisons:
