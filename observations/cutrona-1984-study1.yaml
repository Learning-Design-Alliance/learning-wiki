      measure: "Three correlated factors (internality, stability, globality) fitted to the nine ratings for the three ASQ events not used to select the subsample"
      scale: "Bentler-Bonett normed fit index (0 to 1; .90 or above read as a very good fit)"
      direction: higher-is-better
