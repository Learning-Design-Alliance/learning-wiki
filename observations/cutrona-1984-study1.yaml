  # The cross-domain figure: achievement versus affiliative situations. The
  # six-factor model gave each dimension its own achievement and affiliation
  # factor; the estimated correlations between each pair were near unity, so the
  # domain split added almost nothing for the three dimensions.
  - id: achievement-affiliation-factor-correlations
    sample:
      value: 1133
      unit: participants
    comparison_ref: whole-sample
    outcome:
      construct: "Consistency of attributions between achievement and affiliative situations"
      source_language: "the correlations between the two internality, stability, and globality factors for achievement and affiliation"
      measure: "Correlations between the achievement and the affiliation factor for each attribution dimension, estimated by LISREL in the six-factor model"
      scale: "latent factor correlation"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "single administration, cross-sectional"
    result:
      measure_type: correlation
      estimate_range:
        lower: 0.929
        upper: 1.00
        over:
          value: 3
          unit: other
      model: "Six-factor model, chi2(120, N = 1133) = 631.53, p < .001, normed fit index .722; only .035 better than the three-factor model"
      interpretation: "The authors conclude the achievement/affiliation distinction does not matter for the three dimensions"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      The range is over the three dimension pairs (internality, stability,
      globality); the source does not say which pair took which value. These
      are latent correlations from a model that fits poorly, not observed
      score correlations.
    source_quote: "Moreover, as these results suggest, the correlations between the two internality, stability, and globality factors for achievement and affiliation were estimated by the LISREL program to be quite high (ranging from r=.929 to 1.00)."
    source_location: "Study 1, Factor structure of the ASQ"

