      outcome_timing: observed
      effect_size: unreported
    observability_notes: "The OCR text prints the fit index Delta as 'A'."
    source_quote: "This model was not found to provide a very good fit to the data, x2 (24, N = 337) = 117.41, p < .001, A = .531."
    source_location: "Study 1, Factor structure of the ASQ for consistent subjects"

