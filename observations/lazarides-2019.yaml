      estimate: 0.21
      reliability:
        statistic: icc
        over: other
        form: "ICC1 (individual ratings attributable to class membership); ICC2 for the same row is .85"
      interpretation: "Authors: ICC1 above .05 shows individual ratings are attributable to group membership; ICC2 above .70 indicates accurate class means"
    moderators:
      reported: []
      candidate: []
    observability:
