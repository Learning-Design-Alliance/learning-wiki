    sample:
      value: 849
      unit: effect-sizes
    comparison_ref: whole-corpus
    outcome:
      construct: "Divergent thinking"
      source_language: "correlation between DT and intelligence"
      measure: "Established DT tests (Alternate Uses, TTCT and other batteries) correlated with established intelligence tests (g, gf or gc measures)"
      scale: "Pearson r corrected for attenuation, back-transformed from Fisher z"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "as measured in the primary studies"
    result:
      measure_type: correlation
      estimate: 0.25
      ci_lower: 0.21
      ci_upper: 0.30
      interval_type: confidence
      k:
        value: 849
        unit: effect-sizes
      heterogeneity:
        statistic: "I2"
        value: 92.07
        unit: "percent"
        interpretation: "Within-study I2 46.58%, between-study I2 45.49%; QE(848) = 9206.17, p < .001"
      publication_bias:
        method: "Funnel plot, trim and fill, Egger-type test with standard errors as a moderator in the three-level model"
        p_value: "0.018"
        finding: "Funnel plot asymmetric; trim and fill imputed 169 coefficients on the right side, all in the region of significant effects, giving r = .27, 95% CI [.25, .29] (random-effects model without the within-study level); Egger-type test z = -2.37, p = .018. The authors read this as a slight underestimate, not a classical significance-driven bias."
      model: "three-level random-effects (REML), attenuation-corrected"
    moderators:
      reported:
        - variable: "DT scoring (fluency, originality/creative quality, composite)"
          relationship: "Fluency r = .20, originality/creative quality .31, composite .37; fluency significantly lower than originality, robust across checks"
          source_quote: "DT scoring was found to be a significant moderator of the relationship between DT and intelligence, QM(2) = 22.47, p < .001, with correlations ranging between r = .20 (fluency) to r = .37 (composite score; see Table 5)."
        - variable: "Other aspects of DT instructions (game-like, test-like, strategy)"
          relationship: "Game-like instructions gave a non-significant correlation (.07); test-like (.27) and strategy (.33) instructions were higher"
          source_quote: "Game-like DT instructions yielded a non-significant correlation between DT and intelligence, whereas effect sizes were small to moderate for test-like or strategy DT instructions. The moderator test was significant, QM(2) = 25.94, p < .001."
        - variable: "Intelligence facet (g, gc, gf)"
          relationship: "No difference between facets"
          source_quote: "The moderator test was non-significant (QM(2) = 5.77, p = .056)."
        - variable: "Average sample age"
          relationship: "Positive: older samples show higher correlations (recorded as its own observation)"
          source_quote: "The average sample age had a positive relationship with the intelligence–DT correlation, β = 0.01, z = 6.93, p < .001."
        - variable: "Gender ratio (proportion female)"
          relationship: "Negative: implied r = .34 for all-male and .17 for all-female samples"
          source_quote: "In addition, gender ratio had a negative effect on the transformed intelligence–DT correlation (see Figure 4), β = −0.17, z = −5.09, p < .001."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: unreported
      effect_size: observed
      pooled_k: observed
    source_quote: "The estimated overall correlation between DT and intelligence was r = .25, 95%-CI [.21, .30] (m = 112, k = 849)."
    source_location: "Section 4.1, Overall Effect"

