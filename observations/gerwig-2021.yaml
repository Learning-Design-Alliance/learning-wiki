evidence_base:
  unit: effect-sizes
  size:
    value: 849
    unit: effect-sizes
  additional_sizes:
    - value: 112
      unit: studies
      note: "studies (m) contributing the 849 coefficients"
    - value: 34610
      unit: participants
      note: "total N across the 112 studies"
    - value: 1293
      unit: effect-sizes
      note: "coefficients obtained before excluding those affected by fluency contamination"
  population:
    description: >-
      School students (40.50% of samples), university students (34.71%),
      adults (15.70%), preschoolers (4.13%) and mixed samples. Mean gender
      ratio 0.55 (SD 0.26). Most studies from the USA (51), then the UK (12),
      Germany (9) and Austria (8). Sample sizes from 10 to 5337 (mean 274.68).
    age_or_stage: "Preschool to adulthood; ages printed as ranging across samples from 4.00 to 72.93 years"
    age:
      unit: years
      min: 4.00
      max: 72.93
      mean: 20.40
      sd: 12.20
      note: "Printed as 'the age of the participants across samples'; whether these summarise sample mean ages or individual ages is not stated."
  context:
    setting: "Laboratory, school and test-manual validation studies of psychometric intelligence and divergent-thinking tasks"
  variation:
    - dimension: "DT task"
      distribution: "Alternate Uses Task 33.80% of effect sizes, DT test batteries 30.62%, ad hoc composites of several tasks 13.66%, others 2-5% each"
    - dimension: "DT task modality"
      distribution: "verbal 70.20% of effect sizes, figural 19.55%, several 10.25%"
    - dimension: "Intelligence test modality"
      distribution: "verbal 36.98%, figural 28.86%, several 27.33%, numerical 6.83%"
  arms:
    - id: fluency-scoring
      description: "Coefficients in which DT was scored for fluency (number of ideas)."
      size: {value: 564, unit: effect-sizes}
    - id: originality-scoring
      description: "Coefficients in which DT was scored for originality or creative quality."
      size: {value: 190, unit: effect-sizes}
    - id: composite-scoring
      description: "Coefficients in which DT outcomes were combined by averaging or summing into a composite score."
      size: {value: 73, unit: effect-sizes}

comparisons:
  - id: whole-corpus
    kind: none
    description: "The pooled intelligence-DT correlation across all 849 coefficients; no contrast between configurations."
  - id: age-meta-regression
    kind: none
    description: "Meta-regression of the Fisher-z correlation on average sample age across the corpus; a slope, not a contrast of two configurations."
  - id: imputed-reliability
    kind: none
    description: "The corpus-mean reliabilities of DT and intelligence measures used to impute missing reliabilities for the attenuation correction."

