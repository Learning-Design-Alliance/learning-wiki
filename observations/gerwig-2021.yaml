# Gerwig, Miroshnik, Forthmann, Benedek, Karwowski & Holling (2021): a
# three-level meta-analysis of the correlation between intelligence and
# divergent thinking (DT).
#
# Read from the PubMed Central copy of the open-access article (CC BY 4.0),
# text layer; tables came through as clean tab-separated rows.
#
# WHAT A READER NEEDS TO KNOW:
#
#   * Every pooled correlation here is CORRECTED FOR ATTENUATION: each r was
#     divided by the square root of the product of the DT and intelligence
#     reliabilities before pooling, with missing reliabilities imputed at the
#     corpus means (.78 for DT, .79 for intelligence). The uncorrected
#     estimate for Kim's period is printed separately (r = .19). A reader
#     comparing r = .25 with an uncorrected correlation is comparing two
#     different quantities.
#   * `k` counts CORRELATION COEFFICIENTS (849), `m` studies (112). The
#     three-level model treats coefficients as nested in studies.
#   * The two reliability observations are the corpus-mean reliabilities the
#     authors computed and used for imputation, not the reliability of any one
#     instrument. They are recorded because they set the size of the
#     correction for every study that reported none.
#   * The age figures (4.00 to 72.93, M 20.40, SD 12.20) are printed as "the
#     age of the participants across samples"; the article does not say
#     whether they summarise sample mean ages or individual ages.

schema_version: 2

study:
  key: gerwig-2021
  citation: "Gerwig, A., Miroshnik, K., Forthmann, B., Benedek, M., Karwowski, M., & Holling, H. (2021). The relationship between intelligence and divergent thinking: A meta-analytic update. Journal of Intelligence, 9(2), 23."
  doi: "10.3390/jintelligence9020023"
  design:
    family: meta-analysis
    design_detail: >-
      Three-level meta-analysis (metafor, REML) of correlations between
      intelligence and divergent-thinking measures, coefficients nested in
      studies. Correlations corrected for attenuation, Fisher-z transformed,
      pooled and back-transformed. Categorical moderators by meta-regression
      with cell-mean coding and Bonferroni-Holm-corrected contrasts; mean
      sample age and gender ratio as continuous moderators; significant
      moderators re-tested in robustness checks adding correlated moderators.
  synthesis:
    model: "Three-level random-effects model (metafor, REML), coefficients nested in studies"
    heterogeneity_statistic: "I2 (total, within- and between-study) and QE"
    reporting_guideline: "PRISMA"
    search:
      databases:
        - Academic Search Premier
        - PsycARTICLES
        - Psych Critiques
        - PsycINFO
        - PSYNDEX
      date_range: "1962 to June 2019"
      records_screened: 1494
      records_included: 112
    inclusion:
      - "Empirical studies in English or German: journal articles, PhD theses, books or DT test manuals"
      - "Correlations (or statistics convertible to them) between intelligence and DT measures, with DT procedure, DT scoring and the intelligence test described"
      - "Established DT tests (not verbal fluency) and established intelligence tests (not proxies such as school achievement)"
      - "Intelligence measured by full batteries, reasoning tasks, or vocabulary and knowledge tasks (g, gf, gc)"
      - "Healthy participants"
    exclusion:
      - "Single-product creative production tasks such as metaphor and humour production"
      - "Coefficients affected by fluency contamination: 444 of 1293 (34.34%) excluded, leaving 849"
    data_handling:
      - "Correlations corrected for attenuation by the DT and intelligence reliabilities; missing reliabilities imputed by the mean reliability (.78 DT, .79 intelligence)"
      - "Studies from 1962-2016 screened and coded by the first author, disputes resolved with the third author; 2016-2019 screened by three student assistants and coded by the second author, who checked all coded studies for inconsistencies"
      - "Scoring category 'other' (one study, 18 effect sizes) omitted"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

