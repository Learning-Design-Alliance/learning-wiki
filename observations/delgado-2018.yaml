# Delgado, Vargas, Ackerman & Salmerón (2018): meta-analysis of reading
# comprehension on paper against digital screens, 2000-2017.
#
# Read from the published article (Educational Research Review 25, 23-38),
# text layer. Table 1's columns come out of the text layer as separate runs,
# but each block (categories, k, g, CI) keeps its row order, and every g used
# below is also printed in the Results prose. The table quotes are those runs
# as the text layer gives them, with ASCII hyphens as minus signs; the prose
# quotes keep the article's minus sign.
#
# WHAT THIS FILE USES:
#
#   * `population.age: unreported`. Educational level was coded (grades 1-6,
#     7-12, undergraduates, graduates or professionals) and tested as a
#     moderator, but the article prints no age figure.
#   * `measure_type: reliability` for the coding: Cohen's kappa .89 (range
#     .71 to 1) over raters for qualitative variables, and ICC = 1 for
#     continuous ones, from two judges on a 28% random sample of studies.
#   * No `measure_type: mean`: every result is a pooled standardised effect.
#
# SIGN: g and dc are digital minus paper, so a NEGATIVE value is a paper
# advantage. The article fixes the sign this way for both indices.
#
# Two separate meta-analyses: between-participants (Hedges' g) and
# within-participants (dc, the standardised mean change, with a correlation
# of .7 imputed because no study reported one). Moderators were analysed in
# the between-participants set only.

schema_version: 2

study:
  key: delgado-2018
  citation: "Delgado, P., Vargas, C., Ackerman, R., & Salmerón, L. (2018). Don't throw away your printed books: A meta-analysis on the effects of reading media on reading comprehension. Educational Research Review, 25, 23–38."
  doi: "10.1016/j.edurev.2018.09.003"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-analysis of studies from 2000 to 2017 comparing comprehension of
      comparable texts read individually and silently on paper and on digital
      screens. Between-participants and within-participants designs were
      pooled separately. Categorical moderators by one-way ANOVA (QB) and
      continuous moderators by simple meta-regression with the Knapp-Hartung
      adjustment, in the between-participants set. Moderators were not
      analysed in the within-participants set because of its small number of
      effect sizes, and an explicit in-depth reading prompt (k = 5) was too
      rare to test.
  synthesis:
    model: "Random-effects model"
    heterogeneity_statistic: "Q"
    search:
      databases:
        - PsycInfo
        - ERIC
        - ProQuest Psychology
        - Web of Science
        - Scopus
        - ProQuest Dissertations and Theses
        - Google Scholar
      date_range: "2000 to 2017; search ended May 2017"
      records_screened: 1840
      records_included: 54
    inclusion:
      - "Compares comprehension of texts printed on paper and displayed on digital screens (computers, tablets, mobile phones, e-readers)"
      - "Participants read individually and silently, in their daily-used language"
      - "Materials comparable across media; no hyperlinks or web navigation in the digital condition"
      - "Normative population: typical development, no reading difficulties, no cognitive impairments or disorders"
      - "Published or presented 2000-2017, in English; formal publication not required"
    data_handling:
      - "Two independent judges coded a random 28% of studies; disagreements discussed"
      - "Within-participants dc computed with an imputed pre-post correlation of .7; sensitivity analyses imputed .10 to .90"
      - "Two between-participants effect sizes removed as outliers after a robust model"

