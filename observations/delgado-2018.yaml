          source_quote: "Examination of the reading time frame showed that comparisons in studies with time constraints yielded a significantly larger (QB = 4.12, p = .04) print advantage (Hedges' g = −0.26) than comparisons in studies in which participants were allowed to self-pace their reading (Hedges’ g = −0.09)."
        - variable: "Text genre"
          relationship: "Paper advantage for informational (g = -0.27) and mixed (g = -0.30) texts, none for narrative only (g = 0.01); explains 31% of variance"
          source_quote: "The moderator factor of text genre revealed a significant effect, explaining 31% of the mean effect size variance."
        - variable: "Date of publication"
          relationship: "Paper advantage increased by 0.01 a year (b = -0.01)"
          source_quote: "The beta coefficient of −0.01 (QR = 4.95, p = .03) indicates that the effect size favouring paper-based reading increased by 0.01 points a year, explaining 64% of the mean effect size variance (see Table 3)."
        - variable: "Educational level, text length, digital device, need for scrolling, open testing, type of comprehension"
          relationship: "No significant moderation"
          source_quote: "No moderating effects were found for educational level, text length, type of digital device, need for scrolling, open testing, or type of comprehension because QB values were not significant in all these cases (see Table 1)."
