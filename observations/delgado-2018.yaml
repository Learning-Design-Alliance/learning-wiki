        statistic: "Q"
        value: 208.96
        interpretation: "p < .001; I2 = 72.24, described as medium-high"
      prediction_interval:
        lower: -0.56
        upper: 0.14
        source: "reported by the authors"
      publication_bias:
        method: "Classic fail-safe N, Egger's regression, ANOVA of published against unpublished studies"
        p_value: ".39 (Egger)"
        finding: "Fail-safe N = 1,727 against Rosenthal's criterion of 290; published and unpublished not different (QB = 0.14, p = .71); no publication bias"
      model: "random-effects"
    moderators:
