    sample:
      value: 560
      unit: participants
    comparison_ref: public-vs-private
    outcome:
      construct: "Educational investment decision"
      source_language: "Dummy: student signed up for the SAT prep course"
      measure: "Whether the student signed up on the form for the free online SAT preparation course"
      scale: "proportion signing up"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "at the offer, in class"
    result:
      measure_type: regression_coefficient
      estimate: -0.1083
      standard_error: 0.040
      unit: "proportion signing up (linear probability model)"
      p_value: "robust .007; wild bootstrap .012; permutation .006"
      model: "OLS, no controls, nonhonors classes (Table III col. 1); with individual covariates -0.1195 [0.040], n 531; adding classroom and surveyor fixed effects -0.1231 [0.040], n 531"
      descriptives: "Mean private take-up 0.717. Raw sign-up 72 percent private, 61 percent public (Figure IV)"
    moderators:
      reported:
        - variable: "Self-rated importance of being popular"
          relationship: "Public sign-up 20 percentage points lower for students saying popularity is important (p = .002); small (4 points) and non-significant for those saying it is not"
          source_quote: "Figure V shows that for students in nonhonors classes who say that it is important to be popular, the sign-up rate is 20 percentage points lower in the public condition than in the private condition (p = .002)."
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: partial
    observability_notes: >-
