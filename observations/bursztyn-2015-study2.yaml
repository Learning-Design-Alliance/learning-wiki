      unit: schools
      note: "the four largest public high schools in a disadvantaged area of south Los Angeles"
    - value: 560
      unit: participants
      note: "students in nonhonors classes"
    - value: 265
      unit: participants
      note: "students in honors classes"
    - value: 343
      unit: participants
      note: "some-honors students, taking some but not all honors classes (42 percent of the sample)"
  population:
    description: >-
      Eleventh-grade students in four large public high schools (around 3,000
      students each) in south Los Angeles, with more students eligible for free
      and reduced-price meals (84 versus 68 percent) and of Hispanic ethnicity
      (96 versus 69 percent) than the average LAUSD school. All students present
      in the visited classrooms took part. Table II: 51-52 percent male, 96
      percent Hispanic, mean GPA about 2.5, about 1.4 honors classes on average.
    age_or_stage: "Grade 11; mean age printed only per condition (Table II), recorded as two observations"
  context:
    setting: "One classroom visit per period, December 2013 to April 2014; the whole intervention took less than 10 minutes; the course was worth about $200 per student and was not previously used in these schools"
  arms:
    - id: private-signup
      description: "Sign-up form stating the decision would be kept completely private from everyone, including the other students in the room."
      size:
        value: 411
        unit: participants
    - id: public-signup
      description: "Identical sign-up form stating the decision would be kept completely private from everyone, except the other students in the room."
      size:
        value: 414
        unit: participants

comparisons:
  - id: public-vs-private
    kind: between-groups
    index_arm: public-signup
    reference_arm: private-signup
    description: "Students given the public form against classmates given the private form, within the same classrooms."

