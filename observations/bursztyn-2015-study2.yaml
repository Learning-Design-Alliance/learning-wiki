# Bursztyn & Jensen (2015), setting 2: the SAT-prep sign-up field experiment.
#
# The article's second, independent setting (setting 1, the leaderboard change,
# is `bursztyn-2015-study1`). 825 eleventh graders in 26 honors and nonhonors
# classrooms of four south Los Angeles high schools were offered free access to
# an online SAT preparation course. Sign-up forms, pre-sorted in an alternating
# pattern and handed out in seat order, differed in one word: the decision would
# be kept private from everyone "including" (private) or "except" (public) the
# other students in the room. The authors describe this as randomising at the
# level of the student within the classroom; no sign-up decision was in fact
# revealed.
#
# Results are reported separately for nonhonors and honors classes, and then
# for "some-honors" students (taking one to three honors classes), who were
# found in an honors or a nonhonors class depending on which period the team
# arrived. That last split is not randomised: the authors argue the timing is
# unrelated to student characteristics and compare only students taking the
# same number of honors classes. Each split is its own observation with its own
# analysed n; nothing is pooled here.
#
# Age: the article prints mean age only per condition (Table II: private 16.74,
# SD 0.535, n 411; public 16.75, SD 0.489, n 414), never for the whole sample.
# Choosing one of them, or averaging them, would be a deduced figure, so
# `population.age` is not written and the two printed means are recorded as
# `measure_type: mean` observations on their arms. No reliability figure is
# printed for any measure.
#
# Read from the author manuscript deposited in PubMed Central (PMC4698889,
# NIHMS745446). Table quotes are given whitespace-normalised, as the table rows
# span several lines in that text.

schema_version: 2

study:
  key: bursztyn-2015-study2
  citation: "Bursztyn, L., & Jensen, R. (2015). How does peer pressure affect educational investments? The Quarterly Journal of Economics, 130(3), 1329–1367."
  doi: "10.1093/qje/qjv021"
  design:
    family: randomized-controlled-trial
    design_detail: >-
      Field experiment with assignment of the sign-up form (public or private)
      across students within classrooms, forms pre-sorted in an alternating
      pattern. Linear probability models of sign-up on a public-treatment
      dummy, separately for nonhonors and honors classes, without and with
      individual covariates and classroom and surveyor fixed effects; robust,
      wild-bootstrap clustered and permutation-test p-values. The some-honors
      analysis exploits which class a student happened to be in when the team
      arrived, which was not randomised.

