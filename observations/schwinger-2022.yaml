  - claim: conscientiousness-strongest-negative-antecedent-self-handicapping
    bearing: supports
    anchor: schwinger-2021

evidence_base:
  unit: effect-sizes
  size:
    value: 690
    unit: effect-sizes
  additional_sizes:
    - value: 159
      unit: studies
      note: "studies included"
    - value: 194
      unit: other
      note: "independent samples within the 159 studies"
    - value: 81630
      unit: participants
      note: "total participants across the 194 samples (range n = 13 to n = 12,237)"
  population:
    description: >-
      School and university students. Samples mainly higher education and
      university students (60.3%), elementary and high school students
      (39.2%) and one mixed sample (.5%). Studies published 1986-2020, mainly
      from the US/Canada (44.8%), Europe (28.9%), Asia (12.9%) and Australia
      and Pacific Islands (10.8%).
    age_or_stage: "School (elementary to high school) and university students, doctoral students and postgraduates; the article prints no age figure"
    age: unreported
  context:
    setting: "Field and laboratory studies relating questionnaire-measured habitual academic self-handicapping to its hypothesised antecedents"
  variation:
    - dimension: "Educational level of the samples"
      distribution: "higher education and university 60.3%, elementary and high school 39.2%, one mixed sample .5%"
  arms: []

comparisons:
  - id: whole-corpus
    kind: none
    description: "Bivariate association between an antecedent and self-handicapping pooled across the corpus; no contrast between groups."

