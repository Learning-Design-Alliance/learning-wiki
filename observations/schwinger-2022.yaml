# Schwinger, Trautner, Pütz, Fabianek, Lemmer, Lauermann & Wirthwein (2022):
# antecedents of habitual academic self-handicapping, a meta-analysis of 159
# studies and 194 independent samples.
#
# Not the same paper as `schwinger-2014` (self-handicapping and achievement,
# doi:10.1037/a0035832), which treats achievement as an OUTCOME; this one keeps
# only achievement measured before self-handicapping, as an antecedent.
#
# Read from the text layer of the Online First copy (28 October 2021, pages
# 1-21, the same DOI). Crossref gives the issue as 114(3), 576-596, April 2022;
# page numbers below are the Online First pages. No PDF was available here.
#
# THE MINUS SIGN. The text layer prints APA's minus as a substitute glyph,
# the control character U+0001 (Table 3: "\x01.193***", "[\x01.218, \x01.167]";
# the text: "mastery-approach goals (r = \x01.19) were found to have a medium,
# but negative relation"). The same glyph stands for the en dash in ranges
# ("0\x0130% female"). Where it precedes a correlation it is a minus, which the
# running text confirms in words for both negative rows recorded here, so the
# source_quote fields write the article's character (−) in its place, as
# `schwinger-2014` does for the same font. A substring search of the raw text
# for those two quotes finds them with U+0001 in place of −.
#
# Table 3 extracted column by column. The k, N, SE, CI, tau², Q and I² values
# below were read off those columns by row order, which the k column confirms
# (fear of failure 14, test anxiety 35, mastery-approach 78,
# performance-approach 65, performance-avoidance 62 in the emotional-
# motivational block). Each source_quote is therefore the running text, not a
# table row.
#
# WHAT THIS FILE RECORDS:
#
#   * The pooled correlations of self-handicapping with performance-avoidance,
#     performance-approach and mastery-approach goals and with
#     conscientiousness, with heterogeneity and the publication-bias findings.
#   * `population.age: unreported`: the article gives the share of university
#     and of school samples but no age figure.
#   * No reliability observation. The authors double-coded 28 studies, but the
#     kappas are in online supplemental Table 2, not in the article; the
#     ".61 and .80" in the text are Landis and Koch's benchmarks, not results.

schema_version: 2

study:
  key: schwinger-2022
  citation: "Schwinger, M., Trautner, M., Pütz, N., Fabianek, S., Lemmer, G., Lauermann, F., & Wirthwein, L. (2022). Why do students use strategies that hurt their chances of academic success? A meta-analysis of antecedents of academic self-handicapping. Journal of Educational Psychology, 114(3), 576-596. (Advance online publication 28 October 2021.)"
  doi: "10.1037/edu0000706"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-analysis of Pearson correlations between self-reported habitual
      academic self-handicapping and hypothesised antecedents (self-related
      beliefs, emotional-motivational variables, personality, gender, prior
      achievement) in correlational cross-sectional and longitudinal studies;
      experimental studies excluded. Fisher-Z transformed correlations pooled
      under random-effects models with REML, cluster robust variance estimation
      for dependent effect sizes; moderators (self-handicapping scale
      reliability and scale type) by mixed-effects meta-regression with
      Knapp-Hartung adjustment. The authors state the data are largely
      cross-sectional and support no causal or time-lagged conclusion.
  synthesis:
    model: "Random-effects models with a restricted maximum likelihood (REML) estimator; cluster robust estimation with small-sample adjustment for dependent effect sizes"
    heterogeneity_statistic: "Q and I2"
    search:
      databases:
        - PsycINFO
        - PSYINDEX
        - ERIC
        - Google Scholar
        - Web of Science
        - BASE
        - NDLTD
        - ProQuest Dissertations & Theses
        - Trove National Library of Australia
        - OpenGrey
        - NTIS
      date_range: "up to October 2020"
      records_included: 159
    inclusion:
      - "At least one correlation between habitual self-handicapping and a listed antecedent, in an academic setting"
      - "Correlational cross-sectional or longitudinal designs with self-report self-handicapping questionnaires; experimental studies excluded"
      - "Achievement assessed before self-handicapping, so that it is a predictor and not an outcome"
      - "School and university students, doctoral students and postgraduates; samples with learning difficulties excluded"
      - "Bivariate correlations or enough information to compute them"
      - "Published in English or German"
    data_handling:
      - "A second independent person coded 28 (17%) of the included studies; kappas and ICCs are in online supplemental Table 2"
      - "Correlations reported for subgroups such as gender or age treated as independent samples"
      - "Outliers by studentized residuals beyond 1.96 SDs; eight effects excluded after checks"
      - "Publication bias by funnel plots, Begg and Mazumdar rank correlation tests, Egger regression tests and trim and fill"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

