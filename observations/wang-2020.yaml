  # The answer format, a property of every question in both datasets. It is
  # what fixes the chance level of a guess and the three distractors whose
  # choice the paper says reveals a misconception.
  - id: answer-options-per-question
    arm_ref:
      - tasks-1-2-training-set
      - tasks-3-4-training-set
    outcome:
      construct: "Answer options per question"
      source_language: "4 possible answer choices, exactly one of which is correct"
      measure: "Options per multiple-choice diagnostic question (AnswerValue and CorrectAnswer take values 1 to 4)"
      direction: contextual
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "as released"
    result:
      measure_type: count
      estimate: 4
      unit: "answer options per question, exactly one correct"
    moderators:
