# Cooper, Nye, Charlton, Lindsay & Greathouse (1996): the effect of summer
# vacation on achievement test scores, narrative and meta-analytic review.
#
# Recorded here is the META-ANALYSIS of the 13 post-1975 reports only. The
# vote count over the 26 pre-1975 studies (Tables 1-2) is a different synthesis
# with a different method and is listed in not_yet_extracted.
#
# THE SHAPE: every effect is a standardized mean CHANGE within one sample,
# fall minus spring over the sample's own spring SD ("d-index"), so the arms are
# the two test occasions and the comparison is within-subject-baseline. Negative
# means a summer loss.
#
# TWO DATA SETS, ONE SOURCE OF THE GAP: the Sustaining Effects Study (SES)
# contributes 38,384 of 47,994 students and reports gains, so the weighted
# overall estimate is +.02 with it and -.13 without it. The abstract's "one
# tenth of a standard deviation" is the unweighted figure (-.09 with the SES,
# -.10 without). All four are recorded, because the source prints all four and
# no one of them is "the" estimate.
#
# No confidence bounds are printed anywhere: an asterisk marks a weighted
# average whose 95% CI excludes zero, and that is recorded as interpretation,
# never as an interval. Intercoder reliability is described (two coders,
# discrepancies resolved in conference) but no coefficient is printed. The
# article prints grades, never ages, so `age: unreported`.
#
# Read from the JSTOR scan of the published article (pp. 227-268). The scan
# carries no DOI; the DOI was checked against Crossref (title, authors, year,
# journal, volume and pages agree).

schema_version: 2

study:
  key: cooper-1996
  citation: "Cooper, H., Nye, B., Charlton, K., Lindsay, J., & Greathouse, S. (1996). The effects of summer vacation on achievement test scores: A narrative and meta-analytic review. Review of Educational Research, 66(3), 227–268."
  doi: "10.3102/00346543066003227"
  design:
    family: meta-analysis
    design_detail: >-
      Narrative review of 39 reports, with a vote count of the 26 pre-1975
      studies and a meta-analysis of the 13 reports from 1975 on. Effect sizes
      are spring-to-fall change scores within each sample: a d-index (fall mean
      minus spring mean over the average of the two SDs) and a difference in
      grade-level equivalents (DGLE). Unweighted and inverse-variance-weighted
      averages; shifting unit of analysis; moderators tested by homogeneity
      analysis. No comparison group of students who were not on vacation.
  synthesis:
    model: "Unweighted averages and averages weighted by the inverse of each effect size's variance, with variance estimated as (1 + d^2/4)/n; 95% confidence intervals computed for weighted d-indexes only"
    heterogeneity_statistic: "Q"
    search:
      databases:
        - ERIC
        - PsycLIT
      date_range: "ERIC 1982-1994; PsycLIT 1987-1994; plus reference sections of recent reports and requests to active researchers"
      records_included: "39 reports reviewed; 13 reports from 1975 on meta-analysed, 12 of which contributed effect sizes"
    data_handling:
      - "Shifting unit of analysis: a sample's several d-indexes are averaged before entering an overall analysis, but contribute one effect per category in a moderator analysis"
      - "Each sample independently coded by two coders on 18 characteristics; discrepancies resolved in conference"
      - "Results reported with and without the Sustaining Effects Study; moderator tests use an edited data set with the SES weights reduced and spelling and the four largest effect sizes excluded"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: summer-loss-one-month-grade-level-equivalent
    bearing: supports
    anchor: cooper-1996
  - claim: summer-loss-grade-moderation-gender-race-null
    bearing: qualifies
    anchor: cooper-1996

evidence_base:
  unit: reports
  size:
    value: 13
    unit: reports
  additional_sizes:
    - value: 66
      unit: other
      note: "independent samples, described in 12 of the 13 reports, contributing d-indexes and/or DGLEs"
    - value: 62
      unit: other
      note: "independent samples contributing d-indexes, from 11 reports"
    - value: 118
      unit: effect-sizes
      note: "separate d-index estimates from the 62 samples"
    - value: 43
      unit: other
      note: "samples, in five reports, contributing DGLEs"
    - value: 47994
      unit: participants
      note: "students across all samples; 38,384 of them in the five SES samples"
    - value: 9610
      unit: participants
      note: "students in the 61 non-SES samples (sample sizes 24 to 683, mean 153)"
  population:
    description: >-
      US school students in samples reported from 1975 to the 1990s: 28 samples
      described as low-income, 20 middle-income, 11 mixed, 7 unspecified; 10
      all-White and 6 all-Black samples; 9 all-male and 9 all-female; 31 urban,
      4 suburban, 1 rural.
    age_or_stage: "Kindergarten to Grade 8 by the samples described (Table 9 covers Grades 1-8); no ages are printed"
    age: unreported
  context:
    setting: "Standardized achievement tests given in spring and again in fall; mean spring-to-fall interval 131 days (range 92 to 153) in the 34 samples reporting it, so most intervals include some instructional time"
  variation:
    - dimension: "Decade of report"
      distribution: "31 samples from 1970s reports, 27 from the 1980s, 8 from the 1990s"
    - dimension: "Metric of change"
      distribution: "absolute measures in 12 samples, relative (normed) measures in 58, both in 4"
  arms:
    - id: spring-test
      description: "Each sample's achievement test scores in spring, before the summer break."
    - id: fall-test
      description: "The same sample's achievement test scores in fall, after the summer break."

comparisons:
  - id: fall-vs-spring
    kind: within-subject-baseline
    index_arm: fall-test
    reference_arm: spring-test
    description: "Fall score minus spring score within each sample, pooled across samples."

observations:

  - id: overall-d-unweighted-with-ses
    sample:
      value: 46421
      unit: participants
    comparison_ref: fall-vs-spring
    outcome:
      construct: "Achievement test score"
      source_language: "achievement test scores"
      measure: "Standardized achievement tests, all subjects; a sample's several d-indexes averaged into one"
      scale: "d-index: fall mean minus spring mean over the average of the two SDs"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "spring to fall, across the summer break (mean interval 131 days)"
    result:
      measure_type: standardized_mean_difference
      estimate: -0.09
      k:
        value: 62
        unit: effect-sizes
      heterogeneity:
        statistic: "Q"
        value: 574.8
        interpretation: "chi-square(61, n = 62) = 574.8, p < .0001: more variance than sampling error alone"
      model: "Unweighted average, data set including the SES"
      interpretation: "Read by the authors as the average fall score one tenth of a standard deviation below spring"
    moderators:
      reported:
        - variable: "Student gender and race"
          relationship: "No systematic relation of average d-indexes to all-male vs all-female or all-White vs all-Black samples"
          source_quote: "Homogeneity analyses that compared all-male samples to all-female ones, and all-White samples to all-Black ones, found no systematic relation of average d-indexes to these student individual differences."
        - variable: "Year of report"
          relationship: "With the SES included, more recent samples showed less negative d-indexes; without it, no linear effect"
          source_quote: "With the SES included in the data set, more recent samples revealed less negative d-indexes, X2(1, n = 62) = 11.27, p \\< .001; without the SES, however, no linear effect was shown, X2(1, n = 57) = 0.91, n.s."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: unreported
      outcome_timing: partial
      effect_size: observed
      pooled_k: observed
    observability_notes: >-
      The sample size is the Table 4 total for the 62 samples. No interval is
      printed, and the authors computed confidence intervals for weighted
      averages only.
    source_quote: "This analysis estimated the unweighted overall effect of summer vacation to be d = -.09. Thus, the average student's fall score was one tenth of a standard deviation below where it had been in the spring."
    source_location: "Overall Effect of Summer Vacation, p. 253; Table 4"

