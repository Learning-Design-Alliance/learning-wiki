# Becker, Brackbill & Centola (2017): network dynamics of social influence
# in the wisdom of crowds. Web experiment, participants randomised to a
# decentralized network, a centralized network or an independent control.
#
# WHAT IS RECORDED: the change in error from round 1 (independent estimate)
# to round 3 (after two rounds of revision) for the group mean, the group
# median and individuals in decentralized networks; the change in group-mean
# and group-median error in centralized networks, split by whether the
# central node's estimate pulled toward or away from the truth; and the
# control condition's individual and group results.
#
# Every percent change is the source's own figure: the magnitude of the change
# divided by the magnitude of the round-1 error, with estimates normalised by
# the SD of independent responses per question. None is computed here. The
# unit of analysis is the experimental TRIAL (one 40-person network per
# condition per trial), not the participant, so `sample` counts trials.
#
# The centralized "toward truth" and "away from truth" subsets are NOT
# assigned conditions: the authors sort estimation tasks after the fact by
# where the central node's initial estimate fell. They are recorded as
# within-arm round-1-to-round-3 contrasts with that said in the description.
#
# `population.age: unreported`: participants were recruited "from the World
# Wide Web"; the article text prints no age or demographic figure. No
# reliability applies (the outcome is distance from a known true value), and
# no single-group mean is used beyond the round-by-round errors kept in
# `descriptives`.
#
# Read from a text layer of the PNAS article (pdftotext, reading order). The
# two-column layout interleaves some paragraphs; every quote below is taken
# from a run that reads cleanly, and is copied verbatim INCLUDING the text
# layer's line-end hyphenation ("reduc- tion"; the article prints
# "reduction"). The text layer escaped the comparison signs ("P \<0.01");
# the quotes give them as the article prints them ("P <0.01").

schema_version: 2

study:
  key: becker-2017
  citation: "Becker, J., Brackbill, D., & Centola, D. (2017). Network dynamics of social influence in the wisdom of crowds. Proceedings of the National Academy of Sciences of the United States of America, 114(26), E5070–E5076."
  doi: "10.1073/pnas.1615978114"
  design:
    family: randomized-controlled-trial
    design_detail: >-
      Web-based experiment. Participants randomly assigned to a decentralized
      network (everyone equally connected), a centralized network (one highly
      connected central member) or an independent control. 40 per network or
      control group; three estimation rounds per question (independent, then
      two revisions after seeing neighbours' average, or with no social
      information in control). 13 experimental trials, 8 control groups.
      Group-level analyses clustered at the trial; Wilcoxon signed rank tests
      of round 1 against round 3.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: decentralized-networks-group-mean-improves
    bearing: supports
    anchor: becker-et-al-2017
  - claim: control-condition-no-group-improvement
    bearing: supports
    anchor: becker-et-al-2017

evidence_base:
  unit: participants
  size:
    value: 1360
    unit: participants
  additional_sizes:
    - value: 13
