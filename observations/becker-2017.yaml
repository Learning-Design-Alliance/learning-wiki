    sample:
      value: 13
      unit: other
    comparison_ref: decentralized-round3-vs-round1
    outcome:
      construct: "Accuracy of the group mean estimate"
      source_language: "average error of the group mean"
      measure: "Distance of the group's mean estimate from the true answer, in SDs of the independent responses to that question"
      scale: "percent change in error, round 1 to round 3"
      direction: lower-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "round 3, after two rounds of revision"
    result:
      measure_type: other
      estimate: -10
      unit: "percent change in error"
      p_value: "< 0.01"
      statistic: "Wilcoxon signed rank test"
      descriptives: "average error 0.69 SD at round 1, 0.62 SD at round 3"
    moderators:
      reported:
        - variable: "Group revision coefficient (partial correlation between individual accuracy and revision magnitude)"
          relationship: "Groups with higher revision coefficients showed larger improvements in the group mean in decentralized networks (rho = -0.71, n = 59 tasks); no significant correlation in centralized networks (rho = -0.16, n = 57)"
          source_quote: "Consistent with our theoretical expectations, the correla- tion shown in Fig. 3A indicates that, in decentralized net- works, groups with higher revision coefficients also exhibited larger improvements in group accuracy (n= 59 estimation tasks, ρ= −0.71, 95% CI \\[−0.82, −0.56\\]."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      `sample` counts experimental trials (unit `other`). No interval is printed
      for the percent change; Fig. 1C shows bootstrapped 95% error bars that are
      not readable from the text. The rho = -0.71 interval is printed as
      [-0.82, -0.56] in the text and [-0.84, -0.51] in the Fig. 3 legend.
    source_quote: "After two rounds of exposure to social influ- ence, the average error of the group mean at round 3 (0.62 SD) was significantly lower than at round 1 (0.69 SD) (n = 13 trials, P <0.01, Wilcoxon signed rank test), resulting in a 10% reduc- tion in the average error of the group mean."
    source_location: "Results, Decentralized Networks; Fig. 1 A and C"

