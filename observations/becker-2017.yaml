      note: "experimental trials, each one decentralized and one centralized network of 40 given the same question set; the unit of the group-level analyses"
    - value: 8
      unit: other
      note: "control groups of 40, one per unique question set"
    - value: 59
      unit: other
      note: "group estimation tasks completed by decentralized networks (and 59 by centralized networks, 34 by control groups)"
  population:
    description: "Adults recruited online to a web-based estimation experiment, paid according to the accuracy of their final estimate."
    age_or_stage: "Not stated in the article text; recruited from the World Wide Web."
    age: unreported
  context:
    setting: >-
      Real-time online sessions of about 15 minutes. Image prompts asking for a
      numerical quantity: count-based questions (6 trials, 4 questions each)
      and percentage-based questions (7 trials, 5 questions each).
  arms:
    - id: decentralized
      description: "Decentralized random network of 40, every member with the same number of ties; after each round a participant sees the average estimate of the peers directly connected to them."
      size:
        value: 520
        unit: participants
      elements:
        - term: "social influence (observing neighbours' average estimate)"
      dose:
        amount: 2
        unit: rounds of revision
      delivery:
        grouping: individual
        role: other
        basis: inferred
    - id: centralized
      description: "Centralized network of 40 in which one central member has a disproportionate number of connections; otherwise as the decentralized condition."
      size:
        value: 520
        unit: participants
      elements:
        - term: "social influence (observing neighbours' average estimate)"
      dose:
        amount: 2
        unit: rounds of revision
      delivery:
        grouping: individual
        role: other
        basis: inferred
    - id: control
      description: "Independent control: same questions in the same order and two chances to revise, with no social information."
      size:
        value: 320
        unit: participants
      dose:
        amount: 2
        unit: rounds of revision
      delivery:
        grouping: individual
        role: other
        basis: inferred

comparisons:
  - id: decentralized-round3-vs-round1
    kind: within-subject-baseline
    index_arm: decentralized
    description: "Decentralized networks, round 3 (after two revisions) against round 1 (independent estimates), per trial."
  - id: centralized-toward-truth-round3-vs-round1
    kind: within-subject-baseline
    index_arm: centralized
    description: "Centralized networks, round 3 against round 1, on the estimation tasks where the central node's initial estimate lay toward the truth relative to the group estimate. A post hoc sort of tasks, not an assigned condition; 12 of 13 trials had such a task."
  - id: centralized-away-from-truth-round3-vs-round1
    kind: within-subject-baseline
    index_arm: centralized
    description: "Centralized networks, round 3 against round 1, on the estimation tasks where the central node's initial estimate pulled the group away from the truth. A post hoc sort of tasks, not an assigned condition; all 13 trials."
  - id: control-round3-vs-round1
    kind: within-subject-baseline
    index_arm: control
    description: "Control groups, round 3 against round 1, revising with no social information."

