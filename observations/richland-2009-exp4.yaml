# Richland, Kornell & Kao (2009), Experiment 4: pretest against extended
# study, final test ONE WEEK later; only the 5 emphasised items bolded, so
# bolding varied within participants and testing between them.
#
# Records the bolded-and-tested against bolded-only contrast (d = 0.45), the
# two condition means with SEs, and the untested-unbolded contrast (no
# difference, no d printed). Effects were analysed with one-tailed t tests.
# The within-test-condition comparison prints "SE = 0.30" beside 55% where
# the between-condition sentence prints SE = 2.0 for the same mean; that
# within-condition figure is not recorded.
#
# `population.age`: mean age 20 years.
#
# No scoring reliability is printed for the final test in any experiment (how
# answers were scored is not described), so no reliability is recorded.
#
# Read from the publisher PDF of the article supplied for this batch (beside its
# pdftotext text layer). The text layer writes "=" as U+2AFD and "<" as U+2B0D,
# and drops the hyphen in "bolded-only" and "italicized-only" at line breaks;
# every source_quote containing those characters was taken from the page images
# (PDF pp. 246-251) and uses the characters the article prints. The numbers in
# the text layer and the page images agree.

schema_version: 2
study:
  key: richland-2009-exp4
  citation: 'Richland, L. E., Kornell, N., & Kao, L. S. (2009). The pretesting effect: Do unsuccessful
    retrieval attempts enhance learning? Journal of Experimental Psychology: Applied, 15(3), 243–257.
    Experiment 4.'
  doi: 10.1037/a0016496
  design:
    family: randomized-controlled-trial
    design_detail: Laboratory experiment, participants tested individually, random assignment to two between-participants
      conditions; bolding of 5 of the 10 key concepts manipulated within participants (in the test condition
      the bolded items were the pretested ones). Learning phase as in Experiments 1-3; final test one
      week later at the same time of day. One-tailed t tests.
    preregistration:
      status: unreported
