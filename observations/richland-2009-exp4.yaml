not_yet_extracted:
- Within the test and study condition, tested and bolded items against untested and unbolded items (42%,
  SE 3.0), t(78) = 3.3, p < .001, d = 0.75 (the 55% is printed there with SE = 0.30).
- 'Within the extended study condition, bolded (M = 45%, SE = 2.2) against unbolded items (M = 39%, SE
  = 2.6), t(78) = 1.9, p < .04, d = 0.43: the bolding effect. The SE printed for the 45% differs between
  this sentence (2.2) and the between-condition one (3.0).'
- The authors judge the Experiment 4 effects comparable in size to Experiment 3's, and suggest unsuccessful
  tests may not slow forgetting (p. 250).
