      mean: 20
  context:
    setting: Individual sessions; final test one week later
    materials: A two-page essay on vision and cerebral achromatopsia from Sacks (1995) with 10 testable
      sentences; two counterbalanced 5-question pretests; a 10-question final test. Only 5 items bolded;
      two high-accuracy pretest questions rewritten.
  arms:
  - id: test-and-study
    description: 'Test and study: 2-min pretest on 5 concepts (10% answered correctly), then 8 min studying
      the passage with those 5 concepts bolded.'
    size:
      value: 79
      unit: participants
    elements:
    - term: unsuccessful retrieval attempt (pretest) before studying the text
      anchors:
      - principles/retrieval-practice
    dose:
      amount: 10
      unit: min in total (2 min pretest, 8 min study)
  - id: extended-study
    description: 'Extended study: 10 min studying the passage with 5 matched concepts bolded.'
    size:
      value: 79
      unit: participants
    elements:
    - term: additional study time on the same text
    dose:
      amount: 10
      unit: min of study
