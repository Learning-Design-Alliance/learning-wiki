# Siegler & Stern (1998): conscious and unconscious discovery of the inversion
# shortcut (a + b - b) by German second graders, a microgenetic study.
#
# Read from the published PDF's text layer (JEP: General 127(4), 377-397). The
# text layer reads Table 4 column by column, so its rows were read from the page
# image (PDF page 7, journal p. 383), and the four Table 4 quotes below are taken
# from that image, written as the row reads across. Every other quote is from the
# running text. The OCR spells "defined" as "denned" in one sentence, so that
# quote stops short of the word.
#
# WHAT THIS FILE RECORDS:
#
#   * Table 4: the accuracy of the old route (computation, 74% mixed and 73%
#     blocked correct) against the newly discovered shortcut (100% in both
#     groups), with each strategy's mean response time beside it. Each group's
#     figure is its own observation (`arm_ref`). The table's "% correct" is the
#     percentage of that group's trials on that strategy answered correctly; the
#     source does not say whether it is a mean of per-child rates or a pooled
#     ratio, so it is recorded as `other` in percent, as printed, not as `mean`.
#   * 27 of 31 children (88%) showed the shortcut implicitly (a solution time of
#     4 s or less with a computational explanation) before reporting it.
#   * Use of the shortcut just after its first use, within the same session:
#     73% of the mixed group on the next trial; "about 80%" of the blocked group
#     on the next three. And in the session a week later, for the mixed group, a
#     limit only: "On none of the first six trials ... did even 25%", recorded
#     as a bound. The other next-session values are only in Figure 6, a line
#     graph, and are not recorded.
#   * `population.age`: the range is printed in months (100 to 115) and the mean
#     in years (8.75). The structured field takes one unit, so it holds the
#     range in months and the mean stays in the note, unconverted.
#   * No reliability: the paper prints no agreement coefficient for its strategy
#     classifications. It argues their validity from four kinds of convergent
#     evidence (solution times, overt behaviour, their associations), none of
#     which is an agreement statistic.

schema_version: 2

study:
  key: siegler-1998
  citation: "Siegler, R. S., & Stern, E. (1998). Conscious and unconscious strategy discoveries: A microgenetic analysis. Journal of Experimental Psychology: General, 127(4), 377-397."
  doi: "10.1037/0096-3445.127.4.377"
  design:
    family: randomized-controlled-trial
    design_detail: >-
      Microgenetic two-group experiment over eight weekly sessions. After a
      pretest session, the 31 children who had not used the shortcut were
      randomly assigned, within quartiles of a standardised maths test, to a
      blocked problems group (100% inversion problems in Sessions 2-4 and 6)
      or a mixed problems group (50% inversion, 50% standard problems); both
      received mixed sets in Sessions 1, 5 and 7, and transfer problems in
      Session 8. Strategy on each trial was classified from the solution time
      (4 s or less, or longer), the child's immediately retrospective
      explanation and overt behaviour. Reported results use the first 10
      inversion problems of each session.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

