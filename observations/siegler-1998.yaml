  size:
    value: 31
    unit: participants
  additional_sizes:
    - value: 39
      unit: participants
      note: "original sample; 8 used the shortcut on at least one pretest trial and did not continue"
  population:
    description: >-
      German second graders (18 girls, 13 boys) attending an afterschool centre
      in Munich, who did not use the shortcut strategy on the pretest. Mean
      performance on the SCHOLASTIC maths test was near the norms (44th
      percentile on word problems, 47th on computation).
    age_or_stage: "Second grade; 8- and 9-year-olds"
    age:
      unit: months
      min: 100
      max: 115
      note: "Range printed in months at the beginning of the study; the mean is printed in years (8.75) and is not converted here."
  context:
    setting: "Individual weekly sessions in a quiet room of the afterschool centre, three female research assistants as experimenters; problems on index cards, timed by stopwatch to the nearest second"
  arms:
    - id: blocked
      description: "Blocked problems: 20 inversion problems (a + b - b) and no standard problems in Sessions 2, 3, 4 and 6; the mixed set in Sessions 1, 5 and 7."
      size:
        value: 16
        unit: participants
      dose:
        amount: 8
        unit: weekly sessions
        detail: "Session 1 pretest, Sessions 2-7 practice, Session 8 transfer"
    - id: mixed
      description: "Mixed problems: 10 inversion and 10 standard problems (a + b - c) in every practice session."
      size:
        value: 15
        unit: participants
      dose:
        amount: 8
        unit: weekly sessions
        detail: "Session 1 pretest, Sessions 2-7 practice, Session 8 transfer"

comparisons:
  - id: blocked-vs-mixed
    kind: between-groups
    index_arm: blocked
    reference_arm: mixed
    description: "Blocked against mixed presentation of inversion problems, children randomly assigned within test-score quartiles."

