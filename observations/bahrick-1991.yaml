    source_quote: "Odd-even reliability coefficients corrected by the Spearman Brown formula indicated a reliability of .93 for the final geometry test and .94 for the algebra test."
    source_location: "Method, Pilot Testing"

  - id: more-math-courses-minimal-algebra-loss
    comparison_ref: whole-sample
    outcome:
      construct: "Retention of Algebra 1 content"
      source_language: "minimal losses during the course of more than 50 years"
      measure: "Algebra 1 test score as predicted by the final regression equation for profiles differing in number and level of mathematics courses (Figures 1 and 2), rehearsal set at zero"
      scale: "chance-adjusted proportion of the score at the start of the retention interval lost (Figure 2)"
      direction: lower-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "retention interval up to about 50 years after the last algebra course"
    result:
      measure_type: qualitative
      finding: >-
        In profiles predicted by the regression, participants who took three or
        more college mathematics courses with the highest above calculus show
        minimal losses of Algebra 1 content over more than 50 years while
        reporting no rehearsal; those who took no further algebra courses
        decline to the control-group level; intermediate training falls in an
        orderly hierarchy between.
      perspective: researcher
      collection_method: "Evaluation of the final regression equation for predictor profiles (Table 7), plotted in Figures 1 and 2"
      interpretation: >-
        A description of model-predicted retention functions, not of observed
        group means. Level and number of courses are confounded, and the
        authors note that longer acquisition periods and relearning in later
        courses go with them. The plotted values are in figures and are not
        given as numbers in the text.
    moderators:
      reported: []
      candidate:
        - "Spacing of acquisition over several years, which the authors say is confounded with the number of courses taken"
        - "Self-selection of those who continue to take mathematics courses, which the authors say may play a role"
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: observed
      effect_size: unreported
    source_quote: "Those who have taken three or more college mathe- matics courses with the highest level course above calculus show minimal losses during the course of more than 50 years even though they report no rehearsal activities during that period."
    source_location: "Results and Discussion, Effect of number and level of mathematics courses taken (Figure 2)"

  - id: sat-retention-correlation
    comparison_ref: whole-sample
    outcome:
      construct: "Algebra retention test performance"
      source_language: "the retention scores"
      measure: "Algebra test score against SAT or equivalent ACT score"
      scale: "Pearson correlation"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "at test, across retention intervals"
    result:
      measure_type: correlation
      estimate: 0.65
      interpretation: "The highest correlation of any variable with the retention scores."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: partial
      effect_size: observed
    observability_notes: >-
      The n for this correlation is not printed; standardized scores were
      unavailable for two thirds of participants, and the separate regression
      used 284. The sentence follows the algebra analysis; the article does
      not say explicitly that the correlation is for the algebra test.
    source_quote: "test scores (i.e., SAT or equivalent ACT scores) had the highest correlation with the retention scores (r = .65)."
    source_location: "Results and Discussion, Effect of standardized test scores"

  - id: sat-subsample-final-multiple-r
    sample:
      value: 284
      unit: participants
    comparison_ref: whole-sample
    outcome:
      construct: "Algebra 1 retention test performance"
      source_language: "the final multiple correlation"
      measure: "Hierarchical regression of Algebra 1 test score with standardized test scores added, including their interaction with the retention interval"
      scale: "multiple correlation R"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "at test, across retention intervals"
    result:
      measure_type: other
      estimate: 0.85
      statistic: "multiple R"
      interpretation: >-
        The standardized-score by retention-interval interaction was not
        statistically significant, which the authors read as standardized
        scores not significantly affecting the rate of loss. No test statistic
        or p value is printed for the interaction.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: partial
      effect_size: unreported
    observability_notes: >-
      A non-significant interaction is not a demonstrated absence of an
      effect on rate; the article prints no estimate or power for it.
      Standardized scores were mostly unavailable for those tested 30 or more
      years after the course and for high school students.
    source_quote: "The addition of standardized scores increased the final multiple correlation to .85, but did not yield a statistically significant interaction between standardized scores and the retention interval, indicating that the scores per se do not significantly affect the rate of loss."
    source_location: "Results and Discussion, Effect of standardized test scores"

