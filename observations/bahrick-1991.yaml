# Bahrick & Hall (1991): retention of high school algebra and geometry content
# over up to about 50 years, by cross-sectional hierarchical regression.
#
# Read from the text layer of the published article (pdftotext, reading order).
# No PDF was available to this extraction, so no page image was viewed. The
# two-column layout and the tables came out interleaved: Table 1 (subjects by
# retention interval), Table 2 (rehearsal by math level), Tables 5, 6 and 8 to
# 13 (regression steps and weights) cannot be read cleanly, and no figure from
# them is recorded; they are listed in not_yet_extracted. Every figure below
# is from a prose sentence that the text layer kept contiguous.
#
# The sentence giving R = .39 (algebra) and .17 (geometry) is interleaved with
# the other column in the text layer, so each of those two observations quotes
# only the contiguous fragment holding its own figure.
#
# Two quotes carry OCR artefacts that are kept as the text layer prints them,
# because the page was not available to check: "of. 17" (for .17) and
# "K = .69" (for R = .69). The article's own characters may differ.
#
# The article prints two different reliability figures for the same two
# tests: odd-even split-half, Spearman-Brown corrected, .94 (algebra) and .93
# (geometry) in the Method, and ".98 for algebra and .95 for geometry" in the
# Discussion with no coefficient named. Both observations below record the
# Method figures, whose coefficient is stated; the discrepancy is noted on each.
#
# No age figure is printed for the sample as a whole; only the adult controls'
# range (19 to 84) and the recruiting band for younger participants (16 to 30)
# are given, so `age: unreported` and the words go in age_or_stage.
#
# The front matter prints no DOI (1991); the journal, volume, issue and pages
# (JEP: General 120(1), 20-33) agree with 10.1037/0096-3445.120.1.20.

schema_version: 2

study:
  key: bahrick-1991
  citation: "Bahrick, H. P., & Hall, L. K. (1991). Lifetime maintenance of high school mathematics content. Journal of Experimental Psychology: General, 120(1), 20-33."
  doi: "10.1037/0096-3445.120.1.20"
  design:
    family: observational
    design_detail: >-
      Cross-sectional study: participants who varied in time since their last
      algebra course (or since plane geometry) took one test of Algebra 1 and
      Algebra 2 content and/or one of plane geometry content, and a
      questionnaire on courses, grades, test scores and rehearsal. Hierarchical
      multiple regression predicted test scores from the retention interval
      (log, squared and cubed), original-learning variables, rehearsal and
      gender, then interactions of each with the retention interval, which the
      authors read as effects on the rate of decline. Retention functions are
      the regression equation evaluated for profiles of predictor values
      (Table 7), not observed group means. Course and score data were checked
      against registrar and testing-service records for 661 participants.
      Student and adult control groups had never taken the course.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: college-math-courses-prevent-algebra-loss-decades
    bearing: supports
    anchor: bahrick-1991
  - claim: grades-sat-predict-level-not-decline-rate
    bearing: supports
    anchor: bahrick-1991
  - claim: grades-sat-predict-level-not-decline-rate
    bearing: supports
    anchor: bahrick-1991-2
  - claim: geometry-content-declines-less-than-algebra
    bearing: supports
    anchor: bahrick-1991
  - claim: geometry-content-declines-less-than-algebra
    bearing: supports
    anchor: bahrick-1991-2

evidence_base:
  unit: participants
  size:
    value: 1726
    unit: participants
  additional_sizes:
    - value: 1050
      unit: participants
      note: "took the algebra test, including 110 student controls and 13 adult controls"
    - value: 946
      unit: participants
      note: "took the geometry test, including 61 student controls and 25 adult controls"
    - value: 270
      unit: participants
      note: "took both tests, usually on different days"
    - value: 927
      unit: participants
      note: "algebra subjects excluding controls (Table 1)"
    - value: 860
      unit: participants
      note: "geometry subjects excluding controls (Table 1)"
    - value: 661
      unit: participants
      note: "whose reported course dates, courses, grades and SAT/ACT scores were checked against registrar and Educational Testing Service records (38% of the sample)"
    - value: 284
      unit: participants
      note: "with standardized test scores available, analysed in a separate regression"
  population:
    description: >-
      Ohio participants who had taken high school algebra and/or plane
      geometry between about 1937 and 1986, recruited at local high schools,
      Ohio Wesleyan University and the Ohio State University, and among Ohio
      Wesleyan alumni and members of local churches and service
      organisations. Control groups had never taken the course: students due
      to begin it the following fall, and adults whose educational level
      approximated that of the other participants.
    age_or_stage: >-
      Persons between 16 and 30 were recruited mainly at high schools and
      universities, older participants from alumni and community groups;
      adult controls ranged in age from 19 to 84. No age figure is printed
      for the sample as a whole.
    age: unreported
  context:
    setting: "Tests given individually and to groups of up to 200 in laboratories, high school classrooms and church space, spring 1986 to fall 1987; no time limit, most finishing within 90 minutes"
  variation:
    - dimension: "Retention interval"
      distribution: "From 0 to over 50 years since the last algebra course (or plane geometry); per-interval counts are in Table 1, not readable in the text layer"
    - dimension: "Highest level of mathematics taken"
      distribution: "Below calculus, calculus, above calculus (Table 2, not readable in the text layer)"
  arms: []

comparisons:
  - id: whole-sample
    kind: none
    description: "Regression and correlation results over the participants analysed; no contrast between assigned groups."

