  - id: algebra-test-reliability
    comparison_ref: whole-sample
    outcome:
      construct: "Algebra content knowledge"
      source_language: "reliability of .94 for the algebra test"
      measure: "Final algebra test: recall and recognition (multiple choice) items on Algebra 1 and Algebra 2 content, ordered by difficulty"
      scale: "odd-even split-half reliability, Spearman-Brown corrected"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "pilot testing, before the final administration"
    result:
      measure_type: reliability
      estimate: 0.94
      reliability:
        statistic: other
        over: items
        form: "Odd-even reliability coefficients corrected by the Spearman Brown formula"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: partial
      effect_size: unreported
    observability_notes: >-
      Reported in the Pilot Testing section for "the final ... algebra test";
      the article does not say whether it was computed on the 92 pilot
      participants or on the main sample. The Discussion gives a different
      figure for the same test (".98 for algebra"), naming no coefficient;
      that figure is not recorded here.
    source_quote: "Odd-even reliability coefficients corrected by the Spearman Brown formula indicated a reliability of .93 for the final geometry test and .94 for the algebra test."
    source_location: "Method, Pilot Testing"

