not_yet_extracted:
  - "Table 1: number of algebra and geometry subjects per retention-interval band; columns interleaved in the text layer."
  - "Table 2: reported level of rehearsal by highest level of math taken; digits run together in the text layer."
  - "Table 5: hierarchical regression steps for Algebra 1 (R, F change, df, p per step, including the Learning x Retention interaction step that carries the course-taking effect on rate of loss); p values cannot be aligned to steps in the text layer."
  - "Table 6: regression weights from the final Algebra 1 step; coefficients, t and p cannot be aligned to variables in the text layer."
  - "Figures 1 to 5: predicted Algebra 1 retention functions by course level, grade, gender and item format; plotted values only."
  - "Tables 8 and 9: item-level regression (final R .71 in prose); Tables 10 and 11: Algebra 2 (final R .78 in prose); Tables 12 and 13: geometry steps and weights; item-level geometry R .58 in prose. Not recorded: no simulator figure rests on them."
