  - id: more-math-courses-minimal-algebra-loss
    comparison_ref: whole-sample
    outcome:
      construct: "Retention of Algebra 1 content"
      source_language: "minimal losses during the course of more than 50 years"
      measure: "Algebra 1 test score as predicted by the final regression equation for profiles differing in number and level of mathematics courses (Figures 1 and 2), rehearsal set at zero"
      scale: "chance-adjusted proportion of the score at the start of the retention interval lost (Figure 2)"
      direction: lower-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "retention interval up to about 50 years after the last algebra course"
    result:
      measure_type: qualitative
      finding: >-
        In profiles predicted by the regression, participants who took three or
        more college mathematics courses with the highest above calculus show
        minimal losses of Algebra 1 content over more than 50 years while
        reporting no rehearsal; those who took no further algebra courses
        decline to the control-group level; intermediate training falls in an
        orderly hierarchy between.
      perspective: researcher
      collection_method: "Evaluation of the final regression equation for predictor profiles (Table 7), plotted in Figures 1 and 2"
      interpretation: >-
        A description of model-predicted retention functions, not of observed
        group means. Level and number of courses are confounded, and the
        authors note that longer acquisition periods and relearning in later
        courses go with them. The plotted values are in figures and are not
        given as numbers in the text.
    moderators:
      reported: []
      candidate:
        - "Spacing of acquisition over several years, which the authors say is confounded with the number of courses taken"
        - "Self-selection of those who continue to take mathematics courses, which the authors say may play a role"
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: observed
      effect_size: unreported
    source_quote: "Those who have taken three or more college mathe- matics courses with the highest level course above calculus show minimal losses during the course of more than 50 years even though they report no rehearsal activities during that period."
    source_location: "Results and Discussion, Effect of number and level of mathematics courses taken (Figure 2)"

