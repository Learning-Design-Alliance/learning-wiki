    - value: 41538
      unit: participants
      note: "participants across the studies, as printed beside the 523 effect sizes"
  population:
    description: >-
      Samples of children, adolescents and adults from U.S., other Western,
      Asian, Eastern European and Russian, and African cultures, with and
      without psychopathology (community samples, samples selected for absence
      of psychopathology, and clinical samples).
    age_or_stage: >-
      Age coded per sample as the average age of participants and grouped into
      six bands: 8-11, 12-14, 15-18, 19-24, 25-55 and over 55. The article
      prints no age range, mean or SD for the corpus as a whole.
    age: unreported
  context:
    setting: "Attributions for positive and negative events: hypothetical, experimental or naturalistic outcomes, measured by attributional style questionnaires and other attribution measures"
  variation:
    - dimension: "Age group (effect sizes)"
      distribution: "8-11: 111; 12-14: 64; 15-18: 68; 19-24: 121; 25-55: 129; over 55: 10 (Table 3)"
  arms:
    - id: age-8-11
      description: "Effect sizes from samples whose average age was 8 to 11 (middle childhood or elementary school)."
      size:
        value: 111
        unit: effect-sizes
    - id: age-12-14
      description: "Effect sizes from samples whose average age was 12 to 14 (early adolescence or middle school)."
      size:
        value: 64
        unit: effect-sizes
    - id: age-over-55
      description: "Effect sizes from samples whose average age was over 55 (older adults)."
      size:
        value: 10
        unit: effect-sizes
    - id: culture-us
      description: "U.S. samples, one of five broad cultural groups."
    - id: culture-other-western
      description: "Other Western samples: United Kingdom, Canada, Australia, New Zealand and Western Europe."
    - id: culture-asian
      description: "Asian samples: India, Japan, China, Korea and Pacific Islanders."

comparisons:
