# Mezulis, Abramson, Hyde & Hankin (2004): meta-analysis of the self-serving
# attributional bias across age, culture and psychopathology.
#
# Read from a copy of the published article (Psychological Bulletin pages
# 711-747) whose text layer is OCR: several "=" signs and statistic symbols are
# missing in it ("U.S. (d 1.05)"), and the quotes below keep the text exactly as
# it reads, symbols missing included.
#
# The effect size is a within-sample difference: d is the mean internal,
# stable, global attribution for positive events minus that for negative
# events, divided by the mean SD. So each pooled estimate rests on no contrast
# between groups of people; age bands and cultural groups are corpus strata,
# recorded as arms and named by arm_ref, as van-yperen-2014 does.
#
# k counts EFFECT SIZES (independent samples), not studies: 266 articles gave
# 523 effect sizes, 20 outliers were removed, and 503 remain in every analysis
# below.
#
# Table 3's text layer interleaves the last two rows ("25-55 Over 55 129 10
# 0.70 0.58, 0.83 1.38 0.90, 1.86"). The order is read as row order, and the
# Discussion confirms the over-55 figures independently (10 samples, d = 1.38).

schema_version: 2

study:
  key: mezulis-2004
  citation: "Mezulis, A. H., Abramson, L. Y., Hyde, J. S., & Hankin, B. L. (2004). Is there a universal positivity bias in attributions? A meta-analytic review of individual, developmental, and cultural differences in the self-serving attributional bias. Psychological Bulletin, 130(5), 711-747."
  doi: "10.1037/0033-2909.130.5.711"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-analysis of the difference between attributions (internality,
      stability, globality) for positive or success events and for negative or
      failure events, d per independent sample. Fixed- and random-effects
      estimates; moderator analyses by homogeneity partitioning (age group,
      gender, culture, psychopathology, measure, event type, measure
      reliability) and a random-effects weighted multiple regression.
  synthesis:
    model: "Random-effects estimation (Hedges & Vevea, 1998); fixed-effects estimate also reported"
    heterogeneity_statistic: "Within- and between-groups homogeneity statistic H (Hedges & Becker, 1986)"
    search:
      records_included: "266 articles, 523 independent effect sizes, 41,538 participants; 20 outlier effect sizes removed, leaving 503"
    data_handling:
      - "Outliers identified by the Huffcutt and Arthur (1995) procedure: 20 effect sizes (3.8%) removed from all further analyses"
      - "Where an article gave no age, undergraduates were coded 20, a grade level plus 6 years, and the midpoint of an age range"
      - "Effect sizes from F or t statistics, significance levels or percentages where means and SDs were unavailable; within-subjects estimates corrected for the positive-negative correlation (Morris & DeShon, 2002); all corrected for small-sample bias (Hedges, 1981)"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

