      ci_lower: 0.89
      ci_upper: 1.02
      interval_type: confidence
      k:
        value: 503
        unit: effect-sizes
      model: "random-effects"
      publication_bias:
        method: "Funnel plot and trim and fill (Duval & Tweedie, 2000)"
        finding: "Trim and fill indicated that no studies needed to be trimmed to correct for publication bias"
      interpretation: "Described by the authors as a very large effect by Cohen's criteria"
      note: >-
        Before outlier removal, 523 effect sizes gave a weighted mean of 0.88
        (95% CI 0.86 to 0.89); after removal the fixed-effects estimate was 0.90
        (95% CI 0.88 to 0.92). Both sets were significantly heterogeneous.
    moderators:
      reported:
        - variable: "Age group"
          relationship: "Bias largest in children (8-11) and older adults (over 55), least pronounced in adolescence and adulthood, large in every age group"
          source_quote: "Overall, the self-serving attributional bias was most pronounced in children and in older adults. The self-serving attributional bias was least pronounced in adolescence and adulthood."
        - variable: "Culture"
          relationship: "Large in U.S. and other Western samples, significantly smaller in Asian samples, positive in every cultural group"
          source_quote: "It is important to note that across all cultural groups the direction of the self-serving attributional bias was positive."
        - variable: "Psychopathology"
          relationship: "Samples selected for any psychopathology showed a significantly smaller bias than samples without psychopathology and community samples"
          source_quote: "Samples with any psycho- pathology displayed a significantly smaller self-serving attribu- tional bias than samples with no psychopathology and community samples"
      candidate: []
