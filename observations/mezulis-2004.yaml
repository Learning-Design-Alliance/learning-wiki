      (hypothetical, experimental, naturalistic) but not when attributions were
      made relative to the events.
    source_quote: "Averaged over the 503 independent effect sizes, the random- effects estimate of the weighted mean effect size for the self- serving attributional bias was 0.96, representing a very large effect by Cohen's (1969) criteria. The 95% confidence interval for d was 0.89 to 1.02."
    source_location: "Results, Magnitude of the Self-Serving Attributional Bias, p. 717"

