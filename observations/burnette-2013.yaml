      source_language: "performance goals"
      measure: "Performance-goal measures in the primary studies (goal setting)"
      scale: "correlation with incremental (vs entity) theory scores"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "as measured in the primary studies; no lag coded"
    result:
      measure_type: correlation
      estimate: -0.151
      ci_lower: -0.199
      ci_upper: -0.102
      interval_type: confidence
      p_value: "< .001"
      k:
        value: 30
        unit: studies
      heterogeneity:
        statistic: "I2"
        value: 76.3
        unit: percent
      model: "random-effects"
      note: "Corrected for unreliability, rc = -.196. Approach/avoidance moderated it (B = -.130, p < .001), stronger for performance-avoidance goals."
    moderators:
      reported:
        - variable: "Ego threat"
          relationship: "Negative association stronger in the presence of ego threat (Table 2 prints B = -.104, p < .05; the Results prose prints B = .104 with no sign, while its words say the negative association strengthens)"
          source_quote: "significantly moderated the association of incremental theories with performance goals—this negative association was especially strong in the presence vs. absence of ego threat"
        - variable: "Approach vs avoidance"
          relationship: "Stronger negative association with performance-avoidance than performance-approach goals (B = -.130, p < .001)"
          source_quote: "significantly moderated the association of incremental theories with performance goals (Path c; B = -.130, p < .001), with incremental theories exhibiting a stronger negative association with performance-avoidance goals than with performanceapproach goals."
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: unreported
      outcome_timing: unreported
      effect_size: observed
      pooled_k: observed
    source_quote: "with performance-oriented goals (Path a; r = -.151; rc = -.196) and a positive association of incremental theories with learning-oriented goals (Path b; r = .187; rc = .241)."
    source_location: "Results, Goal Setting, p. 41; Table 2 (p. 97, read from page image) for k, n, CI and I-squared"

