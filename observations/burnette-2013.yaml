# Burnette, O'Boyle, VanEpps, Pollack & Finkel (2013): a meta-analysis of
# implicit theories (mindsets) and self-regulation.
#
# Read from the author's in-press manuscript (dated May 9, 2012; 129 pp.).
# Page numbers below are the manuscript's own running heads, not the
# Psychological Bulletin pagination. The manuscript prints no DOI; the DOI
# below was checked against Crossref (title, first author, 2013, 139(3),
# 655-701).
#
# TABLE 2 WAS READ FROM THE PAGE IMAGE. pdftotext splits Table 2 (p. 97) into
# columns, so a row cannot be quoted from the text layer. k, n, the 95% CIs
# and I-squared for each row were read from the PDF page image (PDF page 98)
# and every one of them also appears, column by column, in the text file. Each
# observation's source_quote is the article's own prose (abstract or Results),
# which prints r and rc but not k, n, CI or I-squared.
#
# WHAT THIS FILE USES:
#
#   * `population.age` as min/max only: the article prints an age range across
#     samples (5-42) and its banding (37% school-aged 5-17), no mean or SD.
#   * `measure_type: reliability` three times: the mean Cronbach's alpha of the
#     implicit-theory measures (.80) and of the self-regulation measures (.79)
#     across the primary studies that reported one, and the coders' kappa for
#     classifying outcomes into the six processes (.88). The two alphas are the
#     article's own averages over primary-study alphas, not alphas of one
#     instrument.
#
# `k` in Table 2 counts STUDIES (independent samples), per the table note.

schema_version: 2

study:
  key: burnette-2013
  citation: "Burnette, J. L., O'Boyle, E. H., VanEpps, E. M., Pollack, J. M., & Finkel, E. J. (2013). Mind-sets matter: A meta-analytic review of implicit theories and self-regulation. Psychological Bulletin, 139(3), 655-701."
  doi: "10.1037/a0029531"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-analysis of correlations between implicit theories (incremental vs
      entity) and six self-regulatory processes (performance goals, learning
      goals, helpless-oriented strategies, mastery-oriented strategies,
      negative emotions, expectations) and achievement, organised by the
      authors' SOMA model. Most included studies (73%) assessed implicit
      theories as an individual difference; the rest induced them
      experimentally. Correlations corrected for unreliability (Hunter &
      Schmidt) are reported beside the observed ones. Moderators (approach vs
      avoidance, ego threat, domain, method of assessment, publication status)
      tested by fixed-effects meta-regression.
  synthesis:
    model: "Random-effects model for mean effect sizes (Comprehensive Meta-Analysis 2.0); fixed-effects meta-regression for moderators"
    heterogeneity_statistic: "I2"
    heterogeneity_thresholds: "I-squared above 25 percent taken to justify a search for moderators (Higgins et al., 2003)"
    data_handling:
      - "Two authors independently categorised outcome variables into the six self-regulatory processes; discrepancies resolved by discussion"
      - "Correlations corrected for unreliability per sample where possible, otherwise with the mean reliability of the primary samples"
      - "Four outliers (of 273 effects) excluded from final analyses after a one-study-removed analysis"
      - "Publication bias: trim and fill and Rosenthal's fail-safe N, on published studies only, with moderators and sample size in the regression"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-author-manuscript
  verification: unverified

appears_in:
  - claim: incremental-theories-predict-goal-setting
    bearing: supports
    anchor: burnette-2012
  - claim: incremental-theories-predict-goal-operating
    bearing: supports
    anchor: burnette-2012
  - claim: incremental-theories-predict-goal-monitoring
    bearing: supports
    anchor: burnette-2012
  - claim: ego-threat-moderates-mindset-selfregulation-links
    bearing: supports
    anchor: burnette-2012

evidence_base:
  unit: studies
  size:
    value: 113
    unit: studies
  additional_sizes:
    - value: 85
      unit: reports
      note: "citations included: published articles, dissertations, theses and unpublished data"
    - value: 28217
      unit: participants
      note: "total unique N across the 113 independent samples"
    - value: 273
      unit: effect-sizes
      note: "effect sizes yielded by the 113 samples, before the 4 outliers were excluded"
  population:
    description: >-
      113 independent samples across achievement domains (68% academic) from
      10 nations (58% United States); about 44% of participants female.
      Reports were published studies (77%), dissertations (9%) and
      unpublished studies (14%).
    age_or_stage: >-
      Ages 5-42 across samples: 37% school-aged (5-17), 49% university-aged
      (18-23), 14% adult (24-42). No mean or SD is printed, and age was not
      tested as a moderator.
    age:
      unit: years
      min: 5
      max: 42
      note: "Range across the included samples, not within one sample"
  context:
    setting: "Academic (68%) and non-academic achievement domains such as athletics, weight management and leadership"
  variation:
    - dimension: "Achievement domain"
      distribution: "68% academic"
    - dimension: "Implicit-theory assessment"
      distribution: "73% assessed as an individual difference; the rest experimentally induced"
    - dimension: "Report type"
      distribution: "77% published, 9% dissertations, 14% unpublished"
  arms: []

comparisons:
  - id: whole-corpus
    kind: none
    description: "Correlation of incremental (vs entity) theories with a self-regulatory process across the pooled samples; no contrast between configurations."
  - id: outcome-coding-agreement
    kind: none
    description: "Agreement between the two independent coders who categorised outcome variables into the six self-regulatory processes, across all included studies."
  - id: primary-study-measures
    kind: none
    description: "Internal consistency of the primary studies' own measures, averaged over the studies that reported it."

