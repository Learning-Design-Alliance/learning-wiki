  - id: extended-study
    description: 'Extended study: 10 min studying the unmarked passage, the same total time.'
    size:
      value: 27
      unit: participants
    elements:
    - term: additional study time on the same text
    dose:
      amount: 10
      unit: min of study
comparisons:
