  context:
    setting: Group setting in a lecture class; assignment by seating area
    materials: A two-page essay on vision and cerebral achromatopsia from Sacks (1995) with 10 testable
      sentences; two counterbalanced 5-question pretests; a 10-question final test.
  arms:
  - id: test-and-study
    description: 'Test and study: 2-min pretest on five embedded concepts (5% answered correctly), then
