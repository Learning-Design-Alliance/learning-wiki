# Richland, Kornell & Kao (2009), Experiment 1: a pretest on five embedded
# concepts before reading an unmarked essay, against extended study of the
# same essay for the same 10 minutes. Immediate final test.
#
# Records the tested-items contrast (d = 1.1), the two condition means with
# their SEs, and the untested-items contrast (no difference, no d printed).
# The extended-study figure is the condition's OVERALL mean on all 10 items,
# as the article says, not a mean over matched items.
#
# `population.age: unreported`: Experiment 1 prints no age figure.
#
# No scoring reliability is printed for the final test in any experiment (how
# answers were scored is not described), so no reliability is recorded.
#
# Read from the publisher PDF of the article supplied for this batch (beside its
# pdftotext text layer). The text layer writes "=" as U+2AFD and "<" as U+2B0D,
# and drops the hyphen in "bolded-only" and "italicized-only" at line breaks;
# every source_quote containing those characters was taken from the page images
# (PDF pp. 246-251) and uses the characters the article prints. The numbers in
# the text layer and the page images agree.

schema_version: 2
study:
  key: richland-2009-exp1
  citation: 'Richland, L. E., Kornell, N., & Kao, L. S. (2009). The pretesting effect: Do unsuccessful
    retrieval attempts enhance learning? Journal of Experimental Psychology: Applied, 15(3), 243–257.
    Experiment 1.'
  doi: 10.1037/a0016496
  design:
    family: other
    design_detail: 'Group-setting experiment in a lecture class. Participants were described as randomly
      assigned to conditions but were assigned on the basis of seating areas, and the authors note they
      did not have tight control over cell size. Test and study: 2-min pretest on 5 of the 10 testable
      items, then 8 min reading the passage. Extended study: 10 min reading. Untimed final test of all
      10 items immediately after.'
    preregistration:
      status: unreported
