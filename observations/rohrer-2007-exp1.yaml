      effect_size: unreported
    observability_notes: "The group's n is not printed; the SE is as printed and no SD is derived from it."
    source_quote: "the Spacers’ mean test accuracy of 74% (SE = 8%) exceeded both the Massers’ average of 49% (SE = 10%) and the Light Massers’ average of 46% (SE = 7%)."
    source_location: "Results and discussion, Test performance, p. 489; Fig. 2b"

