      source_language: "coefficient equivalence (alpha)"
      measure: "Wonderlic Personnel Test (1998), two parallel forms"
      scale: "Cronbach's alpha, averaged over the two parallel forms"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "each of two occasions about one week apart"
    result:
      measure_type: reliability
      estimate: 0.79
      standard_error: 0.020
      reliability:
        statistic: cronbach_alpha
        over: items
        form: "coefficient of equivalence: the coefficient alphas of the two parallel forms, averaged"
      note: "Standard error from Table 3 (Monte Carlo simulation). Full-scale SD 5.36."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
