# Schmidt, Le & Ilies (2003): transient error in measures of individual
# differences, estimated from two administrations about one week apart.
#
# One sample (N = 167 after attrition) took parallel forms or parallel half
# scales of ten constructs' measures on two occasions. The figures recorded here
# are the general mental ability measure (Wonderlic Personnel Test), which is the
# one measure with true parallel forms and the cognitive one, and the Rosenberg
# self-esteem scale's transient error share. Each measure's coefficient of
# equivalence (CE, alpha), coefficient of equivalence and stability (CES) and
# transient error share (TEV = CE - CES) are separate observations because the
# source prints them as separate statistics with their own standard errors.
#
# TEV is a proportion of OBSERVED score variance, as the source defines it
# ("transient error variance over observed score variance"). It is recorded as
# printed and is not converted to a share of true or systematic variance.
#
# Quotes for the Wonderlic rows come from the text layer, where Table 2 prints
# the row's numbers in sequence. The Rosenberg row of Table 2 is scrambled across
# columns in the text layer (TSBI, Rosenberg and the average interleaved), so the
# quote for `rosenberg-tev` was taken from the page image of p. 217 (Table 2) and
# its standard error from the page image of p. 219 (Table 3).

schema_version: 2

study:
  key: schmidt-2003
  citation: "Schmidt, F. L., Le, H., & Ilies, R. (2003). Beyond alpha: An empirical examination of the effects of different sources of measurement error on reliability estimates for measures of individual differences constructs. Psychological Methods, 8(2), 206–224."
  doi: "10.1037/1082-989x.8.2.206"
  design:
    family: observational
    design_detail: >-
      Two-occasion measurement study. Students completed two laboratory sessions
      about one week apart, each with a different one of two questionnaires
      holding one of a pair of parallel forms (Wonderlic, TSBI) or parallel half
      scales (all other measures) of each measure. CE was the mean alpha of the
      parallel forms (or half scales, stepped up by Spearman-Brown); CES was the
      cross-occasion correlation of the parallel forms (or half scales, via the
      authors' Equation 14); TEV = CE - CES. Standard errors from a Monte Carlo
      simulation of 1,000 data sets per measure. No conditions were assigned.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

evidence_base:
  unit: participants
  size:
    value: 167
    unit: participants
  additional_sizes:
    - value: 235
      unit: participants
      note: "initial sample; 68 did not attend the second session"
    - value: 18
      unit: sessions
      note: "laboratory sessions of about 20 participants each, spanning 3 weeks"
  population:
    description: >-
      Students in an introductory management course at a midwestern US
      university, participating for course credit. Final sample 83 men and 84
      women; initial sample 123 women (52%) and 112 men (48%).
    age_or_stage: "Undergraduates; average age 21.3 years in the final sample, 21.5 in the initial sample"
    age:
      unit: years
      mean: 21.3
      note: "Final sample of 167. The initial sample of 235 averaged 21.5 years. No range or SD printed."
  context:
    setting: "Two laboratory questionnaire sessions separated by approximately one week"
  arms: []

comparisons:
