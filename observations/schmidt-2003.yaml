      effect_size is `unreported` because a reliability coefficient is not an
      effect. The quoted Table 2 row reads SD, CE, CES, TEV, % overestimate.
    source_quote: "5.36 .79 .74 .05 6.7"
    source_location: "Table 2, GMA / Wonderlic row (p. 217); SE in Table 3 (p. 219)"

  - id: wonderlic-ces
    sample:
      value: 167
      unit: participants
    comparison_ref: whole-sample
    outcome:
      construct: "General mental ability test score reliability across occasions"
      source_language: "coefficient of equivalence and stability"
      measure: "Wonderlic Personnel Test (1998), parallel forms given on different occasions"
      scale: "correlation between parallel forms administered about one week apart"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "two occasions about one week apart"
      offset:
        value: 1
        unit: weeks
        from: "first session"
    result:
      measure_type: reliability
      estimate: 0.74
      standard_error: 0.035
      reliability:
        statistic: other
        over: occasions
        form: "coefficient of equivalence and stability (CES): the correlation between the parallel forms administered on different occasions"
      note: "Standard error from Table 3 (Monte Carlo simulation). Forms and occasions vary together in this coefficient."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    source_quote: "5.36 .79 .74 .05 6.7"
    source_location: "Table 2, GMA / Wonderlic row (p. 217); SE in Table 3 (p. 219)"

  - id: wonderlic-tev
    sample:
      value: 167
      unit: participants
    comparison_ref: whole-sample
    outcome:
      construct: "Transient (occasion) error share of a general mental ability test score"
      source_language: "transient error variance over observed score variance"
      measure: "Wonderlic Personnel Test (1998)"
      scale: "proportion of observed score variance (CE minus CES)"
      direction: lower-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "two occasions about one week apart"
      offset:
        value: 1
        unit: weeks
        from: "first session"
    result:
      measure_type: other
      estimate: 0.05
      unit: "proportion of observed score variance"
      standard_error: 0.029
      note: >-
        CE overestimates the CES by 6.7% (Table 2). Footnote 4: adjusting CE and
        CES for the sample's range restriction on the Wonderlic (sample SD 5.36
        against the manual's 7.50) reduced this estimate from .05 to .03.
    moderators:
      reported: []
      candidate:
        - "Range restriction of a college sample on general mental ability (the authors' own adjustment lowers the estimate to .03)"
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      Not an effect of any configuration; a variance share of one measure.
      Standard error from Table 3 (Monte Carlo simulation).
    source_quote: "Against our expectation, measures of GMA and broad personality traits appear to have comparable TEV (.05 for GMA and an average of .04 across 7 broad personality traits; Table 2)."
    source_location: "Results, p. 218; Table 2 (p. 217); SE in Table 3 (p. 219); footnote 4"

