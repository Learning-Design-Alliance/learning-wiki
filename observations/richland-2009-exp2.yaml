# Richland, Kornell & Kao (2009), Experiment 2: as Experiment 1, but the 10
# testable sentences were italicized in both conditions, to equalize attention
# to key content. Immediate final test.
#
# Records the tested-and-italicized contrast (d = 0.61), the two condition means
# with SEs, and the untested-items contrast (no difference, no d printed).
#
# `population.age`: mean age 21 years, printed for the 61 recruited; 2 were
# excluded from analysis (59 analysed).
#
# No scoring reliability is printed for the final test in any experiment (how
# answers were scored is not described), so no reliability is recorded.
#
# Read from the publisher PDF of the article supplied for this batch (beside its
# pdftotext text layer). The text layer writes "=" as U+2AFD and "<" as U+2B0D,
# and drops the hyphen in "bolded-only" and "italicized-only" at line breaks;
# every source_quote containing those characters was taken from the page images
# (PDF pp. 246-251) and uses the characters the article prints. The numbers in
# the text layer and the page images agree.

schema_version: 2
study:
  key: richland-2009-exp2
  citation: 'Richland, L. E., Kornell, N., & Kao, L. S. (2009). The pretesting effect: Do unsuccessful
    retrieval attempts enhance learning? Journal of Experimental Psychology: Applied, 15(3), 243–257.
    Experiment 2.'
  doi: 10.1037/a0016496
  design:
    family: randomized-controlled-trial
    design_detail: Group-setting laboratory experiment, random assignment to two between-participants
      conditions. Same procedure as Experiment 1 (2-min pretest then 8 min study, against 10 min study)
      with all 10 testable sentences italicized in both conditions; no instruction about the italics.
      Untimed final test immediately after.
    preregistration:
      status: unreported
provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: '2026-11-26'
  extraction_method: manual-from-publisher-fulltext
  verification: unverified
