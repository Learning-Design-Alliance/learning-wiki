evidence_base:
  unit: participants
  size:
    value: 61
    unit: participants
  population:
    description: Undergraduates given course credit for participating. 44 women and 17 men, from an upper
      division psychology course on human stress; 2 excluded for failing to respond to final test questions.
    age_or_stage: Undergraduates
    age:
      unit: years
      mean: 21
      note: printed for the 61 recruited, before 2 exclusions
  context:
    setting: Group setting
    materials: A two-page essay on vision and cerebral achromatopsia from Sacks (1995) with 10 testable
      sentences; two counterbalanced 5-question pretests; a 10-question final test. All 10 testable sentences
      italicized.
  arms:
  - id: test-and-study
    description: 'Test and study: 2-min pretest (22% answered correctly), then 8 min studying the passage
      with the 10 testable sentences italicized.'
    size:
      value: 33
      unit: participants
    elements:
    - term: unsuccessful retrieval attempt (pretest) before studying the text
      anchors:
      - principles/retrieval-practice
    dose:
      amount: 10
      unit: min in total (2 min pretest, 8 min study)
  - id: extended-study
    description: 'Extended study: 10 min studying the same italicized passage.'
    size:
      value: 26
      unit: participants
    elements:
    - term: additional study time on the same text
    dose:
      amount: 10
      unit: min of study
