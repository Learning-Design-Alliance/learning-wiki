# Garon-Carrier et al. (2016): intrinsic motivation and achievement in
# mathematics, grades 1 to 4, in the Quebec Longitudinal Study of Child
# Development.
#
# WHAT THIS FILE RECORDS:
#
#   * The four cross-lagged paths and the two motivation stability paths of
#     the final (non-constrained) latent cross-lagged model, Figure 2. The
#     text gives the stability paths by grade (".31 to .42") and says which
#     cross-lagged paths were significant, but it does not print the
#     cross-lagged values; they appear only as labels in Figure 2. Which grade
#     interval each cross-lagged label belongs to is read from the figure's
#     layout (the text layer lists "-.01ns .09" beside the grade 1-2
#     stability .31 and ".02ns .14" beside the grade 2-4 stability .42), and
#     each of those observations says so.
#   * Observed (manifest) correlations from Table 2: the three concurrent
#     motivation-achievement correlations and one lagged one.
#   * `population.age` with the figures printed per wave: grade 1 in months
#     (M = 85.82, SD = 3.06), grades 2 and 4 in years. The structured field
#     holds the grade 1 wave; the other waves are in its note.
#   * `measure_type: reliability` for the achievement tests (alpha, computed
#     in this sample) and for the motivation scale (an alpha range the article
#     quotes from Guay et al. 2010, grades 1 to 3, not computed in this
#     sample). The two are not equally good and the observations say which is
#     which.
#   * No single-group means. Table 1 prints means by sex and grade, but no
#     figure recorded here rests on them.
#
# Read from the accepted author manuscript (self-archived peer-reviewed
# version), which names the published DOI on its first page.

schema_version: 2

study:
  key: garon-carrier-2016
  citation: "Garon-Carrier, G., Boivin, M., Guay, F., Kovas, Y., Dionne, G., Lemelin, J.-P., Séguin, J. R., Vitaro, F., & Tremblay, R. E. (2016). Intrinsic motivation and achievement in mathematics in elementary school: A longitudinal investigation of their association. Child Development, 87(1), 165–175."
  doi: "10.1111/cdev.12458"
  design:
    family: longitudinal
    design_detail: >-
      Prospective birth-cohort study (QLSCD) with three school waves (grades
      1, 2 and 4). Cross-lagged structural equation model (Mplus 7.11, FIML)
      of latent intrinsic motivation and latent mathematics achievement, with
      achievement at each wave adjusted for non-verbal cognitive ability
      (WPPSI-R Block Design at age 6) and correlated uniquenesses for matching
      motivation items. Observational; no condition was assigned.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-author-manuscript
  verification: unverified

appears_in:
  - claim: achievement-predicts-later-math-intrinsic-motivation
    bearing: supports
    anchor: garoncarrier-2016
  - claim: math-intrinsic-motivation-does-not-predict-achievement
    bearing: supports
    anchor: garoncarrier-2016
  - claim: findings-challenge-sdt-motivation-drives-achievement
    bearing: supports
    anchor: garoncarrier-2016
  - claim: motivation-achievement-correlation-increases-with-grade
    bearing: supports
    anchor: garoncarrier-2016
  - claim: motivation-achievement-association-gender-invariant
    bearing: supports
    anchor: garoncarrier-2016

evidence_base:
  unit: participants
  size:
    value: 1478
    unit: participants
  additional_sizes:
    - value: 1528
      unit: participants
      note: "assessed in grade 1"
    - value: 1451
      unit: participants
      note: "assessed in grade 2"
    - value: 1334
      unit: participants
      note: "assessed in grade 4"
    - value: 2223
      unit: participants
      note: "children in the QLSCD birth cohort"
  population:
    description: >-
      Canadian (Quebec) children from a representative birth cohort born
      between October 1997 and July 1998, followed through elementary school.
      All started school the same year. Analysed n varied between 1323 and
      1478 across measures; average attrition 4.37% a year from age 7 to 10.
      Children with missing achievement scores tended to have lower
      achievement and lower socioeconomic background.
    age_or_stage: "Grades 1, 2 and 4 of elementary school (age 7-10)"
    age:
      unit: months
      mean: 85.82
      sd: 3.06
      note: "At the grade 1 wave. Grade 2: M = 8.10 years, SD = .26. Grade 4: M = 10.14 years, SD = .26."
  context:
    setting: "Quebec elementary schools; achievement tests administered individually at school or at home by a trained research assistant; motivation questionnaire completed in a face-to-face interview"
  arms: []

comparisons:
  - id: whole-cohort
    kind: none
    description: "Associations within the whole cohort across waves; no contrast between groups."

observations:

  - id: achievement-to-motivation-g1-g2
    comparison_ref: whole-cohort
    outcome:
      construct: "Intrinsic motivation in mathematics"
      source_language: "achievement predicted intrinsic motivation"
      measure: "Latent intrinsic motivation in grade 2 (3 Elementary School Motivation Scale items) regressed on latent grade 1 achievement (Number Knowledge Test), controlling for grade 1 motivation"
      scale: "standardized cross-lagged path coefficient"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "grade 1 to grade 2"
    result:
      measure_type: regression_coefficient
      estimate: 0.09
      model: >-
        Non-constrained latent cross-lagged model, standardized solution
        (Figure 2): chi2(133) = 371.76, CFI = .97, TLI = .96, RMSEA = .033.
        Constraining the cross-lagged paths to equality worsened fit,
        delta chi2(2) = 10.17.
    moderators:
      reported:
        - variable: "Sex"
          relationship: "A sex-invariant model (loadings, stability paths, cross paths and covariance equal) did not fit worse: delta chi2(26) = 36.26, p = .08"
          source_quote: "Thus, the associations between intrinsic motivation and mathematics achievement did not vary across sex."
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      The value is a label in Figure 2, marked significant there (only paths
      marked "ns" are not); the text says the path is significant but does not
      print it. Its grade interval is read from the figure's layout. No
      standard error or confidence interval is printed for any path.
    source_quote: "Cross-lagged models showed that achievement predicted intrinsic motivation from grades 1 to 2, and from grades 2 to 4."
    source_location: "Abstract; Results, Testing the direction of the associations; Figure 2"

