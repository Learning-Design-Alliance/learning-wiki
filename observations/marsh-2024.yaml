# Marsh, Guo, Pekrun, Lüdtke & Núñez-Regueiro (2024): lagged and contemporaneous
# reciprocal effects of maths self-concept (MSC) and maths achievement (MACH),
# PALMA, five annual waves, Years 5-9, Bavaria.
#
# Read from the HAL deposit (hal-04665537, CC BY 4.0) of the published
# Educational Psychology Review version, text layer only. Labelled "Reflection on
# the Field", but it reanalyses PALMA data and prints its own estimates, so it
# gets a record.
#
# Recorded: the lag1 cross-lagged paths of the traditional CLPM (CLPM-M1) and of
# the random-intercept CLPM (RI-CLPM-M1); the lag1 and lag0 paths of the model
# the authors chose as "best" (RI-CCLPM-M5); the Year 5 -> Year 6 latent
# correlation of MSC and the average lag1 MSC stability; and the MSC alphas.
#
# Two discrepancies inside the article, recorded as printed and not resolved:
#   * N: the abstract says 3527 students, the Method says N = 3370. `size` uses
#     the Method's figure; the abstract's is kept in additional_sizes.
#   * MSC lag1 stability: the text gives "r = 0.71 (0.68–0.78)", but Table 2's
#     four adjacent-wave MSC correlations are .66, .66, .75 and .78. Both are
#     recorded where they are printed; neither is corrected to the other.
#
# All paths are standardised estimates from latent SEMs (Mplus, MLR, FIML), with
# the lag1 and lag0 paths constrained equal over waves unless said otherwise.

schema_version: 2

study:
  key: marsh-2024
  citation: "Marsh, H. W., Guo, J., Pekrun, R., Lüdtke, O., & Núñez-Regueiro, F. (2024). Cracking chicken-egg conundrums: Juxtaposing contemporaneous and lagged reciprocal effects models of academic self-concept and achievement's directional ordering. Educational Psychology Review, 36(2), 53."
  doi: "10.1007/s10648-024-09887-w"
  design:
    family: longitudinal
    design_detail: >-
      Secondary analysis of a five-wave annual panel (PALMA, Years 5-9) with a
      taxonomy of latent structural equation models: cross-lagged panel
      models (CLPM), random-intercept CLPMs, pure contemporaneous (lag0)
      models and combined lag0 + lag1 models (RI-CCLPM), with and without
      lag2 paths and covariates (gender, Year 4 maths and German grades).
      Correlational; no assignment.
    preregistration:
      status: not-preregistered
      source_quote: "This study’s design and its analysis were not pre-registered."

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: rem-reciprocal-effects-ri-clpm-clpm-palma
    bearing: supports
    anchor: marsh-2024
  - claim: asc-achievement-temporal-asymmetry
    bearing: supports
    anchor: marsh-2024

evidence_base:
  unit: participants
  size:
    value: 3370
    unit: participants
  additional_sizes:
    - value: 3527
      unit: participants
      note: "the figure the abstract gives ('3527 secondary school students'); the Method section says N = 3370"
    - value: 5
      unit: other
      note: "annual measurement waves, Years 5 to 9, plus Year 4 primary-school grades as covariates"
  population:
    description: >-
      Secondary students in Bavaria, Germany (50% girls), sampled by the IEA
      Data Processing and Research Center to be representative on gender,
      urban/rural location and SES; Gymnasium 37%, Realschule 30%,
      Hauptschule 33%. 38% took part in all five waves; 9%, 19%, 15% and 19%
      in four, three, two or one.
    age_or_stage: "Years 5-9 of secondary school; mean age 11.7 (SD 0.7) at Year 5"
    age:
      unit: years
      mean: 11.7
      sd: 0.7
      note: "at Year 5, the first wave"
  context:
    setting: >-
      Questionnaires in classrooms by trained external test administrators in
      the first two weeks of July, near the end of each school year;
      achievement is the end-of-year maths grade from school records.
  arms: []

comparisons:
  - id: whole-sample
    kind: none
    description: "Paths, correlations and reliabilities in the whole PALMA panel; no contrast between groups."

