    outcome:
      construct: "Mathematics achievement (school grade), next year"
      source_language: "MSC→MACH"
      measure: "Latent maths achievement (single end-of-year grade) regressed on the previous year's latent maths self-concept, controlling for previous achievement"
      scale: "standardised lag1 cross-lagged path"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "one school year (adjacent annual waves)"
      offset:
        value: 1
        unit: years
        from: "previous wave"
    result:
      measure_type: regression_coefficient
      estimate: 0.128
      standard_error: 0.011
      model: "CLPM-M1: lag1 stability and reciprocal paths, no lag2 paths, no random intercepts, no covariates; paths invariant over waves. RMSEA .024, CFI .975, TLI .972."
      interpretation: "Described as 'highly significant'; the authors read > .12 as large (following Orth et al., 2022)."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    source_quote: "MSC→MACH = 0.128 (SE = 0.011) and MACH→MSC = 0.102 (SE = 0.011)."
