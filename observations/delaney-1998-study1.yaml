# Delaney, Reder, Staszewski & Ritter (1998), the feeling-of-knowing
# reanalysis: power functions fitted by strategy (retrieval or calculation) to
# trial-by-trial solution times from three earlier mental-arithmetic
# experiments (Reder & Ritter, 1992, Experiments 1 and 2; Schunn et al., 1997,
# Experiment 1).
#
# The article's second analysis, one expert mental calculator (G.G.,
# Staszewski's 1988 data), is a different sample and is delaney-1998-study2.
#
# The figures recorded are the authors' own: means over participants of
# their fitted power-law slopes (Table 4), their counts of strategy switches,
# and their tests of slope and intercept differences. Read from a text layer of
# the published article. Table 4's columns came out in order (four row labels,
# then four slopes, then four intercepts), so each slope quote is the label
# run followed by the slope column. Tables 1-3 came out with the values of
# different columns separated from their rows; they are not recorded.
#
# The article prints no participant count, age or other description of the
# people in the reanalysed experiments, and no reliability figure.

schema_version: 2

study:
  key: delaney-1998-study1
  citation: "Delaney, P. F., Reder, L. M., Staszewski, J. J., & Ritter, F. E. (1998). The strategy-specific nature of improvement: The power law applies by strategy within task. Psychological Science, 9(1), 1-7."
  doi: "10.1111/1467-9280.00001"
  design:
    family: other
    design_detail: >-
      Secondary reanalysis of three experiments in which participants solved
      relatively novel two-digit x two-digit problems (multiply, and either
      plus or an invented 'sharp' operator), each preceded by a snap
      (850 ms) feeling-of-knowing choice to retrieve or to calculate, which
      the authors use as the trial's strategy. Problems recurred a variable
      number of times. Incorrect trials were excluded from the analyses but
      counted as practice. Power functions were fitted to log solution time
      on log practice, per participant and operator, once on practice with
      the problem and once per strategy on practice with that strategy;
      only participants using each strategy on at least 30% of trials for an
      operator (an a priori criterion) were analysed individually. Strategy
      was chosen by the participant, not assigned.

