# Snell, Adam & Duncan (2007): sleep and BMI of US children, with nationally
# representative descriptive data on bedtimes and wake times (PSID Child
# Development Supplement time diaries, 1997 and 2002-2003).
#
# WHAT THIS FILE RECORDS:
#
#   * The descriptive half of the article, not its BMI regressions: weekday
#     bedtimes the text prints for children aged 8 and under, 11 and 14, and
#     the weekday wake-time band it prints for ages 6 to 15. These come from
#     the pooled Time 1 + Time 2 diaries (ages 3-18). They are printed without
#     an SD or a per-age n, so `sd` is absent and `sample` is left out.
#   * Table 1's whole-sample Time 1 bedtime and wake-up time, each with its SD
#     (n = 1,885). These are a 5:2 weekday/weekend weighted average for the
#     Time 1 diaries (children aged 3-12), not weekday values.
#   * `population.age` from Table 1 (age at Time 1, M = 8.12, SD = 2.91) and
#     the abstract's "aged 3-12 years at baseline".
#   * No reliability: the article cites time-diary accuracy from other work but
#     prints no coefficient of its own for any measure.
#
# CLOCK TIMES are recorded as minutes after midnight so that a mean and its SD
# share one unit (9:25 p.m. = 1285; 7:30 a.m. = 450). This is a change of
# notation for the clock reading, not a conversion of metric; each observation
# keeps the printed clock time in `interpretation`.
#
# Read from the JSTOR repository copy. Pages 313 and 315 are two-column pages
# whose text layer interleaves the columns, so the quotes for the age-specific
# bedtimes, the wake-time band and the descriptive-analysis sample were taken
# from the page images (PDF pp. 6 and 8, journal pp. 313 and 315), in the
# article's own words. Table 1 quotes are the table rows as extracted.
# The waketime figure (Fig. 2) values for other ages are read-offs from a
# graph, not printed numbers, and are not recorded.

schema_version: 2

study:
  key: snell-2007
  citation: "Snell, E. K., Adam, E. K., & Duncan, G. J. (2007). Sleep and the body mass index and overweight status of children and adolescents. Child Development, 78(1), 309–323."
  doi: "10.1111/j.1467-8624.2007.00999.x"
  design:
    family: longitudinal
    design_detail: >-
      Two-wave panel (Panel Study of Income Dynamics Child Development
      Supplement, 1997 and 2002-2003). Sleep measured from one weekday and one
      weekend 24-hour time diary per child per wave, filled out by parents of
      younger children and by older children with help; weighted with
      PSID-supplied probability weights. Descriptive analysis pools Time 1
      (ages 3-12) and Time 2 (ages 8-19, 19-year-olds dropped) diaries and
      examines weekday and weekend sleep separately; OLS regressions relate
      Time 1 sleep to Time 2 BMI.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

evidence_base:
  unit: participants
  size:
    value: 2281
    unit: participants
  additional_sizes:
    - value: 1441
      unit: participants
      note: "sample for the sleep and weight analysis, smaller because of missing height and weight data"
    - value: 1885
      unit: participants
      note: "children with Time 1 time-diary sleep measures (Table 1)"
  population:
    description: >-
      Nationally representative US sample of children from the PSID Child
      Development Supplement; children younger than 3 at the first wave
      excluded. Time 1 sample 50% male; 16.1% non-Hispanic Black, 62.9%
      non-Hispanic White, 13.3% Hispanic, 7.6% other (Table 1).
    age_or_stage: >-
      Aged 3-12 at baseline (Time 1, 1997); 8-19 at Time 2. The descriptive
      sleep analysis pools both waves, ages 3-18.
    age:
      unit: years
      min: 3
      max: 12
      mean: 8.12
      sd: 2.91
      note: "age at Time 1 (Table 1, n = 2,281); age at Time 2 M = 13.65, SD = 2.93"
  context:
    setting: "Home; parent- or child-completed 24-hour time diaries for a randomly selected weekday and weekend day, reviewed with an interviewer"
    geography: "United States"
  arms:
    - id: weekday-age-8-and-under
      description: "Children aged 8 and under in the pooled descriptive sample (which begins at age 3), weekday diaries."
    - id: weekday-age-11
      description: "11-year-olds in the pooled descriptive sample, weekday diaries."
    - id: weekday-age-14
      description: "14-year-olds in the pooled descriptive sample, weekday diaries."
    - id: weekday-ages-6-to-15
      description: "Children aged 6 to 15 in the pooled descriptive sample, weekday diaries."
    - id: time1-diary-sample
      description: "All children with Time 1 (1997) time-diary sleep data, aged 3-12; weekday and weekend weighted 5:2."

comparisons: []

