      note: "examination items administered; 28 removed before analysis"
    - value: 6
      unit: other
      note: "examinations: two 35-item midterms and one 80-item final in each of two semesters"
    - value: 8
      unit: participants
      note: "faculty members who wrote and annotated the items and consented (of nine who taught the course)"
  population:
    description: >-
      Multiple-choice items written by eight physiology faculty members for a
      two-semester upper-level undergraduate human physiology course at the
      Faculty of Medicine, Memorial University of Newfoundland, taken by
      students majoring in Biochemistry, Nutrition, Dietetics or Neuroscience.
      The article does not print the number of students.
    age_or_stage: "Students in the third or fourth year of their undergraduate programmes"
    age: unreported
  context:
    setting: "Upper-level undergraduate human physiology course, lectures and laboratory classes; multiple-choice examinations worth 80% of the grade, graded on a fixed university-wide percentage scale"
  arms: []

comparisons:
