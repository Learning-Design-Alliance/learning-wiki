      unit: items
    comparison_ref: whole-item-set
    outcome:
      construct: "Item difficulty"
      source_language: "actual item difficulty"
      measure: "Item P value (proportion of students answering correctly), correlated with the item writer's own cognitive-level label (1 knowledge, 2 comprehension, 3 application)"
      scale: "Spearman's rho"
      direction: contextual
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "examinations across one two-semester course"
    result:
      measure_type: correlation
      estimate: -0.09
      p_value: "0.14"
      statistic: "Spearman's rho"
      interpretation: "Not significant at the article's 5% level"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: partial
      effect_size: observed
    observability_notes: >-
      The abstract states this as the correlation with "actual student scores";
      the Methods say actual difficulty is the item P value. All 272 items were
      multiple choice. No confidence interval is printed.
    source_quote: "In terms of whether the cognitive level of an item was a determinant of the outcome on a test, no significant relationships were observed between faculty members’ classifications of cognitive level and 1) actual item difficulty (ρ = −0.09, P = 0.14) or 2) item discrimination (ρ = 0.05, P = 0.42)."
    source_location: "Results, Faculty classifications of item cognitive level (p. 397); also the abstract"

