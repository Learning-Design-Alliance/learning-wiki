    outcome:
      construct: "Accuracy of faculty difficulty predictions"
      source_language: "successfully predicted"
      measure: "Items whose intended difficulty matched their grade-based P-value band (easy 0.80-1.00, moderate 0.55-0.79, hard 0-0.54)"
      scale: "percent of items correctly predicted"
