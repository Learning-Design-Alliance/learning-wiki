      effect_size: observed
    source_quote: "In terms of whether the cognitive level of an item was a determinant of the outcome on a test, no significant relationships were observed between faculty members’ classifications of cognitive level and 1) actual item difficulty (ρ = −0.09, P = 0.14) or 2) item discrimination (ρ = 0.05, P = 0.42)."
    source_location: "Results, Faculty classifications of item cognitive level (p. 397)"

