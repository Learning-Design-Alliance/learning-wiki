    sample:
      value: 272
      unit: items
    comparison_ref: whole-item-set
    outcome:
      construct: "Item difficulty"
      source_language: "actual student scores"
      measure: "Item P value, correlated with the item writer's intended difficulty (1 easy, 2 moderate, 3 hard)"
