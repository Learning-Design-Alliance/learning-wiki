      effect_size: observed
    source_quote: "ers’ classifications of cognitive level and 1) actual item difficulty (ρ = −0.04, P = 0.50) or 2) item discrimination (ρ = 0.06, P = 0.34)."
    source_location: "Results, Faculty classifications of item cognitive level (p. 398)"

