    bearing: supports
    anchor: kibble-jd-2011
  - claim: faculty-item-difficulty-prediction-weak
    bearing: supports
    anchor: kibble-jd-2011
  - claim: individual-variation-difficulty-prediction
    bearing: supports
    anchor: kibble-jd-2011
  - claim: low-agreement-cognitive-level-classification
    bearing: supports
    anchor: kibble-jd-2011
  - claim: exam-quality-high-despite-weak-prediction
    bearing: supports
