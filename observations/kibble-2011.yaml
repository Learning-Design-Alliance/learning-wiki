      descriptives: "Easy 57 of 117 (49%), moderate 63 of 116 (54%), hard 10 of 39 (26%)"
      note: "Faculty members differed in their rates of successful prediction (chi-square = 16.84, P = 0.02), from 27% to 75%."
    moderators:
      reported:
        - variable: "Faculty member"
          relationship: "Individual success rates ranged from 27% to 75%"
