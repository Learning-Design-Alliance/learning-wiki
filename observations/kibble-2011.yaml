    source_quote: "Compared with the grade-based performance categories, faculty members as a group successfully predicted 130 of 272 items (48%): 57 of 117 easy items (49%), 63 of 116 moderate items (54%), and 10 of 39 hard items (26%)."
    source_location: "Results, Faculty predictions of item difficulty level (p. 397); Table 2"

