# Kibble & Johnson (2011): can faculty predictions or Bloom levels estimate
# multiple-choice item difficulty?
#
# One course, one sample of items. The unit analysed is the ITEM: 300 items were
# administered across six examinations and 272 were analysed (28 removed: the
# non-consenting faculty member's items, 13 not single-best-answer, 4 flawed).
# The abstract's "300 items" is the administered count; every correlation below
# rests on the 272.
#
# "Item difficulty" in this article is the item P value (proportion of students
# answering correctly), so a NEGATIVE rho means items rated higher (harder, or
# at a higher cognitive level) were answered correctly less often.
#
# Uses all three 2026-11-25 additions where the article allows:
#   * reliability: Cronbach's alpha per examination (a range, 0.70-0.92, over six
#     examinations), and the agreement between item writers' cognitive-level
#     labels and the two-person consensus labels (57% of items, kappa 0.33).
#   * age: `unreported`. The article says the students were in the third or
#     fourth year of their undergraduate programmes and prints no age figure.
#   * mean: not used. The single-group means the article prints (examination
#     means, mean item discrimination) are not used here; they are listed in
#     not_yet_extracted.
#
# The kappa quote was taken from the PDF page image (p. 397): the text layer
# renders the kappa symbol as an unreadable glyph. Every other quote is from the
# text layer.

schema_version: 2

study:
  key: kibble-2011
  citation: "Kibble, J. D., & Johnson, T. (2011). Are faculty predictions or item taxonomies useful for estimating the outcome of multiple-choice examinations? Advances in Physiology Education, 35(4), 396–401."
  doi: "10.1152/advan.00062.2011"
  design:
    family: observational
    design_detail: >-
      Correlational item analysis in one two-semester upper-level undergraduate
      human physiology course. Eight consenting faculty members annotated their
      own multiple-choice items before the examinations with an intended
      difficulty (easy, moderate, hard) and a truncated Bloom's level
      (knowledge, comprehension, application); one author and the Course
      Director independently assigned a Bloom's level to every item and agreed
      a consensus score. Annotations were correlated (Spearman's rho) with item
      P values and point-biserial discrimination, and predictions were
      cross-tabulated against grade-based P-value bands.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

