    unit: participants
  population:
    description: Undergraduates given course credit for participating. 44 women, 17 men, 3 unstated.
    age_or_stage: Undergraduates
    age:
      unit: years
      mean: 22
  context:
    setting: Group setting
    materials: A two-page essay on vision and cerebral achromatopsia from Sacks (1995) with 10 testable
      sentences; two counterbalanced 5-question pretests; a 10-question final test. One keyword bolded
      in each testable sentence.
  arms:
  - id: test-and-study
    description: 'Test and study: 2-min pretest (21% answered correctly; 11% after two items were dropped),
      then 8 min studying the passage with keywords bolded.'
    size:
      value: 31
      unit: participants
    elements:
    - term: unsuccessful retrieval attempt (pretest) before studying the text
      anchors:
      - principles/retrieval-practice
    dose:
      amount: 10
      unit: min in total (2 min pretest, 8 min study)
  - id: extended-study
    description: 'Extended study: 10 min studying the same passage with keywords bolded.'
    size:
      value: 33
      unit: participants
    elements:
    - term: additional study time on the same text
    dose:
      amount: 10
      unit: min of study
