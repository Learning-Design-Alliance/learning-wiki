      source_language: "Correlations of Children's Competence Beliefs and Achievement Task Values at Each Grade"
      measure: "Math competence-belief scale with math interest scale, same occasion"
      scale: "Pearson correlation"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "Grade 1, spring"
    result:
      measure_type: correlation
      estimate: 0.23
      p_value: "< .001"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      The per-grade n is not printed. The article corrected correlations with
