# Wigfield, Eccles, Yoon, Harold, Arbreton, Freedman-Doan & Blumenfeld (1997):
# change in elementary children's competence beliefs and subjective task values
# in math, reading, instrumental music and sports, over 3 years.
#
# READ FROM PAGE IMAGES ONLY. The PDF is a scan of the journal pages with no
# text layer, so every source_quote below was transcribed from the page image
# (pp. 451-465) and cannot be checked by a substring search of extracted text.
# Table cells are quoted as the table prints them, with decimals omitted as its
# note says ("Decimals are omitted"); the estimates restore the decimal point
# and nothing else.
#
# WHAT THIS FILE RECORDS:
#
#   * Table 5's within-grade correlations between competence beliefs and
#     interest in math and reading at Grade 1 and Grade 6, the two ends of the
#     rise the authors report. Grades are strata of a cohort-sequential sample;
#     each correlation is a result about one grade (`arm_ref`), not a contrast.
#     The authors present them "averaged across cohort".
#   * Table 4's one-year stability of math competence beliefs (Year 1-2) in the
#     youngest and oldest cohorts.
#   * `measure_type: reliability`: the internal-consistency ranges the article
#     prints for its own competence-belief and interest scales.
#   * `population.age: unreported`: the sample is described by grade (first,
#     second and fourth graders in Year 1) and the article prints no age figure.

schema_version: 2

study:
  key: wigfield-1997
  citation: "Wigfield, A., Eccles, J. S., Yoon, K. S., Harold, R. D., Arbreton, A. J. A., Freedman-Doan, C., & Blumenfeld, P. C. (1997). Change in children's competence beliefs and subjective task values across the elementary school years: A 3-year study. Journal of Educational Psychology, 89(3), 451–469."
  doi: "10.1037/0022-0663.89.3.451"
  design:
    family: longitudinal
    design_detail: >-
      Cohort-sequential longitudinal design (Michigan Childhood and Beyond
      Study): three cohorts, first, second and fourth graders in Year 1,
      surveyed each spring for 3 years, covering Grades 1 to 6. Questionnaires
      on 7-point Likert scales; repeated-measures MANOVAs for mean-level change,
      within-construct correlations across years for stability, and
      within-grade correlations between competence beliefs and task values.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-repository-copy
  verification: unverified

evidence_base:
  unit: participants
  size:
    value: 615
    unit: participants
  additional_sizes:
    - value: 865
      unit: participants
      note: "first, second and fourth graders in the Year 1 base sample, 10 elementary schools in four school districts; the longitudinal sample is 71% of it"
    - value: 195
      unit: participants
      note: "Cohort 1 (first graders in Year 1)"
    - value: 210
      unit: participants
      note: "Cohort 2 (second graders in Year 1)"
    - value: 210
      unit: participants
      note: "Cohort 3 (fourth graders in Year 1)"
  population:
    description: >-
      Approximately 615 children (325 girls, 290 boys) in the suburbs of a large
      midwestern city; middle-class districts (average family income $50,000),
      over 95% European American. The article calls the size approximate: it
      varies slightly across measures with missing data.
    age_or_stage: "Grades 1 to 6 across the three cohorts and three years; no age figure printed"
    age: unreported
  context:
    setting: "Classroom questionnaires each spring, three 20-minute sessions; items read aloud in Years 1 and 2"
  arms:
    - id: grade-1
      description: "Children measured in Grade 1 (Cohort 1, Year 1)."
    - id: grade-6
      description: "Children measured in Grade 6 (Cohort 3, Year 3)."
    - id: youngest-cohort
      description: "Cohort 1, first graders in Year 1 (Grades 1-3 over the study)."
      size:
        value: 195
        unit: participants
    - id: oldest-cohort
      description: "Cohort 3, fourth graders in Year 1 (Grades 4-6 over the study)."
      size:
        value: 210
        unit: participants

comparisons:
  - id: whole-sample-scales
    kind: none
    description: "Internal consistency of the questionnaire scales across domains and times of measurement; no contrast."

observations:

