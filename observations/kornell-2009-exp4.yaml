# Kornell, Hays & Bjork (2009), Experiment 4: weak-associate word pairs,
# total trial time held equal (13 s) in both conditions, as in Experiment 2.
#
# Records the final cued-recall means with SDs and the printed d. Against
# Experiment 2 (fictional trivia, same timing: no difference) this is the
# contrast the learning-graph simulator reads as related vs arbitrary
# material; the source does not test that contrast statistically, so the
# material type is a candidate moderator, not a reported one.
#
# `population.age: unreported`: the article prints no age figure for any
# experiment. No scoring-reliability figure is printed (answers were typed
# and scored as correct or not; how is not described).
#
# Read from the maintainer's Drive copy of the published article. Its text
# layer writes "=", "<", ">" and the minus sign as symbol-font glyphs; the
# source_quotes use the characters the article prints, so they differ from
# the text file in those symbols only. The numbers are clean.

schema_version: 2

study:
  key: kornell-2009-exp4
  citation: "Kornell, N., Hays, M. J., & Bjork, R. A. (2009). Unsuccessful retrieval attempts enhance subsequent learning. Journal of Experimental Psychology: Learning, Memory, and Cognition, 35(4), 989–998. Experiment 4."
  doi: "10.1037/a0015729"
  design:
    family: other
    design_detail: >-
      Laboratory experiment. Within-participants: condition (read only, test),
      replicating Experiment 2's timing with Experiment 3's 60 weak-associate
      pairs. Read-only trial: cue and target together for 13 s. Test trial:
      cue alone for 8 s, then cue and target for 5 s. Correct guesses at study
      removed from analysis. 5-min delay, then a cued-recall test.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-repository-copy
  verification: unverified

appears_in:
  - claim: pretesting-enhances-learning
    bearing: supports
    anchor: kornell-hays-and-bjork-2009

evidence_base:
  unit: participants
  size:
    value: 15
    unit: participants
  population:
    description: "University of California, Los Angeles (UCLA) undergraduates."
    age_or_stage: "Undergraduates; no age figure is printed"
    age: unreported
  context:
    setting: "Laboratory, computer-presented study phase and cued-recall test."
    materials: "The 60 weak-associate pairs of Experiment 3 (Nelson, McEvoy and Schreiber, 1998, norms; forward association strength .050 to .054)."
  arms:
    - id: read-only
      description: "Read-only: cue and target shown together for 13 s."
      elements:
        - term: "study of the question and answer presented together"
      dose:
        amount: 13
        unit: "s per trial (target visible 13 s)"
    - id: test
      description: "Test: cue alone for 8 s while the participant tried to produce the target, then cue and target together for 5 s. Correct guesses (3.6% of trials) removed."
      elements:
        - term: "unsuccessful retrieval attempt followed by the answer (feedback)"
          anchors:
            - principles/retrieval-practice
      dose:
        amount: 13
        unit: "s per trial (8 s attempt, target visible 5 s)"

comparisons:
  - id: test-vs-read-only
    kind: other
    index_arm: test
    reference_arm: read-only
    description: "Within-participant contrast: each participant's final recall of items studied in the test condition against items in the read-only condition."

observations:

  - id: test-vs-read-only-final-recall
    sample: {value: 15, unit: participants}
    comparison_ref: test-vs-read-only
    outcome:
      construct: "Cued recall of weak-associate targets not retrieved at study"
      source_language: "cued-recall accuracy on the final test"
      measure: "Final cued-recall test: cue shown, participant types the target; items guessed correctly at study excluded"
      scale: "proportion correct"
      direction: higher-is-better
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "5 minutes after the study phase"
      offset: {value: 5, unit: minutes, from: "end of the study phase"}
    result:
      measure_type: cohens_d
      estimate: 0.38
      statistic: "t(14) = 3.20"
      p_value: "< .01"
      descriptives: "test M = 0.67 (SD 0.21) vs read-only M = 0.55 (SD 0.22)"
      note: "Also printed: prep = .96 (probability of replication). The source does not say which SD forms the denominator of d."
    moderators:
      reported: []
      candidate:
        - "Material type: the authors suspect the benefit of unsuccessful tests was larger with weak associates than with trivia questions because associates allow deep semantic processing of cue and target, while the fictional answers were mostly arbitrary names. A conjecture across experiments, not a tested moderator."
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      Within-participant t test; the source does not say how d was computed
      for the paired design.
    source_quote: "cued recall accuracy on the final test was significantly higher in the test condition (M = .67, SD = .21) than the read-only condition (M = .55, SD = .22), t(14) = 3.20, p < .01, prep = .96, d = 0.38."
    source_location: "Experiment 4, Results and Discussion (p. 994)"

