        gap 0.24 [0.12, 0.37]; QWK 0.704 -> 0.706. gpt-5-mini: high -0.00, low
        -0.54, gap 0.54 [0.38, 0.69]; QWK 0.730 -> 0.734. The estimate reported
        above is the first; all three are given because the spread between them
        is itself the finding. Each model in its own default configuration.
      interpretation: >-
        IT REPLICATES ACROSS PROVIDERS, BUT THIS CONTRAST ALONE CANNOT SAY WHAT
        IT IS. All three intervals exclude zero and the magnitude ranges 0.24 to
        0.54 with no ordering by capability or price. The tails hold different
        learners with true labels, so a label used as information and a label
        that shifts the mark look the same here; the swapped-label re-test
        (`attainment-label-moves-identical-work`) separates them and finds the
        label itself moves identical work in both tails on every model. The
        asymmetry read here (drift in the high tail +0.03 and -0.00 on the
        OpenAI models, against -0.21 and -0.54 in the low) is relative to each
        grader's own unlabeled mark: inside the high tail a false low label
        still costs 0.50-0.57 points on those models. It is not a one-sided
        effect, and whether the low-tail drift helps or harms depends on the
        grader's calibration (MIXED-ACROSS-MODELS). QWK moves +0.009, +0.002
        and +0.004; paired intervals leave room for gains of no more than
        +0.017 to +0.027.
    moderators:
      reported:
        - variable: model provider
          relationship: >-
            Direction identical on all three; magnitude ranges 0.24 to 0.54 with
            no obvious ordering by capability or price. Choosing a vendor does
            not remove the effect.
          source_quote: >-
            From the release: gaps of 0.48 [0.34, 0.63], 0.24 [0.12, 0.37] and
            0.54 [0.38, 0.69] across three models from two vendors.
      candidate:
        - variable: open-weights versus commercial instruction tuning
          relationship: >-
            All three models in this record are commercial instruction-tuned
            products and might share a post-training convention an open-weights
            model does not.
          note: >-
            CANDIDATE, answered by the re-tests rather than promoted: two
            open-weights families (Qwen3-235B, Llama 4 Maverick) show the
            label effect, Qwen the largest of six models.
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      The draw samples on the learner's held-out attainment, 150 cases per
      tail, so every case sits where the contrast is. Sample is 300 cases per
      model, graded by three models. The held-out mean is keyed on the
      learner, never on the question, which would measure item difficulty
      instead. No demographic data exists in the corpus, so whether the gap
      tracks a protected attribute cannot be tested here.
    source_quote: >-
      From the release: gaps of 0.48 [0.34, 0.63], 0.24 [0.12, 0.37] and 0.54
      [0.38, 0.69] on three models from two vendors.
    source_location: release 1.0.0, evidence attainment-bias-replicates-across-providers

  - id: attainment-label-moves-identical-work
    sample:
      value: 300
      unit: items
    comparison_ref: attainment-swap
    analysis_ref: jorgpt-attainment-retests
    outcome:
      construct: >-
        Whether the attainment label itself changes the mark on identical work,
        and whether the change moves grades toward or away from the teacher
      source_language: >-
        L, mark under the high label minus mark under the low label on the
        same answer; per-tail signed error with and without the true label
      measure: >-
        Mean within-answer difference between the two label arms, overall and
        within each tail, with learner-cluster bootstrap 95% intervals; the
        control's and the true-label arm's mean signed error against the
        teacher in each tail; the pre-registered toward/away rule
      scale: "-10 to 10"
      direction: contextual
      role: capability-evidence
      role_basis: stated
      anchors:
        - claims/showing-a-grader-a-learners-prior-performance-biases-the-grade
    time:
      label: At grading, no delay
    result:
      measure_type: mean_difference
      estimate: 0.37
      ci_lower: 0.30
      ci_upper: 0.44
      interval_type: confidence
      model: >-
        Four models, the original attainment draw (150 answers per tail; 19 and
        14 learners), learner-cluster 95% intervals. L: gemini-3.5-flash-lite
        +0.37 [+0.30, +0.44]; gpt-4.1-mini +0.38 [+0.30, +0.46]; gpt-5-mini
        +0.52 [+0.43, +0.61]; qwen3-235b-a22b-2507 (open weights) +0.75 [+0.69,
        +0.82]. Within the high / low tail: +0.42/+0.32, +0.50/+0.26,
        +0.57/+0.47, +0.79/+0.72. Control signed error high / low: +0.20/+0.49,
        -1.30/-0.46, -0.98/+0.08, -1.52/-0.41; with the true label +0.44/+0.27,
        -1.22/-0.72, -0.97/-0.44, -1.29/-0.75. Low-tail MAE change -0.03,
        +0.16, +0.10, +0.21. Verdicts (high, low): unresolved/TOWARD,
        TOWARD/AWAY, flat/unresolved, TOWARD/AWAY. Across models
        MIXED-ACROSS-MODELS. The estimate above is the first model; all four
        are given because the spread is part of the finding.
      interpretation: >-
        THE MARK DEPENDS ON THE LABEL, NOT ONLY ON THE WORK, AND WHETHER THAT
        MOVES IT TOWARD THE TEACHER DEPENDS ON THE GRADER. The same answer gains 0.37 to 0.75 points
        under a high label, inside each tail, on every model; a false low label
        costs strong work 0.42-0.79 points. Relative to the teacher the label
        pulls a generous grader's weak tail toward the teacher (Gemini) and
        pushes harsh graders' weak tails away (GPT-4.1-mini, Qwen). "Bias" in
        the statistical sense holds; a uniform penalty on weak learners does
        not. The open-weights model shows the largest effect, so it is not a
        commercial post-training convention.
    moderators:
      reported:
        - variable: the grader's own calibration in each tail
          relationship: >-
            Where the unlabeled grader is generous the low label moves it toward
            the teacher; where it is already harsh, away. The label carries no
            information about which.
          source_quote: >-
            Low-tail control signed error +0.49 on Gemini (TOWARD) against
            -0.46 and -0.41 on GPT-4.1-mini and Qwen (AWAY).
      candidate:
        - variable: a label-blind calibration
          relationship: >-
            Removing each arm's own calibration constant, three of four models
            read as a usable prior: the graders compress the scale and the
            label's difference pushes each tail the way the compression is
            wrong.
          note: >-
            CANDIDATE, reported but not pre-registered. Whether one shift and
            one stretch fitted to everybody removes the same compression without
            the label was not tested.
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      Pre-registered; the toward/away instrument failed its first
      detection floor and was revised before any dump was read. The
      floor showed the high tail's direction is not resolvable on this draw for
      a grader only about 0.1 generous there, so the rule declines there. The
      OpenAI re-tests used non-strict schema decoding where the originals were
      strict. Intervals resample learners within tail and exclude run-to-run
      model noise, measured separately at about +/-0.07 on L.
    source_quote: >-
      From studies/measurement/grader-attainment-prior: L +0.37 / +0.38 / +0.52
      / +0.75 on four models, in both tails; MIXED-ACROSS-MODELS.
    source_location: studies/measurement/grader-attainment-prior/out/results.json

  - id: label-effect-persists-at-the-frontier
    sample:
      value: 300
      unit: items
    comparison_ref: attainment-swap
    analysis_ref: jorgpt-model-breadth
    outcome:
      construct: >-
        Whether the label effect on identical work holds on a frontier model
        and a second open-weights family, and whether it differs by learner
      source_language: L on identical work; per-learner L_j heterogeneity
      measure: >-
        As `attainment-label-moves-identical-work`, on two further models; per
        learner, L_j against a family-matched deranged null and a within-learner
        label sign-flip null
      scale: "-10 to 10"
      direction: contextual
      role: capability-evidence
      role_basis: stated
      anchors:
        - claims/showing-a-grader-a-learners-prior-performance-biases-the-grade
    time:
      label: At grading, no delay
    result:
      measure_type: mean_difference
      estimate: 0.28
      ci_lower: 0.23
      ci_upper: 0.32
      interval_type: confidence
      model: >-
        claude-opus-5.5 (Bedrock pin): L +0.28 [+0.23, +0.32]; high / low tail
        +0.30/+0.25; control signed error -1.79/-0.83; with the true label
        -1.63/-0.94; low-tail MAE +0.07 [+0.03, +0.11]; MIXED (TOWARD, AWAY);
        control QWK 0.682. llama-4-maverick (Parasail pin): L +0.54 [+0.42,
        +0.65]; control -1.19/-0.40, true label -0.66/-0.42; PRIOR (TOWARD,
        flat). Frontier verdict PERSISTS-AT-FRONTIER. QWK change from the true
        label +0.029 [+0.013, +0.043] (Opus) and +0.046 [+0.010, +0.085]
        (Llama); no resolved change in Pearson r on any of nine runs checked
        (-0.015 to +0.014; intervals up to +0.049; a check added after the
        runs). Per learner: heterogeneous on 3 of 10 runs (between-learner SD
        0.15-0.26), none after Holm; minimum detectable SD about 0.5; no learner
        on any run resolvably below zero under the sign-flip null.
      interpretation: >-
        THE FRONTIER MODEL SHOWS THE SMALLEST EFFECT, NOT NONE. Six models from
        five developers now show the label effect. On harsh, compressed graders
        the true label buys a small QWK gain, with no resolved change in the
        correlation with the teacher: consistent with a gain in where marks
        land rather than in what the grader perceives, though the r intervals
        allow a ranking gain of the same size. The pooled
        effect does not hide learners moved the other way.
    moderators:
      reported:
        - variable: model
          relationship: >-
            L ranges from +0.28 (Opus 5.5) to +0.75 (Qwen3-235B) at default
            settings, with no ordering by price.
          source_quote: >-
            Opus +0.28 [+0.23, +0.32]; Llama 4 Maverick +0.54 [+0.42, +0.65].
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      Pre-registered. Gemini 3.1 Pro and GPT-5.5 were not run
      as graders through the API (Gemini 3.1 Pro graded ten answers in a
      pricing probe), a scope decision on cost per grade recorded with the
      arithmetic in the study; Claude Fable 5.1's API route was blocked by the
      account's zero-data-retention setting. Fable 5.1 was later graded
      on 100 of these answers as Claude Code subagents (release analysis
      fable-agent-label: L +0.31 [+0.19, +0.45], PERSISTS); that route
      differs from the API condition and is not pooled into this record. Opus ran in JSON mode with the schema in a
      system message, because its zero-retention route refuses strict schemas.
    source_quote: >-
      From studies/measurement/grader-model-breadth: PERSISTS-AT-FRONTIER;
      Opus 5.5 L +0.28, the smallest of six models.
    source_location: studies/measurement/grader-model-breadth/out/models.json

  - id: reasoning-off-doubles-the-label-effect
    sample:
      value: 222
      unit: items
    comparison_ref: reasoning-off
    analysis_ref: jorgpt-model-breadth
    outcome:
      construct: >-
        Whether the model's reasoning setting changes how far the label moves
        the mark on identical work
      source_language: change in L between reasoning settings of one model
      measure: >-
        Paired difference in L between two runs of the same model, draw,
        prompt and arms, learner-cluster bootstrap 95% interval; reasoning
        tokens billed per call confirm the setting took effect
      scale: "-10 to 10"
      direction: contextual
      role: capability-evidence
      role_basis: stated
      anchors:
        - claims/showing-a-grader-a-learners-prior-performance-biases-the-grade
    time:
      label: At grading, no delay
    result:
      measure_type: mean_difference
      estimate: -0.51
      ci_lower: -0.65
      ci_upper: -0.37
      interval_type: confidence
      model: >-
        gpt-5-mini, effort minimal (0 reasoning tokens) to the API default
        (about 813): L +1.04 to +0.53, change -0.51 [-0.65, -0.37]; minimal to
        high (4,424 tokens): +1.05 to +0.54, -0.51 [-0.62, -0.39]; default to
        high -0.01 [-0.10, +0.10]. gemini-3.5-flash-lite, thinking minimal to
        high (1,591 tokens): +0.36 to +0.41, +0.05 [-0.06, +0.14]. Across-run
        null (Gemini default, first run to re-run): -0.01 [-0.07, +0.05]. At
        minimal effort gpt-5-mini failed schema validation on 92 of 900 calls;
        222 answers complete in both arms of the contrast.
      interpretation: >-
        TURNING ONE MODEL'S REASONING OFF DOUBLES THE EFFECT; TURNING IT ON IS
        NOT A REMEDY. With reasoning off GPT-5-mini shows the largest label
        effect of any configuration (+1.04, a false low label costing strong
        work 1.16 points). Any reasoning restores the smaller effect, and more
        than the default buys no resolvable further change (-0.01 [-0.10,
        +0.10]). On Gemini, thinking changes calibration and does not
        resolvably change the label effect (+0.05 [-0.06, +0.14]). With reasoning on, both models still move identical work
        by 0.4-0.5 points.
    moderators:
      reported:
        - variable: model
          relationship: >-
            Reasoning halves the effect on GPT-5-mini and does not resolvably
            change it on Gemini 3.5 Flash Lite.
          source_quote: >-
            GPT-5-mini minimal to default -0.51 [-0.65, -0.37]; Gemini minimal
            to high +0.05 [-0.06, +0.14].
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      The equivalence verdict (NO-REASONING-EFFECT) was unreachable by the
      floor, so unsigned results are read as intervals, as pre-registered. The
      default-effort token count comes from a 10-call probe; the original
      GPT-5-mini dump predates the usage record.
    source_quote: >-
      From studies/measurement/grader-model-breadth: REASONING-LOWERS on
      GPT-5-mini, dL -0.51.
    source_location: studies/measurement/grader-model-breadth/out/reasoning.json

  - id: exemplar-marks-pairing-and-level
    sample:
      value: 600
      unit: items
    comparison_ref: exemplar-marks-pairing
    analysis_ref: exemplar-marks
    outcome:
      construct: >-
        Whether graded exemplars act through the correct pairing of answer and
        mark, through the sight of a marked scale, or through the level the
        marks are set at
      source_language: >-
        bias under correct, shuffled and shifted exemplar marks on identical
        work
      measure: >-
        Paired differences in mean signed error between exemplar arms on the
        same answers, question-clustered and learner-clustered 95% intervals
      scale: "-10 to 10"
      direction: contextual
      role: capability-evidence
      role_basis: stated
      anchors:
        - claims/graded-exemplars-shift-an-llm-grader-by-the-level-they-are-marked-at
    time:
      label: At grading, no delay
    result:
      measure_type: mean_difference
      estimate: 0.22
      ci_lower: 0.12
      ci_upper: 0.31
      interval_type: confidence
      model: >-
        gemini-3.5-flash-lite, 600 answers, 50 questions, 79 learners; bias
        [question-clustered 95%]: control +0.19 [-0.01, +0.41]; ungraded +0.61;
        correct marks -0.15; shuffled +0.06; shifted up 2 +0.33; shifted down 2
        -0.80. Contrasts: correct minus control -0.34 [-0.48, -0.21]
        (GRADED-CALIBRATES); ungraded minus control +0.42 [+0.29, +0.55];
        shuffled minus correct +0.22 [+0.12, +0.31] (CORRECT MARKS MATTER;
        share of the shift shuffled marks keep 0.37 [0.02, 0.60]); shifted up
        minus shifted down +1.13 [+1.02, +1.23] (ANCHORS TO SHOWN LEVEL; 0.39
        [0.35, 0.42] points per point of shown level). Shifting down costs 0.24
        MAE and 0.043 QWK. gpt-4.1-mini, 146 answers: control bias -0.77;
        correct minus control -0.06 [-0.17, +0.03] (NOT-REPLICATED); shifted up
        minus down +0.47 (0.16 per point); QWK +0.033 [+0.005, +0.068] from the
        correct marks.
      interpretation: >-
        THE MARKS DO THE WORK, THROUGH THEIR PAIRING AND THEIR LEVEL, AND THE
        RESULT IS A SHIFT, NOT A CALIBRATION. Shuffled marks keep about a third
        of the shift, so the scale alone is not enough. The grader adopts the
        level the examples are marked at, right or wrong. The examples moved
        Gemini down by about a third of a point whatever its starting
        generosity: near zero on the original 150, an overshoot to -0.15 on the
        wider draw, and no resolvable movement in bias on a harsh second
        model, whose QWK the correct marks raised by 0.033 [+0.005, +0.068].
    moderators:
      reported:
        - variable: model
          relationship: >-
            Correct marks shift Gemini's bias by -0.34 and do not resolvably
            move GPT-4.1-mini's; level anchoring replicates in sign on both.
          source_quote: >-
            Gemini dCorr -0.34 [-0.48, -0.21]; GPT-4.1-mini -0.06 [-0.17,
            +0.03]; anchoring 0.39 and 0.16 per point.
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      Pre-registered. The original 150 answers reproduce the earlier
      exemplar table within 0.06 on every cell. The GPT-4.1-mini run is a
      directional check under the cost stop rule (pairing underpowered). The
      original graded-against-ungraded contrast also changes a closing
      instruction; the new arms hold it fixed.
    source_quote: >-
      From studies/measurement/grader-exemplar-marks: CORRECT MARKS MATTER and
      ANCHORS TO SHOWN LEVEL on Gemini; NOT-REPLICATED on GPT-4.1-mini.
    source_location: studies/measurement/grader-exemplar-marks/out/results.json
