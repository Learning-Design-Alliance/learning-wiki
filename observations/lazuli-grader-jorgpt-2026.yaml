    comparison_ref: perturbation
    analysis_ref: jorgpt-stability
    outcome:
      construct: >-
        Proportion of resubmissions a normalised content signature can serve
        from a stored grade
      source_language: cache hit rate by perturbation variant
      measure: >-
        Signature is words in order, case and punctuation stripped — blind to
