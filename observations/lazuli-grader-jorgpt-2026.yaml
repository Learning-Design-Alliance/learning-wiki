    result:
      measure_type: mean_difference
      estimate: 0.48
      ci_lower: 0.34
      ci_upper: 0.63
      interval_type: confidence
      model: >-
        Three models, two vendors, n=150 per tail per model, same deterministic
        draw. gemini-3.5-flash-lite: high +0.21, low -0.27, gap 0.48
