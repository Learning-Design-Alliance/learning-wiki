      estimate: 0.804
      model: >-
        Control (flat, 1 skill — what ships today) 0.838, MAE 1.27, bias +0.56.
        Plus hierarchy (parent + 4 siblings) 0.810, bias +0.69. Plus learner
        attainment 0.826, bias +0.49. Fifteen skills with one relevant 0.804,
        bias +0.67. n=150.
      interpretation: >-
        MORE GRAPH DID NOT HELP, AND IRRELEVANT GRAPH LOWERED AGREEMENT IN A
        SINGLE RUN. Every arm is at or below control, the dilution arm by 0.034
        — at the edge of the harness's resolution — and every arm adding unrelated skills also makes
        the grader more generous. The minimal flat list production already
        sends is the best of the four. BUT THIS RESULT DOES NOT GENERALISE: the
        companion Mohler record reverses it on a corpus with real curricular
        structure, and each sits at the edge of resolution.
    moderators:
      reported: []
      candidate:
        - variable: how much signal the item itself carries
          relationship: >-
            JorGPT answers are long and on a 0-10 scale, so the grader already
            has ample signal and further skills are distraction. The proposed
            reconciliation with the opposite Mohler result.
