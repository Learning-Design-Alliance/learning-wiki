      label: On resubmission
    result:
      measure_type: probability
      estimate: 1.0
      model: >-
        100% hit for every layout-only variant (whitespace, single paragraph,
        line per sentence, bullets, lowercased starts, final punctuation); 2%
        for the typo variant.
      interpretation: >-
        The fix that follows from the two records above, and the 2% is the
        point rather than a shortfall: a typo variant changes a word, so it
        re-grades, correctly. Direction is `contextual` because a hit rate near
