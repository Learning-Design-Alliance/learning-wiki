# ============================================================================
# The SOURCE is this programme's own research release, cited by its DOI, not
# somebody else's paper; each observation names the release analysis that
# produced it. The chain
#
#     claim <- evidence <- analysis <- dataset <- release <- protocol
#
# is traversable from either end.
#
# READ `provenance.source_type` BEFORE POOLING ANYTHING. This is
# `platform-experiment`: the grader's makers' own experiment on that grader, scored against
# another team's human-graded corpus. It is not a finding from the corpus's
# depositors and must not be pooled with one.
#
# Every `appears_in` edge is anchored to the claim's `### Porcaro 2026`
# evidence entry, which cites the release by its DOI.
# ============================================================================

schema_version: 2

study:
  key: lazuli-grader-jorgpt-2026
  citation: 'David S. Porcaro. (2026). Reliability, calibration and attack surface of an LLM short-answer grader, measured against three human-graded corpora. Research release ai-grader-reliability-2026 1.0.0, Learning Design Alliance. https://doi.org/10.5281/zenodo.23480844'
  design:
    family: other
    design_detail: >-
      Repeated-measures ablation over archival human-graded answers. Cases are
      drawn by stratified sampling across the 0-10 grade range; every grader
      configuration under test then scores every sampled case, so each case is
      its own control and all contrasts are within-item. The teacher grade
      shipped with the corpus is the reference. No people are assigned to
      anything — the units are answers, already written and already graded —
      which is why the design family is `other` rather than a trial.

provenance:
  source_type: platform-experiment
  extracted_by: claude/unspecified
  extracted_at: 2026-09-15
  extraction_method: computed-from-own-runs
  verification: unverified

appears_in:
  - claim: llm-short-answer-graders-can-reach-human-rater-agreement
    bearing: supports
    anchor: porcaro-2026
    note: >-
      Agreement of 0.853 here is only readable against the ceiling measured on
      the companion Mohler record; on its own this observation establishes a
      level, not that the level is good.
  - claim: pooling-repeated-llm-grades-does-not-improve-agreement
    bearing: supports
    anchor: porcaro-2026
    note: >-
      Four separate estimators — three single passes, median, mean and a
      cross-model pool — land within 0.005 of each other, and the cross-model
      pool is worse than its best member alone.
  - claim: surface-formatting-changes-shift-llm-grades-without-penalising-them
    bearing: supports
    anchor: porcaro-2026
    note: >-
      Both halves are measured, in single runs on one model: on matched
      answers about two grades in five move a level on a layout-only edit
      (17-37% across variants), against one in four for re-grading identical
      text, with no consistent direction across variants (n = 30 each, no
      intervals).
  - claim: graded-exemplars-shift-an-llm-grader-by-the-level-they-are-marked-at
    bearing: supports
    anchor: porcaro-2026
    note: >-
      Supports the claim as titled (renamed 2026-10-06, maintainer; it read
      "calibrate ... without improving agreement", which this record
      qualified). On the original draw graded exemplars took Gemini's bias
      from +0.38 to +0.06 with kappa unchanged, and the shuffled- and
      shifted-mark re-test shows they apply a roughly fixed shift set by the
      level the examples are marked at (0.39 points per point of shown
      level on Gemini): it overshot to -0.15 on a wider draw, and on a harsh
      second model it did not resolvably move bias but raised QWK by 0.033
      [+0.005, +0.068]. The ungraded arm
      differs in two ways (marks and a closing instruction).
  - claim: showing-a-grader-a-learners-prior-performance-biases-the-grade
    bearing: supports
    anchor: porcaro-2026
    note: >-
      Supports the core claim: a marked previous attempt and an attainment
      label both move the grade on identical work, and the swapped-label
      re-test shows the label itself does it on six models from five
      developers. Qualifies two subclaims: the direction relative to the
      teacher differs by model, in the direction of each model's own error (a
      pattern, not a tested mechanism), so "a one-sided penalty
      on the weak" does not hold as written; and three model configurations that mark strong work below the teacher gained
      0.03-0.05 QWK from the true label with no resolved change in Pearson r
      (intervals up to +0.049, so a ranking gain of that size is not
      excluded).
  - claim: delimiting-untrusted-learner-text-defeats-authority-claim-injection
    bearing: supports
    anchor: porcaro-2026
    note: >-
      A within-item three-arm comparison on identical graded content, so the
      movement is attributable to the payload and the prompt arm alone.
  - claim: course-context-helps-sparse-items-and-dilutes-rich-ones
    bearing: qualifies
    anchor: porcaro-2026
    note: >-
      THE DILUTION HALF ONLY, and it contradicts the companion Mohler record.
      Each effect sits at the edge of the harness's resolution in a single run, and they point opposite ways, so
      this edge qualifies the claim rather than supporting it: it is the
      boundary condition, not the demonstration.

evidence_base:
  unit: items
  size:
    value: 150
    unit: items
  additional_sizes:
    - value: 3041
      unit: items
      note: >-
        The full corpus from which every sample is drawn. Absolute agreement on
        all 3,041 rows is 0.799 against 0.833 stratified — the +0.03 stratum
        inflation that every figure here must be read against.
    - value: 79
      unit: participants
      note: >-
        Students whose answers make up the corpus. Not the sample unit: the
        contrasts are within-item, and no result here is a statement about
        these 79 people.
    - value: 50
      unit: comparisons
      note: Distinct open-ended questions in the corpus.
  population:
    description: >-
      79 university computer-science students answering 50 open-ended questions
      in a taught course, collected and graded by the course's own teacher and
      deposited openly. A PROXY population: not Lazuli learners, not Lazuli's
      questions, not its rubrics. Every figure in this record describes grader
      mechanics on this corpus and none of them is production calibration.
    age_or_stage: University students, stage not recorded in the deposit
    prior_knowledge: >-
      Enrolled in the course the questions come from; not otherwise
      characterised. The grade distribution is broad enough to stratify across,
      which is all the analysis relies on.
  context:
    setting: >-
      Archival. Answers were written and graded before any of this work
      existed; nothing was collected for it.
    delivery_mode: >-
      Offline re-scoring. The production grading prompt and schema are called
      directly; the database, anonymisation and xAPI layers around them are
      skipped.
    duration: >-
      Runs executed 2026-09-14 to 2026-09-15. Two Gemini tiers throughout; the
      attainment arm also ran on two OpenAI models. Pre-registered re-tests
      2026-10-05 added a swapped-label arm, Qwen3-235B, Llama 4 Maverick and
      Claude Opus 5.5, a reasoning contrast, paired intervals on the history
      arms, and shuffled- and shifted-mark exemplar arms on 600 answers.
  arms:
    - id: lite-flat
      description: >-
        THE SHIPPED CONFIGURATION. Model.LITE (gemini-3.5-flash-lite), thinking
        off, the flat single-skill list production already passes, no
        exemplars, no history, no attainment. The control for every contrast.
        Each ablation run carries its own control pass over its own cases, so
        control figures differ slightly between runs.
      size:
        value: 150
        unit: items
    - id: standard-thinking
      description: Model.STANDARD (gemini-3.7-flash), thinking on, otherwise identical.
      size:
        value: 150
        unit: items
    - id: median-of-three-lite
      description: Median of three independent LITE passes over the same cases.
      size:
        value: 150
        unit: items
    - id: cross-model-pool
      description: Median of three LITE passes plus one STANDARD pass.
      size:
        value: 150
        unit: items
    - id: regraded-identical
      description: >-
        The same byte-identical text graded again. The noise floor against
        which every perturbation is read.
      size:
        value: 100
        unit: items
    - id: reformatted
      description: >-
        Layout-only edits that preserve the words and their order — whitespace,
        single paragraph, one line per sentence, bullets, lowercased sentence
        starts, final punctuation. Content is unchanged by construction.
      size:
        value: 100
        unit: items
    - id: graded-exemplars
      description: >-
        Three human-graded answers to the same question — low, middle, high —
        shown with their grades before marking.
      size:
        value: 150
        unit: items
    - id: ungraded-exemplars
      description: >-
        The same three answers with their grades stripped. The control that
        separates "calibrated anchors" from "more context".
      size:
        value: 150
        unit: items
    - id: prior-attempt-low
      description: >-
        A real, previously graded low-scoring answer to the same question,
        supplied as the learner's previous attempt.
      size:
        value: 150
        unit: items
    - id: prior-attempt-high
      description: As above, with a high-scoring previous attempt.
      size:
        value: 150
        unit: items
    - id: prior-attempt-low-unmarked
      description: >-
        The same low-scoring previous attempt with THE MARK REMOVED. The arm that
        separates anchoring on the prior score from whatever the sight of earlier
        work does on its own.
      size:
        value: 150
        unit: items
    - id: prior-attempt-high-unmarked
      description: As above, with a high-scoring previous attempt and no mark.
      size:
        value: 150
        unit: items
    - id: attainment-control
      description: >-
        The attainment draw graded with no attainment shown: 150 cases from
        each tail of the learners' held-out attainment, one deterministic draw
        shared by every model. Each model grades it as its own control.
      size:
        value: 300
        unit: items
    - id: attainment-gemini
      description: >-
        The same draw with the learner's own mean human grade across their
        OTHER answers supplied, held out from the case being graded — a
        stand-in for the mastery posterior the product could pass.
        gemini-3.5-flash-lite.
      size:
        value: 300
        unit: items
    - id: attainment-gpt41mini
      description: As `attainment-gemini`, graded by gpt-4.1-mini.
      size:
        value: 300
        unit: items
    - id: attainment-gpt5mini
      description: As `attainment-gemini`, graded by gpt-5-mini.
      size:
        value: 300
        unit: items
    - id: attainment-swapped-label
      description: >-
        The attainment draw with each answer shown the held-out attainment of a
        paired learner from the OPPOSITE tail, same sentence and length. With
        the true-label arm it puts every answer under a high and a low label, so
        the label's effect is read on identical work, net of who wrote it.
        Graded by gemini-3.5-flash-lite, gpt-4.1-mini, gpt-5-mini,
        qwen3-235b-a22b-2507, llama-4-maverick and claude-opus-5.5.
      size:
        value: 300
        unit: items
    - id: attainment-gpt5mini-reasoning-minimal
      description: >-
        The control, true-label and swapped-label arms graded by gpt-5-mini
        with reasoning effort `minimal` (0 reasoning tokens billed).
      size:
        value: 300
        unit: items
    - id: exemplars-shuffled
      description: >-
        The three graded exemplars with the same three teacher marks deranged
        across the answers: the scale and its mean kept, the pairing wrong.
        Same closing instruction as the graded arm.
      size:
        value: 600
        unit: items
    - id: exemplars-shifted-up
      description: The graded exemplars with every mark raised by 2, clipped to 0-10.
      size:
        value: 600
        unit: items
    - id: exemplars-shifted-down
      description: The graded exemplars with every mark lowered by 2, clipped to 0-10.
      size:
        value: 600
        unit: items
    - id: graph-hierarchy
      description: The flat skill plus its parent and four siblings.
      size:
        value: 150
        unit: items
    - id: graph-diluted
      description: Fifteen skills, one of them relevant.
      size:
        value: 150
        unit: items
    - id: inject-shipped
      description: >-
        Adversarial payload appended to a real answer, graded by the shipped
        prompt. The graded content is unchanged, so all movement is the
        payload's.
      size:
        value: 50
        unit: items
    - id: inject-hardened
      description: As above, with the untrusted-response instruction added.
      size:
        value: 50
        unit: items
    - id: inject-nonce-fenced
      description: >-
        As above, with the response wrapped in a per-submission unguessable
        marker and the model told only text strictly between the markers is the
        response.
      size:
        value: 50
        unit: items

comparisons:
  - id: grader-vs-corpus-baselines
    kind: between-groups
    index_arm: lite-flat
    reference_arm: lite-flat
    description: >-
      The shipped configuration against the four LLM baselines the corpus ships
      for the same answers. Both sides are model grades of the same items
      scored against the same teacher reference; the corpus baselines are not
      an arm this release ran, which is why both arm slots name this release's
      own arm.
  - id: tier
    kind: between-groups
    index_arm: standard-thinking
    reference_arm: lite-flat
    description: Model tier and thinking, holding prompt and cases constant.
  - id: pooling
    kind: between-groups
    index_arm: median-of-three-lite
    reference_arm: lite-flat
    description: >-
      Pooled estimators against a single call, on the same cases. Asked twice,
      because agreement with the human and self-consistency are different
      questions and pooling is a variance reduction.
  - id: perturbation
    kind: within-subject-baseline
    index_arm: reformatted
    reference_arm: regraded-identical
    description: >-
      Layout-only edits against a re-grade of byte-identical text. The
      reference arm is what makes this readable: without it, every flip would
      be attributed to the edit.
  - id: exemplars
    kind: between-groups
    index_arm: graded-exemplars
    reference_arm: lite-flat
    description: Anchor exemplars against no exemplars.
  - id: exemplars-ungraded
    kind: between-groups
    index_arm: ungraded-exemplars
    reference_arm: lite-flat
    description: >-
      The same exemplars without their grades. Isolates whether the gain comes
      from the grades or from the extra text.
  - id: attempt-history
    kind: between-groups
    index_arm: prior-attempt-low
    reference_arm: lite-flat
    description: A previous attempt shown to the grader, against none.
  - id: attainment
    kind: between-groups
    index_arm: attainment-gemini
    reference_arm: attainment-control
    description: >-
      The learner's held-out attainment shown to the grader, against none, on
      the same draw. Read in two tails, high and low.
  - id: graph-context
    kind: between-groups
    index_arm: graph-diluted
    reference_arm: lite-flat
    description: >-
      More of the goal graph than the item needs, against the minimal flat list
      production already sends.
  - id: pooling-cross-model
    kind: between-groups
    index_arm: cross-model-pool
    reference_arm: standard-thinking
    description: >-
      A pool of three cheap passes plus one strong one, against the strong pass
      alone. The arm that shows pooling can be actively harmful: a weaker
      model's votes drag a better estimate down.
  - id: graph-hierarchy-vs-flat
    kind: between-groups
    index_arm: graph-hierarchy
    reference_arm: lite-flat
    description: >-
      A parent skill and four siblings against the flat single skill.
      COMPROMISED ON THIS CORPUS and reported as such: JorGPT has no goal
      graph, so its siblings are unrelated questions, which makes this partly a
      second dilution arm rather than a test of hierarchy.
  - id: attempt-history-high
    kind: between-groups
    index_arm: prior-attempt-high
    reference_arm: lite-flat
    description: >-
      A high-scoring previous attempt against no history. The companion to
      `attempt-history`: a high mark barely moves the grade, so the effect is
      not symmetric assimilation toward the prior.
  - id: injection-hardening
    kind: between-groups
    index_arm: inject-hardened
    reference_arm: inject-shipped
    description: >-
      An instruction telling the model the response is untrusted, against the
      shipped prompt. The mitigation arm, separated from the structural one so
      that "asking the model to resist" and "making the forgery impossible" are
      measured apart.
  - id: attempt-history-unmarked
    kind: between-groups
    index_arm: prior-attempt-low-unmarked
    reference_arm: prior-attempt-low
    description: >-
      The same previous attempt with and without its mark. Isolates the prior
      SCORE as the active ingredient, which the three-arm design could not.
  - id: attempt-history-unmarked-high
    kind: between-groups
    index_arm: prior-attempt-high-unmarked
    reference_arm: prior-attempt-high
    description: >-
      The high-scoring prior with and without its mark. The companion to
      `attempt-history-unmarked`: both graded arms have an unmarked counterpart,
      so "the mark is the mechanism" rests on two contrasts rather than one.
  - id: attainment-cross-provider
    kind: between-groups
    index_arm: attainment-gpt41mini
    reference_arm: attainment-control
    description: >-
      The attainment contrast on a second vendor's model over the same
      deterministic draw. Answers whether the effect is one vendor's
      instruction-following.
  - id: attainment-third-model
    kind: between-groups
    index_arm: attainment-gpt5mini
    reference_arm: attainment-control
    description: The attainment contrast on a third model, over the same draw.
  - id: injection-defence
    kind: between-groups
    index_arm: inject-nonce-fenced
    reference_arm: inject-shipped
    description: >-
      Three prompt arms over identical graded content and identical payloads.
      Only the prompt's treatment of the response boundary differs.
  - id: attainment-swap
    kind: other
    index_arm: attainment-swapped-label
    reference_arm: attainment-gemini
    description: >-
      The same answers under a high and a low attainment label, one of them
      the learner's own and the other a paired learner's from the opposite
      tail. The quantity is L, the mark under the high label minus the mark
      under the low label on identical work, read per model.
  - id: reasoning-off
    kind: other
    index_arm: attainment-gpt5mini-reasoning-minimal
    reference_arm: attainment-gpt5mini
    description: >-
      The label effect L on the same model, draw, prompt and arms, with only
      the reasoning setting changed (minimal against the API default).
  - id: exemplar-marks-pairing
    kind: between-groups
    index_arm: exemplars-shuffled
    reference_arm: graded-exemplars
    description: >-
      The same exemplar texts and marks, correctly paired against deranged.
      Separates "the correct marks" from "the sight of a marked scale".
  - id: exemplar-marks-level
    kind: between-groups
    index_arm: exemplars-shifted-up
    reference_arm: exemplars-shifted-down
    description: >-
      The same exemplars with every mark two points up against two points down,
      ranking kept. Whether the grader adopts the level it is shown.

observations:
  - id: agreement-vs-teacher
    sample:
      value: 150
      unit: items
    comparison_ref: grader-vs-corpus-baselines
    analysis_ref: jorgpt-agreement
    outcome:
      construct: Agreement between an AI grade and an expert human grade
      source_language: quadratic-weighted kappa against the teacher grade
      measure: >-
        Quadratic-weighted kappa over the 0-10 scale's own levels. Chosen over
        accuracy because accuracy is wrong for an ordinal scale — it scores "8
        when the human said 9" as badly as "1 when the human said 9" and
        flatters a grader that always predicts the modal score.
      scale: "-1 to 1"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      anchors:
        - claims/llm-short-answer-graders-can-reach-human-rater-agreement
    time:
      label: At grading, no delay
    result:
      measure_type: other
      estimate: 0.853
      model: >-
        Quadratic-weighted kappa, stratified n=150, Model.LITE. The best
        baseline the corpus ships (gemini) reaches 0.833 on the same items. MAE
        1.20 on a 0-10 scale. In the first n=60 run the shipped baselines ran
        from 0.634 (qwen) to 0.838 (gemini).
      interpretation: >-
        BORDERLINE AGAINST THE BASELINES AND LABELLED SO. The 0.020 margin over
        the best shipped baseline sits exactly on the harness's +/-0.02
        resolution and must not be quoted as established. What is robust is the
        LEVEL: agreement in the mid-0.8s, reproduced on every run and under
        every configuration tried. Subtract about 0.03 to read this as a
        corpus-level figure — the stratified draw inflates it.
    moderators:
      reported: []
      candidate:
        - variable: answer length
          relationship: >-
            Long answers carry more signal for the grader to work from, which
            the companion corpus's much lower agreement on one-sentence answers
            is consistent with.
          note: >-
            CANDIDATE, never promoted. No within-corpus analysis by length was
            run; this is a cross-corpus impression.
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      Everything about the grader side is fully observed — the harness calls
      the production prompt and schema directly. What is only partly visible is
      the reference: one teacher, one pass, no second rater, so this corpus
      cannot say how much of the residual 0.15 is the grader's error and how
      much is the teacher's noise.
    source_quote: >-
      From the release: this prompt reaches QWK 0.853 at stratified n=150,
      against 0.833 for the best of four baselines the corpus ships.
    source_location: release 1.0.0, evidence agreement-vs-teacher

  - id: spread-ratio
    sample:
      value: 150
      unit: items
    comparison_ref: grader-vs-corpus-baselines
    analysis_ref: jorgpt-agreement
    outcome:
      construct: >-
        Whether the grader discriminates across the scale or hedges toward safe
        mid-scores
      source_language: spread ratio — model standard deviation over human standard deviation
      measure: >-
        Reported beside kappa on purpose. A grader that predicts the modal
        score can post a respectable kappa while having stopped discriminating,
        and kappa alone hides it.
      direction: contextual
      role: capability-evidence
      role_basis: stated
      anchors:
        - claims/llm-short-answer-graders-can-reach-human-rater-agreement
    time:
      label: At grading, no delay
    result:
      measure_type: other
      estimate: 0.94
      model: >-
        Model sd / human sd, stratified n=150, Model.LITE. STANDARD 0.89.
        The corpus baselines ran 0.60 to 0.78 in the n=60 run.
      interpretation: >-
        Close to 1, meaning the grader uses the scale about as widely as the
        teacher does. The compression that afflicts all four shipped baselines
        is not present. Direction is `contextual` rather than
        higher-is-better: a ratio well above 1 would be over-discrimination,
        which is its own failure.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    source_quote: >-
      From the release: spread 0.94 on LITE, against 0.60-0.78 for the
      corpus baselines.
    source_location: release 1.0.0, evidence spread-ratio

  - id: model-tier-bias
    sample:
      value: 150
      unit: items
    comparison_ref: tier
    analysis_ref: jorgpt-agreement
    outcome:
      construct: Systematic generosity of the grade relative to the human grade
      source_language: mean signed difference, model grade minus teacher grade
      measure: Mean signed error on a 0-10 scale, reported beside kappa and MAE
      scale: "-10 to 10"
      direction: contextual
      role: capability-evidence
      role_basis: stated
      anchors:
        - claims/llm-short-answer-graders-can-reach-human-rater-agreement
    time:
      label: At grading, no delay
    result:
      measure_type: mean_difference
      estimate: 0.34
      model: >-
        LITE bias +0.34, STANDARD +0.01, stratified n=150. Agreement 0.853 vs
        0.869; MAE 1.20 vs 1.06.
      interpretation: >-
        THE TWO METRICS SEPARATE HERE, WHICH IS THE POINT. The kappa gap
        (0.016) sits on the resolution limit and varies run to run; the bias
        gap does not. LITE runs about a third of a grade point generous on
        every run and STANDARD is unbiased. Buy the tier for calibration, not
        for agreement — and for a score shown to a learner and compared against
        a pass mark, the bias is what matters.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      Measured at n=60 (tied) and n=40 (STANDARD ahead by 0.03) before n=150.
      The smaller runs could not resolve the agreement question and should not
      have been read; the bias gap was stable at every n.
    source_quote: >-
      From the release: LITE bias +0.34 against STANDARD +0.01, agreement
      0.853 against 0.869.
    source_location: release 1.0.0, evidence model-tier-bias

  - id: pooling-agreement
    sample:
      value: 150
      unit: items
    comparison_ref: pooling
    analysis_ref: jorgpt-stability
    outcome:
      construct: Whether pooling repeated grades improves agreement with the human
      source_language: quadratic-weighted kappa by estimator
      measure: QWK for single, median-of-3, mean-of-3 and cross-model estimators
      scale: "-1 to 1"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      anchors:
        - claims/pooling-repeated-llm-grades-does-not-improve-agreement
    time:
      label: At grading, no delay
    result:
      measure_type: other
      estimate: 0.845
      model: >-
        Median of 3 LITE, stratified n=150. Single LITE passes 0.835 / 0.846 /
        0.846; mean of 3, 0.849; cross-model pool of 3 LITE + 1 STANDARD,
        0.847; STANDARD alone 0.869. Bias +0.36 to +0.38 across every LITE arm.
      interpretation: >-
        A MEASURED NULL, and flat enough not to be underpowered. Every pooled
        estimator lands within 0.005 of a single call — inside the 0.011 spread
        of three identical single passes. Pooling LITE with STANDARD is WORSE
        than STANDARD alone, the weaker model's votes dragging the better
        estimate down. Bias is untouched across every arm, which is the tell:
        the residual disagreement is systematic, and averaging cannot reach it.
        Do not buy k=3; spend on capability instead. This is a null in QWK,
        which penalises the compression averaging creates; later work on
        another corpus, outside this release, found a small gain in Pearson r
        from nine passes. Re-run here on 2026-10-05 with nine passes and read
        in r: +0.0035 [+0.0026, +0.0048], inside a pre-set +/-0.01 equivalence
        margin, so on this corpus QWK hid nothing material.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      First run at n=40, below this harness's own resolution, and re-run at
      n=150. The conclusion held and the figures above are the n=150 ones. The
      n=40 pass should not have been reported.
    source_quote: >-
      From the release: pooling lands within 0.005 of a single call, and
      pooling LITE with STANDARD is worse than STANDARD alone.
    source_location: release 1.0.0, evidence pooling-agreement

  - id: pooling-stability
    sample:
      value: 100
      unit: items
    comparison_ref: pooling
    analysis_ref: jorgpt-stability
    outcome:
      construct: >-
        Whether pooling stops the same work receiving a different mark on
        resubmission
      source_language: proportion of cases whose rounded grade changes, content identical
      measure: >-
        Flip rate on identical content. A separate question from agreement:
        learners do not complain that the grade is wrong, they complain that it
        moved, which is a variance phenomenon, and pooling is a variance
        reduction.
      scale: 0-1
      direction: lower-is-better
      role: proximal-outcome
      role_basis: stated
      anchors:
        - claims/pooling-repeated-llm-grades-does-not-improve-agreement
    time:
      label: At re-grading, immediately after the first grade
    result:
      measure_type: probability
      estimate: 0.20
      model: >-
        Median-of-3 re-grade flip rate 20%, against 25% single-shot;
        reformatted 37% against 39%. Agreement identical to three decimals
        (0.858 both arms).
      interpretation: >-
        NO, FOR THE THIRD TIME. Pooling trims pure re-grade flips from 25% to
        20% — modest, and inside the ~5pp standard error on a proportion at
        this n — and does essentially nothing for reformatting. It cannot: a
        reformat SHIFTS where the grader settles, and pooling averages noise
        around a centre rather than moving the centre back. The cache is the
        fix for both, and nothing cheap addresses residual noise on a genuinely
        edited resubmission.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    source_quote: >-
      From the release: re-grade flips 25% to 20%, reformat flips 39% to 37%,
      agreement identical to three decimals.
    source_location: release 1.0.0, evidence pooling-stability

  - id: formatting-movement
    sample:
      value: 100
      unit: items
    comparison_ref: perturbation
    analysis_ref: jorgpt-stability
    outcome:
      construct: >-
        Sensitivity of the grade to surface form, separated from sensitivity to
        re-running
      source_language: mean absolute grade change on a layout-only edit
      measure: >-
        Mean absolute change on a 0-10 scale, matched against a re-grade of
        byte-identical text on the same cases. Matching is what makes this
        readable — an earlier reading compared flip rates across different runs
        and concluded the two were the same size.
      scale: 0-10
      direction: lower-is-better
      role: proximal-outcome
      role_basis: stated
      anchors:
        - claims/surface-formatting-changes-shift-llm-grades-without-penalising-them
    time:
      label: On resubmission of the same words in a different layout
    result:
      measure_type: mean_difference
      estimate: 0.46
      model: >-
        Reformatted mean |delta| 0.46 and 39% level flips, against re-graded
        identical 0.21 and 25%, on matched cases. Across seven perturbation
        variants at n=30 the mean SIGNED delta ranges -0.10 to +0.22, with no
        interval and no consistent direction across variants, while 17-37% of
        cases move a level and 10-30% move down.
      interpretation: >-
        THE COMPLAINT IS REAL AND NO PENALTY WAS DETECTED. On matched answers
        about two grades in five move a level on a layout-only edit, and some
        of those move down, which is what a learner reports. But the signed
        changes show no consistent direction across variants (-0.10 to +0.22 at
        n = 30 each, no intervals), so no penalty for bullets or lowercase was
        detected. Nor is it merely noise: reformatting moves the grade more
        than twice as far as re-running does on the same cases. Surface form
        does not just resample the grader, it SHIFTS it — which is why pooling
        cannot fix it and the cache can.
    moderators:
      reported:
        - variable: kind of edit
          relationship: >-
            Variants that alter characters as well as layout (lowercased
            sentence starts, typos) move the grade about as much as those that
            only reflow it, so the sensitivity is not specific to whitespace.
          source_quote: >-
            From the release: across seven variants, 17-37% move a level, and
            the character-altering variants sit inside that range rather than
            above it.
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      The perturbation sweep is n=30 per variant; the matched comparison
      against re-grading is n=100. The n=30 figures establish direction across
      variants, not magnitude for any one of them.
    source_quote: >-
      From the release: reformatting moves the grade more than twice as far as
      re-running does — mean absolute 0.46 against 0.21, flips 39% against 25%.
    source_location: release 1.0.0, evidence formatting-movement

  - id: signature-cache-coverage
    sample:
