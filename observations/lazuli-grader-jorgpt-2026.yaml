    observability:
      population_detail: observed
      implementation_detail: partial
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      THE HIERARCHY ARM IS COMPROMISED AND IS REPORTED ANYWAY. JorGPT has no
      goal graph, so its "siblings" are unrelated questions from the corpus,
      which makes that arm partly a second dilution arm rather than a test of
      hierarchy. It was tested properly on a corpus that does have a taxonomy;
