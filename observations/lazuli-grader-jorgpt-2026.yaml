  - id: cross-learner-signature-collision
    sample:
      value: 3041
      unit: items
    comparison_ref: perturbation
    analysis_ref: jorgpt-stability
    outcome:
      construct: >-
        Whether identical answer text from different learners was graded
        identically by the human
      source_language: >-
        proportion of the corpus sharing a content signature across learners,
        and how the teacher graded those groups
      measure: Full-corpus scan for shared signatures, then inspection of the human grades
      scale: 0-1
      direction: contextual
      role: capability-evidence
      role_basis: inferred
      anchors:
        - claims/surface-formatting-changes-shift-llm-grades-without-penalising-them
    time:
      label: As graded originally by the teacher
    result:
      measure_type: probability
      estimate: 0.02
      model: >-
        2.0% of the 3,031 gradable answers are answers from DIFFERENT learners
        with identical signatures, to the same question. 15 of those 18 groups were graded differently by
        the teacher — mostly one learner credited and the rest given 0.
      interpretation: >-
        A DESIGN CONSTRAINT MEASURED RATHER THAN ASSUMED. An integrity penalty
        is a judgement about provenance, not about content, so a content-only
        cache would serve a credited grade to an author who was zeroed. Key the
        cache on (learner, item, signature) and never share entries across
        learners; per learner, the case cannot arise.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      18 groups is a small base for the 15/18 proportion. The direction is not
      in doubt — the grades differ, and the corpus offers no reading of that
      other than provenance — but the rate should not be quoted.
    source_quote: >-
      From the release: 2.0% of the corpus shares a signature across learners,
      and 15 of 18 such groups were graded differently.
    source_location: release 1.0.0, evidence cross-learner-signature-collision

  - id: exemplar-calibration
    sample:
      value: 150
      unit: items
    comparison_ref: exemplars
    analysis_ref: jorgpt-stability
    outcome:
      construct: >-
        Effect of human-graded anchor answers on the grader's systematic
        generosity and on its agreement
      source_language: bias and QWK, with and without three graded exemplars
      measure: Mean signed error and QWK, same cases, same model tier
      scale: "-10 to 10"
      direction: contextual
      role: capability-evidence
      role_basis: stated
      anchors:
        - claims/graded-exemplars-shift-an-llm-grader-by-the-level-they-are-marked-at
    time:
      label: At grading, no delay
    result:
      measure_type: mean_difference
      estimate: 0.06
      model: >-
        Control bias +0.38, QWK 0.840, MAE 1.24. Three graded anchors: bias
        +0.06, QWK 0.840, MAE 1.22. Three anchors with grades stripped: bias
        +0.63, QWK 0.821, MAE 1.26. n=150, Model.LITE.
      interpretation: >-
        ON THIS DRAW, EXEMPLARS REMOVED THE GENEROSITY; THEY DID NOT IMPROVE
        AGREEMENT. Kappa is unchanged to three decimals, which the offset
        arithmetic explains: removing a 0.32-point offset on this draw is worth
        0.0065 QWK. The ungraded arm is worse than the control on bias and
        kappa, but it removes both the marks and the closing instruction, so on
        its own it cannot say which does the work. The pre-registered re-test
        (`exemplar-marks-pairing-and-level`) can, and it restates the mechanism:
        the correct marks matter, and the grader adopts the level the examples
        are marked at, so the exemplars apply a roughly fixed shift. That it
        landed near zero here is a coincidence of size; on a wider draw it
        overshot, and on a harsh second model it did not resolvably move bias
        (-0.06 [-0.17, +0.03]) while raising QWK by 0.033.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      One run at n=150, reproduced within 0.06 on every cell on the same 150
      answers in the 2026-10-05 re-test. The kappa null is flat to three
      decimals; the bias change is larger than any run-to-run spread measured.
    source_quote: >-
      From the release: bias +0.38 to +0.06 with graded anchors, kappa
      unchanged at 0.840; the ungraded arm is worse on both.
    source_location: release 1.0.0, evidence exemplar-calibration

  - id: attempt-history-anchoring
    sample:
      value: 150
      unit: items
    comparison_ref: attempt-history
    analysis_ref: jorgpt-learner-context
    outcome:
      construct: >-
        Effect of showing the grader the learner's previous attempt, with its
        mark, on the grade for the current one
      source_language: drift in mean grade against a no-history control
      measure: >-
        Mean signed change against control on identical current work, by
        whether the supplied previous attempt scored low or high
      scale: "-10 to 10"
      direction: contextual
      role: capability-evidence
      role_basis: stated
      anchors:
        - claims/showing-a-grader-a-learners-prior-performance-biases-the-grade
    time:
      label: At grading of a resubmission
    result:
      measure_type: mean_difference
      estimate: -0.59
      model: >-
        Five-arm run, n=150, Model.LITE. Control: QWK 0.849, MAE 1.18, bias
        +0.38. Prior attempt scoring low, with its mark: QWK 0.848, MAE 1.22,
        bias -0.21, drift -0.59. Prior attempt scoring high, with its mark: QWK
        0.829, MAE 1.27, bias +0.28, drift -0.10. The two unmarked arms are in
        `attempt-history-mark-is-the-mechanism`.
      interpretation: >-
        A LOW PRIOR MARK LOWERS THE GRADE ON IDENTICAL WORK, AND NO ACCURACY IS
        SHOWN TO BE BOUGHT. Agreement sits in a 0.83-0.85 band across all five
        arms while a low prior mark moves the mean grade by more than half a
        point. The pre-registered re-run on the same 150 answers
        (`jorgpt-attainment-retests`, learner-clustered 95% intervals) gives
        drift -0.44 [-0.62, -0.26] for the low mark and -0.16 [-0.33, +0.02]
        for the high, with QWK changes inside intervals that leave room for
        gains of +0.024 and +0.056: "no gain larger than" those bounds, not
        equivalence. A learner whose earlier attempt was poor is marked lower
        for the same work. Do not pass attempt history to the grader.
    moderators:
      reported:
        - variable: the previous attempt's own grade
          relationship: >-
            A low mark lowers the grade and a high one does not raise it: a
            high prior mark moved the grade by -0.10 (re-run -0.16), close to
            the same strong answer shown without its mark (-0.24). Relative to
            the no-history mark, a low prior mark costs the learner and a high
            one gains them nothing.
          source_quote: >-
            From the release: drift -0.59 with a low-scoring prior attempt
            against -0.10 with a high-scoring one.
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      The corpus has no genuine resubmissions, so the "previous attempt" is
      another learner's real, human-graded answer to the same question. One
      run at n=150, re-run with intervals on 2026-10-05 (65 learners). At n=40 an earlier version of this experiment showed the
      low-prior arm at QWK 0.930 against a 0.886 control; at n=120 the two
      were level. That false positive is why nothing here is read below
      n=150.
    source_quote: >-
      From the release: agreement flat across five arms while the low-prior
      arm drifts -0.59.
    source_location: release 1.0.0, evidence attempt-history-anchoring

  - id: graph-context-dilution
    sample:
