        and Triangle-area (.03).
      interpretation: "A skill already mastered at the start (initial success probability .95); more practice brings little gain"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: partial
      effect_size: observed
    observability_notes: >-
