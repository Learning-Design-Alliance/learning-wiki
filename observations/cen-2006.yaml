    source_quote: "Compose-by-addition (-.04) and Parallelogram-area (-.01), Triangle-area (.03)."
    source_location: "Section 5.1, Experiment 1; Table 4"

  - id: original-model-fit
    sample:
      value: 4102
      unit: other
    comparison_ref: whole-sample-model
    outcome:
      construct: "Model fit"
      source_language: "Mean Absolute Deviance (MAD)"
      measure: "Mean absolute difference between observed first-attempt success (0/1) and the model's predicted probability, original 15-skill model"
      scale: "MAD, 0 to 1"
      direction: lower-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "across the whole log data set"
    result:
      measure_type: other
      estimate: 0.083
      model: "Eq. 2 fitted to the original cognitive model. AIC 3,950; BIC 4,285 (Table 4, Model Statistics)."
      interpretation: "The baseline against which the LFA-improved models are compared"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: partial
      effect_size: unreported
    observability_notes: >-
      A fit statistic, not an effect; the sample is the 4,102 logged data
      points the model was fitted to.
    source_quote: "Model Statistics AIC 3,950 BIC 4,285 MAD 0.083"
    source_location: "Table 4, Model Statistics"

  - id: best-bic-model-improvement
    sample:
      value: 4102
      unit: other
    comparison_ref: whole-sample-model
    outcome:
      construct: "Model fit"
      source_language: "BIC is reduced by 37"
      measure: "Reduction in BIC of the best model found by LFA with BIC as the heuristic (three binary splits, 18 skills), relative to the original 15-skill model"
      scale: "BIC points"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "across the whole log data set"
    result:
      measure_type: other
      estimate: 37
      unit: "BIC points"
      model: >-
        Experiment 2, LFA with A* search (50 node expansions). The same model
        reduced AIC by 62 and MAD by .012; the best AIC model reduced AIC by 83,
        increased BIC by 18 and reduced MAD by .02.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: observed
      outcome_timing: partial
      effect_size: unreported
    source_quote: "For the best BIC model, its BIC is reduced by 37, and AIC by 62. The fit of the new model, as measured by MAD, is reduced by .012."
    source_location: "Section 5.2, Experiment 2"

