# Ghosh, Heffernan & Lan (2020): context-aware attentive knowledge tracing
# (AKT), KDD 2020.
#
# A model paper, not an experiment with learners in conditions. The arms are
# model configurations evaluated on logged response data, and every figure
# recorded is the paper's own: test AUCs from five-fold cross-validation,
# averaged over the five test folds (Table 2 prints each with its SD across
# folds; Table 3 prints averages only, as its text says). The observations are
# on ASSISTments2009, the dataset that carries question IDs and on which all
# three ablations were run.
#
# Read from the arXiv copy (arXiv:2007.12324v1, 24 Jul 2020, 10 pp.), whose
# front matter carries the ACM reference format and DOI 10.1145/3394486.3403282,
# matching Crossref (KDD '20 proceedings, pp. 2330-2339). The arXiv copy is the
# authors' version; it was not compared with the ACM version of record.
#
# Tables 1-5 come out of the text layer column by column, so the table-row
# source_quotes below were taken from the PDF page images (pp. 5-7), in the
# article's own characters (its "±" and spacing).
#
# measure_type: Table 2 and Table 3 values are recorded as `mean` (an average
# over five test folds, with the SD across folds where Table 2 prints one),
# because the source says that is what they are. Table 4 does not say whether
# its values are fold averages, so its positional-encoding AUC is recorded as
# `other` rather than as a mean.
#
# No age, no reliability: the article prints no age or grade for any dataset
# (ASSISTments is described as an online tutoring platform, Statics2011 as a
# college-level engineering course) and no reliability or agreement figure.
# BKT+ AUCs in Table 2 are taken from an earlier paper ([36]), so they are not
# this study's figures and are not recorded.

schema_version: 2

study:
  key: ghosh-2020
  citation: "Ghosh, A., Heffernan, N., & Lan, A. S. (2020). Context-aware attentive knowledge tracing. In Proceedings of the 26th ACM SIGKDD International Conference on Knowledge Discovery & Data Mining (KDD '20) (pp. 2330–2339). Association for Computing Machinery."
  doi: "10.1145/3394486.3403282"
  design:
    family: other
    design_detail: >-
      Computational benchmark. AKT predicts a learner's response to the current
      question with two self-attentive encoders (questions; knowledge
      acquired) giving context-aware representations, a knowledge retriever
      whose monotonic attention down-weights past items by an exponential
      decay of a context-aware distance in time steps (one decay rate per
      head), and Rasch model-based question and response embeddings (a
      per-question scalar difficulty times a per-concept variation vector).
      Compared with DKT, DKT+, DKVMN and SAKT (re-implemented) on four
      datasets by five-fold cross-validation (per fold 60% of learners train,
      20% validation for early stopping and tuning, 20% test), sequences
      truncated to 200 responses, AUC as the metric; three ablations
      (context-aware vs raw representations, monotonic attention vs
      positional encodings, with vs without Rasch embeddings). No conditions
      were assigned to learners.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-27
  extraction_method: manual-from-repository-copy
  verification: unverified

