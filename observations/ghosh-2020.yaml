evidence_base:
  unit: other
  size:
    value: 4
    unit: other
  additional_sizes:
    - value: 4151
      unit: participants
      note: "learners in ASSISTments2009: 110 concepts, 16,891 questions, 325,637 responses (Table 1); interactions not associated with a named concept removed"
    - value: 19840
      unit: participants
      note: "learners in ASSISTments2015: 100 concepts, 683,801 responses, no question IDs; interactions with isCorrect not 0 or 1 removed"
    - value: 1709
      unit: participants
      note: "learners in ASSISTments2017: 102 concepts, 3,162 questions, 942,816 responses"
    - value: 333
      unit: participants
      note: "learners in Statics2011: 1,223 concepts, 189,297 responses, no question IDs"
  population:
    description: >-
      Four benchmark datasets of logged learner responses: ASSISTments2009,
      ASSISTments2015 and ASSISTments2017 from the ASSISTments online tutoring
      platform, and Statics2011 from a college-level engineering statics
      course. The size above counts datasets.
    age_or_stage: "Statics2011 is a college-level course; no age or grade is stated for any dataset."
    age: unreported
  context:
    setting: "Offline prediction of each learner's binary response to the next question from their logged response sequence; models trained with Adam, batch size 24 learners, up to 300 epochs"
  arms:
    - id: akt-r
      description: "AKT with the Rasch model-based embeddings (question IDs used): context-aware encoders, monotonic attention knowledge retriever."
    - id: akt-nr
      description: "AKT without the Rasch model-based embeddings: context-aware encoders and monotonic attention, concepts indexing questions."
    - id: akt-raw-nr
      description: "AKTraw-NR: AKT-NR without the question and knowledge encoders; raw question and response embeddings go straight into the knowledge retriever (a single self-attention with exponential decay)."
    - id: akt-nr-pos
      description: "AKT-NRpos: AKT-NR with the monotonic attention replaced by learnable positional encoding."
    - id: dkt
      description: "DKT (LSTM), re-implemented by the authors."

comparisons: []

