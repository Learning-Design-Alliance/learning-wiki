      The coefficient is a slope on a study-level moderator, not an effect of
      any configuration.
    source_quote: "The reliability of the self-handicapping was an additional significant moderator (unstandardized b = −0.67, z = −3.0, p < .01)."
    source_location: "Results, Moderator Analyses, p. 10 (Online First)"

  # The reliability of the authors' CODING, not of any self-handicapping
  # scale in the corpus. Per-variable kappas are in Table 2, whose rows the
  # text layer scrambled; only the range and the two values the text names
  # are relied on.
  - id: coder-agreement-kappa
    comparison_ref: coding-agreement
    outcome:
      construct: "Inter-coder agreement on moderator coding"
      source_language: "coding reliability of the variables"
      measure: "Cohen's kappa between the first coder and a second coder who categorized 10 of the included studies, per coded variable"
      scale: "Cohen's kappa"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "during coding"
    result:
      measure_type: reliability
      estimate_range:
        lower: 0.68
        upper: 1.00
        over:
          value: 10
          unit: items
      reliability:
        statistic: cohens_kappa
        over: raters
        form: "Cohen's kappa per coded moderator variable"
      interpretation: "All at least substantial; all excellent except school type (kappa = .68) and questionnaire (kappa = .74)"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      `over` counts the coded variables that carry a kappa in Table 2 (ten
      values in its kappa column). The source writes that the 10 double-coded
      studies were "about 34%" of those included; that share is recorded as
      printed and not recomputed. effect_size is `unreported` because a
      reliability is not an effect.
    source_quote: "As can be seen, the coding reliabilities of each item were at least substantial with kappas ranging from .68 to 1.00. With two exceptions regarding the categories school type (κ = .68) and questionnaire (κ = .74), all kappas could be classified as excellent."
    source_location: "Method, Literature Search and Coding, p. 7 (Online First); Table 2"

