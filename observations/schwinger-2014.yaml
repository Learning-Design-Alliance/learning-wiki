    source_quote: "The confidence intervals of the categories “elementary school” (r = −.29; 95% CI: −.35 ≤ r ≤ −.23) and “middle school” (r = −.34; 95% CI: −.41 ≤ r ≤ −.25) compared to “high school” (r = −.23; 95% CI: −.26 ≤ r ≤ −.18) and “university students” (r = −.18; 95% CI: −.21 ≤ r ≤ −.14) did not overlap, indicating a statistically significant difference between these correlations."
