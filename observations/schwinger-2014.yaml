# Schwinger, Wirthwein, Lemmer & Steinmayr (2014): academic self-handicapping
# and achievement, a meta-analysis of 36 field studies.
#
# Read from the Online First copy (10 February 2014, pages 1-19, the same DOI);
# the issue version is 106(3), 744-761, so page numbers below are the Online
# First pages. No PDF of it was available here, only its text layer.
#
# The text layer prints APA's symbol font with substitute glyphs; the
# source_quote fields use the characters the article prints (=, −, ≤, <, κ). Table 3
# extracted column by column, not row by row, so its rows cannot be quoted as
# rows: each stratum's quote is the running text, and the k and SE taken from
# Table 3 are read off its k and SE columns, whose order matches the ES column
# that the text confirms.
#
# WHAT THIS FILE RECORDS:
#
#   * The pooled correlation (r = -.23) with its heterogeneity and the
#     publication-bias tests.
#   * School type as corpus strata (arms), one correlation each, as the source
#     reports them; the moderator test sits on the pooled observation.
#   * The meta-regression of the correlation on the reliability of the
#     self-handicapping scale.
#   * `measure_type: reliability` for the authors' own double coding: Cohen's
#     kappa from .68 to 1.00 across the coded variables.
#   * `population.age: unreported`: the article gives school types and the
#     share of university students, but no age figure.

schema_version: 2

study:
  key: schwinger-2014
  citation: "Schwinger, M., Wirthwein, L., Lemmer, G., & Steinmayr, R. (2014). Academic self-handicapping and achievement: A meta-analysis. Journal of Educational Psychology, 106(3), 744-761."
  doi: "10.1037/a0035832"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-analysis of Pearson correlations between self-reported academic
      self-handicapping and academic achievement in field studies of school and
      university students. Multiple effect sizes within a study were combined
      through Fisher's Z; results reported for separate groups were treated as
      independent samples. Categorical moderators by meta-analytic analogue to
      ANOVA under a mixed-effects model, continuous ones by weighted least
      squares meta-regression, and a multiple WLS meta-regression.
  synthesis:
    model: "Random-effects model with a restricted maximum likelihood (REML) estimator of the between-study variance; mixed-effects model for moderators"
    heterogeneity_statistic: "Q and I2"
    search:
      databases:
        - PsycINFO
        - ERIC
        - Google Scholar
        - Web of Knowledge
        - ProQuest Dissertations & Theses
        - OpenGrey
        - NTiS
        - PSYNDEX
      date_range: "up to August 2013"
      records_screened: 366
      records_included: 36
    inclusion:
      - "Correlations between self-handicapping and academic achievement specified (achievement in sports excluded)"
      - "Self-report measures"
      - "Sample of school or university students"
      - "Written in English or German"
    data_handling:
      - "Known authors contacted for unpublished studies or data"
      - "Two outlying correlations (more than 2 SDs from the mean) winsorized to 2 SDs"
      - "A second coder categorized 10 of the included studies to estimate coding reliability"
      - "Publication bias assessed by funnel plot, Begg and Mazumdar rank correlation test and Egger regression test"

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-25
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: self-handicapping-achievement-mean-correlation
    bearing: supports
    anchor: schwinger-2014
  - claim: self-handicapping-effect-heterogeneity
    bearing: supports
    anchor: schwinger-2014
  - claim: school-type-moderates-self-handicapping-correlation
    bearing: supports
    anchor: schwinger-2014
  - claim: scale-reliability-moderates-self-handicapping-correlation
    bearing: supports
    anchor: schwinger-2014

evidence_base:
  unit: effect-sizes
  size:
    value: 49
    unit: effect-sizes
  additional_sizes:
    - value: 36
      unit: studies
      note: "field studies included"
    - value: 25550
      unit: participants
      note: "total participants across the 49 independent samples (range 43 to 6,366 per sample)"
  population:
    description: >-
      School and university students in field studies published 1992-2013:
      51% of participants university students and 49% school students.
      Publications from the United States (38.8%), Europe (30.6%) or
      Australia (20.4%).
    age_or_stage: "Elementary, middle and high school students and university students; the article prints no age figure"
    age: unreported
  context:
    setting: "Field studies relating questionnaire-measured academic self-handicapping to grade point average, achievement tests, exam grades or report-card grades"
  variation:
    - dimension: "School type (number of effect sizes, Table 3)"
      distribution: "elementary 6, middle school 4, high school 12, university 25"
    - dimension: "Self-handicapping questionnaire (number of effect sizes, Table 3)"
      distribution: "Academic SHS 23, SHS 11, Short SHS 2, mixed 4, MES self-sabotage 6, others 3"
  arms:
    - id: elementary-school
      description: "The elementary-school stratum of the corpus. The source does not define the grade span."
      size:
        value: 6
        unit: effect-sizes
    - id: middle-school
      description: "The middle-school stratum of the corpus."
      size:
        value: 4
        unit: effect-sizes
    - id: high-school
      description: "The high-school stratum of the corpus."
      size:
        value: 12
        unit: effect-sizes
    - id: university
      description: "The university-student stratum of the corpus."
      size:
        value: 25
        unit: effect-sizes

comparisons:
  - id: whole-corpus
    kind: none
    description: "Self-handicapping and achievement across the whole corpus; no contrast between strata."
  - id: coding-agreement
    kind: none
    description: "Agreement between the first coder and a second coder who categorized 10 of the included studies."

observations:

  - id: sh-achievement-overall
    sample:
      value: 49
      unit: effect-sizes
    comparison_ref: whole-corpus
    outcome:
      construct: "Academic achievement"
      source_language: "academic achievement"
      measure: "Grade point average, achievement test scores, exam grades or report-card grades as reported by the primary studies"
      scale: "correlation with self-reported academic self-handicapping"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "as measured in the primary studies (concurrent or prospective)"
    result:
      measure_type: correlation
      estimate: -0.23
      ci_lower: -0.25
      ci_upper: -0.20
      interval_type: confidence
      p_value: "< .001"
      k:
        value: 49
        unit: effect-sizes
      heterogeneity:
        statistic: "I2"
        value: 70.32
        unit: percent
        interpretation: "95% CI [55.72%, 82.96%], classified as high; Cochran's Q = 156.50, df = 48, p < .001"
      publication_bias:
        method: "Funnel plot; Begg and Mazumdar rank correlation test; Egger regression test"
        finding: "No asymmetry: Kendall's tau = 0.01, p = .90; regression test z = -0.36, p = .72"
      model: "random-effects"
      note: "Range of the individual correlations r = -.46 to r = .02. The authors call it a medium-sized correlation by Hattie (2009)."
    moderators:
      reported:
        - variable: "School type"
          relationship: "Stronger negative correlations in elementary (r = -.29) and middle school (r = -.34) than in high school (r = -.23) and university (r = -.18); QB = 18.83, p < .01"
          source_quote: "The largest moderator effect was found for “school type” (QB = 18.83, p < .01)."
        - variable: "Self-handicapping questionnaire"
          relationship: "Weaker correlation for the SHS (r = -.11) than for the Academic SHS (r = -.25) and the MES (r = -.25); QB = 24.74, p < .01"
          source_quote: "the variable “questionnaire” emerged as a significant moderator of the mean correlation between self-handicapping and achievement (QB = 24.74, p < .01)."
        - variable: "Mastery-approach goals in the sample"
          relationship: "Stronger correlation in samples with medium mastery-approach goals (r = -.38) than with high (r = -.25); QB = 8.93, p < .01"
          source_quote: "Mastery-approach goals were an additional statistically significant moderator (QB = 8.93, p < .01)"
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: unreported
      outcome_timing: partial
      effect_size: observed
      pooled_k: observed
    source_quote: "The random-effects model revealed a mean correlation between self-handicapping and achievement of r = −.23 (p < .001; range: r = −.46 to r = .02; 95% CI [−.25, −.20]; k = 49)."
    source_location: "Results, Mean Effect Size, p. 9 (Online First)"

