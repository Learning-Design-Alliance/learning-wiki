not_yet_extracted:
- Table 2 and Table 3 solution and study times per problem, and incorrect attempts per phase (acquisition
  t(25) = 2.20; immediate t(25) = 1.50, p = .073; delayed similar t(25) = 3.38).
- Study-time ANOVA (format F(1, 25) = 6.08; format x problem F(2, 50) = 4.25) and its simple effects.
- 'Self-explanation analyses: Tables 5-8 (explanation categories, rereads, metacognitive statements, knowledge
  components) and their t and chi-square tests, including more correct inferences in the integrated group,
  t(17) = 1.73, p = .05, on 10 and 9 analysed protocols.'
