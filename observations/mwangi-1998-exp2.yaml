# Mwangi & Sweller (1998), Experiment 2: integrated against split-source
# worked examples of two-step compare word problems, Year 3 children, all
# asked to self-explain.
#
# One file per experiment the simulator uses: mwangi-1998-exp2 and
# mwangi-1998-exp3. Experiment 1 (worked examples against problem solving,
# 18 children) is a different sample and has no record here.
#
# WHAT THIS FILE RECORDS: each group's mean and SD for problems solved
# correctly in the acquisition, immediate and delayed tests (similar and
# transfer problems), the article's t test for each, and the format effect on
# delayed solution times. The article prints no standardised effect size, and
# none is computed: a d from these means would be ours, not the article's.
#
#   * `measure_type: mean`: eight means with SDs, by arm.
#   * `measure_type: reliability`: the self-explanation coding agreement,
#     Scott's coefficient .897 and a proportion-agreement range .79-1.00.
#     Scott's pi has no slot of its own, so statistic is `other` with the
#     procedure in `form`.
#   * `population.age`: the article prints the mean as "9 years 3 months";
#     it is recorded as 111 months, the same figure in one unit, with a note.
#
# Read from the JSTOR copy of the journal pages (text layer, with the page images checked for
# Experiment 3's tables). Every quote here comes from the text layer as is.

schema_version: 2
study:
  key: mwangi-1998-exp2
  citation: 'Mwangi, W., & Sweller, J. (1998). Learning to solve compare word problems: The effect of
    example format and generating self-explanations. Cognition and Instruction, 16(2), 173–199.'
  doi: 10.1207/s1532690xci1602_2
  design:
    family: randomized-controlled-trial
    design_detail: Two-group experiment, children randomly assigned to integrated (n = 14) or split-source
      (n = 13) worked examples of inconsistent-language two-step compare word problems; every child self-explained
      each example. Individual sessions; acquisition test, immediate test and a delayed test 10 days later.
      Group comparisons by t tests and format x problem ANOVAs. Small sample, two schools.
provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified
appears_in:
- claim: integrated-beats-split-source-compare-problems
  bearing: supports
  anchor: mwangi-1998
- claim: integrated-beats-split-source-compare-problems
  bearing: supports
  anchor: mwangi-1998-2
evidence_base:
  unit: participants
  size:
    value: 27
    unit: participants
  population:
    description: Twenty-seven Year 3 children (16 girls, 11 boys) attending two public schools in Sydney,
      Australia.
    age_or_stage: Year 3; mean age printed as 9 years 3 months
    age:
      unit: months
      mean: 111
      note: Printed as M = 9 years 3 months; 111 is that figure written in one unit.
  context:
    setting: Individual instruction in a quiet room, during the last term of the school year; the experimenter
      read each problem aloud; explanations tape recorded
  arms:
  - id: integrated
    description: Worked examples with the solution steps embedded in the relevant sections of the story
      text (Appendix B); three worked solution-test problem pairs, no study time limit, child asked to
      explain each solution to an imagined child who could not solve it, guided by open-ended questions.
    size:
      value: 14
      unit: participants
  - id: split-source
    description: The same worked examples with the solution steps immediately after the story text (Appendix
      B); same self-explanation procedure.
    size:
      value: 13
      unit: participants
comparisons:
- id: integrated-vs-split
  kind: between-groups
  index_arm: integrated
  reference_arm: split-source
  description: Integrated against split-source worked examples, both with self-explanation.
- id: coding-agreement
  kind: none
  description: Agreement between the researcher and an independent coder on the self-explanation protocols;
    no contrast between groups.
