# Kim (2005): meta-analysis of correlations between IQ scores and creativity
# test scores, with moderators (IQ test, IQ level, threshold, creativity test,
# test type, subscale, gender, age).
#
# WHAT IS RECORDED:
#
#   * The pooled correlation weighted by sample size (r = .174), with the
#     unweighted mean (.137) in its note, and the omnibus heterogeneity.
#   * The four age strata of Table 8 (elementary, middle school, high school,
#     adult), each a correlation about one stratum (`arm_ref`), not a contrast.
#     "Elementary" includes 87 kindergarteners; "adult" includes naval recruits
#     and college students (Method).
#   * Age's coefficient in the weighted multiple regression of Table 9, with
#     the model's R-squared, and the four a priori chi-square contrasts between
#     age strata.
#   * Threshold theory: the strata below and above IQ 120, their a priori
#     contrast, and the threshold coefficient and R-squared change when it was
#     added to the regression (Table 10).
#
# `k` counts CORRELATION COEFFICIENTS, not studies: 447 from 21 studies.
#
# `population.age: unreported`: the article groups samples by school level and
# prints no age range, mean or SD. No reliability coefficient is printed for any
# instrument, and no coding agreement.
#
# SOURCE TEXT. The first pass read a text layer with no PDF beside it. This
# pass reads the published PDF (ERIC copy EJ698316, 10 pages), whose pages were
# viewed as images; every figure below was checked against them. Quotations
# taken from the page images (and matched to that PDF's own text layer):
# iq-creativity-middle-school, iq-creativity-high-school, iq-creativity-adult,
# age-regression-coefficient (replacing table-row quotes), and every
# observation added in this pass (the age contrasts and the threshold
# observations). The overall and elementary quotes are unchanged and were
# confirmed on the page.
#
# Things the printed article itself does, all checked on the page images:
#   * "p > .0001" (and "p > .001" for the high-school stratum) really is what
#     the PDF prints for heterogeneous Q values, though the homogeneity rule
#     (heterogeneous when p < .001) implies "<". No p value is recorded for
#     those. The overall Q(446) is printed "p < .0001" and is recorded.
#   * Table 1 as printed puts 65 coefficients and r = .201 on the row labelled
#     "Above IQ 120" and 14 and .235 on "Below IQ 120", and its "Unreported"
#     row runs together ("368.163heterogeneous"). The Results text (65 below,
#     14 above) and the Discussion (368 of 447 unreported) agree with each
#     other, so the threshold observations take the Results sentences; the
#     table is not quoted.
#   * The titles of Tables 9 and 10 are swapped: the table titled "With
#     Threshold" (Table 9) has four moderators and no threshold row, and the
#     one titled "on Moderator Variables" (Table 10) has the threshold row. The
#     text's numbering (Table 9 = four moderators, Table 10 = with threshold)
#     matches the rows and is followed here.
#   * The R-squared symbol renders as "R?" in this PDF (a missing glyph); it is
#     quoted as printed. "adjusted R?" and "R? Change" leave no doubt which
#     statistic it is.
#   * The regression paragraph first says "age and creativity subscales
#     independently accounted for variation", then that creativity tests and
#     age had significant effects and creativity subscales did not; the IQ
#     tests p is printed ".59.64" in the text and .59064 in Table 9; creativity
#     tests' z = -2.33020 is printed with p < .001. Recorded as printed for age
#     and threshold only; not resolved.
#   * The Results and Table 8 show weaker correlations in the elementary group
#     than in the older groups, and the first age paragraph of the Discussion
#     says the same; the concluding paragraph says the opposite ("more closely
#     associated with creativity scores for younger groups than for older
#     groups"). The figures are recorded; the contradiction is noted, not
#     resolved.
#   * How age was coded for the regression is not stated anywhere in the
#     article (Method, Results, Tables 8-10 and their notes were read).
#
# The article prints no DOI; 10.4219/jsge-2005-473 was checked against Crossref
# (title, sole author Kyung Hee Kim, 2005, 16(2-3), 57-66), which agrees with the
# front matter ("The JSGE Vol. XVI, No. 2/3, Winter/Spring 2005, pp. 57-66").

schema_version: 2

study:
  key: kim-2005
  citation: "Kim, K. H. (2005). Can only intelligent people be creative? A meta-analysis. Journal of Secondary Gifted Education, 16(2-3), 57–66."
  doi: "10.4219/jsge-2005-473"
  design:
    family: meta-analysis
    design_detail: >-
      Meta-analysis of correlation coefficients between IQ test scores and
      creativity test scores. Fisher's z transformation, each z weighted by
      N - 3, random-effects model, r values back-transformed from z (Schwarzer's
      Meta 5.3). Moderator analyses by subgroup (QB tests, simple contrasts as z
      at p < .001), Hedges' g per coefficient for the moderator analysis
      (DSTAT 1.10), then a weighted multiple linear regression of zr on the
      significant moderators, with and without the IQ-120 threshold.
  synthesis:
    model: "Random-effects model; Fisher z weighted by N - 3, back-transformed to r"
    heterogeneity_statistic: "Q"
    heterogeneity_thresholds: "Heterogeneous when the residual SD exceeded three fourths of the effect size and sampling error was less than 75% of observed variance (Schwarzer); in the tables, heterogeneous when p < .001"
    search:
      databases:
        - Academic Search Premier
        - ERIC
        - PsycARTICLES
        - PsycINFO
      date_range: "1961 through summer 2004"
      records_included: 21
    inclusion:
      - "English-language creativity and intelligence literature"
      - "Reports correlations among measures of intelligence and creativity, or t, chi-square or single-df F tests, or exact p values"
    data_handling:
      - "Several coefficients per study where a study used several creativity subscales or reported results separately by gender"
      - "Conservative criterion (p < .001) for moderator contrasts to protect against Type I error"
      - "Creativity subscales classified as fluency, flexibility or originality; unreported subscales categorised from the nature of the tasks"
      - "Residual SD used as the standard error for 95% confidence intervals"

