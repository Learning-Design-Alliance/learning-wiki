      description: "The elementary-school stratum: kindergarten through fifth grade, including 87 kindergarteners."
    - id: middle-school
      description: "The middle-school stratum."
    - id: high-school
      description: "The high-school stratum."
    - id: adult
      description: "The adult stratum, including naval recruits and college students."
    - id: below-iq-120
      description: "Correlation coefficients from samples below IQ 120 (65 coefficients)."
    - id: above-iq-120
      description: "Correlation coefficients from samples above IQ 120 (14 coefficients)."

