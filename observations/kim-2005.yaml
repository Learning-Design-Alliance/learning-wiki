      note: "studies synthesised, from more than 100 located"
    - value: 45880
      unit: participants
      note: "total sample size across the 21 studies"
  population:
    description: >-
      Samples from kindergarten to adulthood in the studies synthesised,
      including 87 kindergarteners (Ward, 1968), naval recruits (Richards,
      1976) and college students. Most studies did not report ethnicity.
    age_or_stage: "Grouped as elementary (kindergarten through fifth grade), middle school, high school and adult; no age figures are printed"
    age: unreported
  context:
    setting: "Studies published 1961 to 2004 reporting IQ and creativity test scores"
  variation:
    - dimension: "Age group"
      distribution: "Elementary 251 coefficients, middle school 27, high school 105, adult 53, unreported 11 (Table 8)"
    - dimension: "Creativity test"
      distribution: "Wallach-Kogan 319 coefficients, Guilford 64, TTCT 18, others 46 (Table 4)"
    - dimension: "IQ test"
      distribution: "CTMM 114, STEP 100, WISC 60, SCAT 40, TCMT 21, PPVT 18, others 94 (Table 3)"
  arms:
