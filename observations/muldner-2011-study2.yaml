      implementation_detail: observed
      outcome_timing: unreported
      effect_size: observed
    observability_notes: "The analysed n is taken as the 775 problems of the data set; the source does not state it for this analysis."
    source_quote: "In contrast, when we analyzed that problems were consistently gamed on by randomly assigning students to two buckets and obtaining an overall average, the analysis yielded a lower degree of association (r = .55, p < 0.001); the difference between the two correlation coefficients is reliable (Z = 10.5, p < 0.05)."
    source_location: "Section 5, Self-correlation Analysis"

