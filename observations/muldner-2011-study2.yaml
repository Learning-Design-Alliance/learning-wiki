# Muldner, Burleson, Van de Sande & VanLehn (2011), Study 2: the student-or-
# problem analyses repeated on Algebra Cognitive Tutor logs.
#
# The article's second log corpus, with a different tutor and population, so a
# record of its own (Study 1, `muldner-2011-study1`, is the Andes college
# data). The authors applied their gaming detector, with thresholds re-set for
# this tutor by the same visual method, to the Cognitive Tutor data used in
# Baker et al. (2009): 53 students, 775 problems.
#
# WHAT THIS FILE RECORDS: the regression (R2 .420; student .52, problem .35;
# each alone 30% and 15% of the variance) and the two split-half
# "self-correlations" (student r = .973, problem r = .55, Z = 10.5 for the
# difference). As in Study 1 the self-correlations are recorded as the
# correlations the source prints, not relabelled as reliability.
#
# `population.age: unreported`: the article says "high school students working
# in classrooms" and prints no age or grade figure.
#
# Read from the publisher's online-first PDF text layer (Springer); sections
# are cited, not pages.

schema_version: 2

study:
  key: muldner-2011-study2
  citation: "Muldner, K., Burleson, W., Van de Sande, B., & VanLehn, K. (2011). An analysis of students' gaming behaviors in an intelligent tutoring system: Predictors and impacts. User Modeling and User-Adapted Interaction, 21(1-2), 99-135."
  doi: "10.1007/s11257-010-9086-0"
  design:
    family: observational
    design_detail: >-
      Secondary analysis of existing Algebra Cognitive Tutor log data (the data
      used in Baker et al. 2009). The authors' latency-based gaming detector,
      with thresholds refitted for this tutor, labels each tutor-student turn
      pair; per student-problem percentage of gamed actions is analysed by
      linear regression, split-half self-correlations, frequency distributions
      and Bayesian network parameter learning, as in Study 1. No condition was
      assigned.

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified

appears_in:
  - claim: cognitive-tutor-student-predictor-validation
    bearing: supports
    anchor: kasia-muldner-winslow-burleson-brett-van-de-sande-kurt-vanlehn-2010

evidence_base:
  unit: participants
  size:
    value: 53
    unit: participants
  additional_sizes:
    - value: 775
      unit: items
      note: "unique Cognitive Tutor problems in the analysed data"
  population:
    description: "High-school students using the Algebra Cognitive Tutor in classrooms."
    age_or_stage: "High school; the article prints no age or grade figure"
    age: unreported
  context:
    setting: >-
      Classroom use of the Algebra Cognitive Tutor, which, like Andes, gives
      hints that start general and end in a bottom-out hint.
  arms: []

comparisons:
  - id: whole-sample
    kind: none
    description: "Regression and split-half correlations across the whole Cognitive Tutor data set; no contrast between groups."

observations:

