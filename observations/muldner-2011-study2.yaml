    outcome:
      construct: "Gaming the system"
      source_language: "Per Gamingsp"
      measure: "Detector-labelled share of a student's actions on a problem that were gamed, regressed on the student's average gaming and the problem's average gaming"
      scale: "standardised regression coefficient of the student predictor"
      direction: contextual
      role: proximal-outcome
      role_basis: inferred
      valued_by: []
    time:
      label: "across the tutor use in the data set, cross-sectional over problems"
    result:
      measure_type: regression_coefficient
      estimate: 0.52
      statistic: "t = 76"
      p_value: "p < 0.001"
      model: "Two-predictor linear regression; F = 4588, p < 0.001; R2 = .420. Problem coefficient .35 (t = 51)."
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: partial
      implementation_detail: partial
      outcome_timing: unreported
      effect_size: observed
    observability_notes: >-
      The number of student-problem pairs in the regression is not printed.
      The refitted detector thresholds for this tutor are not printed.
    source_quote: "In this model, both student and problem are correlated with the dependent variable, although student yields a higher correlation than problem (student: standardized coefficient = .52, t = 76, p < 0.001; problem: standardized coefficient = .35, t = 51, p < 0.001)."
