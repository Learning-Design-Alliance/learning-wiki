      outcome_timing: unreported
      effect_size: observed
    observability_notes: "The analysed n is taken as the 53 students of the data set; how many problems each half held is not printed."
    source_quote: "We found a high degree of association (r. = .973, p < 0.001)."
    source_location: "Section 5, Self-correlation Analysis"

