  bearing: supports
  anchor: mwangi-1998-2
- claim: integrated-beats-split-source-compare-problems
  bearing: qualifies
evidence_base:
  unit: participants
  size:
    value: 48
    unit: participants
  population:
    description: Forty-eight Year 4 children (25 girls, 23 boys) randomly selected from two public schools
      in Sydney, Australia.
    age_or_stage: Year 4, early in the school year (April-May); mean age printed as 9 years 11 months
    age:
      unit: months
      mean: 119
      note: Printed as M = 9 years 11 months; 119 is that figure written in one unit.
  context:
    setting: Individual sessions, administered as in Experiment 2
  arms:
  - id: integrated-no-explanation
    description: Integrated worked examples, studied for a set time with no request to self-explain.
  - id: split-no-explanation
    description: Split-source worked examples, studied for a set time with no request to self-explain.
  - id: integrated-self-explanation
    description: Integrated worked examples with Experiment 2's self-explanation procedure.
  - id: split-self-explanation
    description: Split-source worked examples with Experiment 2's self-explanation procedure.
