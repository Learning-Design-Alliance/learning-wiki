# Mwangi & Sweller (1998), Experiment 3: example format (integrated or
# split-source) crossed with self-explanation (asked or not), Year 4 children.
#
# One file per experiment the simulator uses: mwangi-1998-exp2 and
# mwangi-1998-exp3.
#
# WHAT THIS FILE RECORDS: Table 11's mean and SD of problems solved correctly
# for each of the four cells in each phase (acquisition, immediate, delayed
# similar, delayed transfer), and the three F tests the article prints for its
# 2 x 2 ANOVAs. The article prints no standardised effect size, and none is
# computed here.
#
#   * `measure_type: mean`, by arm. The article gives 48 children and a
#     random half of each format group per self-explanation condition, but no
#     cell n, so no per-cell sample is recorded.
#   * No reliability: the self-explanation protocols were "analyzed as in
#     Experiment 2", and no agreement figure is printed for this experiment.
#   * `population.age`: printed as "9 years 11 months", recorded as 119
#     months, the same figure in one unit, with a note.
#   * The delay before the delayed test is not restated for this experiment.
#
# Table 11 comes out of the text layer as one run of figures per phase; its
# column order (no explanation then self-explanation, correct then incorrect)
# was checked against the page image (p. 192). The quotes are the text layer's.

schema_version: 2
study:
  key: mwangi-1998-exp3
  citation: 'Mwangi, W., & Sweller, J. (1998). Learning to solve compare word problems: The effect of
    example format and generating self-explanations. Cognition and Instruction, 16(2), 173–199.'
  doi: 10.1207/s1532690xci1602_2
  design:
    family: randomized-controlled-trial
    design_detail: '2 (example format: integrated, split-source) x 2 (self-explanation, none) between-subjects
      experiment. Children randomly assigned to format, then half of each format group randomly assigned
      to self-explain; no-explanation groups studied each example for a time set from Experiment 2''s
      mean self-explanation time (84 s). Tasks and procedures as in Experiment 2. Analysed by 2 x 2 ANOVAs
      per phase and measure.'
provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-publisher-fulltext
  verification: unverified
