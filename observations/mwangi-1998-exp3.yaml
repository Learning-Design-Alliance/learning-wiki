    direction: lower-is-better
    role: capability-evidence
    role_basis: inferred
    valued_by: []
  time: *id003
  result:
    measure_type: other
    statistic: F(1, 44) = 6.17, MSE = 3.24
    interpretation: Integrated groups made fewer incorrect attempts on the immediate test; the only significant
      effect in the correct-solution and incorrect-attempt ANOVAs across the three test phases.
    model: 2 (format) x 2 (self-explanation) ANOVA
  moderators: *id002
  observability: &id006
    population_detail: partial
    implementation_detail: observed
    outcome_timing: observed
    effect_size: unreported
  observability_notes: The paragraph reports several 2 x 2 ANOVAs, one per phase and measure, and names
    the immediate-test incorrect attempts as the only significant effect; the self-explanation and interaction
    F values follow in the same passage, and the interaction is read by the authors on incorrect attempts.
    They are recorded on that measure.
  source_quote: The only significant effect was that of format on the number of incorrect attempts made
    in the immediate test phase, F(1, 44) = 6.17, MSE = 3.24. The effect of self-explanation was not significant,
    F(1, 44) = 0.78. The interaction between format and self-explanation was not significant, F(1, 44)
    = 0.01, indicating that the integrated group made fewer incorrect attempts than the split-source group
    in both the self-explanation and no-explanation conditions.
  source_location: Experiment 3, Results, p. 191
