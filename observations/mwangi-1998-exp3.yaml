not_yet_extracted:
- Table 11 incorrect-attempt means and SDs for the four cells in each phase.
- Tables 9 and 10 study and solution times, and their ANOVAs (study time format F(1, 44) = 4.89; acquisition
  solution time F(1, 44) = 3.63, p = .06; immediate solution time F(1, 44) = 3.79, p = .06).
- Self-explanation analyses (Table 12; goal statements t(16) = 1.79; solution-linked rereads chi-square(1,
  N = 138) = 16.35), on nine protocols per group after six incomplete ones were excluded.
- The F values for format and self-explanation on correct solutions, which the article does not print;
  it says only that no effect other than format on immediate incorrect attempts was significant.
