# Penk & Richter (2017): change in test-taking motivation within a two-hour
# low-stakes mathematics test, German National Assessment Study 2012.
#
# Read from the peDOCS repository copy (urn:nbn:de:0111-pedocs-174284), which the
# cover sheet describes as a formally and content-revised version of the original
# publication in Educational Assessment, Evaluation and Accountability 29(1),
# 55-79. It is a blinded manuscript ("Institute xxx [blinded for review]"), not the
# publisher's typeset version; page numbers below are the manuscript's. The cover
# sheet prints the repository DOI 10.25656/01:17428, not the publisher DOI;
# study.doi is the publisher's, as given for this key.
#
# Observational: one sample, no assigned conditions, test-taking motivation
# measured three times (before, half way, after) and modelled with second-order
# latent growth curves; every result is a whole-sample estimate.
#
# Figure 3 (the structural model with self-concept, the growth factors and test
# performance) is extracted as scattered numbers ("R² = .22*", "R² = .00") with no
# readable path labels, so no figure from it is recorded: the text says only that
# self-concept "explained almost a quarter of the variance in initial probability
# of success". See not_yet_extracted.

schema_version: 2

study:
  key: penk-2017
  citation: "Penk, C., & Richter, D. (2017). Change in test-taking motivation and its relationship to test performance in low-stakes assessments. Educational Assessment, Evaluation and Accountability, 29(1), 55–79."
  doi: "10.1007/s11092-016-9248-7"
  design:
    family: observational
    design_detail: >-
      Secondary analysis of a national low-stakes assessment. Self-reported
      test-taking motivation (effort, probability of success, importance) at three
      points in one two-hour testing session (T3 for about half the sample);
      univariate and multivariate second-order latent growth curve models, then a
      structural model predicting the mathematics score (Rasch WLE) from the growth
      factors, mathematics self-concept and background variables. Mplus 7.1, MLR,
      standard errors corrected for students nested in classes, sample weights;
      significance cut-off p < .001.
    preregistration:
      status: unreported

provenance:
  source_type: research
  extracted_by: claude/unspecified
  extracted_at: 2026-11-26
  extraction_method: manual-from-repository-copy
  verification: unverified

evidence_base:
  unit: participants
  size:
    value: 42298
    unit: participants
  additional_sizes:
    - value: 44584
      unit: participants
      note: "the National Assessment Study's representative sample of ninth-graders, before exclusions"
    - value: 1380
      unit: participants
      note: "students with special needs excluded (they received a different test)"
    - value: 906
      unit: participants
      note: "excluded for disregarding the TTM questionnaire instructions (blank or uniform responses)"
  population:
    description: >-
      German ninth-graders in a representative national sample; 49.8% female;
      35.2% in academic-track schools, the rest in non-academic tracks.
    age_or_stage: "Grade 9"
    age:
      unit: years
      mean: 15.6
      sd: 0.61
  context:
    setting: "German National Assessment Study, spring 2012: a two-hour paper-and-pencil mathematics and science test with no grade or individual feedback, a 15-minute break after the first hour"
  arms: []

comparisons:
  - id: whole-sample
    kind: none
    description: "Whole-sample correlations, reliabilities and model paths; no contrast between groups."

observations:

  - id: effort-importance-intercepts-correlation
    comparison_ref: whole-sample
    outcome:
      construct: "Initial test-taking effort and initial perceived importance of the test"
      source_language: "The intercept of the effort factor and the intercept of the importance factor"
      measure: "Latent intercept factors of the effort (4 items) and importance (2-item challenge subscale) growth processes"
      scale: "latent factor correlation"
      direction: contextual
      role: learner-characteristic
      role_basis: inferred
      valued_by: []
    time:
      label: "before the test (intercept of a linear growth model over three points in a two-hour session)"
    result:
      measure_type: correlation
      estimate: 0.79
      p_value: "< .001"
      model: "Multivariate second-order latent growth curve model of effort, importance and probability of success; chi2(311) = 7781.83, CFI .96, TLI .95, RMSEA .02, SRMR .06"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: "The analysed n of the multivariate model is not printed; the univariate models used 42,281 to 42,292."
    source_quote: "The intercept of the effort factor and the intercept of the importance factor showed the highest correlation, as did the slope of the effort factor and the slope of the importance factor (r = .79 for both)."
    source_location: "Results, p. 21; Table 3"

  - id: effort-importance-slopes-correlation
    comparison_ref: whole-sample
    outcome:
      construct: "Change in test-taking effort and change in perceived importance"
