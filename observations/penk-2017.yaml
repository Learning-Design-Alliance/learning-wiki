  - "Table 2 growth parameters (effort intercept 2.98, slope -0.13; importance 2.70, -0.18; probability of success 2.89, -0.02, with SDs) and Table 1 manifest means and SDs at T1-T3: not used here; the Table 2 text layer interleaves columns."
