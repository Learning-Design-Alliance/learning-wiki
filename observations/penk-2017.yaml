  - id: importance-to-performance-via-effort
    comparison_ref: whole-sample
    outcome:
      construct: "Mathematics test performance"
      source_language: "the effect of the intercept for importance on test performance via effort"
      measure: "Weighted likelihood estimates from a unidimensional Rasch scaling of the low-stakes mathematics test (balanced incomplete block design)"
      scale: "standardised indirect effect (beta)"
      direction: higher-is-better
      role: capability-evidence
      role_basis: inferred
      valued_by: []
    time:
      label: "end of the two-hour session"
    result:
      measure_type: regression_coefficient
      estimate: 0.13
      model: >-
        Model 2: mathematics score on the intercepts and slopes of effort,
        importance and probability of success, mathematics self-concept, and sex,
        school track, SES, immigration background and mathematics grade; 64% of
        variance explained (57% by the background model alone). The importance
        intercept had no significant direct effect; the effect "was fully mediated
        by the initial level of effort". The indirect effect of initial probability
        of success via effort was beta = .03.
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: observed
    observability_notes: >-
      A cross-sectional indirect effect from one structural model, not a causal
      estimate. The direct paths are in Figure 3, whose text layer is not
      readable; the indirect effects are in Appendix B.
    source_quote: "Of the indirect effects shown in Appendix B, only the effect of the intercept for importance on test performance via effort was substantial and significant (beta = .13)."
    source_location: "Results, p. 24"

