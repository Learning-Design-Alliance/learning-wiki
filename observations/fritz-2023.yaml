  # The reliability of the CODING, which is what this meta-analysis printed
  # about its own procedure. The companion "ICC = 99.8%" is not recorded:
  # see not_yet_extracted.
  - id: coder-agreement-kappa
    sample:
      value: 20
      unit: studies
    comparison_ref: coding-agreement
    outcome:
      construct: "Inter-coder agreement"
      source_language: "interrater reliability"
      measure: "The coding scheme (study characteristics, goal and dishonesty measures, effect sizes) applied by the first author and a graduate student to a subset of 20 studies"
      scale: "Cohen's kappa"
      direction: higher-is-better
      role: other
      role_basis: inferred
      valued_by: []
    time:
      label: "during coding"
    result:
      measure_type: reliability
      estimate: 0.90
      reliability:
        statistic: cohens_kappa
        over: raters
      interpretation: "Described by the authors as a high interrater reliability"
    moderators:
      reported: []
      candidate: []
    observability:
      population_detail: observed
      implementation_detail: observed
      outcome_timing: observed
      effect_size: unreported
    observability_notes: >-
      effect_size is `unreported` because a reliability coefficient is not an
      effect. The source calls the 20 studies "34.5% of the total sample",
      which does not match the 33 included studies; the denominator is not
      explained.
    source_quote: "The double coding yielded a high interrater reliability (ICC = 99.8%, Cohen’s Kappa = 0.90)."
    source_location: "Method, Data Extraction and Coding (p. 13)"

