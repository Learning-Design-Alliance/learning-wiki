  - "Table 4 pooled estimates for mastery (r = -.234, k = 7), mastery-avoidance (r = -.006, k = 3), performance (r = -.035, k = 10), performance-approach (r = .034, k = 20) and performance-avoidance (r = .060, k = 14) goals."
  - "Table 5 moderation of performance-approach (F(2, 40) = 4.60, p = .016) and performance-avoidance (F(2, 24) = 3.43, p = .049) goals by dishonesty measure type."
