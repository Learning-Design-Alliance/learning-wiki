    source_quote: "The critical t values were: t(18) = 3.10, for Problem 1; t(18) = 2.30, for Problem 2; and t(18) = 2.40, for Problem 3."
    source_location: "Experiment 6, Results and Discussion, p. 327"

  - id: problem2-t-test
