name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Set up docs directory
        run: |
          mkdir -p docs
          for dir in principles elements patterns strategies theories claims branding; do
            ln -s ../$dir docs/$dir
          done
          ln -s ../index.md docs/index.md
          ln -s ../CLAUDE.md docs/CLAUDE.md
          ln -s ../log.md docs/log.md

      - name: Build docs site
        run: mkdocs build

      # Reports (doesn't fail the build) files left on gh-pages by keep_files: true
      # for pages that have since been renamed or deleted, so they're easy to spot
      # and clean up instead of accumulating silently.
      - name: Check for orphaned gh-pages files
        run: python3 scripts/find_orphaned_pages.py | tee -a "$GITHUB_STEP_SUMMARY"

      # Not `mkdocs gh-deploy` — that force-replaces the whole gh-pages branch history,
      # which would wipe out the pr-preview/ subfolders that pr-preview.yml deploys there.
      # keep_files: true leaves anything not part of this build (i.e. pr-preview/*) alone.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
