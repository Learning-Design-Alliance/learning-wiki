name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Two merges close together used to race each other onto gh-pages. Both runs
# build from their own commit, both push, and the second is rejected with
# "the remote contains work that you do not have locally" — so the site stays
# on whichever build won, and the change in the losing merge is simply absent
# from the published site while `main` says it shipped. That has happened four
# times (runs 37, 39, 45 and 60); the last one silently withheld the page
# metadata panel while its PR showed green.
#
# cancel-in-progress is deliberately false. Cancelling the earlier run would
# be right for a preview build, where only the newest state matters, but this
# is a deploy: the newest run is built from the newest commit and supersedes
# the older one, so letting the queue drain in order publishes the same final
# tree either way, without discarding a build that is already most of the way
# through mkdocs.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      # The curated tier with mkdocs, the long tail with build_longtail.py, and the
      # Pagefind index over both (docs_hooks/two_tier.py).
      - name: Build docs site
        run: scripts/build_site.sh

      # Reports the files the previous deploy left on gh-pages that this build no
      # longer produces (renamed or deleted pages, the old lunr index). The deploy
      # below removes them; this says what went.
      - name: Report files this deploy removes from gh-pages
        run: python3 scripts/find_orphaned_pages.py | tee -a "$GITHUB_STEP_SUMMARY"

      # The open PR previews live on gh-pages under pr-preview/ (pr-preview.yml) and
      # are not part of this build, so they are copied into it before the deploy
      # replaces the published tree.
      - name: Carry the open PR previews over
        run: |
          if git ls-tree -d --name-only origin/gh-pages pr-preview >/dev/null 2>&1 \
             && [ -n "$(git ls-tree -d --name-only origin/gh-pages pr-preview)" ]; then
            git archive origin/gh-pages pr-preview | tar -x -C site
          fi

      # keep_files: false replaces the published tree with this build. It was true,
      # to keep the previews, and so kept every page ever renamed or deleted as well:
      # the published site only grew (2026-10-10). Not `mkdocs gh-deploy`, which
      # force-replaces the branch history.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: false
