name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Two merges close together used to race each other onto gh-pages. Both runs
# build from their own commit, both push, and the second is rejected with
# "the remote contains work that you do not have locally" — so the site stays
# on whichever build won, and the change in the losing merge is simply absent
# from the published site while `main` says it shipped. That has happened four
# times (runs 37, 39, 45 and 60); the last one silently withheld the page
# metadata panel while its PR showed green.
#
# cancel-in-progress is deliberately false. Cancelling the earlier run would
# be right for a preview build, where only the newest state matters, but this
# is a deploy: the newest run is built from the newest commit and supersedes
# the older one, so letting the queue drain in order publishes the same final
# tree either way, without discarding a build that is already most of the way
# through mkdocs.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Set up docs directory
        run: |
          mkdir -p docs
          # The folder list is read from okf_lib rather than repeated here — this
          # was the fifteenth hard-coded copy of it, and adding two kinds broke
          # all three workflows at once because none of them knew.
          for dir in $(python3 -c "import sys; sys.path.insert(0, 'scripts'); import okf_lib; print(' '.join(okf_lib.CONTENT_FOLDERS))") branding; do
            ln -s ../$dir docs/$dir
          done
          ln -s ../index.md docs/index.md
          ln -s ../CLAUDE.md docs/CLAUDE.md
          ln -s ../log.md docs/log.md

      - name: Build docs site
        run: mkdocs build

      # Reports (doesn't fail the build) files left on gh-pages by keep_files: true
      # for pages that have since been renamed or deleted, so they're easy to spot
      # and clean up instead of accumulating silently.
      - name: Check for orphaned gh-pages files
        run: python3 scripts/find_orphaned_pages.py | tee -a "$GITHUB_STEP_SUMMARY"

      # Not `mkdocs gh-deploy` — that force-replaces the whole gh-pages branch history,
      # which would wipe out the pr-preview/ subfolders that pr-preview.yml deploys there.
      # keep_files: true leaves anything not part of this build (i.e. pr-preview/*) alone.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
