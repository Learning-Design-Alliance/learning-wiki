name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Set up docs directory
        run: |
          mkdir -p docs
          for dir in principles elements patterns strategies theories learner-variables claims branding; do
            ln -s ../$dir docs/$dir
          done
          ln -s ../index.md docs/index.md
          ln -s ../CLAUDE.md docs/CLAUDE.md
          ln -s ../log.md docs/log.md

      - name: Build docs site
        run: mkdocs build --strict

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site

  remove-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          action: remove
