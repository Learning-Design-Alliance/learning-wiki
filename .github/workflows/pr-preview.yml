name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Set up docs directory
        run: |
          mkdir -p docs
          # The folder list is read from okf_lib rather than repeated here — this
          # was the fifteenth hard-coded copy of it, and adding two kinds broke
          # all three workflows at once because none of them knew.
          for dir in $(python3 -c "import sys; sys.path.insert(0, 'scripts'); import okf_lib; print(' '.join(okf_lib.CONTENT_FOLDERS))") branding; do
            ln -s ../$dir docs/$dir
          done
          ln -s ../index.md docs/index.md
          ln -s ../CLAUDE.md docs/CLAUDE.md
          ln -s ../log.md docs/log.md

      - name: Build docs site
        run: mkdocs build --strict

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9  # v1
        with:
          source-dir: ./site

  remove-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      # pr-preview-action shells out to git in the working directory, so
      # without a checkout it dies on `git config user.name` with
      # "fatal: not in a git directory" and the whole job fails. This job has
      # never once succeeded: every PR closed since it was added left its
      # preview folder behind on gh-pages, which is a large part of why that
      # branch has accumulated so much cruft. deploy-preview has the checkout
      # and works fine, which is why the bug stayed invisible.
      - uses: actions/checkout@v4

      - name: Remove preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9  # v1
        with:
          action: remove
