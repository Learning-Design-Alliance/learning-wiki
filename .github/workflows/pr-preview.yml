name: PR preview

# Only PRs that change how the site is built get a preview: a content batch rewrites
# hundreds of pages, and a full preview of each (~19,000 pages) was filling gh-pages.
# A preview of any other PR can be had by adding the `preview` label.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed, labeled]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(mkdocs\.yml|docs_hooks/|scripts/build_site\.sh|scripts/build_longtail\.py|branding/|requirements-docs\.txt|\.github/workflows/pr-preview\.yml)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-preview:
    needs: changes
    if: >-
      github.event.action != 'closed' &&
      (needs.changes.outputs.site == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      # The curated tier with mkdocs, the long tail with build_longtail.py, and the
      # Pagefind index over both (docs_hooks/two_tier.py).
      - name: Build docs site
        run: scripts/build_site.sh --strict

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9  # v1
        with:
          source-dir: ./site

  remove-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      # pr-preview-action shells out to git in the working directory, so
      # without a checkout it dies on `git config user.name` with
      # "fatal: not in a git directory" and the whole job fails. This job has
      # never once succeeded: every PR closed since it was added left its
      # preview folder behind on gh-pages, which is a large part of why that
      # branch has accumulated so much cruft. deploy-preview has the checkout
      # and works fine, which is why the bug stayed invisible.
      - uses: actions/checkout@v4

      - name: Remove preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9  # v1
        with:
          action: remove
