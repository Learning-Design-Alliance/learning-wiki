name: Validate Wiki

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Lint wiki (schema, cross-links, evidence, trust tiers)
        run: python3 scripts/lint.py

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Set up docs directory
        run: |
          mkdir -p docs
          for dir in principles elements patterns strategies theories claims branding; do
            ln -s ../$dir docs/$dir
          done
          ln -s ../index.md docs/index.md
          ln -s ../CLAUDE.md docs/CLAUDE.md
          ln -s ../log.md docs/log.md

      - name: Build docs site (strict — fails on broken links/anchors)
        run: mkdocs build --strict
