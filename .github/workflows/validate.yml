name: Validate Wiki

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      # Installed BEFORE lint, not after. lint.py's check_observations needs
      # PyYAML to read observations/*.yaml, and a lint step that cannot parse
      # them would report OK because it never looked — the exact failure
      # CLAUDE.md documents for learner-variables. PyYAML is pinned here
      # explicitly rather than relied on as a transitive mkdocs dependency,
      # since it is now a lint dependency too.
      - name: Install python dependencies
        run: pip install -r requirements-docs.txt

      - name: Lint wiki (schema, cross-links, evidence, trust tiers, observations)
        run: python3 scripts/lint.py

      # Both files are committed because the repos that read them — the
      # design-spec pipeline's CI — have no wiki checkout. A committed copy
      # that has drifted from disk is worse than none: that side reads it as
      # fact and has nothing to check it against. Nothing else notices, since
      # a stale index is valid JSON about a wiki that no longer exists.
      - name: Generated indexes are current
        run: |
          python3 scripts/build_reverse_index.py --check
          python3 scripts/build_wiki_index.py --check
          python3 scripts/build_evidence_report.py --check
          python3 scripts/build_indexes.py --check

      # The curated tier with mkdocs, the long tail with build_longtail.py, and the
      # Pagefind index over both (docs_hooks/two_tier.py).
      - name: Build docs site (strict — fails on broken links/anchors)
        run: SKIP_SEARCH=1 scripts/build_site.sh --strict
